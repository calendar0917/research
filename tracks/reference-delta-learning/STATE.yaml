mechanism:
  - C pair RMSE still falls monotonically (molesol 1.28 -> 0.25, mollipo 1.32 -> 0.60 in sigma units) and the C molecule Train curve is also unchanged.
  - With the correct input domain, C Val/Test curves improve with training on both tasks; C beats N on all 1600 rounds for Val and Test on both tasks.
  - mollipo: C beats D/N/R by +7.96%/+28.49%/+4.27% on Val and +9.82%/+25.04%/+3.58% on Test, so it is a strong_joint_task.
  - molesol: C beats D/N/R on Val (+5.34%/+42.62%/+0.44%) but is worse than D and R on Test (-9.15%/-7.53%), so the other-task 5% condition fails and the joint signal is a cross-task tradeoff.
  - C is within 5% of the best frozen reference L on molesol (Val/Test ratios 1.010/1.039) but not within 5% of G on mollipo (1.171/1.066).
  - R vs D is unchanged: Val +4.9%/+3.9%, Test -1.5%/+6.5%.  The retrieval + restoration machinery is usable; the delta learner now shows a task-dependent tradeoff.

open_questions:
  - Is the molesol Test regression vs D/R a property of this frozen capacity and single seed, or of the delta target?
  - Could a pre-registered regularisation (early stop on Val, smaller capacity, Train-only pair subsampling) remove the cross-task tradeoff without changing the gate?
  - Does a structural comparator add anything once the delta model beats retrieval baselines on one task but not the other?

