mechanism:
  - C pair RMSE falls monotonically (molesol 1.28 -> 0.25, mollipo 1.32 -> 0.60 in sigma units) while Train molecule RMSE falls and Val/Test rise to ~2-3x N.
  - C never beats N on Val at any round on either task (0/1600); Test wins 2/1600 (molesol) and 0/1600 (mollipo).
  - R beats D on Val (molesol +4.9%, mollipo +3.9%) and on mollipo Test (+6.5%); only molesol Test is 1.5% worse. The retrieval + restoration machinery is usable; learning the delta from Train pairs alone is not, in this frozen recipe.

open_questions:
  - Is the failure specific to the frozen capacity (1600 rounds, no depth/eta search) rather than the idea?
  - Would a regularised delta (early stop on Val, smaller capacity, Train-only pair subsampling) change the sign?
  - Does a structural comparator add anything once the delta model stops collapsing to the neighbour baseline?

