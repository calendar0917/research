  root_cause: >-
    pair_matrix / pair_feature_blocks always read task.x["train"]; the C
    evaluator reused them for Val/Test query local indices.  References and
    labels were the true Val/Test ones, so the two sides of the pair did not
    describe the same query.
  model_sha_unchanged: true
  new_training_trajectories: 0
