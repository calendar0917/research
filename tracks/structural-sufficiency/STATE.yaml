phase0_5_corrections:
  authoritative_file: tracks/structural-sufficiency/notes/phase0_corrigendum.md
  key_corrections:
    - "Three layers separated: (A) finite-sample identity identifiability, (B) task information sufficiency, (C) finite-sample learnability."
    - "E_2 LOO group-mean is one memorizing estimator; its failure does not prove shared-patch models fail."
    - "Scaffold LOO (uses same-scaffold training labels) is not scaffold-disjoint generalization."
    - "Risk decomposition sign corrected: R(h_dyn)-R(h_stat) = -I + excess_dyn - excess_stat, with I=R*(E_r)-R*(G)>=0. The old +I form is void."
    - "Pilot direction fixed: Adv(n)=MAE_static(n)-MAE_dynamic(n); positive means dynamic better; small-sample advantage is Adv(small)-Adv(large)>0."
    - "Old D(E_r)-S_patch>=0.03, negative-interaction, and static-MAE>dynamic stop rules are void."
    - "Eijkelboom Table 2 is train/test; use test MAE (ZINC full 0.192-0.263 vs no-MP 0.527-0.614)."
    - "ESA+ identified: Buterez et al. 2025, Nat Commun, DOI 10.1038/s41467-025-60252-z; ZINC-12k ESA+ 0.052+-0.001; no all-S unmasked-only ablation."
    - "Shen & Dong 2026 (DOI 10.1145/3816434) is layer-wise statistical sufficiency, not E_r graph sufficiency; not a duplicate."
    - "Old S(G) all-pairs-distance oracle downgraded: distance histogram is not provably lossless and a trained S(G) is not a Bayes oracle. Not run in Phase 1a."

