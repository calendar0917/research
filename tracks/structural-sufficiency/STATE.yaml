phase0_evidence:
  report: tracks/structural-sufficiency/results/phase0/REPORT.md
  corrigendum_link_at_top: true
  cpu_toy:
    tests: 17 passed
    key_facts:
      - E_0/E_1/E_2 collide for d=6 vs d=9 on cycle, caterpillar, grid.
      - E_3 separates them; a patch contains both marks iff d <= 2r.
      - positive control label [d<=4] is perfect at r=2 on all three families.
      - one-shot full-graph distance oracle separates d6/d9 (iteration not necessary).
  real_data:
    split: 3360/420/420; 2408 scaffold groups; cross-split leakage 0.
    candidate_internal_split: 2352/504/504; now frozen as Phase 1a split.
    exact_E_r_cost: ~3-4 s for 3360 molecules at r=2/3.
    LOO: E_2/E_3 near-unique (94.5% singleton), LOO MAE 0.927 vs global 0.979; Murcko scaffold 0.730.
    interpretation: "statistically sparse exact fingerprint; not a proof of structural sufficiency/insufficiency."
  official_labels:
    valid_read: false
    test_read: false
    label_vault_opened: false

open_questions:
  - Does X beat S at n=253 and/or n=2352 under exactly matched E_2 input?
  - Is any advantage stable across 3 seeds and larger at n=253 (sample-efficiency) or only at n=2352?
  - Does G's application reference dominate, and is the G-S/G-X gap explainable without a new information-access experiment?
  - Next round (only if PROMISING): independent split or second task, not a new architecture.
  - If S≈X and G better: add fixed one-hop/edge-incidence information with matched non-iterative/iterative controls.

