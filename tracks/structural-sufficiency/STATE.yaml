# ---------------------------------------------------------------------------
# zinc-support-transfer-probe-v1: can a shared correction rule be learned from
# other structures' genuine out-of-sample errors when the base has zero
# supervision support for the target local key types? Appended section only.
zinc_support_transfer_probe_v1:
  protocol_id: zinc-support-transfer-probe-v1
  protocol: tracks/structural-sufficiency/zinc_support_transfer_probe_v1/PROTOCOL.md
  report: tracks/structural-sufficiency/zinc_support_transfer_probe_v1/REPORT.md
  status: COMPLETE_WITH_CORRECTION
  question: >-
    With a base model that has zero supervised support for the target structures' radius-2
    key types, can a shared additive correction rule learned on other structures' genuine
    out-of-sample errors transfer to those structures, and does local structure add anything
    over coarse statistics?
  answer_short: >-
    Not for this family. On a fresh honest holdout inside official train 10k (F 7467 /
    C_fit 1156 / C_dev 306 / Q_A 361 / Q_B 310 / Q_bg 400, all isolation gates pass), all
    24 heads (G, S) x (2 wd) x (3 inits) x (2 base seeds) select step 0 on the C_dev rule
    AND on the untrimmed C_dev curve, i.e. the selection rule chooses "no correction"; the
    selected arms are bit-identical to B. Applied at the endpoint they are significantly
    harmful (+0.036..+0.122 on Q_A/Q_B). Two corrections were made after the first write-up:
    (A3) the k1 support feature looked a radius-1 id up in the radius-2 table; fixed and all
    24 cheap heads retrained from the frozen bases (0 GPU) with the same recipe -- the
    selection outcome did not change; (A4/A5) the mechanistic claims of the first version
    ("conditional mean ~ 0", "unpredictable even within a key family", "ceiling 0.0011 for
    any learnable correction") are retracted as unsupported.
  verdict: NO_TRANSFERABLE_CORRECTION_FOR_THIS_HEAD_FAMILY
  superseded_verdict: NO_TRANSFERABLE_CORRECTION__RESIDUAL_IS_LABEL_NOISE_AT_THIS_RESOLUTION
  decision_branch: D
  verdict_scope: "additive, m_F-gated heads on (coarse ctx | 108-d atom block + n1,n2 support), L1 loss, C_dev(trim5) selection; does NOT bound other corrector families"
  correction_pass:
    amendments: [A3, A4, A5]
    protocol: tracks/structural-sufficiency/zinc_support_transfer_probe_v1/PROTOCOL.md
    gpu_hours: 0.0
    cpu_wall_seconds: 260
    new_runs_or_seeds: none
    a3_bug: "n1 = sup2[atom_k1] (radius-1 id used to index the radius-2 support table) in zst_head.Features and zst_common.per_atom_support"
    a3_checks:
      per_atom_vs_bruteforce_count_max_abs_diff: 0.0
      renumbering_invariance_max_abs_diff: 0.0
      pre_fix_expression_change_under_renumbering: 4022.0
      ctx_columns_affected: [27, 28]
      n1_median_change_on_cfit_atoms: "277 -> 3630"
    a4_fix: "report both raw and trim5 curves; a post-hoc raw dip (seed 0 S, step 50, -0.0102) is recorded but is not a selection rule and does not reproduce on seed 1"
    a5_fix: "L1 targets a conditional median; oracle constants bound only whole-package translation; identity-selected deltas are tautological; endpoint intervals bound only endpoint predictions"
    effect_on_verdict: none
  verdict_basis:
    - "selected arm = identity on every package and every seed: G-B = S-B = 0.0000 exactly"
    - "head fits C_fit (L1 0.120 -> 0.027 S / 0.054 G) while C_dev worsens monotonically from step 0 under BOTH raw (0.1140 -> 0.166/0.180) and trim5 (0.0919 -> 0.147/0.158); the raw curve was saved for the 12 selected-wd arms only, the other wd kept its trim5 level (equally at the base value)"
    - "endpoint (unselected) harm: Q_A +0.041/+0.036 (G/S) s0 and +0.049/+0.042 s1, Q_B +0.071/+0.122 and +0.051/+0.111, Q_bg +0.012/+0.013 and +0.017/+0.015; gated Q_bg 0.1961->0.2375/0.2433 and 0.2029->0.2629/0.2558"
    - "S vs G has NO consistent sign after the fix (Q_A -0.005/-0.007 in favour of S, Q_B +0.051/+0.060 against S); the earlier 'S is always worse' claim is retracted"
    - "coarse baselines: median constant |d|<=0.0011, mean constant +0.002..+0.008, linear in f_base +0.001..+0.016"
    - "old sup_minus package reproduces the same sign independently (12/12 step 0 under raw and trim5; endpoint +0.07..+0.12 on Q_old)"
  checks:
    file: tracks/structural-sufficiency/zinc_support_transfer_probe_v1/analysis/cpu_checks.json
    all_pass: true
    count: 7
    fast_unit_tests: 9
    key: "total params G 424066 / S 423986 <= 500000; zero-init replay max |h| = 0.0; sign check exact; S-path gradient finite and atom-block-sensitive; isolation gates all true; identity on ungated molecules max |diff| = 0.0; k1/k2 support: brute-force count 0.0, renumbering invariance 0.0, pre-fix expression moves by 4022"
  split:
    file: tracks/structural-sufficiency/zinc_support_transfer_probe_v1/analysis/split_manifest.json
    roles: {F: 7467, C_fit: 1156, C_dev: 306, Q_A: 361, Q_B: 310, Q_bg: 400}
    gates: "roles disjoint and cover 10k; target keys zero support in F; D keys zero in F+C_fit; A/B keys zero in F+C_fit+C_dev; A/B parent overlap 0; every family's key co-occurrence graph is singleton components; the split always used its own correct k1 counts, so A3 did not touch it"
  budget:
    file: tracks/structural-sufficiency/zinc_support_transfer_probe_v1/analysis/budget.json
    gpu_hours_cap: 3.0
    gpu_hours_used: 0.51
    gpu_hours_base_training_measured: 0.4884
    gpu_hours_correction_pass: 0.0
    wall_clock_hours: 0.8
    includes_failures: true
    note: "two launches died in <1 min on a git-ignored manifest; head fitting/selection/evaluation and the whole correction pass were CPU"
  artifacts:
