zinc_performance_search_v1:
  protocol_id: ssrc-zinc-performance-search-v1
  plan: tracks/structural-sufficiency/zinc_performance_search_v1/PLAN.md
  status: COMPLETE
  verdict: TARGET_NOT_MET_BEST_TEST_0.066267
  report: tracks/structural-sufficiency/zinc_performance_search_v1/REPORT.md
  question: >-
    Under one single <=500k-parameter deployment model, no fusion, no seed
    averaging, can a performance-first sweep over bodies (P3Null, DCC-L, a
    third explicit-relation body) and four declared recipes push the official
    ZINC-10k test MAE below 0.060?
  answer: >-
    No.  The best single model is B-R0 (DCC-L, 494,193 params, R0) seed 0 at
    test MAE 0.066267 (valid 0.078537, epoch 489).  Across 4 seeds the B-R0
    family gives valid 0.075990 +- 0.002137 and test 0.067319 +- 0.000709
    (range 0.066267-0.067785); the matched A-R0 baseline gives valid
    0.080761 +- 0.003033 and test 0.070879 +- 0.001830, and all four B-R0
    seeds beat all four A-R0 seeds on test.  The gap to the 0.060 target
    (0.006267) is larger than any single lever tried in the round (<=0.005).
  findings:
    - "R1 (lr 5e-4 / wd 1e-4) is deterministically worse than R0 on body A (valid +0.0113, test +0.0053) and neutral on body B (+0.0007 valid, +0.0017 test)."
    - "R0L (R0 values on a 1200-epoch cosine) does not help A: valid 0.079491 vs 0.079250, test 0.071844 vs 0.070879, final-epoch valid worse (overfits late)."
    - "GRIT (10 layers / 64 wide / 8 heads / RRWP 1..20) was implemented and parity-verified (forward 1.7e-6, grad 9.6e-5) but measured at 30.97 s/epoch (bs32) / 18.65 (bs64) / 14.84 (bs128) dense and ~9.5 s/epoch sparse -> >=4 h per native run, over the 2 h/run ceiling; the declared fallback (native DBT, 600 epochs / 94.2k updates, 1.48 GPU-h) gave valid 0.082479 (sd 0.0074) / test 0.071329 (sd 0.0034)."
    - "The EMA checkpoint policy is invalid this round: the EMA->model copy was reversed, so every EMA evaluation reported the untrained init (valid 1.60004).  Fixed and unit-checked after the fact, but never used for selection."
    - "valid rank does not predict test rank at seed level (B-R0's worst-valid seed has the best test); the family ordering does transfer."
    - "The unseen-atom group (251 molecules) has 2.5-3x the MAE of the seen group; no recipe changed that structure."
  budget:
    gpu_hours_cap: 16.0
    gpu_hours_used_including_failures: 8.39
    wasted_on_failures_and_cancel: 0.97
    wall_clock_hours: 5.9
    gpu_hours_by_family: {A-R0: 1.274, B-R0: 1.489, A-R0L: 1.334, C-DBT600: 3.025, A-R1: 0.313, B-R1: 0.416}
  artifacts:
    report: tracks/structural-sufficiency/zinc_performance_search_v1/REPORT.md
    ledger: tracks/structural-sufficiency/zinc_performance_search_v1/LEDGER.md
    decisions: tracks/structural-sufficiency/zinc_performance_search_v1/DECISIONS.md
    main_table: tracks/structural-sufficiency/zinc_performance_search_v1/analysis/main_table.md
    report_tables: tracks/structural-sufficiency/zinc_performance_search_v1/analysis/report_tables.md
    test_table: tracks/structural-sufficiency/zinc_performance_search_v1/analysis/test_table.md
    test_freeze: tracks/structural-sufficiency/zinc_performance_search_v1/analysis/test_freeze.json
    shortlist: tracks/structural-sufficiency/zinc_performance_search_v1/analysis/frozen_shortlist.json
    per_molecule_valid: tracks/structural-sufficiency/zinc_performance_search_v1/analysis/per_molecule_valid.csv
    per_molecule_test: tracks/structural-sufficiency/zinc_performance_search_v1/analysis/test_pred_*.csv
    dense_parity: tracks/structural-sufficiency/zinc_performance_search_v1/analysis/dense_parity.json
    dense_timing: tracks/structural-sufficiency/zinc_performance_search_v1/analysis/dense_timing.json
  official_test:
    loaded: true
    when: 2026-10-23T21:34Z
    order: "frozen_shortlist.json committed -> valid re-checked 14/14 -> test_freeze.json (sha256) written -> test labels read once"
    post_test_tuning: false
  non_claims:
    - "B is not proven to be a fundamentally better body: the 4-seed valid gap is 1.8x the pooled sd and the valid distributions overlap; only the test ordering is fully separated."
    - "C/DBT is not proven worse: it ran a 600/1500-epoch truncated horizon here; the historical full-horizon DBT (3.69 GPU-h) scored test 0.069401."
    - "row bootstrap CIs describe the 1,000-molecule sample, not training repeatability; repeatability is the seed range."
    - "seeds >=2 reuse the seed-1 SSL encoder (only s0/s1 exist), so seed 2/3 understate fully independent-init variance."
  next_action: >-
    Either buy >=4-5 GPU-h per run and give GRIT/DBT their native horizon
    (10-layer GRIT 625k updates; DBT 1500 epochs), or change the setting
    (larger model, more data, different readout).  Do not re-tune lr/wd/horizon
    inside the same <=0.35 GPU-h box: every lever measured here moved <=0.005.

zinc_relation_composition_probe_v1:
  protocol_id: ssrc-zinc-relation-composition-probe-v1
  plan: tracks/structural-sufficiency/zinc_relation_composition_probe_v1/PLAN.md
  config: tracks/structural-sufficiency/zinc_relation_composition_probe_v1/configs/probe_v1.json
  status: COMPLETE
  verdict: NO_STABLE_D_S_DIFFERENCE_AND_WORSE_THAN_B_AT_THIS_HORIZON
  report: tracks/structural-sufficiency/zinc_relation_composition_probe_v1/REPORT.md
  question: >-
    Under identical explicit structural input, local encoding, parameter scale
    and recipe, does letting the relation state depend on the current bond-token
    state (arm D) buy performance over a relation state written from fixed
    structure only (arm S), and is this body worth continuing against the
    confirmed B-R0 baseline (DCC-L, 494,193 params, 4-seed test 0.067319)?
  answer: >-
    No on both counts, at this horizon and on one seed.  D and S differ only in
    the input of the relation write (h-conditioned xi vs a structure-only
    xi_static), share every parameter/tensor/init and use the same real xi for
    the token update.  At 470,321 params, 600 epochs, seed 0: D best-valid
    0.084493 (ep 566) vs S 0.081838 (ep 557), i.e. best-valid favours S by
    0.002655, while W20/T100/final favour D by 0.008255/0.009686/0.003772 - the
    sign flips between summary statistics, the paired row bootstrap CI spans
    zero ([-0.0038, +0.0097], 49.2% of rows prefer D) and the valid curve itself
    is unstable (W20 is 0.010-0.021 above best-valid for both arms).  Both arms
    are worse than the historical B-R0 on every stable measure (W20 +0.0157 D /
    +0.0240 S; final +0.0164 D / +0.0201 S; best-valid +0.0060 D / +0.0033 S).
  findings:
    - "The mechanism is wired in: with the trained D checkpoint frozen and only the relation-write rule switched to the static form, valid MAE degrades 0.084493 -> 0.122155 (+0.037661, 45%) with mean |d pred| 0.0849 and a layer-0 relation-state change of 9.17 (max).  The untrained-model control gives a prediction change of only 2.5e-4."
    - "The local CPU re-forward of the pulled best.pt reproduces the GPU-reported best-valid to 4.06e-09, so the comparison and the intervention use the exact selected checkpoint."
    - "D fits the training set far better than S (train MAE in eval mode 0.0236 vs 0.0535 at best; 0.0332 vs 0.1089 at final), so the D/S difference at this horizon is partly a fit/capacity effect that does not transfer to valid."
    - "Group direction is inconsistent (D better on seen_ordinary 0.0529 vs 0.0538; S better on tail_65 0.1844 vs 0.2206 and unseen_ordinary 0.1407 vs 0.1449); versus B-R0 the trade is visible but unfavourable overall (better tails, worse ordinary seen)."
    - "Relation = bond-lifted RRWP R_bc[k] = (M P^k M^T)_bc, M endpoint 1/sqrt(2), P = diag(deg)^-1 A, k=0..20, label-free, precomputed on train/valid only; verified against four-endpoint enumeration to 2.9e-8 with flip/relabel invariance at 1e-16."
    - "7/7 engineering suites pass (relation, identity, replay, mechanism, masking, numerical, checkpoint); 470,321 parameters <= 500k; the D and S state dicts are bit-identical at step 0; the old 513-wide B reader is absent."
  budget:
    wall_clock_hours: 3.6
    gpu_hours_cap: 6.0
    gpu_hours_used: 2.24
    gpu_hours_training_only: 2.2225
    cost_rule_applied: "4 runs did not fit (measured 6.68 s/epoch -> 1.113 GPU-h per 600-epoch run); pre-declared rung 3 = seed 0's D/S pair only"
    cost_note: "the 3 h wall cap was exceeded by ~30-40 min; the extra wall went to the long implementation phase, a remote deploy blocker (untracked-file collisions in the remote checkout, cleared in three CPU-only passes) and two runner fixes.  GPU work stayed inside the cap and no extra run was added to compensate."
  single_seed: true
  official_test:
    loaded: false
    scored: false
    note: "the 0.05x target is not evaluated in this round"
  artifacts:
    report: tracks/structural-sufficiency/zinc_relation_composition_probe_v1/REPORT.md
    plan: tracks/structural-sufficiency/zinc_relation_composition_probe_v1/PLAN.md
    summary: tracks/structural-sufficiency/zinc_relation_composition_probe_v1/analysis/summary.json
    report_tables: tracks/structural-sufficiency/zinc_relation_composition_probe_v1/analysis/report_tables.md
    curves: tracks/structural-sufficiency/zinc_relation_composition_probe_v1/analysis/curves.csv
    per_molecule_valid: tracks/structural-sufficiency/zinc_relation_composition_probe_v1/analysis/per_molecule_valid.csv
    intervention: tracks/structural-sufficiency/zinc_relation_composition_probe_v1/analysis/intervention.json
    checks: tracks/structural-sufficiency/zinc_relation_composition_probe_v1/analysis/checks.json
    param_audit: tracks/structural-sufficiency/zinc_relation_composition_probe_v1/analysis/param_audit.json
    relation_cache: tracks/structural-sufficiency/zinc_relation_composition_probe_v1/analysis/relation_cache.json
    timing: tracks/structural-sufficiency/zinc_relation_composition_probe_v1/analysis/timing_D_s0.json
    gpu_ledger: tracks/structural-sufficiency/zinc_relation_composition_probe_v1/analysis/gpu_ledger.json
    runs: "tracks/structural-sufficiency/zinc_relation_composition_probe_v1/runs/RC_{D,S}_s0 (best/final + train.json + predictions; git-ignored)"
  non_claims:
    - "One seed only: no cross-seed repeatability claim; the D/S contrast is bounded by seed 0."
    - "600 epochs / 47,400 updates is a declared exploration horizon, not the native GRIT 2000-epoch recipe; 'no gain' is not 'the body cannot work'."
    - "B-R0 is a historical reference from zinc_performance_search_v1 (not re-trained here); the comparison is same-split but not same-recipe-controlled."
    - "Row bootstrap CIs describe the 1,000-molecule valid sample, not training noise."
  next_action: >-
    Stop.  Do not add seeds or re-tune inside this box.  If the line is reopened,
    first re-establish a stable valid curve (per-graph normalisation was removed
    by design this round, and both arms' W20 sits 0.010-0.021 above their
    best-valid), then re-run the D/S contrast with the two arms' train@best in
