  data: official ZINC subset train 10k / valid 1k; official test never loaded
  valid_discipline: reuse the single existing valid-label read (sha256 8f6ee636...); no new read
  phase1_matrix: B, E@0.1, E@1.0, H@0.1, H@1.0 x seeds 0,1 (5 runs per GPU, seeds parallel)
  decision_line: both seeds improve and seed-mean valid MAE gain >= 0.003 and ordinary/drop-B-worst-10 not reversed
  budget: 8 A100-hours total; phase-1 target <= 4 h
  supersedes_existing_work: false
  relation_to_closed_rounds: independent side round; does not reopen S/T/R or Phase 2b
