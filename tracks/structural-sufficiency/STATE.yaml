# zinc-composition-transfer-v1: look-ahead constraint (random vs structural
# partition) + supervision-support intervention, two seeds, one frozen SSL
# encoder. Appended section; the header above still points at phase2b.
zinc_composition_transfer_v1:
  protocol_id: zinc-composition-transfer-v1
  protocol: tracks/structural-sufficiency/zinc_composition_transfer_v1/PROTOCOL.md
  report: tracks/structural-sufficiency/zinc_composition_transfer_v1/REPORT.md
  status: COMPLETE
  question: >-
    (i) Does an explicit cross-group update constraint (one-step look-ahead on a source/query
    split) change generalisation, and does a structure-derived split beat a random one?
    (ii) Does the supervised label support of rare local environments change error on
    molecules carrying exactly those environments?
  answer_short: >-
    The look-ahead constraint helps a little (W20/T100 -0.0009..-0.0038) but a random split is as
    good as the structural one, so it is a general training-constraint effect, not a structure
    mechanism. Label support for rare local environments is a large lever (Q_target 0.116-0.124
    -> 0.082, DiD -0.033/-0.043). The 0.05x test target was not reached. The official test was
    NOT opened during the decision; it was read once afterwards at the user's request (A3, §9b),
    best single checkpoint 0.06832, which confirms rather than changes the verdict.
  verdict: NO_TARGET_PROGRESS__TRAINING_CONSTRAINT_NOT_STRUCTURAL__SUPPORT_MATTERS
  verdict_basis:
    - "R-E W20: -0.00172 (s0), -0.00178 (s1); T100 -0.00172 / -0.00172; kappa=0.4 escalation -0.0038 (s0) but -0.0016 (s1), so no dose-response"
