    jobs: tracks/structural-sufficiency/zinc_support_transfer_probe_v1/analysis/rr_jobs.json
  valid_test_read: none
  not_run_deliberately:
    - "section 5 full-10k valid application: gate (stable internal gain) not met; the harness had a latent atom_offset/valid-slice defect that is now fixed but still unexecuted"
    - "structural-alignment shuffle control: only meaningful if S clearly beats G; the post-fix signs are mixed"
  non_claims:
    - "only the additive form f_base + m_F*h was tested; multiplicative/piecewise/quantile forms are not refuted"
    - "L1 is optimised by a conditional median; nothing here shows median(y - f_base | X) = 0"
    - "the oracle per-package constant bounds whole-package translations only (<=0.0011), not conditional/group correction rules"
    - "Q_A is a poor MAE carrier: 3 molecules (one with y=-42.0) carry 50% of its absolute error; trimmed Q_A MAE is 0.109/0.104"
    - "C_fit has only 988 gated molecules for a 10.5k-parameter head; head capacity may be mis-sized"
    - "old-package numbers are exploratory: M was used for checkpoint selection in the previous round and Q_old labels were read then"
    - "A3/A4/A5 are post-hoc: they change no selection rule, query set or budget, but the first write-up (commit ccd6110) stays in history and must be cited together with the corrected report"
  next_action: >-
    Close the post-processing line: residual correction on top of the frozen P3 base has now
    failed twice (zinc_composition_transfer_v1 and here, the second time with fixed features),
    and the remaining headroom for whole-package shifts (0.0011) is below the 0.003 a 0.05x
    step needs. If GPU is spent again it should go to end-to-end representation learning on F
    (a representation that can express unseen key types directly), judged on the official 10k
