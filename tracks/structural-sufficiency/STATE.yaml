zinc_relation_bn_diagnostic_v1:
  protocol_id: ssrc-zinc-relation-bn-diagnostic-v1
  plan: tracks/structural-sufficiency/zinc_relation_bn_diagnostic_v1/PLAN.md
  status: COMPLETE
  kind: diagnostic (no training, no parameter change, no architecture change)
  verdict: BN_BATCH_STATISTICS_EXPLAIN_THE_TRAIN_GAP__GLOBAL_RECALIBRATION_RECOVERS_NEITHER_TRAIN_NOR_VALID
  report: tracks/structural-sufficiency/zinc_relation_bn_diagnostic_v1/REPORT.md
  question: >-
    How much of the eval-mode error of the four frozen D/S checkpoints comes from
    BatchNorm inference statistics not matching the fixed weights, and does
    re-estimating train-only statistics recover the train and valid performance?
  answer: >-
    All of the train-side gap and none of the valid-side gap.  With frozen
    weights, letting BN use the current batch statistics (state B, dropout off,
    no buffer writes) restores the online train MAE for all four checkpoints
    (D_best 0.023578->0.007683, D_final 0.033238->0.007610, S_best
    0.053499->0.009829, S_final 0.108899->0.007541; online 0.0082-0.0091,
    |diff| <= 0.0011), and adding the original attention dropout changes nothing
    (T 0.0084-0.0101).  Re-estimating every BN's running statistics from train
    alone, layer by layer in true forward order (state C), does NOT recover the
    train level (0.0318-0.0749) and moves valid in both directions (-0.013069,
    -0.000513, +0.004754, +0.010758), with the previously selected 'best'
    checkpoints getting worse.
  findings:
