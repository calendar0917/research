next_action: >-
  Phase 1d is complete. Do not run another width, seed, depth, global-token,
  or iterative-update arm. The additive incidence control is sufficient or
  slightly better on the 96% ordinary-molecule complement; the joint pairing
  and capacity gains are concentrated in the 40-molecule large-ring tail, and
  neither closes the tail gap to G_ref. The single next step is a CPU-only
  large-ring predictability audit on frozen predictions and structure-only
  features: determine whether the 40-molecule tail has patch-observable
  headroom and whether a ring-aware local token could plausibly help without
  degrading the complement. Only if that audit shows a pre-specified >=0.02
  MAE opportunity should one ring-aware local representation diagnostic be
  pre-registered in a later round; no GPU work follows from Phase 1d alone.

