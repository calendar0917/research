  mechanism: >-
    The branch is active and becomes the main predictor: zeroing the trained beta
    at inference raises valid MAE from 0.090-0.102 to 0.465-0.518 and train MAE
    from 0.0031 to 0.44-0.47; the reader shifts weight mass toward a_sum/a_sq.
    Stronger shrinkage (eta 1.0) is consistently less harmful than eta 0.1, and
    the parent-sharing prior consistently reduces the damage relative to E, but
    neither reaches B. E's r1 rows are exactly zero because no train atom falls
    back to r1 (r2 train coverage 100%), so only the H prior trains them.
