decision_rules:
  R_candidate: "R passes the practical line vs P3 and is consistently positive over both S and T (both seeds positive, paired CI low > 0)"
  T_candidate: "T passes the practical line vs P3 and is consistently positive over S, while R is not consistently better than T"
  S_dominates: "S passes the practical line vs P3 while T and R show no consistent extra advantage over S"
  close: "no arm reaches the practical line vs P3; do not add layers, heads, relation buckets or seeds to rescue"

