architecture:
  base: "frozen BJOC-Null atom/bond/junction encoders, Null grouping and group_composer"
  removed_reader: "P3 321->256->256->1 reader, 148481 parameters; deleted, not retained"
  p3_nonreader_parameters: 265024
  p3_total_parameters: 413505
  token_dim: 96
  token_order: "all atoms, then all physical bonds, then all junctions, per molecule"
  type_embedding: "3 x 96 = 288 parameters, shared across arms per seed"
  type_embedding_init: "uniform(-1/sqrt(96), +1/sqrt(96)) from a dedicated generator"
  blocks: 2
  block_parameters: 74784
  block_form: "U = H + MIX(LN1(H)); Hnext = U + FFN(LN2(U))"
  layernorm: "affine=True, eps=1e-5, no final LayerNorm"
  ffn: "96 -> 192 -> 96, SiLU, both layers biased, dropout 0"
  dropout: 0.0
  attention_dropout: 0.0
  heads: 4
  head_dim: 24
  scale: "1/sqrt(24)"
  projections: "separate Q/K/V/output Linear(96,96,bias=True); standard 4-head MHA"
  s_mix: "gamma * FFN_extra(x); FFN_extra 96->192->96+SiLU; gamma 96-d, init 1; 37248 params"
  t_mix: "standard 4-head MHA; 37248 params"
  r_mix: "T plus Btype[type_i,type_j,h] + Bdist[dist_bin,h] + Boverlap[overlap,h]"
  relation_bias_init: "all tables zero"
  relation_parameters: 152
  relation_bins:
    distance: "{0,1,2,3,>=4,disconnected}"
    overlap: "{0,1,2,3}"
    type_pairs: 9
  token_supports:
    atom: "{i}"
    bond: "{u,v}"
    junction: "{i,j,k}"
  distance_definition: "minimum shortest path in the original undirected atom graph between the two support sets"
  overlap_definition: "support-set intersection size"
  pooling: "type-wise sum over valid token rows; no softmax or mean pooling; absent type = zero vector"
  reader: "612 -> 96 -> 96 -> 1, SiLU, no dropout / BN; 68257 parameters"
  z_p3: "[sum c_e (96), sum a_i (96), sum a_i^2 (96), g33 (33)] = 321"
  final_reader_input: "z_P3(321) + sum_A(96) + sum_B(96) + sum_J(96) + log1p(N_A)+log1p(N_B)+log1p(N_J) = 612"
  expected_parameters: {S: 483137, T: 483137, R: 483289}
  parameter_increase_vs_p3: "S/T +16.84%; R +16.87%"

initialisation:
  base: "bp.build_bjoc_null(seed) -> seed-matched full-10k masked-SSL encoder, exactly the R3 supervised start"
  not_used: "completed P3 soup is never used as an initialiser"
  shared_modules: "atom_encoder, bond_encoder, junction_encoder, group_composer copied tensor-by-tensor from the same base"
  independent_modules: "type embedding, blocks, reader initialised from dedicated per-module generators; global RNG restored"
  common_init: "type embedding, reader, LNs, residual FFNs and all P3 modules are bit-identical across S/T/R per seed"
  t_r_common: "T and R MHA projections are bit-identical per seed; R bias tables are exactly zero"
  training: "all P3 modules and all new modules participate in optimisation; no source tensor is frozen during training"

