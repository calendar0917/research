model:
  patch_radius: 2
  patch_node_dim: 41
  patch_edge_dim: 12
  hidden: 64
  local_layers: 2
  dropout: 0.1
  s_ffn_layers: 2
  s_ffn_hidden: 128
  x_attn_layers: 2
  x_heads: 4
  x_ffn_hidden: 128
  g_hidden: 96
  g_layers: 2
  expected_parameters:
    S: 59011
    X: 59075
    G: 53379
  code_sha256:
    phase1a_data.py: 4fa0e43280d9dd0f02b89b1307267de864b7dd0cc10e04e36888305abef28f1d
    phase1a_models.py: 160c050ab441b4e87572e1bfb491c3822445289d38e0673e8d519d9e17dbfe51
    phase1a_train.py: 0c5c6738ce6862ac6379663fe7f4ab82b1ff7d17b3c53941be9a3f8a6e84c53d
    run_phase1a.py: 219495af5e3a6937972e58106a98c0255ad2819d07eb67b5fdb7e947d611fe4f
    phase1a_gates.py: 5e3066b13022cf02c2410bc91cd0fd71be2ae6b3d5e7706f40fedbe01bb5ca38
  expected_forward_flops_fixed_64:
    S: 622336384
    X: 877730176
    G: 170472000
  actual_run_forward_flops:
    n253: {S: 622336384, X: 944085376, G: 170472000}
    n2352: {S: 584163072, X: 936648448, G: 159456384}
  flop_note: "FlopCounterMode forward, PyG scatter may be uncounted (lower bound); CPU-gate fixed batch X/S ~1.41x; actual run batches X/S ~1.52x (n=253) and ~1.60x (n=2352)"

training:
  loss: l1
  optimizer: AdamW
  lr: 0.001
  lr_min: 0.00001
  weight_decay: 0.00001
  batch_size: 64
  epochs: 200
  patience: 30
  min_delta: 0.0001
  grad_clip: 5.0
  seeds: [0, 1, 2]
  n_values: [253, 2352]
  models: [S, X, G]
  data_order: "numpy default_rng([seed, epoch]).permutation(n); shared across S/X/G for same n/seed"
  target_standardization: "train-row mean/std only; same transform for Monitor"

endpoints:
  primary: "Adv_set(n) = MAE_S(n) - MAE_X(n); positive means X better"
  interaction: "Adv_set(253) - Adv_set(2352); positive means small-n advantage for X"
  auxiliary: ["MAE_S - MAE_G", "MAE_X - MAE_G"]
  primary_metric: "best-monitor MAE on 504 Monitor rows; last-epoch MAE reported as sensitivity"
  uncertainty: "scaffold-cluster bootstrap over 421 Monitor scaffold groups, 5000 reps; seed range; no equivalence claim"
  practical_thresholds: {negligible: 0.02, weak: 0.05}

gates:
  cpu_status: 8/8 PASS
  cpu_gates_json: tracks/structural-sufficiency/results/phase1a/cpu_gates.json
  collision_tolerance: 1.0e-6
  required_before_gpu: true
  gpu_measurements_required: [peak_memory_mb, step_time_ms, gpu_seconds]

budget:
  gpu_hours_limit: 4.0
  n_trajectories: 18
  no_additional_seeds_or_architectures: true

commands:
  freeze_split: "uv run python tracks/structural-sufficiency/code/phase1a/freeze_split.py"
  gates: "uv run python tracks/structural-sufficiency/code/phase1a/phase1a_gates.py"
  tests: "uv run pytest -q tracks/structural-sufficiency/code/phase1a/tests"
  run: "uv run python tracks/structural-sufficiency/code/phase1a/run_phase1a.py --model {S|X|G} --n {small|2352} --seed {0|1|2} --device cuda --out-dir tracks/structural-sufficiency/runs/phase1a"
