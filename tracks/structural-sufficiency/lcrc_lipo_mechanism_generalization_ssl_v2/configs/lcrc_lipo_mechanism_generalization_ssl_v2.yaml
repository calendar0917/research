protocol_id: lcrc-lipo-mechanism-generalization-ssl-v2
round_id: lcrc-lipo-mechanism-generalization-ssl-v2

seeds: [0, 1, 2]
primary_seeds: [0, 1]
folds: [0, 1, 2]

training:
  batch_size: 128
  epochs: 360
  soup_last: 5
  grad_clip: 5.0
  min_lr: 1.0e-5
  shuffle_offset: 917000
  optimizer: AdamW
  scheduler: per_step_cosine
  loss: mse_on_fold_standardised_target
  checkpoint: mean_of_last_5_epoch_end_state_dicts
  early_stopping: false
  monitor_during_training: false
  checkpoint_selection_by_monitor: false
  seed_selection: false

recipes:
  R0:
    peak_lr: 1.0e-3
    weight_decay: 1.0e-5
    dropout: 0.0
  R1:
    peak_lr: 1.0e-3
    weight_decay: 1.0e-3
    dropout: 0.10
  R2:
    peak_lr: 1.0e-3
    weight_decay: 1.0e-3
    dropout: 0.20
  R3:
    peak_lr: 3.0e-4
    weight_decay: 1.0e-3
    dropout: 0.10

ssl:
  epochs: 120
  batch_size: 128
  lr: 1.0e-3
  min_lr: 1.0e-5
  weight_decay: 1.0e-4
  grad_clip: 5.0
  mask_fraction: 0.15
  val_fraction: 0.10
  val_mask_seed: 20261031
  gate_min_nat: 0.05
  objective: masked_root_atom_type_reconstruction
  head_dims: [64, 64, 16]

decision:
  materiality_rmse: 0.03
  h1_promising_gain: 0.03
  h2_promising_gain: 0.02
  h3_promising_gain: 0.02
  cpu_dominance_gap: 0.07
  bootstrap_resamples: 2000
  bootstrap_seed: 0

budget:
  gpu_hard_cap_hours: 3.5

descriptors:
  thirteen:
    - MolLogP
    - TPSA
    - MolWt
    - NumHAcceptors
    - NumHDonors
    - NumRotatableBonds
    - NumAromaticRings
    - NumAliphaticRings
    - NumSaturatedRings
    - RingCount
    - FractionCSP3
    - HeavyAtomCount
    - MolMR
  morgan_radius: 2
  morgan_bits: 2048
  morgan_use_features: false

baselines:
  ridge_alphas: [1.0, 10.0, 100.0]
  ridge_fixed:
    solver: lsqr
    fit_intercept: true
    tol: 1.0e-6
    max_iter: null
    positive: false
  xgb_grid:
    - {n_estimators: 400, max_depth: 3, min_child_weight: 1}
    - {n_estimators: 400, max_depth: 3, min_child_weight: 5}
    - {n_estimators: 400, max_depth: 5, min_child_weight: 1}
    - {n_estimators: 400, max_depth: 5, min_child_weight: 5}
    - {n_estimators: 800, max_depth: 3, min_child_weight: 1}
    - {n_estimators: 800, max_depth: 3, min_child_weight: 5}
    - {n_estimators: 800, max_depth: 5, min_child_weight: 1}
    - {n_estimators: 800, max_depth: 5, min_child_weight: 5}
  xgb_fixed:
    learning_rate: 0.03
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 5.0
    tree_method: hist
    random_state: 0
    n_jobs: 4

evaluation:
  primary_metric: raw_rmse
  secondary_metrics: [raw_mae]
  monitor_split: monitor
  reserved_labels_read: false
  official_valid_test_read: false
  monitor_used_for_selection: false
