models:
  B0:
    name: original_P3
    total_parameters: 413505
    reader: "321 -> 256 -> 256 -> 1, original parameters retained"
    branch: none
  B1:
    name: P3_plus_per_bond_FFN_branch
    total_parameters: 441825
    branch_parameters: 28320
    mix: "gamma * FFN_extra; FFN_extra 48 -> 96 -> 48 with bias and SiLU; gamma 48-d init 1; 9408 parameters"
  B2:
    name: P3_plus_per_bond_key_attention_branch
    total_parameters: 441825
    branch_parameters: 28320
    mix: "standard 4-head Q/K/V/output self-attention, head dim 12, all valid physical-bond keys of the same molecule visible; dropout 0; 9408 parameters"

branch:
  input: "c_e from the shared group_composer, 96-d"
  input_projection: "Linear(96 -> 48), bias, 4656 parameters"
  h0: "Linear(96 -> 48)(c_e)"
  block: "U = H + MIX(LN1(H)); H1 = U + FFN(LN2(U))"
  layernorm: "LayerNorm(48, affine=True, eps=1e-5), no final LN"
  ffn: "48 -> 96 -> 48, both layers biased, SiLU, dropout 0; 9360 parameters"
  block_parameters: 18960
  output_projection: "Linear(48 -> 96), weight and bias zero-initialised; 4704 parameters"
  residual: "c'_e = c_e + Linear_out(48 -> 96)(H1_e)"
  aggregation: "the original sum(c_e) is replaced by sum(c'_e); reader input remains 321-d"
  no_relation_bias: true
  no_distance_bucket: true
  no_atom_or_junction_tokens: true
  no_extra_reader: true
  c_e_caveat: "c_e contains the full-graph Null context; it is not a strictly local or causally interpretable per-bond contribution"

initialisation:
