# Comparability protocol for the LCRC readout-context feasibility pilot.
#
# A protocol states rules, not a model: dataset, split, metric, fitting scope,
# selection policy, test policy, seed semantics.  This round is a
# *small-dataset feasibility* pilot; every number is DEVELOPMENT and
# DEVELOPMENT_TEST.

id: lcrc-readout-context-pilot-small-v1

dataset:
  tasks:
    - name: ogbg-molesol
      role: small_task
      expected_rows: 1128
      target_unit: official OGB target (log solubility, mol/L)
    - name: ogbg-mollipo
      role: small_task
      expected_rows: 4200
      target_unit: official OGB target (logD at pH 7.4)
  source_policy: official_ogb_graphproppred_only
  loader: "committed label-free caches of PygGraphPropPredDataset + get_idx_split()"
  forbidden_substitutes:
    - ChemBench random122
    - DeepChem scaffold split rebuilds
    - any self-made 80/10/10
  fingerprint_policy: >-
    the four frozen caches (two graph caches, two lipo-input caches) are verified
    by SHA-256 of the real file bytes on every machine at every stage; the
    prepare stage re-asserts the official split sizes and index hashes.

split:
  description: official OGB Train / Validation / Test (scaffold split files shipped with the release)
  sizes:
    ogbg-molesol: {train: 902, valid: 113, test: 113}
    ogbg-mollipo: {train: 3360, valid: 420, test: 420}
  no_row_deletion: true
  no_train_valid_merge: true

metric:
  ranking_metric: valid_rmse
  metric_direction: lower_is_better
  official_metric: rmse
  reported_metrics: [train_rmse, valid_rmse, test_rmse, train_mae, valid_mae, test_mae]
  unit: raw target units (de-standardised once, never twice)
  evaluation_frequency: every epoch, all three splits, full splits
  curve_summaries: [selected (min Val RMSE), final epoch, mean of the last 20 epochs]

train_only_fitting_scope:
  description: >-
    The local trunk, both single-variable families, the global single-variable
    functions, the additive roots, the context interactions, the active-global
    mask (Train span > 1e-8) and the target mean/std (ddof=0) are fitted on
    official Train only.  Val/Test labels never enter candidate scoring,
    thresholds, the active-global mask or the context quantile definition.
  context_quantiles: >-
    The Q25/Q75 diagnostic references are Train raw quantiles of the same two
    fields, converted with the frozen Train mean/scale; they are fixed numbers,
    not per-split statistics.
  test_role: >-
    The official Test split is a development evaluation set for this round and is
    evaluated every epoch (test_policy=always).  It never selects a model state.

validation_selection_policy:
  selection: >-
    minimum Val RMSE over the 360 epochs of the single frozen trajectory; a
    strictly smaller Val RMSE replaces the current selection and an exact tie
    keeps the earlier epoch.  Epoch 0 (initialisation) can never be selected.
  reporting: >-
    The Test column of that same frozen state is reported afterwards, together
    with the final-epoch state and the mean of the last 20 epochs (a curve
    summary, not an ensemble).
  forbidden: selecting an epoch by Test RMSE and calling it Val selection

test_policy: always

seed_semantics:
  seeds: [0]
  note: >-
    Single training seed for the whole round.  No repeat for better numbers, no
    best-of-N, and no multi-seed stability claim.
  rngs:
    training_seed: 0
    canonical_init_subseed: 0
    new_readout_init_streams: {global: 1001, context: 1002, local: 1003}
    bootstrap_seed: 1703
  init_note: >-
    The three isolated init substreams generate modules of *one* model
    configuration; they are not extra training seeds.

prototype_decision_scales:
  note: >-
    Pre-declared scales for this pilot only; not universal scientific
    thresholds, and never reported in place of the numbers.
  performance_retention: C within +5% of A on BOTH Val and Test RMSE (point estimate)
  performance_retention_horizon: the same for the mean of the last 20 epochs
  context_increment: C >= 2% below B on BOTH Val and Test RMSE of the selected state
  interaction_resolution: >-
    RMS interaction contribution >= 1% of the Train target standard deviation on
    Val, Test and the Q25->Q75 intervention, otherwise the interaction is called
    weak and no mechanism claim is made
  root_specificity: >-
    median per-molecule root standard deviation / root RMS < 0.05 means the
    interaction is nearly uniform across roots of one molecule
  trace_pass: >-
    every Val/Test prediction reconstructed from the exported components within
    tol(x) = 1e-5 + 1e-6*max(1,|x|) raw units; the fixed-input intervention
    reproduced from the ledger; the a_k / c_k scale equivalence exact; and the
    selected checkpoint replayed bit-for-bit
  gine_reference: >-
    The frozen sq GINE numbers are reused unchanged as a performance coordinate;
    no GINE is retrained here and no SOTA claim is made
  incomplete_controls: a conclusion that depends on an incomplete control is not drawn

comparability:
  requires: [protocol_id, dataset_fingerprint, split_fingerprint]
  ranking_metric: valid_rmse
  note: >-
    Only runs under this protocol, this dataset fingerprint and this split
    fingerprint are comparable to each other.
