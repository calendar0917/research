# Comparability protocol for the structural-query-learning pilot.

# A protocol states rules, not a model: dataset, split, metric, fitting scope,
# selection policy, test policy, seed semantics.

id: sq-pilot-small-v1

dataset:
  tasks:
    - name: ogbg-molesol
      role: small_task
      expected_rows: 1128
      target_unit: official OGB target (log solubility, mol/L)
    - name: ogbg-mollipo
      role: main_task
      expected_rows: 4200
      target_unit: official OGB target (logD at pH 7.4)
  source_policy: official_ogb_graphproppred_only
  loader: PygGraphPropPredDataset(name=..., root=data/ogb) + get_idx_split()
  evaluator: "OGB Evaluator (official metric: rmse for both tasks)"
  forbidden_substitutes:
    - ChemBench random122
    - DeepChem scaffold split rebuilds
    - any self-made 80/10/10
  fingerprint_policy: >-
    raw atom/bond columns, official row ids, official split indices, targets and
    the computed label-free primitives are frozen into a committed npz per
    dataset (data/ogbg_<task>_sq-pilot-cache-v1.npz) and verified by SHA-256 at
    every run on every machine; the prepare stage re-asserts the official split
    sizes and index hashes.

split:
  description: official OGB Train / Validation / Test (scaffold split files shipped with the release)
  sizes:
    ogbg-molesol: {train: 902, valid: 113, test: 113}
    ogbg-mollipo: {train: 3360, valid: 420, test: 420}
  no_row_deletion: true
  no_train_valid_merge: true

metric:
  ranking_metric: valid_rmse
  metric_direction: lower_is_better
  official_metric: rmse
  secondary_metrics: [test_rmse, train_rmse, val_mae, test_mae]
  unit: raw target units (de-standardised once, never twice)

train_only_fitting_scope:
  description: >-
    Supervision-fitting, query discovery, the query vocabulary (atom/bond value
    sets), the base bank filters, the target mean/std (ddof=0) and every
    standardiser are fitted on official Train only.  Val/Test labels never enter
    candidate scoring, residuals, thresholds, parent ranking or the growth stop
    rule.
  test_role: >-
    The official Test split is a development evaluation set for this round and
    may be inspected continuously.  It is never used to select a model state:
    selection is by minimum Val RMSE only.

validation_selection_policy:
  selection: >-
    minimum Val RMSE over the union of the two frozen presets (H1 depth 3 /
    eta 0.05, H2 depth 5 / eta 0.03) and all boosting rounds; ties break to H1
    first and then to the earlier round.
  reporting: >-
    The Test column of that same frozen state is reported afterwards, together
    with the fixed final-round state and the mean of the last 20 rounds (a curve
    summary, not an ensemble).
  forbidden: selecting an epoch/preset/instance by Test RMSE and calling it Val selection

test_policy: always

seed_semantics:
  seeds: [0]
  note: >-
    Single training seed.  No multi-seed stability claim is made by this round.
  rngs:
    training_seed: 0
    discovery_generator: 1701
    random_library_generator: 1702
    bootstrap_seed: 1703

prototype_decision_scales:
  note: >-
    Pre-declared scales for this prototype only; not universal scientific
    thresholds, and never reported in place of the numbers.
  reference_b_star: best of E/G/L per task by Val RMSE (Test travels with it; never selected by Test)
  performance_competitive: A within +5% of B* on BOTH Val and Test RMSE, on BOTH tasks
  query_learning_signal: >-
    on at least one task A beats F and R by >=3% on both Val and Test RMSE, and on
    the other task A is not worse than R by more than 5%
  export_pass: native AST + tree replay reproduces XGBoost raw predictions to <=1e-5 on Val/Test and 256 Train rows
  incomplete_controls: a conclusion that depends on an incomplete control is not drawn

comparability:
  requires: [protocol_id, dataset_fingerprint, split_fingerprint]
  ranking_metric: valid_rmse
  note: >-
    Only runs under this protocol, this dataset fingerprint and this split
    fingerprint are comparable to each other.
