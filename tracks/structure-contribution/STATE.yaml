next_round_candidate_prev_full10k: >-
  AWAITING USER AUTHORIZATION. The full-10k pretraining-transfer round is COMPLETE
  (notes/bjoc_full10k_pretraining_transfer_v1.md,
  results/bjoc_full10k_pretraining_transfer_v1/REPORT.md).  It ran the official train
  10000 (SSL on structures + raw-y supervised training, no internal split) and read official
  valid exactly once after all six prediction files were frozen.  Answer: masked atom/bond
  pretraining CONFIRMED on official valid — P-B seed-mean -0.015653 (CI95 [-0.021051,-0.009904]),
  both seeds negative (-0.015387/-0.015919), ordinary -0.017391, top-10-removed -0.015980,
  valid:0172-removed -0.016400, P 0.083549 vs B 0.099202 (fresh same-GPU matched scratch
  baseline; the historical B was not reused because the remote replay reference was absent, so B
  was retrained in-round on the same GPU — the stronger matched baseline).  The conditional Q
  (encoder LR 3e-4) was purchased (junction CKA SSL->P 0.1015/0.1268 < 0.75) and is decisively
  harmful: Q-P +0.019484, tail +0.182, RMSE 0.541 vs 0.230, valid:0172 predicted at -7.95/-0.27.
  Tail cost disclosed: y<=-3 n=65 P-B +0.009341 while ordinary improves; 61/100 of B's worst
  rows persist.  Frozen decision FULL10K_PRETRAINING_GAIN_CONFIRMED_ON_DEV with flags
  BULK_GAIN_WITH_TAIL_COST, ENCODER_LR_ADAPTATION_NOT_SUPPORTED.  NEXT (proposed, NOT
  authorised): Route B — a new full-molecule composition mechanism, specifically a
  count-conditioned whole-molecule scale calibration (label-free structural counts -> tiny
  affine/multiplicative term on the object sum, no GNN/attention/iteration, no new
  junction/3-/4-body modules, keeps alpha/delta/gamma decomposition and the full-LR
  fine-tuned pretrained encoders).  Rationale: the SSL/exposure route is saturated (96.8
  exposures/molecule, CE plateau, bond acc 0.994) and its bulk gain trades against the tail,
  while the residual is a persistent scale-driven tail (65 molecules carry ~0.016 of MAE; fixing
  it to the ordinary rate lands ~0.072, inside 0.06-0.07); Q proves encoder preservation is not
  the lever.  No GPU work without a new preregistration + explicit user authorization.
next_round_candidate_prev_pretraining: >-
  AWAITING USER AUTHORIZATION. The masked-pretraining round is COMPLETE
  (notes/bjoc_masked_pretraining_v1.md, results/bjoc_masked_pretraining_v1/REPORT.md).
  It asked whether strictly leak-free masked atom/bond pretraining of the three existing BJOC
  encoders on the SAME 8k Fit molecules (no extra y, no extra molecules, no architecture change)
  improves held-out raw-y MAE, with a frozen monitor gate deciding whether a 50%-extra-supervision
  scratch control C was purchased.  Answer: YES — locked seed-mean P-B -0.011984
  (CI95 [-0.017530,-0.005974]), both seeds negative (-0.007380/-0.016588), ordinary -0.013472,
  top-10-removed -0.013204, and P also beats the purchased C control by -0.007713
  (CI95 [-0.013252,-0.001911]), so the gain is not pure optimization acceleration.  The gate
  fired 7/7 and C ran (locked C 0.099752).  Pretext: atom acc ~0.93 / CE 0.20-0.21 (prior 1.118);
  bond acc ~0.995 / CE 0.015-0.019 (prior 0.605); 22/22 leak gates, 400/400 randomized
  hidden-truth swaps and 100/100 rebuild cases clean; locked labels read exactly once after all 12
  prediction files were hashed.  Caveat: the y<=-3 tail is not improved (locked +0.0075,
  seed-mixed; RMSE worse) while MAE/median/p90/ordinary all improve.  Frozen decision
  SELF_SUPERVISED_PRETRAINING_USEFUL.  NEXT (proposed, NOT authorised): Route A, the
  data-efficiency / external-unlabelled-data route — scale this exact frozen, leak-audited masked
  pretraining to a large external unlabelled structure corpus, keep the split/gate/locked-read
  discipline, primary contrast P-external - P-internal at matched pretraining updates against the
  same B baseline.  Route B (new molecule-level composition architecture) is the weaker prior
  (junction ownership already seed-unstable: O8-N8 -0.006419 with seed1 +0.000861; the
  junction-rich subgroup is mixed again here).  No GPU work without a new preregistration +
  explicit user authorization.
next_round_candidate_prev_intrinsic: >-
  AWAITING USER AUTHORIZATION. The intrinsic-junction-contribution feasibility round is COMPLETE
  (notes/bjoc_intrinsic_contribution_v1.md, results/bjoc_intrinsic_contribution_v1/REPORT.md).
  It asked what the held-out prediction cost is of replacing BJOC-Null's joint reader by a strictly
  additive per-object contribution head (IJCM: bias + Σ atoms + Σ bonds + Σ junctions + Σ global-feature
  eta; 409,922 params vs 413,505; same encoders, features, recipe, last-5 soup).  Answer: the additive
  head is NOT a prediction route — on frozen split A (single seed, seed 1 not purchased) locked MAE
  0.165671 vs 0.118042 (Δ +0.047629, CI95 [+0.034763,+0.063349]); monitor Δ +0.048583 (CI95
  [+0.027308,+0.083351]); ordinary (y>-3) Δ +0.029938 (n=919); tail Δ +0.248349; top-10-removed
  Δ +0.041467, so the degradation is broad.  The mechanism is additive UNDERFITTING, not a
  generalisation trade: soup fit 0.105686 vs 0.037033 (2.85×), so the constrained form cannot even
  represent the training relation.  The frozen monitor stop-loss fired at C_too_costly, seed 1 was not
  bought, and locked-gate exited 1 with "seed mean unavailable", so split B was never trained; 2 of 8
  trajectories used, ~0.46 GPU-h.  Synthetic known-truth audits: A identifiability passes (design rank
  263/268; 5 null dims from duplicated global columns; type recovery r≈0.98); B documents that exactly
  collinear junction types are not identifiable (non-causal type receives 0.11-0.17, sd 0.025; the
  uncertainty must be exported); C shows a true pairwise junction interaction is 32% orthogonal to the
  additive design (floor 0.1507 vs oracle 0.0194, residual corr -0.95).  Frozen decision:
  ATTRIBUTION_WORKS_BUT_PREDICTIVE_COST_TOO_HIGH.  Next stage (proposed, NOT authorised): back to
  PREDICTION research — ONE pre-registered pairwise junction-interaction channel (bond-adjacent
  junction-pair bilinear products) inside the frozen one-shot BJOC family, with capacity/wall-time
  matching and a single monitor gate; do not add more additive structure and do not publish a single
  contribution vector without the co-occurrence uncertainty.  No GPU work without a new preregistration
  + explicit user authorization.
next_round_candidate_previous: >-
  AWAITING USER AUTHORIZATION. The junction-regularisation round is COMPLETE
  (notes/bjoc_junction_regularization_v1.md, results/bjoc_junction_regularization_v1/REPORT.md).
  It asked whether ONE frozen training-time intervention — inverted dropout p=0.10 on the learned
  junction embedding w before the null incidence grouping (R0 p=0.0 vs R1 p=0.10, both 413,505
  params, identical init and batch order per seed) — improves real generalisation.  Answer:
  NO — R1 was worse on both held-out readouts on split A (locked seed-mean Δ +0.010101,
  CI95 [+0.005413,+0.014749]; monitor +0.010560, CI95 [+0.006709,+0.014528]; per-seed locked
  +0.014973 / +0.005230), ordinary molecules (y>-3) were worse (+0.008715), and the top-10-removed
  delta stayed positive (+0.010358), so the degradation is broad, not outlier-driven.  The
  pre-registered purchase gate failed every substantive check, so split B was never trained
  (4 of 8 trajectories used, ~0.42 GPU-h) and no p search was performed.  The frozen decision is
  JUNCTION_DROPOUT_HURTS_GENERALIZATION.  Mechanism reading: the intervention DID move the system
  in the intended direction (R1 |w| 0.091 vs 0.063, less damage under cross-molecule junction
  shuffling, smaller seed spread 0.00098 vs 0.01072) but paid a fit cost it never recovered
  (soup fit 0.0555 vs 0.0351); the within-molecule permutation audit is a numerical no-op
  (~4e-8, conservation ~2e-7), proving the null predictor can only see the junction channel as a
  permutation-invariant per-molecule multiset — per-junction attribution is structurally
  impossible for it.  Next stage (proposed, NOT authorised): build an ownership-preserving
  IDENTIFIABLE JUNCTION-CONTRIBUTION model with a pre-registered predictive-cost band and a
  synthetic identifiability task; do not tune dropout further.  No GPU work without a new
  preregistration + explicit user authorization.
next_round_candidate_previous_2: >-
  AWAITING USER AUTHORIZATION. The representation/optimisation round is COMPLETE
  (notes/bjoc_representation_optimization_v1.md, results/bjoc_representation_optimization_v1/REPORT.md).
  It asked which of three candidate improvable points is real and answered: (1) NOT optimisation -
  the curve audit showed no late plateau and a healthy constant-LR Adam regime, so the pre-registered
  stabilisation candidate S was never run; (2) the learned JUNCTION CONTENT IS NECESSARY - at exactly
  matched capacity (both arms 432,705 params) removing the junction reader costs +0.019825 locked-dev
  MAE, paired CI95 [+0.013324, +0.026108], worse on every pre-frozen subgroup, so the earlier
  "the junction reader may be decorative" hypothesis is refuted; (3) the TYPED short-path +
  ring-block representation does NOT transfer - T fits the training rows better (fit delta -0.013760)
  while making unseen molecules worse (monitor +0.015322, locked-dev +0.012389 CI [+0.004238,
  +0.021133]), so the round's decision is TYPED_STRUCTURE_OVERFIT and the pre-registered T promotion
  rule failed every informative check (no stage 2, 3 of 10 trajectories used).  The channels ARE
  consumed by the network (zeroing them moves predictions by 0.72 and raises monitor MAE to 0.778)
  and the damage is broad, not outlier-driven.  A future representation round must pre-register an
  input-scale / regularisation control for the sparse one-hot channels (|z| up to 304 from
  fit-set standardisation) or an input dropout on the new blocks, and must gate on an a-priori
  monitor read; split B is frozen and unread if a replication contrast is wanted.  No further GPU
  work without a new preregistration + explicit user authorization.
