constraints:
  - 不使用 GNN/Transformer/消息传递作为核心预测机制
  - 每个预测项可归因（单元 / 单元对 / bias）；无隐藏全局旁路
  - 第一版 y-only；official test 本轮禁读
  - GPU 正式实验仅 `res` GPU1 (pool res-gpu1, 进程内 cuda:0)，经 rr

