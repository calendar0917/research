round_cscl-distance-pooling-bottleneck-v1:
  protocol: configs/distance_pooling_bottleneck_v1.yaml (frozen before the formal runs)
  report: notes/distance_pooling_bottleneck_v1.md
  driver: code/run_distance_pooling_v1.py (audit/train/check/predict/score)
  operator: code/distance_pooling_v1.py (Soft5, frozen kernel)
  tests: tests/test_distance_pooling_v1.py (24 passed)
  question: >-
    Full-Y summarises the 48-D pair state through five HARD shortest-path buckets
    (1,2,3,4,>=5), each contributing sum(h), sum(h^2), log1p(count) to the 814-D
    reader input.  Does replacing only that graph-level hard grouping by one
    PRE-FROZEN continuous-distance basis (Soft5: five normalised Gaussian RBF
    weights in log1p(distance) space, sigma 0.35, centers [1,2,3,4,8]) change
    official-validation raw-y MAE, everything else held fixed?
  phase_a_source_path_audit: >-
    all pass: bucket = min(max(int(d),1),5)-1; 23-D relation carries log1p(distance)
    at index 5; consumed 15-D slice = 0..13 + 18 (keeps log distance, C6 zeroes
    path count); distance_gate = 1 + tanh(Embedding(5,48))[bucket] (hard bucket
    only, NOT swapped); pair_value 48-D; pooling per bucket sum/sum-square/log-count;
    reader [289 | 485 | 32 | 8] = 814; params 408651; C6_MASK topology not zeroed
  phase_b_distance_distribution (results/distance_distribution.json, label-blind): >-
    2,668,346 pairs over 10,000 molecules; bucket shares 9.34/12.90/12.78/11.58/53.40%;
    the >=5 bucket is NOT one distance: mean 8.46 distinct exact distances per
    molecule (p50 8, max 18), 99.80% mix >=2, 97.49% span >=3, 99.25% hold BOTH d=5
    and d>=7; conditional entropy 1.91 nats; full all-pairs BFS cross-check on the
    raw graphs: 0 mismatches / 2,668,346 pairs, max |log1p round-trip| 8.6e-8
  phase_c_operator: >-
    s = log1p(d); mu_k = log1p([1,2,3,4,8]); a_k = exp(-(s-mu_k)^2/(2*0.35^2));
    w_k = a_k / sum_j a_j; first_k = sum w_k h, second_k = sum w_k h^2 (square h
    first), count_k = sum w_k stored log1p but still zeroed by C6_MASK; 485 output,
    814 reader, 408651 params, zero new trainable parameters, no new RNG, no
    center/width/parameter search
  phase_d_gates (all pass):
    correctness: "Hard5 bit-identical to frozen path; Soft5 weights finite/non-negative/sum-1;
      conservation (first 3.7e-8, second 3.5e-8, count 2.0e-8 relative); endpoint-swap /
      pair-permutation / batch-composition / single-molecule invariants; C6 count block zero;
      gradient flow; y-independence; identical init state for both arms"
    feature_audit: "mean relative Hard5/Soft5 feature difference 0.495 (p90 0.573, max 0.702);
      100.00% of 10,000 train molecules >1% different; participation ratio 5.21 -> 4.16"
    purchase_gate: {G1_long_distance_heterogeneity: 0.9925 (>=0.10 pass),
                    G2_feature_difference: 1.0000 (>=0.25 pass), G3_correctness: true (pass)}
    label: CPU_PURCHASE_GRANTED
  phase_e_gpu (two fresh matched seed-0 arms, pool res-gpu1, commit 3a09c573): >-
    run_ids distance-pooling-hard5-20261011-222946-a3305c09 and
    distance-pooling-soft5-20261011-230556-b65adb15; identical init-state hash
    93c2f23c..., identical training-program hash d5d08f36..., identical RNG-stream
    hashes at epochs 1/40/120/240, 18,960 steps each, last-5 soup 236-240, 408,651
    params, wall 1683 s / 1607 s on a100-2 GPU1; matching_audit all_match=true.
    Historical full-10k Hard5 checkpoint (valid raw 0.118618) read-only reference;
    the new Hard5 arm reaches 0.118474 (Delta -0.000144) and the frozen historical
    soup reproduces the historical CSV bit-identically (max|d| 0.0)
  phase_f_evaluation (pre-frozen, y read once after freeze): >-
    freeze manifest + hashed predictions written without reading y; then one official
    y read.  MAE Hard5 0.118474 / Soft5 0.119218; RMSE 0.598707 / 0.658496; median
    0.067640 / 0.065110; p90 0.208375 / 0.214412; max 18.228 / 20.090; fit->valid gap
    0.071611 / 0.072081.  Paired Delta = +0.000743, bootstrap CI95 [-0.006523,
    +0.008980], 51.2% Soft5-better.  Subgroups: y<=-3 n=65 +0.05046 [-0.02179,
    +0.14053]; y>-3 n=935 -0.00271 [-0.00840, +0.00296]; best quartile for Soft5 =
    largest diameter / last-bucket-diversity (-0.0131), worst = smallest atom-count /
    bucket-4 fraction (+0.009..+0.015); valid:0172 is 15.4% of Hard5 error mass and
    16.9% of Soft5; delta without it = -0.00112; top-10 error mass share 22.5% / 24.7%.
    Prediction difference between arms: mean |dpred| 0.0920, max 1.862
  judgment: >-
    SOFT5_NO_USEFUL_GAIN (band C, CI contains zero).  The hard >=5 bucket's real
    distance heterogeneity (99.25% of molecules hold d=5 and d>=7) is not converted
    into a prediction gain by a fixed continuous-distance moment basis: the change is
    large at the representation level (100% of molecules >1% different, prediction
    mean |d| 0.092) but indistinguishable from noise on official validation.  The
    small positive point estimate is not row-driven (delta without valid:0172 is
    -0.0011) and no subgroup shows a CI-supported improvement.  Single seed per arm
    and GPU nondeterminism keep this exploratory; official validation was already
    exposed (historical 0.118618 reference); official test never loaded.
  status: COMPLETED 2026-10-11; round stopped (no seed 1, no third arm, no search,
    no retuning, no test access)
