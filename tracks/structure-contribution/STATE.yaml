  confirmed_bugs:
    - BUG-1 v0 签名稠密重编号抹除原子/键类型且重标号不稳定（最小反例已复现，已修复为 hash-based 1-WL）
    - BUG-2 PyG 双向边双计：六元环环秩 7（应 1）、关系直方图双计、is_terminal 失效（已修复为唯一无向物理键）
