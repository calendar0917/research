    架构/参数量 118168 / 初始化 / collate / split / 优化器 / checkpoint 规则与 v3 S 逐位一致；
    监督仍为 raw y；测试钉住 split 惩罚≡v3 组合惩罚、γ 项与 v3 逐位相等
