    variance_share_of_penalty: 0.936   # Σ w_t σ_t²/n_t 项占比；类型偏置项仅 6.4%
    singleton_cells: 0.696             # (batch,类型) 格子 n=1 占比
    units_in_n1_cells: 0.324           # 实例被 (1/N)δ_i² 直接惩罚的占比
    types_per_batch_mean: 58.3
    v3S_fit_delta: 类型均值 |μ_t|≤0.125（多数<0.01），类型内 std 0.015–0.70
