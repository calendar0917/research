      dev_mae: 0.11641
      monitor_mae: 0.11826
      fit_mae: 0.04220
      calibrated_dev_mae (auxiliary, fit-only b): 0.11452
    secondary_best_monitor_dev: 0.12102
    tertiary_last_dev: 0.12112
    epochs: 240 fixed / wall 1231s / params 408651 / 5.1s per epoch
    supervision: raw y L1 + label-free reconstruction (H1_LAMBDA=33.9587 frozen, disclosed)
    paired_vs_orich: -0.21565, bootstrap CI95 [-0.26895, -0.24133], 81.0% molecules better, corr 0.44
    subgroup: 全部子群一致改善; 最大改善在 y<=-3 (-0.40) 与 cyc>=4 (-0.27)
    judgment: 情况 A — 已拥有足够强的非 GNN 预测基础; 下一轮研究强计算上的结构贡献分解
  results_index:
    - path: results/feasibility_v2_cpu/v1_error_structure.json
