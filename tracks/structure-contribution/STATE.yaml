next_round_candidate: >-
  AWAITING USER AUTHORIZATION. The STRC predictive-feasibility round is COMPLETE
  (notes/bjoc_strc_predictive_feasibility_v1.md,
  results/bjoc_strc_predictive_feasibility_v1/REPORT.md).  It tested one tiny
  cross-molecule-shared additive residual channel (28 shared atom-type scalars
  alpha + 129 frozen-vocabulary junction-context scalars beta, zero-init, 157
  params, total 413,662) added to the successful masked-pretrained BJOC-Null P
  and trained jointly under the identical recipe (same post-SSL init replayed
  and verified, same encoders/composer/reader init, same batch order, same
  Adam/L1/soup).  Answer: NO GAIN, decision STRC_NO_PREDICTIVE_GAIN —
  official-valid seed-mean S-P +0.004543 (CI95 [+0.000927,+0.009536], both
  seeds positive +0.007833/+0.001253), ordinary +0.002437, tail +0.034843
  (excluding valid:0172 still +0.007258), RMSE +0.035848, top-10-removed
  +0.003033; 7/8 frozen gate conditions fail.  The channel was live and
  cross-seed stable (Spearman alpha 0.991 / beta 0.892; residual |.| ~6-7% of
  |base|) but mostly reparameterized the base solution: the S-P prediction
  difference is explained by the changed base (R2 0.43/0.73), not the additive
  residual (R2 0.003/0.000005); design rank 149/157 (7 zero-support atom types,
  one collinear context pair).  Shared additive residual route stopped
  permanently (no vocabulary/scale/tail-weighting/third-seed follow-up).
  NEXT (proposed, NOT authorised): scale-separated whole-molecule composition
  — capacity-matched readout [Sum_c, mean(c), std(c), Sum_a, mean(a), std(a),
  n_atoms, global] computed from the same object tensors (c per-bond composer
  outputs, a per-atom encodings), replacing extensive-only sums at the same
  413,505-param budget; CPU collision/synthetic gate first (identical old
  extensive inputs, different intensive statistics), then <=2 seeds against
  the frozen P valid predictions under the same gate shape (~0.35 GPU-h); stop
  the readout-composition route if the same valid conditions fail.  Official
  test remains unread in any form; no GPU work without a new preregistration +
  explicit user authorization.
