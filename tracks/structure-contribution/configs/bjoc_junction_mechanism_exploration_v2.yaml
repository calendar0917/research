# --------------------------------------------------------------- CPU gates
cpu_gates:
  - "C/E allocated parameter count == 413505; D == 462657 checked with named_parameters()"
  - "E tensor shapes and same-seed init identical to A2 / base"
  - "C W/V exactly zero; C q exactly log1p(n_e)"
  - "D first-layer new columns exactly zero; D init forward equals A0 init forward"
  - "D new reader columns and Junction encoder receive nonzero gradient on one Fit batch"
  - "C Junction encoder receives no gradient (structurally inactive; disclosed)"
  - "E moment conservation sum_e W_e == 2 sum_j w_j and sum_e V_e == 2 sum_j w_j^2"
  - "E type-bucket reduction equals an independent Python loop"
  - "type relabel / atom relabel / bond endpoint swap / Junction row order / batch composition invariance"
  - "empty graph / empty junction / empty bucket produce no NaN"
  - "save-load replay exact"
  - "Fit-only standardisation and no Monitor/Locked label access, no official valid/test path"
  - "batch-order hash and SSL encoder hash match the P3-D-s{seed} records"
  - "no GNN / Transformer / attention / iterative message-passing module"

ban:
  - "no third architecture candidate"
  - "no formula change after seeing Monitor scores"
  - "no Junction hidden-width or pooling-bucket search"
  - "no learned attention/gates"
  - "no GLRC / DLP / Organized / typed-path-ring re-run"
  - "no official valid/test or Lipophilicity test access"
  - "no seed purchase decided on seed-0 Monitor outcome"
  - "no bootstrap crossing zero presented as proof of no difference"
  - "no forward sensitivity presented as causal contribution"
