# --------------------------------------------------------------- arms (Part II)
arms:
  A0:
    name: NO_LEARNED_J_CONTENT
    composer_inputs: "W_e = 0, V_e = 0, q_e = 0"
    role: "seed-0 baseline for C; seed 1 NOT_RUN by protocol"
  A1:
    name: GLOBAL_J_MOMENTS
    composer_inputs: "W_e = mu_G, V_e = nu_G, q_e = 0"
    role: "seed-0 reused; seed-1 newly trained as the D control"
  A2:
    name: P3_NULL_REFERENCE
    composer_inputs: "W_e = n_e * mu_G, V_e = n_e * nu_G, q_e = log1p(n_e)"
    role: "historical reference, reused read-only (both seeds)"
  C:
    name: J_COUNT_ONLY
    composer_inputs: "W_e = 0, V_e = 0, q_e = log1p(n_e)"
    meaning: >
      Learned Junction content is entirely absent downstream, but the
      deterministic per-bond Junction count n_e is still supplied.  The
      Junction encoder is executed for identical forward shape, discarded,
      and therefore receives no supervised gradient (disclosed; effective
      active capacity < A2).  Core contrasts: C-A0 (is the per-bond count
      useful?) and C-A2 (do learned moments add value on top of the count?).
  D:
    name: J_DIRECT_READOUT
    composer_inputs: "W_e = 0, V_e = 0, q_e = 0 (A0 composer)"
    reader_input: "[z_B, z_A, z_A2, g_G, mu_G, nu_G]  (321 + 192 = 513)"
    meaning: >
      The graph-level Junction moments mu_G / nu_G are appended to the reader
      input directly instead of being broadcast to every bond and passed
      through the per-bond composer.  The 192 new first-layer reader columns
      are zero-initialised, so the initial function equals A0.  Not
      parameter-matched to A1/A2 (462,657 vs 413,505 allocated parameters).
  E:
    name: J_TYPE_CONDITIONED_POOL
    composer_inputs: "W_e = n_e * mu_{r_e}, V_e = n_e * nu_{r_e}, q_e = log1p(n_e)"
    grouping_key: "r_e = raw physical bond type (0..3), label blind"
    meaning: >
      The same first/second Junction moments are conditioned on the raw bond
      type of each bond: mu_r = S_r/N_r with S_r = sum_{e:r_e=r} sum_{j in e} w_j.
      No new parameters, no gates, no attention; the only change versus A2 is
      which bond receives which conditional mean.  Exactly preserves the
      per-molecule totals sum_e W_e = 2 sum_j w_j and sum_e V_e = 2 sum_j w_j^2.

architecture:
  module: code/structural_relation_composer_v1.py (unchanged for A0/A1/A2/C/E layouts)
  atom_encoder: {in: 96 out, hidden 128}
  bond_encoder: {out: 96, hidden 160}
  junction_encoder: {out: 96, hidden 160}
  composer: {out: 96, hidden 160}
  reader: {hidden: 256, layers: 2}
  allocated_parameters:
    base_and_C_E: 413505
    D: 462657
  d_new_reader_columns: 192
  d_new_first_layer_parameters: 49152

initialization:
  scratch: "per seed, the historical P3 scratch init (same RNG stream), asserted by hash"
  ssl: "per seed, the split-D Fit-only masked-SSL encoder (7560 updates), asserted by hash"
  composer_reader: "scratch init identical to the P3-D-s{seed} group state"
  d_reader_expansion: "old 321 columns copied tensor-wise; last 192 columns exactly zero; reader bias and later layers copied"
  batch_order: "identical to P3-D-s{seed} (8000 rows, batch 128, 360 epochs); asserted by hash"

supervised_recipe:
  name: R3
  epochs: 360
  updates: 22680
  schedule: "per-step cosine"
  lr: 1.0e-3
  lr_min: 1.0e-5
  weight_decay: 1.0e-5
  grad_clip: 5.0
  batch_size: 128
  optimizer: Adam
  loss: "raw-y L1"
  soup: "parameter mean of the last 5 epoch states"
  checkpoint_selection: "none"
  fp32: true

training_matrix:
  seed0: {new: [C, D, E], reused: [A0, A1, A2]}
  seed1: {new: [A1, C, D, E], reused: [A2], not_run: [A0]}
  seed1_purchase_priority: [E, D, A1, C]
  seed1_decision_rule: "bought for completeness and pre-declared budget only; NOT selected on seed-0 Monitor outcome"

# --------------------------------------------------------------- Part I analysis
part1:
  frozen_predictions: {A0: "monitor_A0_D_s0", A1: "monitor_A1_D_s0", A2: "monitor_A2_D_s0"}
  verify: "sha256 + row arange + prediction scale + y hash; recomputed MAE must match the historical monitor_scores.json to 1e-12"
  pairs: [[A2, A0], [A1, A0], [A2, A1]]
  top_k: [1, 3, 5, 10, 20]
  "clearly_better_threshold": 0.05
  descriptor_blocks:
    - "raw: [n_atoms, n_bonds, n_junctions, cyclomatic_rank]"
    - "global_feat: the frozen 33-dim label-blind global topology vector"
    - "atom_type_histogram: 28 counts"
    - "bond_type_histogram: 4 counts"
    - "degree_histogram: 5 counts (0..4, 4 = degree>=4)"
  novelty:
    fit_only_standardisation: true
    distance: "minimum L2 to any of the 8000 Fit molecules in the standardised descriptor space"
    monitor_strata: "Monitor-distance quartiles Q1..Q4 (thresholds computed on Monitor only; no label used)"
  structure_vs_label_disclosure: >
    Structure-based strata support exploratory readings about harder structure
    types.  Label-based strata describe the relation between y and errors only
    and cannot become a prediction-time structural rule.
  forbidden: "no threshold tuning on Monitor labels; no descriptor change after reading the results"

# --------------------------------------------------------------- decisions
decision_vocabulary:
  - COUNT_ONLY_NEAR_A2
  - COUNT_ONLY_INSUFFICIENT
  - COUNT_ONLY_INCONCLUSIVE
  - J_DIRECT_READOUT_USEFUL_EXPLORATORY
  - J_DIRECT_READOUT_NO_GAIN
  - J_TYPE_POOL_USEFUL_EXPLORATORY
  - J_TYPE_POOL_NO_GAIN
  - J_TYPE_POOL_FIT_ONLY
  - INCONCLUSIVE_SINGLE_SEED
  - NOT_RUN

decision_rules:
  useful: "delta <= -0.002 and paired molecule-bootstrap CI95 upper < 0"
  count_only_near: "|delta(C-A2)| <= 0.002 on the seed-0 pair (or seed-mean when both seeds exist)"
  count_only_insufficient: "delta(C-A2) >= +0.005"
  direct_readout_useful: "D-A1 useful by the rule above; RMSE and tail reported descriptively"
  type_pool_useful: "E-A2 useful by the rule above"
  type_pool_fit_only: "E fit MAE improves while E-A2 Monitor delta >= 0"

