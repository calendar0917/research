# cscl-bjoc-junction-mechanism-exploration-v2 (pre-registration)
#
# Track: tracks/structure-contribution
#
# ONE round with two parts, driven by the advisor-discussion question:
#
#   Which of the following is the current BJOC limit?
#     (a) the Junction content itself,
#     (b) where Junction information enters the downstream model,
#     (c) how whole-graph Junction information is organised, or
#     (d) training coverage of extreme molecules.
#
# Part I  (CPU only): error-complementarity analysis of the ALREADY FROZEN
#   split-D Monitor predictions A0/A1/A2 seed 0 from the junction-sufficiency
#   audit round.  No retraining of A0/A1/A2 seed 0.  This is exploratory
#   analysis of historically exposed development data.
#
# Part II (GPU): three pre-declared architecture arms, trained on split D:
#
#   C  J_COUNT_ONLY        W=0, V=0, q=log1p(n_e)         (no learned J content)
#   D  J_DIRECT_READOUT    A0 composer; reader gets [z, zA, zA2, g, mu_G, nu_G]
#   E  J_TYPE_CONDITIONED  W=n_e*mu_{r_e}, V=n_e*nu_{r_e}, q=log1p(n_e)
#
# plus A1 seed 1 as the same-seed control of D, and A2/P3 seed 1 reused
# read-only.  No third architecture, no GNN/Transformer/attention/iteration,
# no hyper-parameter search, no new split, no official valid/test, no Locked
# label read, no full-10k refit.
#
# Discipline inherited from prior rounds:
#   * split D was exposed in the architecture / TA-SSL rounds; its Monitor is
#     HISTORICALLY EXPOSED EXPLORATORY DEVELOPMENT DATA, not a blind test;
#   * Monitor labels are read exactly once in this round, after every new
#     prediction file is frozen and hash-manifested;
#   * Locked labels are NEVER read; official valid/test are NEVER loaded.
#
# Seed-1 purchase rule (frozen before any trajectory): the seed-1 matrix is
# bought for training completeness and pre-declared budget only, NOT on seed-0
# Monitor outcomes.  Pre-declared seed-1 priority order:
#   1. E seed 1, 2. D seed 1, 3. A1 seed 1, 4. C seed 1.
# A0 seed 1 is NOT trained (does not exist historically); all A0 seed-1
# contrasts are reported as NOT_RUN.

protocol: cscl-bjoc-junction-mechanism-exploration-v2
status: frozen
frozen_date: "2026-10-14"
track: tracks/structure-contribution
official_valid_role: "not used in this round"
official_test: never_read
locked: never_read

research_question: >
  Part I: is A2's RMSE (square-error) disadvantage driven by a few extreme
  molecules, by structural rarity of the molecules A0 predicts better, or is
  it broad across structurally similar molecules?  Part II: where should
  Junction information enter the whole-graph predictor?  Tests: (C) is a
  deterministic per-bond count enough?  (D) is a direct graph-level readout
  of the Junction moments better than the per-bond broadcast?  (E) does a
  fixed, label-blind bond-type-conditioned pooling of the same moments add
  value over the unconditional graph mean?

