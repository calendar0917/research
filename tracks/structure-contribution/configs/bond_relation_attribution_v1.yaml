# cscl-bond-relation-attribution-v1 (pre-registration; frozen before any GPU run)
#
# ONE question (do not broaden):
#   Under the IDENTICAL Bond Pair MLP / Composer / Reader / Fit-only masked-SSL
#   initialisation / batch order / R3 recipe, does the REAL one-hop bond
#   relation R = sym(P) beat (a) a row-sum-matched but incidence-free Null
#   D_ij = s_i s_j / sum(s) and (b) the historical uniform control U on a NEW
#   internal split (8k/1k/1k, two seeds); and how far is R from a same-round
#   strong reference P3 (BJOC-Null, different architecture)?
#
# The previous round (explicit-composition-signal-audit-v1) concluded
# INSUFFICIENT_OR_CONFOUNDED for a beyond-formula / bag-collision argument.
# This round does NOT need such an argument: it tests predictive inductive bias
# under matched supervision, not the causal effect of composition on chemistry.
#
# Deliberately NOT done: no new architecture, no fifth arm, no width/recipe/
# walk-length search, no early stopping on held-out, no official valid/test
# load, no third seed, no node-level or readout additions.

protocol: cscl-bond-relation-attribution-v1
status: frozen
frozen_date: "2026-10-18"
track: tracks/structure-contribution
split_tag: E

data:
  official_split: "ZINC(subset=True, split='train') only"
  n_rows_official_train: 10000
  excluded_rows: [941, 2210, 6071, 9766]
  exclusion_reason: >
    Committed canonical-SMILES identity contradicts the official PyG graph
    constitution (previous audit: pairing_verification reproduces exactly these
    four rows).  Excluded consistently for every arm BEFORE any label access.
  n_rows_usable: 9996
  identity: >
    canonical constitution SMILES rebuilt from the official PyG input graph
    (structure_context_support_v1._pyg_rebuilt_smiles, stereo removed), NOT the
    possibly-wrong committed SMILES string.  The graph identity partition must
    equal the committed-SMILES partition on the 9,996 kept rows.
  fingerprint_inputs:
    train_pt_sha256: "e0f1837b4a19714fcf3a5c6727a30c23f57c3398c8987cab2983214a0e76955b"
    canonical_smiles_npz_sha256: "04a590355fb7bba71e35e52bed60c974999b92af9e96e4ee99bed4afe42dcaff"
    encoded_train_pt_sha256: "10d764955ef1b040a317105be1dd3fbb2e81292b03b79e7d078cce08e18e5f1d"

split:
  salt: cscl-bond-relation-attribution-v1
  rule: >
    groups = identical graph-derived constitution identity; group order by
    sha256(salt|key); greedy fill fit to >=7996 rows, monitor to >=1000 rows,
    remainder locked; duplicate groups never cross zones.
  fit_target: 7996
  monitor_target: 1000
  locked_target: 1000
  z_disc: "unused (no early stopping, no model selection)"
  primary_endpoint: locked
  replication_endpoint: monitor

label_discipline:
  fit_y: "raw y from encoded_train.pt, Fit rows only, supervised training"
  monitor_y: "read exactly once, after all predictions/manifest/scoring code frozen"
  locked_y: "read exactly once in the same declared scoring step"
  official_valid: never_loaded
  official_test: never_loaded
  label_guard: "monitor+locked .y unreachable during prep/SSL/train/predict"

arms:
  R:
    relation: "K^R = sym(P), P = (I + D^-1 A_L)/2 lazy one-step, zero-degree rows one-hot"
    model: "bond_random_walk_organization_v1.BondRWComposer (unchanged)"
    parameters: 349985
    kernel_builder: "bond_rw_local_vs_multiscale_v1.k1_matrix + bwo.unordered_triplets"
  D:
    relation: "s_i = sum_j K^R_ij ; K^D_ij = s_i s_j / sum_k s_k"
    model: "same class/init as R"
    parameters: 349985
    properties:
      - "row sums equal R exactly (by construction)"
      - "total weight equals R exactly"
      - "rank 1 by construction; dense"
      - "no new parameters; no real one-hop incidence"
  U:
    relation: "K^U_ef = 1 / N_bond (historical uniform control)"
    model: "same class/init as R"
    parameters: 349985
    kernel_builder: "bond_random_walk_organization_v1.uniform_triplets (unchanged)"
  P3:
    relation: "BJOC-Null (learned Junction encoder, one-shot composer)"
    model: "bjoc_perfmech_long_v1.build_bjoc_null (unchanged)"
    parameters: 413505
    role: "same-round strong-performance reference; NOT a causal-control arm"

matching:
  seeds: [0, 1]
  gpu_parallel: {seed0: res-gpu0, seed1: res-gpu1}
  batch_size: 128
  updates: 22680
  epochs: 360
  steps_per_epoch: 63
  recipe: R3
  loss: "raw-y L1"
  optimizer: "Adam lr 1e-3 -> 1e-5 per-step cosine, wd 1e-5, clip 5"
  soup: "parameter mean of last 5 epoch states"
  shuffle_offset: 101
  shared_within_seed:
    - "fit rows and raw y"
    - "Fit-only global standardiser"
    - "batch order (hash must equal bp.batch_order_hash)"
    - "R/D/U scratch init (identical state_dict hash)"
    - "SSL artifact (atom+bond for R/D/U; all three groups for P3)"
  ssl:
    loop: "bjoc_perfmech_long_v1.pretrain_masked (unchanged)"
    mode: atom_bond
    updates: 7560
    batch: 128
    labels_read: false
    fit_rows_only: true

budget:
  gpu_hours_cap: 4.0
  estimate_gpu_hours: 2.1
  no_extra_seed: true
  no_extra_epoch: true
  no_extra_arm: true

cpu_gates:
  row_sum_tol: 1.0e-10
  total_weight_tol: 1.0e-10
  rank1_tol: 1.0e-9
  nondegeneracy_min_max_abs_diff: 1.0e-6
  invariance_tol: 1.0e-6
  param_count: {R: 349985, D: 349985, U: 349985, P3: 413505}
  micro_smoke_rule: >
    two identical 1-epoch micro-smoke runs must match bitwise or within
    max|dsoup| <= 1e-6 (remote CPU float32 reduction noise ~1e-7, documented
    in earlier rounds); bitwise equality is recorded separately.
  ssl_hash_convention: "atom:/bond:/junc: prefixes; asserted equal to pretrain_masked.encoder_final_sha256"
  amendments:
    - id: amendment-3
      when: "2026-10-18 pre-GPU"
      what: "file lock (fcntl.flock) around the shared prediction manifest and budget ledger, required by the two-GPU parallel seed run; no protocol semantics change"
    - id: amendment-2
      when: "2026-10-18 pre-GPU, after smoke (no labels read)"
      what: "full-encoder group hash uses the historical junc: prefix; SSL self-check and P3 matching audit compare against encoder_final_sha256; freeze regenerated"
    - id: amendment-1
      when: "2026-10-18 pre-GPU (no labels read)"
      what: "micro-smoke determinism gate is a float32 noise floor, not bitwise soup-hash equality"
  reuse_hashes:
    bond_random_walk_organization_v1.py: "efda1dd72ac4465583b0e913c348a949c0c3e5ec9d92c965cd0631a89e39e7f0"
    bond_rw_local_vs_multiscale_v1.py: "6638b238e36b601f829b83cf30078926430c8f1eab8cf2dbfa0b60f735b46c81"
    structural_relation_composer_v1.py: "1c83a97ece60a151c6fa0c1ad5d2022b470ede9356b23d8d7b1e6b62daa71f4f"
    structural_relation_objects_v1.py: "8f4ba44dc3c047d674a1a6832f7ed8265eaa2457b15e820b3973a4cbd3a0861c"
    bjoc_perfmech_long_v1.py: "cb9796cb45f6fe048f2fd63e96798937cdbd802b28dbad34b2aafdbef0cbafe8"
    bjoc_arch_breakthrough_v1.py: "31294de0526215e3c998a822346d4dac5baceb24ebd986b61122f78e65d55377"
    bjoc_masked_pretraining_v1.py: "f27dbfe36ac5a9a0a1915320dba7c955115ccfa36e6b4755f2d2d62d8efb1489"

scoring:
  bootstrap: {n: 5000, seed: 0, unit: molecule}
  tail_threshold: -3.0
  top_k_removed: 10
  contrasts:
    primary: R_minus_D
    replication: R_minus_U
    rowsum_share: D_minus_U
    reference: R_minus_P3
  decisions:
    meaningful_delta: 0.004
    replicated_rule: "seed-mean < 0 and both per-seed deltas < 0 on Monitor"
    case_a_max_gap_to_p3: 0.010
    case_b_max_gap_to_p3: 0.020
  vocabulary: [GAIN, LOSS, NEUTRAL]
  case_vocabulary:
    - CASE_A_RELATION_CANDIDATE
    - CASE_B1_ROWSUNM_ABSORBS
    - CASE_B2_NO_GAIN_OVER_UNIFORM
    - CASE_B3_FAR_BELOW_STRONG_REFERENCE
    - CASE_B4_D_BETTER_THAN_R
    - CASE_C_INCONCLUSIVE
  stop_after_round: true

diagnostics:
  cross_kernel_forward: "each of R/D/U trained models evaluated with each of R/D/U kernels (9 frozen prediction sets)"
  kernel_stats: [rowsum_cv, nonzero_fraction, rank, top_eigen_share, tv_to_uniform, corr_degree_rowsum, diagonal_mass, weight_quantiles]
  gradient_liveness: "post-training per-module grad norms on one Fit batch"
  error_regions: [ordinary, tail, top10_removed, single_worst_removed]
  no_causal_chemistry_claim: true

deliverables:
  dir: results/bond_relation_attribution_v1
  report: REPORT.md (Chinese)
