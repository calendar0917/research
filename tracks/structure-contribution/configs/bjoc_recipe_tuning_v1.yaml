# cscl-bjoc-recipe-tuning-v1  (pre-registration; frozen before any GPU)
#
# Track: tracks/structure-contribution
#
# ONE scientific question: how much does the *supervision-phase training
# recipe* of the already-validated masked-pretrained BJOC-Null P still limit
# single-model raw-y generalisation?  Five pre-declared recipes only (R0-R4),
# all other factors frozen.
#
# No model change, no architecture change, no new module, no objective change,
# no pretraining change, no data change, no label change, no target transform.
# Official valid is the exposed development set used for screening; official
# test is never loaded in any form.

protocol: cscl-bjoc-recipe-tuning-v1
status: frozen
frozen_utc: "2026-10-13"
official_test: never_read

question: >
  Holding the BJOC-Null architecture (413,505 params), the frozen full-10k
  masked-SSL encoder state, the composer/reader initialisation, the training
  rows, the batch size, the raw-y L1 loss, the gradient clip, the parameter
  soup window and the per-seed batch order fixed, does changing only
  (a) the number of supervised epochs, (b) a per-step cosine LR decay
  1e-3 -> 1e-5, or (c) a 10x weight decay improve the official-valid seed-mean
  raw-y MAE of the pretrained model P, stably across seeds and outside the
  extreme row valid:0172?

hypotheses:
  H1: "the fixed constant LR may limit late optimisation; a cosine decay could help"
  H2: "240 epochs may under-train; 360 epochs could improve generalisation"
  H3: "cosine decay and longer training may interact"
  H4: "a stronger weight decay (1e-4) could improve generalisation at fixed length"
  null: "none of R1-R4 robustly improves on R0 (NO_ROBUST_RECIPE_GAIN is allowed)"

# ---------------------------------------------------------------- data
data:
  train: "official PyG ZINC subset=True train, 10000 rows, original order"
  valid: "official PyG ZINC subset=True val, 1000 rows (exposed development set)"
  test: forbidden
  internal_split: none
  y_source: "raw y from the frozen ksvd encoded_train.pt cache (train) / PyG val (valid), same path as the P round"
  pretraining_state: "frozen full-10k masked-SSL encoder files pretrain_encoder_s0/s1.pt reused byte-for-byte; no SSL retraining"
  normalisation: "global-feature standardiser fit on the 10,000 official train objects only (frozen file reused)"

# -------------------------------------------------------- candidate recipes
# R0 is the historical P recipe and is evaluated by checkpoint/prediction
# replay only (no retraining).  R1-R4 are new single-variable perturbations.
candidates:
  R0:
    label: "historical P baseline (replay only)"
    epochs: 240
    schedule: constant
    lr: 1.0e-3
    lr_min: null
    weight_decay: 1.0e-5
    reuse: historical_P_checkpoint
  R1:
    label: "240 epochs, cosine 1e-3 -> 1e-5, wd 1e-5"
    epochs: 240
    schedule: cosine
    lr: 1.0e-3
    lr_min: 1.0e-5
    weight_decay: 1.0e-5
    reuse: null
  R2:
    label: "360 epochs, constant 1e-3, wd 1e-5"
    epochs: 360
    schedule: constant
    lr: 1.0e-3
    lr_min: null
    weight_decay: 1.0e-5
    reuse: null
  R3:
    label: "360 epochs, cosine 1e-3 -> 1e-5, wd 1e-5"
    epochs: 360
    schedule: cosine
    lr: 1.0e-3
    lr_min: 1.0e-5
    weight_decay: 1.0e-5
    reuse: null
  R4:
    label: "240 epochs, constant 1e-3, wd 1e-4"
    epochs: 240
    schedule: constant
    lr: 1.0e-3
    lr_min: null
    weight_decay: 1.0e-4
    reuse: null

# ------------------------------------------------------------- fixed recipe
recipe:
  optimizer: adam
  lr: 1.0e-3
  weight_decay: 1.0e-5
  batch_size: 128
  grad_clip: 5.0
  precision: fp32
  amp: false
  dropout: 0.0
  loss: "L1 on raw y only"
  encoder_lr: "single parameter group; all 413,505 parameters share the candidate LR"
  steps_per_epoch: 79
  soup_last: 5
  train_shuffle_offset: 101
  parameters_expected: 413505
  cosine_rule:
    type: "torch.optim.lr_scheduler.CosineAnnealingLR"
    per: step
    warmup: none
    t_max: "epochs * steps_per_epoch"
    eta_min: 1.0e-5
    step_order: "scheduler.step() immediately after every optimizer.step(); step 1 uses the base lr"
    formula: "lr(k) = eta_min + 0.5*(lr0-eta_min)*(1+cos(pi*k/T_max)), k = number of scheduler steps already taken"

# ------------------------------------------------------- screening (seed 0)
screening:
  comparison: "paired per-molecule |err(R*_s0) - err(P_s0)| against the SAME seed 0 and the SAME frozen valid split"
  metrics: ["raw-y MAE", "ordinary (y > -3) MAE", "tail (y <= -3) MAE", "RMSE", "median/p90/p95/p99", "top-1/5/10-removed delta", "valid:0172 exclusion", "fit MAE", "GPU wall time"]
  gate:
    - "seed-0 valid MAE delta <= -0.003"
    - "ordinary (y > -3) MAE delta <= 0.0 (not worse)"
    - "delta excluding valid:0172 <= -0.002 (gain is not carried by the one extreme row)"
    - "training numerically finite (no non-finite loss, no non-finite gradient, parameter/init/batch-order audits pass)"
  selection_if_multiple_pass: "lowest seed-0 valid MAE; tie broken by fewer supervision updates"
  if_none_pass: "STOP the GPU search; report the negative result; no seed 1, no new candidate, no hyper-parameter search."

# ----------------------------------------- confirmation (unique candidate, seed 1)
confirmation:
  purchased: "exactly one candidate, seed 1 only"
  comparison: "per-seed deltas R*_s - P_s for s in {0,1}, seed-mean delta, molecule-level paired bootstrap (5000, seed 0)"
  final_gate:
    - "both seed deltas < 0"
    - "seed-mean MAE delta <= -0.003"
    - "seed-mean ordinary (y > -3) delta <= 0.0"
    - "seed-mean top-10-removed delta < 0"
    - "seed-mean delta excluding valid:0172 < 0"
    - "no numerical / evaluation anomaly"
  classification:
    RECIPE_GAIN_CANDIDATE: "all final_gate conditions hold AND bootstrap CI95 upper < 0"
    WEAK_OR_INCONCLUSIVE: "all final_gate conditions hold but CI95 crosses zero, or a partial/conflicting signal"
    NO_ROBUST_RECIPE_GAIN: "final gate fails, or no candidate passed screening"
  not_claimed: "the seed-1 check and its CI are NOT an independent blind test; they are conditional on the seed-0 valid screening of the same exposed valid set"

# ------------------------------------------------------- evaluation protocol
evaluation:
  order: >
    (1) replay R0 from the frozen P checkpoints and verify the frozen P valid
    predictions; (2) train R1-R4 seed 0; (3) forward all frozen soups on the
    official-valid structures without reading labels; (4) hash every prediction
    file and freeze; (5) read the official-valid labels exactly once; (6)
    screen; (7) if and only if a unique candidate passes, train its seed 1,
    predict, re-freeze, and score; (8) write the frozen decision.
  primary_metric: "official-valid raw-y MAE, seed-mean of the per-seed single-model MAEs (never an ensemble)"
  bootstrap: {n_resamples: 5000, seed: 0, unit: molecule}
  no_post_read_training: true
  no_ensemble_headline: true
  no_test_access: true

# ------------------------------------------------------------- budget + bans
budget:
  gpu_hours_max: 2.5
  gpus_max: 1
  gpu_authorised: "res GPU1 (pool res-gpu1); GPU0 and res-2 are not authorised"
  r0: "replay only, no retraining"
  screening: "exactly one seed-0 training per R1-R4"
  confirmation: "at most one seed-1 training, only for the unique pre-registered winner"
  no_retry_to_chase_luck: true
  stop_on_gpu_or_artifact_failure: true

bans:
  - "sixth candidate; hidden dimensions; layer numbers; dropout; batch size; loss; mask ratio; pretraining objective or length; checkpoint-averaging window"
  - "per-candidate seed search / third seed / re-running a candidate to chase a lower number"
  - "ensemble as a headline; calibration; label clipping; target transform/standardisation; tail-weighted loss"
  - "official test access in any form, including the historical 0.073957 for selection"
  - "re-tuning after the official-valid read; deleting/trimming rows from the headline"

decision_vocabulary:
  - RECIPE_GAIN_CANDIDATE
  - WEAK_OR_INCONCLUSIVE
  - NO_ROBUST_RECIPE_GAIN
  - BLOCKED

