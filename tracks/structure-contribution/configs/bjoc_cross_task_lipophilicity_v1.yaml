# cscl-bjoc-cross-task-lipophilicity-v1 — FROZEN protocol.
#
# Frozen before any GPU trajectory.  After the `prep` command runs, the driver
# additionally writes `results/bjoc_cross_task_lipophilicity_v1/protocol_freeze.json`
# binding this config + code hashes + split/dataset fingerprints.  GPU runs
# refuse to start without a matching freeze.
protocol_id: cscl-bjoc-cross-task-lipophilicity-v1
track: structure-contribution
status: preregistered
question: >-
  Does the one-shot Atom/Bond/Junction BJOC structural computation plus
  train-only Masked Structural SSL initialisation transfer to a new molecular
  property task (MoleculeNet Lipophilicity, logD regression, RMSE), and is the
  resulting single model competitive with same-protocol ECFP / 2D graph
  baselines under a strict label-isolation and prediction-freezing discipline?

dataset:
  name: MoleculeNet Lipophilicity
  source_url: https://deepchemdata.s3-us-west-1.amazonaws.com/datasets/Lipophilicity.csv
  sha256: aed41590cb30609d51d8e08ad3ff06495a76e80e211358801f596b10da69bacd
  rows: 4200
  label_column: exp
  metric_primary: rmse
  metric_secondary: mae
  task: experimental octanol/water distribution coefficient (logD at pH 7.4)
  license_note: >-
    Curated from ChEMBL (Hersey 2015, DOI 10.6019/chembl3301361) and
    redistributed by DeepChem; see BENCHMARK_AUDIT.md for the full provenance
    and license audit.  The raw CSV is downloaded from the official DeepChem
    URL and pinned by sha256; it is never committed with labels.

split:
  protocol: DeepChem 2.8.0 ScaffoldSplitter (verbatim algorithm, deterministic, no seed)
  fractions: {train: 0.8, valid: 0.1, test: 0.1}
  reference: >-
    generated by directly running deepchem==2.8.0 ScaffoldSplitter.split on the
    CSVLoader dataset (ids = smiles column, CSV row order) in an isolated venv;
    the driver reproduces the algorithm and must match it index-for-index
    before anything else runs.
  expected_sizes: [3360, 420, 420]

vocabulary:
  rule: >-
    atom classes = (element, aromatic) pairs observed on the TRAIN split only
    (structure only, no labels), sorted lexicographically, 15 classes; unseen
    pairs map to a dedicated UNK slot; masked SSL uses a dedicated MASK slot.
    Charge / total-H / chirality / bond-stereo buckets: fixed 5/5/4/4-value
    tables + UNK + MASK.  Bond classes: single/double/triple/aromatic + UNK +
    MASK.  The vocabulary is frozen in
    code/bjoc_lipophilicity_adapter_v1.py before any GPU work.
  atom_class_provenance: >-
    train split observations: C(24676 aliphatic / 41722 aromatic), N(6160/5350),
    O(8482/221), S(818/451), F(1441), Cl(1082), Br(90), I(6), B(4), P(1), Si(1).
    valid contains one aromatic-Se atom (unseen in train -> UNK); test contains
    no atom outside the table.

model:
  builder: structural_relation_composer_v1.BJOC with bjoc_lipophilicity_adapter_v1.LipoConfig
  organisation_mode: null
  hidden_widths: frozen BJOC values (128/96 atom, 160/96 bond, 160/96 junction, 160/96 composer, 256x2 reader)
  expected_inference_parameters: 419713
  forbidden: [GNN, Transformer, attention, iterative message passing, 3D conformer network, extra readout branch]
  notes: >-
    Only the first-layer input widths change with the new vocabulary; hidden
    widths, depth, Null composer and whole-graph reader are unchanged from the
    frozen ZINC BJOC.

ssl:
  objective: CE(masked atom classes) + CE(masked bond classes), weights 1.0/1.0
  mask_ratio: {atom: 0.15, bond: 0.15}
  mask_tokens: {atom: 16, bond: 5}   # dedicated slots; never collide with real/UNK
  batch_size: 128
  exposure_target_per_molecule: 96
  updates_rule: round(96 * N_train / 128)
  updates: 2520
  optimizer: {name: Adam, lr: 0.001, weight_decay: 0.00001, grad_clip: 5.0}
  checkpoint_rule: last step only
  data: TRAIN structures only; valid/test are never used in SSL
  rebuild: every object feature is rebuilt from the masked raw graph (no incremental patching)
  hidden_truth: masked atom class / bond class kept outside the model input

supervised:
  recipe_key: R3-Lipo
  target_normalization: train-only mean/std; MSE on normalized target; inverse transform before metrics
  optimizer: {name: Adam, lr: 0.001, lr_min: 0.00001, schedule: per-step cosine, weight_decay: 0.00001, grad_clip: 5.0}
  batch_size: 128
  epochs: 360
  soup: parameter mean of the last 5 epoch states
  model_selection: none (no validation-driven checkpoint choice)
  arms:
    S: scratch (no SSL)
    P: same init + SSL-pretrained encoders; composer/reader from the identical seed init as S
  shared_per_seed: [full model init, batch order, schedule, update count, soup rule]
  note: >-
    R3-Lipo is the Lipophilicity adaptation of the frozen R3 recipe (RMSE metric
    -> normalized MSE loss).  It is NOT the raw-y L1 ZINC R3 and is never called
    identical to it.

baselines:
  ecfp4_rf:
    fingerprint: {kind: Morgan, radius: 2, n_bits: 2048, use_features: false}
    model: sklearn.ensemble.RandomForestRegressor(n_estimators=500, max_features=1.0, random_state=0, n_jobs=-1)
  ecfp4_xgb:
    fingerprint: {kind: Morgan, radius: 2, n_bits: 2048, use_features: false}
    model: xgboost.XGBRegressor(n_estimators=500, max_depth=6, learning_rate=0.05, subsample=0.8, colsample_bytree=0.8, reg_lambda=1.0, min_child_weight=1, random_state=0, tree_method=hist)
  crippen_logp_reference: descriptive only (never a model input, never a hidden shortcut)
  same_indices: true
  no_test_search: true

promotion_gate:
  baseline_arm: S
  candidate_arm: P
  metric: validation raw-scale RMSE (seed-mean of single models)
  conditions:
    relative_rmse_drop_min: 0.04
    absolute_rmse_drop_min: 0.03
    both_seeds_improve: true
    paired_bootstrap_ci_upper_below_zero: true
    mae_not_materially_worse: true
    not_single_outlier_driven: true
    ecfp_baselines_done: true
    audits_pass: true
    budget_sufficient: true
  outcomes: [TRANSFER_SSL_GAIN_PROMISING, TRANSFER_SSL_PROMISING_UNCONFIRMED, TRANSFER_SSL_NO_CONFIRMED_GAIN]

conditional_confirmation:
  purchase_condition: promotion_gate passed
  seeds: [0, 1, 2, 3, 4]
  extra_seeds: [2, 3, 4]
  compute_ledger_required: true
  compute_control: optional (dropped first if the budget demands)

final_test:
  policy: single terminal read
  preconditions: [promotion decision fixed, checkpoints frozen, predictions generated and hashed, manifest frozen]
  reporting: >-
    per-seed single-model RMSE/MAE, seed mean +/- std, paired bootstrap
    contrast, scaffold subgroups, sample counts, GPU hours, parameter count,
    dataset/split provenance.  A seed-ensemble is a separately labelled
    supplementary number and never the headline.

budget:
  gpu_hours_max: 4.0
  guidance:
    cpu_gates_and_gpu_smoke: 0.2
    seeds_0_1_ssl: 0.8
    seeds_0_1_supervised: 0.7
    conditional_seeds_2_3_4: 1.3
    conditional_controls: 0.6
    reserve: 0.4

stopping_rules:
  no_second_mask_ratio: true
  no_second_backbone: true
  no_dataset_switch_on_failure: true
  no_test_driven_search: true
  no_ensemble_as_headline: true

label_access:
  remote_artifacts_contain_labels: false
  validation_labels_read: once, after all validation predictions are frozen
  test_labels_read: once, after validation decision and (if applicable) seed expansion are fixed
  lock_files: [validation_read.lock, test_read.lock]
