# cscl-bjoc-junction-sufficiency-audit-v1 (pre-registration)
#
# Track: tracks/structure-contribution
#
# ONE round, THREE questions, ONE seed, split D:
#
#   A. How much of the current BJOC-Null competitive accuracy needs the
#      learned Junction local content at all (A0 vs A1 vs A2)?
#   B. Which structural-organization information does the frozen system
#      provably lose, and where in the forward pass does it happen?
#
# The round is a mechanism-exploration round for an advisor discussion.  It is
# NOT a SOTA search: no second seed, no new split, no new hyper-parameter, no
# full-10k refit, no official valid/test, no Locked read.  A0/A1 are the only
# new supervised trajectories (2 x R3, seed 0).  A2 is the frozen historical
# P3-D-s0 model/predictions, reused read-only.
#
# Discipline inherited from cscl-bjoc-task-adaptive-ssl-v1:
#   * official test is NEVER loaded in any form (no code path exists);
#   * official valid is not used in this round at all;
#   * split D is an internal re-partition of official train 10000 that has
#     already been exposed (TA-SSL round), so its Monitor is
#     HISTORICALLY EXPOSED EXPLORATORY DEVELOPMENT DATA, not a first blind
#     validation and not an external test;
#   * Monitor labels are read exactly once in this round, after every
#     prediction file is frozen and hash-manifested;
#   * Locked labels are NEVER read in this round;
#   * Fit-only standardisation; Fit-only SSL encoder reuse; Fit raw-y
#     supervision only.

protocol: cscl-bjoc-junction-sufficiency-audit-v1
status: frozen
frozen_date: "2026-10-14"
track: tracks/structure-contribution
seed: 0
official_valid_role: "not used in this round"
official_test: never_read
locked: never_read

research_question: >
  In the current BJOC-Null + Fit-only masked-SSL + R3 system, how much does the
  learned Junction channel contribute (a) as graph-level Junction content and
  (b) as a per-bond Junction-count conditioning?  And which structural
  organization information is provably discarded by the Null grouping, at what
  stage of the representation?

