  official_valid: "never loaded"
  official_test: "never loaded"

# --------------------------------------------------------------- A decisions
decision_vocabulary:
  - J_MOMENTS_USEFUL_EXPLORATORY
  - J_MOMENTS_NO_CLEAR_GAIN
  - COUNT_CONDITIONING_USEFUL_EXPLORATORY
  - COUNT_CONDITIONING_NO_CLEAR_GAIN
  - NULL_OWNERSHIP_BLINDNESS_VERIFIED
  - REAL_REPRESENTATION_COLLISION_FOUND
  - REAL_COLLISION_NOT_FOUND_WITHIN_BUDGET
  - INCONCLUSIVE_SINGLE_SEED

contrasts:
  delta_10: "MAE(A1) - MAE(A0)"
  delta_21: "MAE(A2) - MAE(A1)"
  delta_20: "MAE(A2) - MAE(A0)"
  bootstrap_unit: "molecule (paired)"
  bootstrap_resamples: 5000
  bootstrap_seed: 0
  useful_threshold: -0.002
  clear_gain_rule: >
    A contrast is labelled *_USEFUL_EXPLORATORY only if the point estimate is
    <= -0.002 and the paired bootstrap 95% CI upper bound is < 0.  Otherwise
    it is labelled *_NO_CLEAR_GAIN, and INCONCLUSIVE_SINGLE_SEED is added when
    the CI crosses zero by more than the point estimate.

metrics_reported:
  - raw_y_mae
  - rmse
  - median_absolute_error
  - p90_absolute_error
  - ordinary_subgroup (y > -3)
  - tail_subgroup (y <= -3)
  - top10_error_removed_mae
  - fit_mae
  - training_wall_seconds
  - paired_bootstrap_ci

stop_rules:
  - "no second seed"
  - "no new split"
  - "no new hyper-parameter"
  - "no full-10k refit"
  - "do not read Locked"
  - "do not load official valid/test"
  - "no new module on top of A1"
  - "report the interpretation matrix as frozen; do not chase a better MAE"

# --------------------------------------------------------------- Part B rules
structural_audit:
  analysis_subset:
    fit_rows: "the first 2000 rows of the sorted split-D Fit list (label-blind)"
    monitor_rows: "all 1000 split-D Monitor rows (structure fields only; labels not read)"
    note: >
      The subset is fixed here before any representation is computed, so the
      B2/B4 summaries are not selected for interest.
  level0:
    - "atom type histogram (28)"
    - "bond type histogram (4)"
    - "degree histogram (5)"
    - "junction structural descriptor counts (centre degree, endpoints bonded, ring-bond count, both-ring, bond-type pair)"
    - "frozen 33-dim global topology vector"
  level1:
    - "atom/bond/junction embedding first and second moments per molecule"
    - "true per-bond junction count multiset"
    - "true junction-to-bond incidence multiset signature"
  level2:
    - "sum_b c_b under A0, A1, A2 (same frozen P3 weights for the representation-only comparison, plus the trained A0/A1 soups for the system-level comparison)"
  level3:
    - "the 321-dim reader input [sum_b c_b, sum_i a_i, sum_i a_i^2, g_G]"
  block_diagnostics:
    - "shape, mean, std, constant-column fraction"
    - "effective rank (entropy of the normalised singular-value spectrum)"
    - "PCA cumulative explained variance (Fit-only fit): dims for 90% and 99%"
    - "pairwise block linear redundancy: ridge R^2 of each block regressed on the other three (Fit-only fit)"
    - "pairwise distance quantiles in Fit-only standardised block space"
  collision_search:
    scope: "official train 10000 structure fields (x / edge_index / edge_attr only)"
    exact_key: >
      identical 33-dim global_feat float32 bytes AND identical atom-type
      histogram AND identical bond-type histogram AND identical degree
      histogram AND identical per-bond junction-count multiset AND different
      canonical SMILES
    near_rule: >
      If no exact collision exists, standardise the 33 global features with
      Fit-only statistics, append atom/bond/degree histograms, and take the
      pairs with the smallest Euclidean signature distance.  Candidate budget:
      at most 200 pairs.  Report the distance for every pair.  Never call a
      near pair 'identical'.
    isomorphism_check: "different canonical SMILES is the primary check; the reported pairs are re-checked with a NetworkX GraphMatcher on atom/bond-labelled graphs"
    max_reported_pairs: 20
    representation_compare:
      - "Fit-only standardised reader-input L2 distance"
      - "frozen-prediction absolute difference"
    not_found_token: REAL_COLLISION_NOT_FOUND_WITHIN_BUDGET
  interventions:
    junction_row_permutation:
      expectation: "A2 W/V and prediction invariant (known property, re-checked)"
    assignment_switch:
      construction: "marginal-preserving Junction-to-Bond reassignment at the post-encoding incidence level, using the historical 4-bond/4-junction counterexample and a real-molecule disjoint-pair swap when one exists"
      expectation: "A2 representation invariant; ORGANIZED representation changes"
      caveat: "the switch is performed after encoding; it does not have to correspond to a realisable molecule"
    global_block_neutralisation:
      neutralise: ["sum_b c_b", "sum_i a_i", "sum_i a_i^2", "g_G"]
      metric: "frozen-prediction absolute change over the pre-declared subset"
      caveat: "zeroing a block feeds the reader an out-of-distribution input; the change is a sensitivity diagnostic, not a chemical attribution"
  synthetic_known_truth:
    reuse: "results/structural_relation_composer_v1 object-level counterexample (marginal-preserving ownership switch)"
    target_M: "sum of a fixed function of the junction tokens (depends only on the Junction multiset)"
    target_O: "sum over selected bonds of a function of the junctions that really touch that bond (depends on ownership)"
    analysis: "deterministic distinguishability only; no new training this round"
