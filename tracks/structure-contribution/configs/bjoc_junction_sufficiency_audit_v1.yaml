# --------------------------------------------------------------- arms (A)
arms:
  A0:
    name: NO_LEARNED_J_CONTENT
    composer_inputs: "W_e = 0, V_e = 0, q_e = 0; b_e and raw bond unchanged"
    junction_forward: "computed but discarded (kept for identical model spec/forward shape)"
    interpretation: >
      No learned Junction content reaches the downstream model.  It is NOT
      'no junction/second-order topology information', because global_feat and
      radius-2 atom features remain.
  A1:
    name: GLOBAL_J_MOMENTS
    composer_inputs: "W_e = mu_G (graph mean of w_j), V_e = nu_G (graph mean of w_j^2), q_e = 0"
    junction_forward: "computed; graph moments broadcast uniformly to every bond"
    interpretation: >
      Full-molecule Junction content is available, but no per-bond Junction
      count conditioning and no true Junction-to-Bond ownership.
  A2:
    name: P3_NULL_REFERENCE
    composer_inputs: "W_e = n_e * mu_G, V_e = n_e * nu_G, q_e = log1p(n_e)"
    junction_forward: "computed; historical BJOC-Null"
    interpretation: >
      Matched historical reference, reused read-only (model + Monitor
      predictions).  Neither A1 nor A2 restores the true Junction-to-Bond
      ownership relation; the ownership question was studied historically
      (Organized vs Null; GLRC) and is not re-run here.

