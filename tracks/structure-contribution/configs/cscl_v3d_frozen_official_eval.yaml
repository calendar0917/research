# cscl-v3d-frozen-official-eval — 冻结模型的官方 validation/test 终点评估协议
#
# 冻结时间: 2026-10-11 (在任何 official validation/test 特征构建与评分之前)
# 授权: 用户已明确授权本轮读取 official validation 与 official test 并实际评分。
# 性质: 终点评估（zero training）。不选择、不修改、不重训任何模型。
#
# 历史 test 接触披露（预冻结声明）:
#   本仓库 KSVD 路线历史上有 official-test 访问记录
#   (tracks/ksvd/experiments/luyin16/zinc_e2e_dictenv_p1.py::unlock_test_stage,
#    "project_wide_pristine": false, 理由 "historical unrelated ZINC official-test
#    reads already exist")。CSCL-v3d 本身的训练/分析 (results/cscl_v3d/) 从未加载
#   official valid/test (train json 的 discipline.official_valid_loaded=false /
#   official_test_loaded=false; code/run_prediction_feasibility_v2.py::load_train_rows
#   docstring "encoded_valid.pt / official valid / official test are never touched")。
#   因此本轮结果不得表述为"全项目首次官方 test 盲测"，只能表述为:
#   "CSCL-v3d 的方法/checkpoint 在本轮读取 official validation/test 之前已冻结;
#   本次是该冻结版本在两个官方 split 上的终点评估。"

