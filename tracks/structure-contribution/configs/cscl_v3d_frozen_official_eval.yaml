  gauge_offsets: "由 gauge_offsets_s0.pt 原样加载, 不重算"

# ---------------------------------------------------------------------------
# 推理入口与工程门槛（评分前必须全部通过; 全部是工程完整性检查, 非性能判断）
# ---------------------------------------------------------------------------
engineering_gates:
  input_replay_on_train:
    desc: "新推理入口对 official train 固定小子集 (前 64 分子) 重建 v3d 特征, 与已验证缓存逐字段一致"
    tolerance: "float 字段逐位一致 (同设备同代码); 结构字段完全相等"
  frozen_model_replay_internal:
    desc: "F 在 monitor+dev 的重放 vs 已存导出; S/O 对 dev 2000 重放 vs 正式分析读数"
    tolerances: {F_pred_atol: 5.0e-5, S_dev_mae_atol: 1.0e-4, O_dev_mae_atol: 1.0e-4, S_pred_atol: 1.0e-5}
    reference: {F_dev: 0.11641, O_bucket_dev: 0.11610, S_bucket_dev: 0.12694}
  input_conservation_on_official_splits:
    desc: "extract_batch_bucket 内建门 (对每个 valid/test 分子): 原子数匹配; dict_atom==x; 每 pair 恰好一个 unit/relation 分桶; 每桶 count 与矩守恒; 从存储块重建 Full-Y 每桶 pooled 一/二阶矩; 新旧边际一致; C6_MASK 语义 (masked count blocks == 0); pair 总数 = n(n-1)/2"
    tolerance: "与 v3d 相同 (POOL_RTOL=2e-4, POOL_ATOL=2e-3; bf 内部断言)"
  s_additivity_and_gauge_on_official_splits:
    desc: "对 valid/test 全部分子: pred = bias + sum(alpha+delta) + sum(gamma) + g_ctx + g_topo 从导出贡献独立重建; raw/canonical pred 一致; alpha/delta 逐单元平移互相抵消 (canonical 与 raw 的逐分子 unit_sum 相等); gamma/global/bias 不受 offsets 影响; 输出全部有限"
    tolerance: "1.0e-5 (= contribution_gauge.GAUGE_ATOL, v3d 同一容差, 评分前冻结)"
  determinism:
    desc: "checkpoint SHA256 在评估前后相同; 三个模型 eval()+no_grad(); 预测长度 == split 长度"
  y_isolation:
    desc: "特征提取与预测生成接口不读 y (extract 的 ys 参数只写入 MolFrozen.y 审计字段, collate/predict 只消费结构特征); 官方 y 仅在 score 阶段读取一次"

# ---------------------------------------------------------------------------
# 主指标与预冻结判断规则（在读取任何 official 分数之前冻结）
# ---------------------------------------------------------------------------
metrics:
  primary: "official raw-y MAE, valid 与 test 分别报告 (全量 1000, 不删重复)"
  paired_differences: [S_bucket_minus_O_bucket, S_bucket_minus_F, O_bucket_minus_F]
  bootstrap:
    resamples: 5000
    seed: 0
    ci: "percentile 95"
    unit: "有符号逐分子配对差 d_i = |pred_A_i - y_i| - |pred_B_i - y_i|"
    note: "valid 与 test 分别计算, 不混合; 区间反映固定模型的分子采样不确定性, 不反映训练种子随机性"
  secondary:
    - "每模型 internal dev -> official valid/test 的 MAE 变化"
    - "S 相对 O 的绝对 MAE 增量与相对增幅"
    - "逐分子三模型谁误差更低 (win counts)"
  exploratory_bands_prefrozen:
    strong_support:
      - "test 上 S-O 配对 CI 上界 <= 0.02"
      - "test 上 S-F 配对 CI 上界 <= 0.02"
      - "validation 方向与 test 无严重矛盾"
      - "全部工程门与贡献完整性检查通过"
    strong_support_meaning: "支持结构化贡献读出的预测代价处于预设可接受范围"
    limited_support:
      - "S-O、S-F 点估计均 <= 0.02 但 CI 上界 > 0.02"
    limited_support_meaning: "点估计达到工程目标, 统计证据不足以稳健确认容忍带"
    no_support:
      - "test 上 S 相对 O/F 差距明显扩大超出容忍带, 或关键不变性/加和验证失败"
    no_support_meaning: "不得以内部 dev 的情况 A 取代独立结果"
    # --- 预评分修正 (amendment 1, 在任何 official 数值计算之前提交) ---
    amendment_1_direction_operationalization:
      status: "对上方 'validation 方向与 test 无严重矛盾' 的唯一操作化; 冻结于评分前"
      rule: >-
        direction_consistent = (sign(S-O 点估计) 在 valid 与 test 一致) AND
        (sign(S-F 点估计) 在 valid 与 test 一致) AND
        |S-O 点估计跨 split 之差| <= 0.02 AND |S-F 点估计跨 split 之差| <= 0.02
      note: "只使用点估计的符号与跨 split 稳定性; 不引入新容忍带, 不改变其它判据"
  o_vs_f_equivalence:
    equivalence_region: [-0.01, 0.01]
    rule: "仅当 O-F 配对差 95% CI 完整落入该区间才使用统计等价表述; 否则只报告观察差与不确定性"

structure_overlap_audit:
  method: "标签无关; PyG ZINC 的 Data 无 smiles 字段且本地无 RDKit, 故重复检测在模型输入空间进行: Weisfeiler-Lehman 图哈希 (原子类别+键类型) 候选分桶 + 精确标签图同构确认 (networkx vf2)"
  validity_check: "在 official train 上验证该方法与 committed RDKit canonical-SMILES 表的一致性 (哈希+同构组 <-> smiles 组)"
  disclosure: "图同构 = 模型视角的同一输入 (x/edge_index/edge_attr 即模型输入的全部信息); 不冒充完整化学同一性 (立体化学/质子化细节不在输入中, 对本评估无关, 如实记录)"
  groups: ["valid 内部", "test 内部", "valid<->test", "valid/test <-> train (fit_inner/monitor/dev)"]
  policy: "不删除重复; 主指标始终为官方 split 全量; 重叠子群另报并披露 n"

attribution_audit:
  export: "S-bucket 对 valid/test 全部分子的逐单元 (type, alpha_can, delta_can, atoms) 与逐关系 (unit pair, gamma, bucket counts) 贡献 + 全局通道 + bias + 逐分子加和残差"
  analyses:
    - "跨分子共享: 同类型同 alpha; fit-frequent/rare/UNK 覆盖与误差"
    - "结构泛化子群: has_UNK, n_UNK, 原子数, 环系数, bucket-0 占比, y<=-3 描述性切片; 每组给 n; 不据此调模型"
    - "关系贡献: gamma 和分布, bonded vs 非 bonded, gamma 与桶组成的敏感性, 通道相关, 贡献抵消"
  wording_limits: "通道占比不称独立解释率; gamma 不作化学因果解释; gauge offsets 不在官方 split 重估"
  new_moment_usage_diagnostic:
    desc: "冻结敏感性诊断 (零训练, 标签无关, 不用 test 标签设计扰动): 置换/扰动 v3d 新增 per-bucket moment 数值列 (unit_bucket/rel_bucket 的 mean48/rms48) 观察 pred 与贡献变化; 并与合成任务 B 的定位修正一并报告 (任务 B 真值只含 bucket count 调制, 是 v3c 已有信息的恢复, 不能单独证明新增 moment 列被使用)"
    samples: "official train fit_inner 固定 1000 分子 (训练域) + official valid 1000 (结构外推域)"

test_access_rules:
  user_authorised: true
  one_formal_scoring: "valid 与 test 各正式评分一次, 在全部工程门通过后执行"
  sequence: "特征/预测全部生成并落盘 (含哈希) 之后, 才读取 y 评分; validation 分数不影响是否评估 test"
  no_adaptation: "若 validation 分数不理想, 仍按本协议完成 test (禁止跳过/换模型/调参)"
  failure_policy: "工程故障记录故障与修复依据; 禁止静默重复 test 只保留较好结果"
  access_record: results/cscl_v3d_official_eval/test_access_record.json
  result_status: "本次 test 结果仅属于本冻结版本; 后续任何新模型配置不得再声称该 test 独立"

deliverables:
  - tracks/structure-contribution/code/eval_cscl_v3d_official.py
  - tracks/structure-contribution/tests/test_cscl_v3d_official_eval.py
  - "tracks/structure-contribution/results/cscl_v3d_official_eval/{freeze_manifest,data_provenance,input_replay_audit}.json"
  - "tracks/structure-contribution/results/cscl_v3d_official_eval/{valid,test}_predictions.npz (F/O/S 三模型可区分)"
  - "tracks/structure-contribution/results/cscl_v3d_official_eval/{valid,test}_metrics.json"
  - tracks/structure-contribution/results/cscl_v3d_official_eval/paired_comparisons.json
  - "tracks/structure-contribution/results/cscl_v3d_official_eval/{attribution_integrity,subgroup_analysis,moment_sensitivity,judgment}.json"
  - tracks/structure-contribution/results/cscl_v3d_official_eval/test_access_record.json
  - tracks/structure-contribution/notes/cscl_v3d_official_validation_test.md
