# cscl-bjoc-performance-mechanism-long-v1  (pre-registration; frozen before any GPU)
#
# Track: tracks/structure-contribution
#
# Long-horizon performance-first round on BJOC-Null + masked structural
# pretraining.  Four coupled questions:
#
#   Q1  does the 360ep-cosine recipe (R3) replace the SSL advantage
#       (Scratch + R3 was the missing full-10k cell)?
#   Q2  does R3 replicate on a NEW internal group-aware split?
#   Q3  where is the remaining generalisation bottleneck?
#   Q4  is one low-complexity readout upgrade (per-bond composition second
#       moment) worth buying?
#   Q5  what is safe to claim for the paper / attribution programme?
#
# Discipline:
#   * official valid is an exposed development split (descriptive only);
#   * official test is NEVER loaded in any form;
#   * the new internal splits are group-aware canonical-SMILES splits of the
#     official train 10 000; their Monitor/Locked labels are sealed until the
#     pre-declared read points;
#   * every reused historical artifact is re-hashed before training;
#   * all GPU jobs run on `res` GPU1 through `rr` (GPU0 is occupied by an
#     unrelated external job at freeze time; see notes).

protocol: cscl-bjoc-performance-mechanism-long-v1
status: frozen
frozen_utc: "2026-10-13"
track: tracks/structure-contribution
official_valid_role: "exposed development split; descriptive Stage-A scoring only"
official_test: never_read

# --------------------------------------------------------------- Stage A
stage_a:
  name: full10k-scratch-r3
  question: >
    On the official train 10 000 (no internal split), does scratch training
    with the R3 recipe (360 epochs, per-step cosine 1e-3 -> 1e-5, wd 1e-5)
    close the gap to the masked-pretrained P3 arm that the same recipe was
    selected on?
  arms:
    B3: {init: scratch, recipe: R3, epochs: 360, schedule: cosine, lr: 1.0e-3, lr_min: 1.0e-5, weight_decay: 1.0e-5, seeds: [0, 1]}
  reused_baselines:
    B0: "results/bjoc_full10k_pretraining_transfer_v1 predictions/valid_B{seed}.npz (scratch, 240ep constant)"
    P0: "results/bjoc_full10k_pretraining_transfer_v1 predictions/valid_P{seed}.npz (SSL, 240ep constant)"
    P3: "results/bjoc_recipe_tuning_v1 predictions/valid_R3{seed}.npz (SSL, 360ep cosine)"
  scoring: "official valid, paired per-molecule, seed-mean of two single-model MAEs"
  classification:
    SSL_GAIN_PERSISTS_UNDER_R3: "G_SSL_R3 = MAE(P3) - MAE(B3) seed-mean <= -0.005 and bootstrap CI95 upper < 0"
    SSL_GAIN_SHRINKS_UNDER_R3: "-0.005 < G_SSL_R3 < 0"
    NO_SSL_GAIN_UNDER_R3: "G_SSL_R3 >= 0"
    recipe_ssl_interaction: "interaction = G_SSL_R3 - G_SSL_R0, G_SSL_R0 = MAE(P0) - MAE(B0)"
  purchase: "mandatory; B3 seed 0 and 1 are trained in this round"

# --------------------------------------------------------------- Stage B
stage_b:
  name: new-internal-split-2x2
  question: >
    On a new deterministic group-aware split of the official train 10 000,
    with Fit-only preprocessing and a Fit-only masked SSL encoder, does the
    2x2 {scratch, SSL} x {R0 240-constant, R3 360-cosine} table reproduce the
    recipe and pretraining effects?  Is the recipe x SSL interaction stable?
  split_salt: cscl-bjoc-perfmech-long-v1-B
  fit_target: 8000
  monitor_target: 1000
  locked_target: 1000
  arms:
    B0: {init: scratch, recipe: R0}
    B3: {init: scratch, recipe: R3}
    P0: {init: ssl, recipe: R0}
    P3: {init: ssl, recipe: R3}
  pretraining:
    reuse: "NONE: the Fit-B encoder is retrained from scratch on the Fit-B rows only"
    objective: "masked atom-type CE + masked physical bond-type CE (weights 1.0/1.0)"
    updates: 7560
    batch_size: 128
    mask: {atom_ratio: 0.15, bond_ratio: 0.15, atom_token: 27, bond_token: 0}
    rng: "SeedSequence([seed, molecule_id, visit_index])"
    checkpoint: "last-step encoder state only"
  recipes:
    R0: {epochs: 240, schedule: constant, lr: 1.0e-3, lr_min: null, weight_decay: 1.0e-5}
    R3: {epochs: 360, schedule: cosine, lr: 1.0e-3, lr_min: 1.0e-5, weight_decay: 1.0e-5}
  recipe_definition: "identical to cscl-bjoc-recipe-tuning-v1 R0/R3, applied to the Fit-B rows"
  label_discipline:
    fit_y: "training only"
    monitor_y: "read exactly ONCE after every arm's Monitor prediction is written and hashed"
    locked_y: "read exactly ONCE at the final stage, after all candidate choices are frozen"
    official_valid_test: never
  monitor_gates:
    recipe_effect: "P3 - P0 seed-mean <= -0.003 and both per-seed deltas < 0"
    recipe_effect_scratch: "B3 - B0 seed-mean <= -0.003 and both per-seed deltas < 0"
    ssl_effect_r3: "P3 - B3 seed-mean <= -0.005 and both per-seed deltas < 0"
    ssl_effect_r0: "P0 - B0 seed-mean <= -0.005 and both per-seed deltas < 0"
    interaction: "(P3 - B3) - (P0 - B0)"
  classification:
    RECIPE_GAIN_ROBUST_ON_NEW_SPLIT: "recipe_effect gate passes"
    SSL_GAIN_ROBUST_UNDER_R3: "ssl_effect_r3 gate passes"
    RECIPE_GAIN_NOT_ROBUST_ACROSS_SPLITS: "recipe_effect gate fails while the full10k Stage-A recipe gain was positive"
    NO_ROBUST_GAIN: "all gates fail"

# --------------------------------------------------------------- Stage C
stage_c:
  name: bond-composition-second-moment-readout
  question: >
    The frozen reader receives the first moment of the composer output
    (z = sum_b c_b) but never the second moment.  Does adding the per-bond
    composition second moment (c_sq = sum_b c_b^2) to the reader input improve
    held-out MAE under the P3 initialisation and recipe?
  enabled_after: "cpu gate must pass"
  model:
    base: "BJOC-Null, 413,505 params, frozen architecture and encoders"
    change: "reader input [z, c_sq, a_sum, a_sq, g]; new first-layer weight columns zero-initialised"
    new_parameter_count: 24576
    total_parameter_count: 438081
    initial_function: "identical to the P3 initial function (zero new columns)"
    iteration: "none (single index_add over bond_batch)"
  cpu_gate:
    identity_max_abs_diff_max: 1.0e-4
    algebraic_construction: "explicit vectors with equal sum/count and different square-sum"
    empirical_novelty: "best linear reconstruction of c_sq from the frozen reader inputs on >= 4000 real Fit-relevant structures leaves >= 0.15 of the centred energy unexplained (median per-dimension ridge-probe test R2 <= 0.90)"
    nondegenerate: "c_sq finite, per-dimension std > 1e-6 for at least 90% of dims"
    gradient_activity: "non-zero gradient reaches the new first-layer columns; one Adam step changes predictions"
    invariance: "atom-order permutation, bond endpoint swap and batch-membership invariance pass"
    forbidden_modules: "no GNN/attention/iteration token; no label enters feature construction"
  gpu_gate:
    split: "Stage-B split, same Fit rows, same SSL encoder per seed"
    matched_arm: "P3 (same seed, same recipe)"
    seed_0_gate: "Monitor MAE(C1) - MAE(P3) <= -0.003; ordinary (y > -3) not worse; top-10-error-removed delta < 0; RMSE within +0.005; no single-row carry"
    seed_1_condition: "seed 0 gate passes"
    classification:
      C1_MONITOR_GAIN_SUPPORTED: "seed-mean gate passes for all purchased seeds"
      C1_GAIN_WEAK_OR_MIXED: "delta < 0 but a gate condition fails"
      C1_NO_PREDICTIVE_GAIN: "delta >= 0 or no robust improvement"
      C1_CPU_BLOCKED: "cpu gate fails; no GPU training"

# --------------------------------------------------------------- Stage D
stage_d:
  name: second-split-replication
  question: "Is the Stage-B recipe effect a property of one Monitor sample or a transferable training phenomenon?"
  purchase_rule: "run iff Stage-B recipe_effect gate passes (P3 - P0 seed-mean <= -0.003, both seeds < 0)"
  split_salt: cscl-bjoc-perfmech-long-v1-C
  arms: {P0: {init: ssl, recipe: R0}, P3: {init: ssl, recipe: R3}}
  optional_scratch_arms: "B0/B3 added only if the Stage-A vs Stage-B interaction estimates disagree in sign and budget remains"
  monitor_gate: "same shape as Stage-B; report paired deltas and seed directions"
  skip_rule: "if Stage B fails the recipe gate, record RECIPE_GAIN_NOT_ROBUST_ACROSS_SPLITS and skip Stage D"

# --------------------------------------------------------------- Stage E
stage_e:
  name: atom-only-masked-ssl-ablation
  question: >
    Under the R3 recipe, is the joint atom+bond masked objective needed, or
    does atom-only masked pretraining transfer equally well?
  purchase_rule: >
    run iff Stage-B ssl_effect_r3 gate passes AND (Stage-B recipe_effect gate
    passes OR Stage-A G_SSL_R3 <= -0.005); default one seed (0) only
  arms: {A1: {init: ssl_atom_only, recipe: R3}}
  contrast: "Monitor MAE(A1) - MAE(P3) at the same seed, same split, same updates"
  classification:
    BOND_OBJECTIVE_MATTERS: "delta >= +0.003 (joint is better by a meaningful margin)"
    BOND_OBJECTIVE_NEUTRAL: "|delta| < 0.003"
    ATOM_ONLY_BETTER: "delta <= -0.003"
  seed_1_condition: "only if the seed-0 result changes the pretraining-strategy choice and budget remains"

# --------------------------------------------------------------- locked
locked:
  read_rule: "after every final candidate prediction is written and hashed, and after the analysis plan is frozen"
  table: [B0, B3, P0, P3]
  optional_table: "C1, A1 only if their Monitor gates passed"
  metrics: [mae, rmse, median_abs, p90_abs, paired_delta, paired_bootstrap_ci95, ordinary, tail]
  no_post_read_training: true
  no_post_read_selection: true

# ------------------------------------------------------------- budget + bans
budget:
  gpu_hours_max: 7.0
  gpu_hours_target: 6.5
  gpu_pool: res-gpu1
  gpu0_policy: "not used while the unrelated external job occupies it"
  stage_guidance:
    A: 0.5
    B: 2.4
    C: 0.8
    D: 1.5
    E: 0.7
    reserve: 0.6
  ledger: "results/bjoc_performance_mechanism_long_v1/gpu_budget_ledger.json"

bans:
  - "official test access in any form"
  - "official-valid score as a selection signal for new architecture choices (descriptive reporting only)"
  - "post-Monitor-read architecture, recipe, seed or threshold changes outside the frozen conditional rules"
  - "using Monitor or Locked labels during training or feature construction"
  - "GNN / Transformer / attention / iterative message passing in any arm"
  - "reusing the historical split-A locked labels or the historical full-10k SSL encoder for Stage-B/C/D arms"
  - "more than one new architecture candidate (C1) unless its CPU gate fails, in which case at most one pre-registered replacement is allowed"
  - "retrying failed trajectories to chase a lower number"
  - "trimmed MAE as a headline; ensembles as a headline"

decision_vocabulary:
  - SSL_GAIN_PERSISTS_UNDER_R3
  - SSL_GAIN_SHRINKS_UNDER_R3
  - NO_SSL_GAIN_UNDER_R3
  - RECIPE_GAIN_ROBUST_ON_NEW_SPLIT
  - RECIPE_GAIN_NOT_ROBUST_ACROSS_SPLITS
  - SSL_GAIN_ROBUST_UNDER_R3
  - C1_MONITOR_GAIN_SUPPORTED
  - C1_NO_PREDICTIVE_GAIN
  - C1_CPU_BLOCKED
  - BOND_OBJECTIVE_MATTERS
  - BOND_OBJECTIVE_NEUTRAL
  - ATOM_ONLY_BETTER
  - BLOCKED

