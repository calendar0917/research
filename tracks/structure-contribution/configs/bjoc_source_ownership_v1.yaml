# ---------------------------------------------------------------------------
# Phase 1 model (N / O / S)
# ---------------------------------------------------------------------------
model:
  base: BJOC one-shot (Atom/Bond/Junction encoders + bond composer + reader)
  note: >
    Frozen widths (src.BJOCConfig).  No width search.  The only additions are
    the ownership grouping switch and one independent global content pathway.
  local_relation:
    N: "W_e = n_e * mean_G(w); V_e = n_e * mean_G(w^2)   (no ownership; historical Null)"
    O: "W_e = sum_{j touching e} w_j; V_e = sum_{j touching e} w_j^2   (true ownership; historical Organized)"
    S: >
      count-matched ownership shuffle: W_e = sum of n_e draws w_{r(e,1..n_e)},
      r drawn deterministically from the molecule's own junction pool ordered by
      a lossless label-invariant junction key; per-bond counts and the vector
      format identical to O, true junction-to-bond incidence destroyed, no
      global junction content enters the local pathway.
  composer_input: "[b_e (96), W_e (96), V_e (96), log1p(n_e) (1), bond_feat (7)]"
  global_content_pathway:
    input: "[mean_G(w) (96), mean_G(w^2) (96), log1p(n_junc) (1)]"
    module: "MLP 193 -> 96 (SiLU) -> 96"
    usage: "appended to reader input as a separate 96-dim block; never broadcast to bonds"
    reader_input: "[z (96), sum_i a_i (96), sum_i a_i^2 (96), g (33), p_global (96)] = 417"
  init_parity:
    method: >
      Build the historical scratch BJOC-Null init for the seed, copy every base
      module, widen the reader first layer to 417 with zero columns for the new
      p_global block, initialise the global pathway from the same seeded
      construction RNG.  Arms then differ only in the grouping switch.  The N
      arm must reproduce the historical P3 function as a black box to <= 1e-6
      (float32 reduction order); O and S legitimately change the grouping at
      init only through ownership, so their init output is not expected to
      match P3 bit-exactly (verified instead by the zero-p_override
      inertness proof: with the global block forced to zero, perturbing it
      cannot change any output).
    arms_share_init: true
    arms_share_ssl: true
    arms_share_batch_order: true

# ---------------------------------------------------------------------------
# Phase 2 training protocol (frozen recipe R3, no search)
# ---------------------------------------------------------------------------
training:
  recipe: R3
  epochs: 360
  schedule: cosine
  lr: 1.0e-3
  lr_min: 1.0e-5
  weight_decay: 1.0e-5
  grad_clip: 5.0
  batch_size: 128
  loss: raw-y L1
  soup: last 5 epoch parameter mean
  seed0_arms: [N, O, S]
  seed1_arms_conditional: [N, O, S]
  gpu_budget_cap_hours: 1.5
  paired_bootstrap: {n: 5000, unit: molecule, seed: 0}
  tail_threshold: -3.0
  top_k_removed: 10  # rows with the largest max(error_candidate, error_reference) removed before the delta mean
  paired_contrast_removal_convention: top-10 by max(err_a, err_b) over the same rows

# ---------------------------------------------------------------------------
# Phase 0 (CPU, frozen R3 seed 0/1, official train 10k, label-free)
# ---------------------------------------------------------------------------
phase0:
  sample:
    source: results/bjoc_source_attribution_feasibility_v1/sample_manifest.json
    diagnostic_rows: hash-rule rank 0-255 (256 molecules)
    reference_rows: hash-rank 256-1279 (1024 molecules)
    seeds: [0, 1]
  ig:
    method: integrated gradients w.r.t. encoded w_j
    baseline: per-molecule mean_G(w)
    steps: 32
    score: abs(IG_j)
  rankings:
    dev: "|| w_j - mean_G(w) ||_2 (encoder-space deviation)"
    rare: "-log2(p_hat(signature)); p_hat = signature frequency over official train 10k junctions"
    random: "uniform k-subset draw; 16 draws per molecule; RNG seed 70000000 + 100000*seed + row"
  top_k: 4
  intervention:
    type: matched natural-encoding replacement (alpha = 1.0)
    reference_molecule: >
      nearest reference molecule in
      |dn_atoms|+|dn_bonds|+|dn_junctions| (tie: smaller row); position j mod n_ref_junctions
  matched_control:
    match_on: [signature, center_degree, center_in_ring, in-molecule dev decile]
    fallback: [signature, center_degree, center_in_ring]
    controls_per_junction: 8
    coverage_gate: 0.8
  thresholds:
    beyond: {mean_gt: 0.0, ci95_lower_gt: 0.0, one_sided_sign_p_lt: 0.01}
    matched: {mean_gt: 0.0, ci95_lower_gt: 0.0, coverage_ge: 0.8}
    enrichment:
      stat: >
        max over signature classes (corpus_count >= 100 and expected top-decile
        count >= 3) of observed_top_decile_count / expected_top_decile_count,
        where "top decile" is computed within each (seed, molecule) block on |IG|
      null: within-(seed, molecule) |IG| permutation (1000 draws, RNG 20261015)
      p_lt: 0.05
    sign_consistency:
      stat: >
        sample-size-weighted mean over signature classes (sample_count >= 30)
        of |mean(sign(centered IG_j))|, where centered IG_j = IG_j - mean over
        the molecule's junctions; centering removes the molecule-level mass
        sign shared by all of its junctions
      null: same within-(seed, molecule) permutation (1000 draws, RNG 20261015)
      p_lt: 0.05
  signature:
    definition: >
      (center_atom_type argmax over the raw 28 atom-type slots,
       sorted endpoint atom types, sorted two raw bond categories,
       center_in_ring, n_ring_bonds)
    corpus_frequency: all official-train-10k junctions (346k total)
    sample: the 256x2 diagnostic junction records; classes with corpus < 30 are
      reported descriptively but not used for the sign test
  decision_rule: >
    SOURCE_SIGNAL_BEYOND_SIMPLE_BASELINES iff IG top-4 response beats dev
    (threshold beyond) AND beats rare (threshold beyond) AND the matched
    (signature, degree, ring, dev-decile) control gap passes (threshold matched)
    AND phase-0C enrichment AND sign consistency both pass.
    SOURCE_SIGNAL_EXPLAINABLE_BY_SIMPLE_BASELINES iff the matched-control gate
    fails while the dev or rarity ranking has a point estimate >= IG.
    INCONCLUSIVE otherwise.

# ---------------------------------------------------------------------------
# Phase 2 frozen decision rules
# ---------------------------------------------------------------------------
gates_seed0:
  ownership_contrast:
    metric: "Monitor paired MAE delta O - N"
    require: "delta <= -0.002 and bootstrap CI95 upper < 0"
  sham_separation:
    metric: "Monitor paired MAE delta O - S"
    require: "delta <= -0.002 and bootstrap CI95 upper < 0"
  not_tail_or_single_driven:
    require: "ordinary (y > -3) delta O-N < 0 AND top-10-removed delta O-N < 0"
  parity_vs_p3:
    metric: "Monitor paired |MAE(O) - MAE(P3-D s0)|"
    require: "MAE(O) - MAE(P3-D s0) <= +0.004"
  mechanism:
    require:
      - "ownership intervention isolation: in O, editing one junction's incidence changes c only for that junction's bonds (exact)"
      - "local pathway does not read the global block (randomising p_global leaves c unchanged; code audit)"
      - "local pathway deletion faithfulness: mean per-molecule Spearman(||c_e||, |delta pred_e|) >= 0.5"
      - "arms share init/SSL/batch-order hashes and exact parameter count"
  stability:
    require: "finite training, encoder hash matches recorded SSL, soup differs from init"
decision_vocabulary:
  - OWNERSHIP_RELATION_VALUE_CONFIRMED
  - OWNERSHIP_LOCAL_VALUE_SEED0_ONLY
  - OWNERSHIP_NOT_MORE_VALUABLE_THAN_SHAM
  - OWNERSHIP_NULL
  - OWNERSHIP_HURTS_PARITY
  - INCONCLUSIVE
seed1_confirmation:
  condition: "all gates_seed0 pass"
  require: "same sign as seed 0 for O-N and O-S; seed-mean O-N <= -0.002 with CI95 upper < 0"
  stop_rule: "if any seed-1 condition fails -> OWNERSHIP_LOCAL_VALUE_SEED0_ONLY; no further purchase"

# ---------------------------------------------------------------------------
# interpretation discipline (writing rules, frozen)
# ---------------------------------------------------------------------------
interpretation_rules:
  - "A local pathway being *used* is not an explanation claim."
  - "Only bond-anchored c_e quantities may be called local; p_global is a graph-level pathway and must never be reported as a sum of local contributions."
  - "Phase 0 is a frozen-model measurement tool, not chemical causality."
  - "Monitor is an exposed exploratory split; official valid is an exposed development set; no blind-test language."
