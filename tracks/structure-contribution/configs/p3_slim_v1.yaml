protocol: cscl-p3-slim-v1
split_tag: U
salt: cscl-p3-slim-v1
seeds: [0, 1]
arms: [P3, P3Slim]

model:
  p3_reader_hidden: 256
  slim_reader_hidden: 128
  reader_layers: 2
  p3_parameters: 413505
  slim_parameters: 322881
  p3_reader_parameters: 148481
  slim_reader_parameters: 57857
  shared_parameters: 265024
  slim_reader_seed_offset: 10000
  dropout: 0.0
  activation: SiLU

param_cap: 500000

recipe:
  key: R3
  epochs: 360
  schedule: cosine
  lr: 0.001
  lr_min: 0.00001
  weight_decay: 0.00001
  batch_size: 128
  soup_last: 5
  shuffle_offset: 101
  grad_clip: 5.0

ssl:
  updates: 7560
  batch_size: 128
  mode: atom_bond
  fit_only: true

split:
  fit_target: 7996
  monitor_target: 1000
  locked_target: 1000
  excluded_rows: [941, 2210, 6071, 9766]

gate:
  meaningful_delta: 0.004
  rmse_tol: 0.005
  tail_tol: 0.005
  tail_threshold: -3.0
  top_k_removed: 10
  bootstrap_n: 5000
  bootstrap_seed: 0

budget:
  gpu_hours: 2.0
  smoke_stop_hours: 1.8
  gpu_assignment:
    0: 0
    1: 1
