alternatives_rejected:
  - item: tune K (2/3/4/8/10) on the 2000 probe or official valid
    because: >-
      K=5 was frozen before any new evaluation; tuning would be double dipping
      and would invalidate the locked confirmation.
  - item: select checkpoints for diversity / minimum epoch gap / remove adjacent
      epochs
    because: >-
      the hypothesis is a fixed equal-weight average of the five lowest-800-MAE
      states; trajectory clustering is part of the result.
  - item: use prediction median instead of the arithmetic mean
    because: >-
      exactly one fixed aggregation rule is allowed.
  - item: use greedy soup / weighted soup / inverse-loss weights
    because: >-
      the primary estimator is a strict equal-weight arithmetic parameter mean.
  - item: use Stage A's favourable 2000-probe numbers to change anything
    because: >-
      the probe already participated in hypothesis formation; Stage A is a
      development-reuse diagnostic with no gate.
  - item: treat official valid as an unbiased project holdout
    because: >-
      it has been used throughout earlier development; this stage calls it a
      locked development confirmation.
  - item: run EMA/SWA after the soup success
    because: >-
      EMA/SWA are separate weight-space mechanisms requiring their own
      pre-registered design; soup success authorizes protocol design only.
  - item: open official test because both gates passed
    because: >-
      official test is hard-locked and no test evaluation is authorized.
consequences:
  - >-
    checkpoint_weight_averaging_protocol_design is authorized: how a canonical
    10K training protocol should lock an equal-weight checkpoint-averaging rule
    without ever touching official test.
  - >-
    A fixed Top-5 equal-weight weight soup retains essentially all of the
    prediction-ensemble benefit while remaining a single 82,115-parameter model
    with ~1x forward cost (rho = 0.976; ensemble-vs-soup CIs include zero).
  - >-
    The two-run point spread was not reduced by the soup; the supported claim is
    estimator stabilization within each trajectory, not cross-run variance
    reduction.
  - >-
    Outputs committed under
    results/top5_checkpoint_aggregation_stabilization/ (protocol lock,
    checkpoint inventory, Top-5 manifests, soup construction + hashes, integrity
    gates, development-reuse probe/summary, prediction disagreement, weight-space
    diagnostics, confirmation lock, official-valid per-run + summary, paired
    bootstrap, compute audit, final decision, Q1-Q20, soup states, 3 figures)
    and notes/top5_checkpoint_aggregation_stabilization.md; tests 20 pass.
revisit_if: >-
  (1) A separate pre-registered checkpoint_weight_averaging_protocol_design stage
  locks an averaging rule inside a canonical 10K training protocol, still without
  official test. (2) EMA/SWA may only be considered under their own independent
  pre-registration. Do NOT tune K, do NOT re-select membership, do NOT use
  official valid to choose among estimators, do NOT train a new backbone here,
  and never load official test without a separate locked benchmark stage.
