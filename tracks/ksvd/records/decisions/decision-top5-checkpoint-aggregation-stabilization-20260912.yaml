decision_id: decision-top5-checkpoint-aggregation-stabilization-20260912
created: '2026-09-12T04:35:00'
kind: decision
study_id: zinc-context-gap
decision: >-
  Execute the pre-registered Top-5 checkpoint aggregation stabilization audit and
  register the verdict Decision Case D: CHECKPOINT AGGREGATION STABILIZATION
  SUPPORTED, with the primary deployable-form result TOP-5 WEIGHT-SOUP
  STABILIZATION SIGNAL. Authorize checkpoint_weight_averaging_protocol_design as
  a future protocol family; do NOT authorize EMA/SWA and do NOT authorize
  official-test evaluation.
why_this_experiment: >-
  The Internal Generalization & Training-Stochasticity Audit established
  CHECKPOINT-SELECTION NOISE DOMINANT: the 82K compact-v4-smallhead seed spread on
  official valid did not reproduce on an independent internal probe, while both
  canonical runs showed material selection regret (mean 0.003381) and sharp
  raw-800 minima. The prior 5-epoch moving-average selector was rejected. The one
  remaining pre-registered question was whether a fixed multi-checkpoint
  estimator built solely from the original 800-selection trajectory is more
  robust than the single raw argmin. This is a zero-new-backbone-training
  checkpoint-estimator experiment, not an architecture, representation,
  regularization, EMA/SWA, optimizer, K-sweep, diversity, or benchmark stage.
protocol: >-
  K=5 frozen in aggregation_protocol_lock.json before any new evaluation;
  checkpoint ranking strictly by 800-selection MAE with earliest-epoch ties; no
  epoch spacing; no greedy/weighted soup; prediction aggregation = arithmetic
  mean; weight aggregation = equal-weight arithmetic mean. Three locked
  estimators: RAW = e_1; ENSEMBLE = mean of five checkpoint predictions; SOUP =
  mean of five state_dicts. Stage A on the development-reuse 2000 probe is
  descriptive with no continue/stop gate. confirmation_lock.json was written
  after Stage A and before the first official-valid read. Stage B evaluates
  official valid once on the locked estimators only.
