decision: >-
  NO NEW TRAINING WAS SCIENTIFICALLY JUSTIFIED.  The frozen IHT-30 gate did not
  fire (fired = False, supported seeds [], classification ['NONE']) and the
  decision is robust to the condition-1 reconstruction factor because the
  substantive condition 2 fails on every axis on all three seeds.  Keep
  FINAL-CLEAN unchanged (C6 + paired node binding + paired edge binding +
  sparse tied-IHT K=32/s=8/IHT-10 + full relation).  Do not train IHT-30, do
  not retrain IHT-10, do not re-tune the gate, do not start any coder or
  dictionary intervention.  Record the localisation of the specificity
  problem: (a) intrinsic DC/scale redundancy of the learned dictionary
  (atoms 6/24/27 in 100 % of rows, aligned with the mean direction, 6 and 24
  0.884-0.987 collinear; atom 23 the PC1 atom) and (b) near-linear sparse/dense
  equivalence (R2 >= 0.97 both directions).  OMP is not a ground-truth coder
  reference on a trained dictionary.
because: >-
  (1) The IHT-10 support is the IHT fixed point (IHT-10 vs IHT-30 Jaccard
  0.972-0.980, exact support 0.889-0.916) and usage / concentration do not move
  with step count (N_eff deltas +0.32/-0.01/-0.13, top-5 drop <= 0.063, max
  activation rate 1.000 everywhere), so the extra iterations cannot produce the
  structural change a coder-fix hypothesis would require.  (2) The
  concentration is present in every seed and already in OMP (atom 6 active in
  97.6/97.7 % of rows on seeds 0/1), and the dominant coefficient is a
  patch-mass coordinate (Spearman 0.93-0.94 with patch_nodes) rather than the
  variance direction (|cos with PC1| 0.32-0.44 at 57.7 % PC1 variance), so it
  is a dictionary-geometry fact.  (3) Bidirectional OLS recoverability
  (dense->sparse R2 0.971-0.977, sparse->dense R2 0.9988-0.9989, CKA ~0.999)
  shows the two coordinates span nearly the same linearly recoverable subspace;
  sparsification loses essentially nothing (H4 excluded) and adds almost no
  independent content (H3 supported), which is why the matched dense control
  was not worse in the preceding round.  (4) Condition 2 of the gate is the
  substantive test of 'would a predictor see a difference', and it fails with
  margins far outside noise on 0/3 seeds for every sub-criterion, so permitting
  IHT-30 training would contradict the frozen protocol without scientific
  justification.  (5) The OMP anomaly (OMP 3.2-5.5x worse than IHT-10 on the
  trained dictionary, independently reproduced with sklearn and with
  well-conditioned supports) shows coder fidelity is a dictionary-coder pair
  property; reading OMP support agreement as distance to truth is invalid
  here, which also explains why the prior K-SVD-dictionary diagnostic looked so
  different.
alternatives_rejected:
  - >-
    Running the single IHT-30 seed-0 training anyway because the absolute
    reconstruction drop (2.9e-3 to 3.9e-3) is material.  Rejected: the
    preregistered gate did not fire; condition 2 (support / concentration /
    geometry) is exactly the observable that would justify training, and it is
    flat on all three seeds.
  - >-
    Lowering the condition-1 factor (<=0.5) after seeing 0.68-0.73.  Rejected:
    post-hoc threshold changes are forbidden, and the outcome is invariant to
    any reasonable relaxation because condition 2 fails everywhere.
  - >-
    Treating OMP as the ground-truth coder and declaring IHT-10 support-bad.
    Rejected: OMP is a worse coder on this dictionary (worse l2 and heavier
    coefficients), so its code cannot define the target support; the
    'exact OMP 1.45e-5' figure belongs to the K-SVD dictionary that was fit for
    OMP.
  - >-
    Claiming sparse specificity from retain-all-information (sparse->dense R2
    0.9988).  Rejected: near-equivalence of the two representations explains the
    specificity failure; information retention is not specificity.
  - >-
    Acting on the audit by orthogonalising atoms 6/24/27, adding a coherence /
    usage penalty, changing K/s/lambda/IHT steps, or adding seeds.  Rejected:
    this round is an audit and authorises no intervention; the next round shape
    is recorded only.
revisit_if: >-
  A new preregistration targets the dictionary structure instead of the coder:
  (a) remove the DC-triplet redundancy (orthogonalise atoms 6/24/27 or add a
  coherence / usage-balance penalty on D) and test at matched capacity whether
  reconstruction, usage concentration and the Sparse-vs-DenseTied margin move;
  (b) test the sparse arm on a phi65 variant not dominated by one DC direction.
  Secondary: a fourth dictionary seed would tighten the PARTIAL_VOCABULARY
  boundary; dropping the two identically-zero descriptors
  (root_neighbour_shell1, root_walk1) is a mechanical cleanup for any descriptor
  revision.  None of these is authorised or started by this audit.
