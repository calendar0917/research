decision_id: decision-e2e-dictenv-dict-coder-audit-20260929
created: '2026-09-29T00:00:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  The preceding clean-mechanism round left sparse dictionary specificity
  unestablished (matched DenseTied 0.125563 vs sparse 0.128499, G_dict
  -0.002936) with a strongly concentrated code (top-5 atoms carry 4.4-5.0 of 8
  activations; one atom active in nearly every row), and explicitly recorded a
  follow-up shape: a new preregistration on the observed concentration.  Before
  spending any training, this round asked a zero-training question: why is
  sparse specificity not established - is it (1) IHT-10 under-convergence,
  (2) an intrinsically concentrated dictionary, (3) sparse/dense redundancy, or
  (4) sparsification losing downstream information?
protocol: >-
  Local CPU only (CUDA_VISIBLE_DEVICES="", no GPU/SSH), preregistration and
  implementation frozen at commit b325770 before the first Stage-A process.
  Reused C6 soup dictionaries (seeds 0/1/2) and the DenseTied seed-0 control
  dictionary; official ZINC train 10000 / valid 1000 phi65 cache; every coder
  runs on one identical column-normalised Dbar per seed.  Stage A: same-D
  coder audit with IHT-10 / IHT-30 / IHT-100 / exact OMP(s=8) and DenseTied,
  with reconstruction, usage concentration, coefficient geometry, support /
  coefficient agreement vs OMP.  Stage B: dominant atom, mean direction, PCA.
  Stage C: train-only SMD atom profiles with frozen train normalisation,
  active and top-response populations.  Stage D: Hungarian cross-seed
  dictionary matching.  Stage E: train-only OLS recoverability between sparse
  and dense representations.  Stage F: the frozen IHT-30 training gate.  No
  predictor trained; official test never loaded.
