decision_id: decision-tccd-v7-stop-standalone-normalized-moment-20260922
created: '2026-09-22T00:00:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  TCCD-v5 and TCCD-v6 localized the frozen TCCD-v2 local gain to coordinate
  conditioning / readout geometry (G_FULL 0.0261305868625641; RECON rho
  0.995135; ReLU gap 0.000196368) rather than to new structural information,
  and left exactly one open question: is the normalization that produced the
  gain sufficient when written EXPLICITLY into the representation itself? As
  the closing round of the TCCD standalone-predictor route, TCCD-v7 wrote the
  size-normalized prototype mean/variance, the normalized relation
  contractions and the explicit log size/mass coordinates into h_NM and read
  them with a LINEAR reader only, then tested frozen closure (Stage A) before
  allowing one end-to-end co-adaptation run (Stage B).
protocol: >-
  GPU1-only remote A100 execution; seed 0; fixed internal 8000/2000 split (split
  seed 20260922); exact frozen TCCD-v2 PrototypeREL checkpoint and exact frozen
  TCCD-v5 pair cache; K=64 prototypes, temperature 0.05+0.95*sigmoid(a), five
  frozen relations; representation h_N = [mu, {vec_sym(Mhat_r)}, log(1+n),
  {log(1+s_r)}] (10,470) and h_NM = [mu, v, {vec_sym(Mhat_r)}, log(1+n),
  {log(1+s_r)}] (10,534) with Mhat_r = C^T R_r C / max(s_r, eps); linear reader
  only; exact TCCD-v5 frozen-reader protocol (Adam 1e-3, wd 1e-5, clip 5,
  batch 32, 240 epochs, patience 40, Top-5 soup); same-session RAW re-screen as
  a preregistered protocol-identity check; Stage B (end-to-end from scratch,
  exact TCCD-v2 regularizers) and the official-train -> official-valid run were
  registered as authorized only after a Stage A PASS; official test frozen.
