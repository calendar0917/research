decision: >-
  STAGE A FAIL -> STOP the TCCD standalone-predictor route immediately. The
  explicit normalized prototype/relation-moment representation is strictly
  worse than the raw representation it was meant to improve (0.412118 vs
  0.278364, delta_norm -0.133754 when the registered PASS required +0.015 and
  an absolute gate of 0.255), with protocol identity proven bit-for-bit
  (drift 0.0). Under the frozen preregistration this forbids Stage B
  (end-to-end co-adaptation), the official-train -> official-valid run and the
  official test; none was run. TCCD standalone performance route CLOSED. No
  TCCD-v8 rescue is authorized.
alternatives_rejected:
  - item: Run the preregistered Stage B end-to-end NORM+MOM co-adaptation anyway
    because: >-
      the registered Stage-A PASS condition (MAE_NM <= 0.255 and delta_norm >=
      0.015) failed on every clause, and the round brief forbids rescue after a
      Stage-A FAIL.
  - item: Attribute the failure to reader optimization and re-tune the reader
    because: >-
      the same-session RAW re-screen reproduced the frozen v5 numbers
      bit-for-bit under the identical reader protocol, and both normalized arms
      underfit (train MAE ~0.39 vs ~0.18 for RAW) while still improving at the
      240-epoch budget, so the deficit is representational.
  - item: >-
      Re-add the raw coordinates and call the union representation a new candidate
    because: >-
      that is exactly TCCD-v6's RECON-LINFACT construction, which was already
      measured (soup 0.252556831) and already attributed; it is not a new
      authorization and does not make the normalized representation standalone.
  - item: >-
      Sweep K, temperature, regularizers, reader width/nonlinearity, seeds or moments
    because: >-
      explicitly forbidden by the round preregistration and not supported by
      any measured gradient.
  - item: Open the official ZINC test
    because: >-
      never loaded; Stage A FAIL left no candidate to report and the test is
      spent / reporting-only.
consequences:
  - >-
    TCCD standalone (prototype vocabulary + normalized moment representation +
    linear decode) is not viable as a high-performance predictor on ZINC:
    MAE_NM 0.412118 versus the frozen raw TCCD-v2 0.278364 / official-valid
    0.261988 and the canonical strong GPU1 reference 0.119818.
  - >-
    TCCD-v6's Case R1 conclusion is sharpened: the v5/v6 conditioning gain is an
    ADDITIVE coordinate-exposure effect inside the union representation
    (h_base PLUS normalized coordinates); the raw un-normalized coordinates
    remain load-bearing and cannot be replaced.
  - >-
    delta_mom 0.0025358498096466064 < 0.005 confirms, with a matched reader and
    no end-to-end confound, that prototype second moments add no independent
    increment.
  - >-
    The prototype-vocabulary mechanisms themselves (task-learned K=64
    prototypes, assignment-sensitive composition) remain supported by TCCD-v2
    and are NOT retracted.
  - >-
    TCCD standalone performance route CLOSED. No TCCD-v8 rescue is authorized.
    No seed 1, no hyperparameter tuning, no K/tau/regularizer sweep, no deeper
    or nonlinear reader, no new moments, no structural rescue.
revisit_if: >-
  Only by re-positioning the prototype vocabulary as an interpretable /
  reusable local coordinate system INSIDE a stronger structural backbone under
  a NEW preregistration, with matched controls (same backbone without
  prototypes; same backbone with prototypes; prototype shuffle / zero
  intervention; vocabulary health). Not by extending the standalone predictor,
  not by a normalization-only variant, and never by opening the official test.
next_action: >-
  NONE auto-authorized. Do not start TCCD-v8. Any future hybrid prototype-role
  experiment requires a new preregistration with the matched controls above.
