decision_id: decision-fsar-incidence-processor-inspect-20260918
created: '2026-09-18T09:10:00'
kind: decision
study_id: zinc-context-gap
decision: >-
  Decision - FSAR-C1: INSPECT (pre-registered middle band), partial mechanism
  support, NOT promoted, NO seed1 bought, NO official test.  On the frozen
  deterministic-A100 ZINC-12K official train/valid regime (official test never
  loaded; training revision 412b3bd), the single authorised seed0 run of the
  parameter-matched incidence processor C1 (88,643 params) reaches best valid
  0.190477 @ep219 and Top-5 soup valid 0.182050, which lands in the
  pre-registered INSPECT band (0.14, 0.20] -> the gate does NOT authorise a
  second seed and does NOT call it a failure.  The parameter-exact
  incidence-free bag control C0 (identical modules, identical 88,643 params)
  reaches best valid 0.376120 @ep166 (early stop @206) and Top-5 soup 0.369359,
  so the parameter-matched mechanism gap is C0 - C1 = +0.187309 (positive =
  incidence better).  C1 closes 75.1 % of the C0 -> B-Full gap and is
  -0.263908 better than the 25,317-param factorized AR0-EDGE diagnostic, but
  it remains +0.062232 above B-Full seed0 (0.119818) and +0.054668 above B-Bag
  seed0 (0.127382), so the processor hypothesis is only PARTIALLY supported:
  incidence composition is causally responsible for the bulk of the gain at
  this budget, but it is not sufficient to recover the strong mixed backbone.
  Both models are fully alive (C1 binding output std 0.2924/0.2488, residual
  scales 0.2614/0.1292 grown from 0.05, object effective ranks 26.80/33.24 of
  48, all seven module groups with non-zero task gradient; C0 equally alive at
  binding std 0.5090/0.4897 and ranks 28.50/32.91), so C0's deficit is a
  representational limit of the incidence-free processor, NOT a collapse; the
  failure taxonomy is partial-support / capacity-or-information limited, not
  mechanism/optimization failure.  Evaluation-only attribute permutation shows
  C1 uses the real atom and bond assignments heavily (actual 0.18205 vs
  atom-permuted 1.2607 and bond-permuted 1.5433) and C0 only weakly (0.36936 vs
  0.6769 / 0.5168).  The C1 learning curve shows train MAE 0.1394 @240 against
  a noisy 0.19-0.23 valid band -> late OVERFITTING, not underfitting.  Stage A
  14/14 local tests + a 1-epoch CPU smoke; Stage B remote sanity 14/14,
  gradient_audit active path == total (88,643/88,643) with all groups non-zero,
  and a deterministic GPU smoke (finite, not constant, 254.8 MB).  Synthetic
  controls pass before any ZINC run: incidence-only star positive C1 0.00741 vs
  C0 0.51087 (C0 at chance), marginal-only negative C1 0.00637 vs C0 0.00241.
  GPU 1 only, shared with an unrelated ~561 MiB / 13 % process (recorded,
  never touched); GPU 0 held an unknown 35.8 GB / 100 % task that was never
  touched or co-tenanted; peak our-GPU memory 275.9 MB.
why_this_experiment: >-
  FSAR-R2-AR0 and AR0-EDGE established that the node role<->atom and edge
  role<->bond assignments each carry stable, control-beating information, but
  both diagnostics collapsed the assignments into graph-level statistics and
  linearly read them at ~25k params, far above the strong backbones.  The
  remaining hypothesis was that the gap is a downstream COMPOSITIONAL-PROCESSOR
  deficit rather than an assignment-order or feature deficit.  FSAR-C1 is the
  minimal falsification: keep the exact S/A/B primitives, spend the ~80-100k
  strong-model budget on persistent node/edge objects plus a real
  node<->incident-edge processor, and compare against a parameter-exact
  incidence-free bag control to separate "incidence composition" from "just
  more parameters".  Pre-registered before any formal run.
protocol: >-
  Canonical OPTIMIZED_PROTOCOL inherited verbatim: Adam lr 1e-3, batch 128, L1
  loss, grad clip 5.0, no scheduler, max 240 epochs, patience 40, best
  official-valid checkpoint, fixed equal-weight Top-5 soup,
  torch.use_deterministic_algorithms(True), CUBLAS_WORKSPACE_CONFIG=:4096:8.
  Single documented deviation (pre-registration section 4): binding modules,
  the two LayerNorms and the two scalar residual scales are in a
  weight_decay = 0 group; all other parameters keep wd = 1e-5.  C1 and C0 have
  bit-identical module structure and identical 88,643 parameters.  Stage A
  local tests + tiny CPU smoke; Stage B remote sanity / synthetic /
  gradient_audit / GPU smoke; Stage C exactly one C1 seed0 formal run, then the
  pre-registered gate fired INSPECT, which authorises the C0 control but not a
  second seed, so exactly one C0 seed0 control run followed.  No official ZINC
  test, no hyperparameter or architecture sweep.
alternatives_rejected:
  - item: Promoting C1 or buying seed1
    because: >-
      the pre-registered gate puts 0.182050 in the INSPECT band (0.14, 0.20];
      seed1 is not authorised and the absolute level is not seed1-worthy on
      its own.  The round reports and stops.
  - item: Calling the result a clean SUCCESS for the processor hypothesis
    because: >-
      C1 is still +0.062 above B-Full seed0 and +0.055 above B-Bag seed0; the
      processor recovers most but not all of the gap, and the residual is
      confounded between excluded information and overfitting.
  - item: Calling the result a refutation of incidence composition
    because: >-
      at an identical parameter count the incidence processor beats the
      incidence-free bag by +0.187309 with both models fully alive; the
      mechanism is real and large.  Only its sufficiency is limited.
  - item: Attributing C0's deficit to collapse
    because: >-
      C0 is alive and high-rank (binding std 0.5090/0.4897, ranks 28.50/32.91,
      all module groups with non-zero gradient); the deficit is a
      representational limit of global-only aggregation.
  - item: Rescue by adding typed local tokens / radius-3 typed context now
    because: >-
      explicitly out of scope for this processor round; adding a new feature
      family is forbidden and would destroy the isolation of the processor
      effect.
  - item: Rescue by optimizer / regularization / width / depth / rounds
      changes
    because: >-
      this is a falsification round, not a hyperparameter or architecture
      sweep; the overfitting signature is recorded, not tuned away.
  - item: Reading the official ZINC test
    because: >-
      never loaded by design; no test read is authorised by this decision.
consequences:
  - >-
    The compositional-processor hypothesis is PARTIALLY supported: keeping
    persistent node/edge objects and composing over the real graph incidence is
    causally responsible for the bulk of the recovered performance, and it is
    dramatically better than the factorized diagnostic, but it does not by
    itself recover the strong mixed backbone at this budget.
  - >-
    The remaining ~0.06 MAE gap to B-Full/B-Bag is now the primary open object.
    It is not explained by capacity (C0 is parameter-exact), and it is
    confounded between the information the strong backbone consumes that this
    round excludes and a late-training overfitting signature.
  - >-
    One candidate next action only (NOT auto-authorised): a paired seed-1
    confirmation of C1 and C0 to replicate the +0.187 parameter-matched
    mechanism delta, which is currently single-seed.  Do NOT add features, do
    NOT sweep width/depth/rounds/optimizer, do NOT open the official test, do
    NOT buy 3+ seeds.
revisit_if: >-
  A paired seed-1 C1/C0 run is authorised and the +0.187 incidence delta
  replicates; OR a fresh pre-registered round isolates the residual gap by
  adding exactly one pre-declared information channel (typed local context) with
  its own guard and its own parameter-matched control; OR a pre-registered
  regularization/optimization study targets the late overfitting while holding
  the architecture and information set fixed.  Not by sweeping this
  architecture's width/depth/rounds, not by ad-hoc optimizer tuning after a
  single-seed number, and never by reading the official test without separate
  authorisation.
