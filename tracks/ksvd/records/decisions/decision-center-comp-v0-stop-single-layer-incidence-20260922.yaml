decision_id: decision-center-comp-v0-stop-single-layer-incidence-20260922
created: '2026-09-22T00:00:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  TCCD-v4 showed that the parameter-free two-hop moment C^T S^2 C adds no
  material frozen-screen signal, but that moment contracts occurrence identity
  before composition. TCCD-v5 showed that a global pair nonlinearity (PRE/POST)
  and an assignment-location shuffle do not materially change the frozen TCCD-v2
  ceiling. TCCD-v6 attributed the v5 POST gain to base-reconstructible
  coordinate exposure. None of these rounds tested whether the binding between
  a concrete center occurrence and the pair interactions it participates in
  carries predictive information. CENTER-COMP-v0 therefore froze one explicit
  pair-to-center incidence operator and asked whether retaining that binding
  before global pooling breaks the ~0.25 frozen ceiling.
protocol: >-
  GPU1-only remote A100 execution; seed 0; fixed internal 8000/2000 split
  (split seed 20260922); exact frozen TCCD-v2 PrototypeREL checkpoint
  (SHA-256 093e0e46...c0f42) and exact reused TCCD-v5 pair cache
  (official_test_loaded false); all unordered i<j pairs; p_ij =
  [c_i+c_j, |c_i-c_j|, c_i*c_j, r_ij]; e_ij = phi(p_ij) with phi
  197->64->16; q_i = sum_{j!=i} e_ij; u_i = rho([c_i, q_i]) with rho
  80->64->16; h_center = sum_i u_i; h = [h_base, h_center]; linear head
  10480->1; 30417 trainable parameters; exact TCCD-v5 Adam / Top-5-soup
  protocol; evaluation-only CENTER-BIND-SHUFFLE permutes q within each molecule
  with c_i, h_base and the q multiset fixed. No baseline rerun, no seed 1, no
  second layer, no GNN, no official-valid, official test never loaded.
