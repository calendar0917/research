decision: >-
  OUTCOME D — NO MATERIAL SIGNAL (borderline binding). G_center
  -0.0029188548958627436 (CENTER-COMP soup 0.254337 does not exceed the best
  existing frozen composition, TCCD-v5 PRE 0.251418) and G_bind(soup)
  0.009341380437836055 (below the 0.010 material threshold). One layer of
  pair-to-center incidence is used but is insufficient: it does not supply
  material missing predictive signal beyond the existing global
  pair/statistical representation, and it explains none of the 0.25 -> 0.12
  gap. Do not add a second incidence layer, do not deepen the reader, do not
  attempt a GNN rescue.
alternatives_rejected:
  - item: Add a second pair-to-center incidence layer or iterate the composition
    because: >-
      the registered outcome is D: one layer is already used only at a
      sub-material level (G_bind 0.009341) and does not exceed the existing
      frozen composition, so a second layer would be an unauthorized depth
      sweep rather than a preregistered test.
  - item: Deepen rho / the final reader or widen phi
    because: >-
      the preregistration froze one fixed architecture with no width or depth
      sweep; TCCD-v6 already showed that reader-coordinate effects, not new
      structure, explain the recent v5 POST gain.
  - item: Run a paired seed 1 to confirm the borderline G_bind
    because: >-
      CENTER-COMP-v0 is a single-seed round; no seed was authorized, and the
      registered D rule fires on both gates.
  - item: Re-run any existing baseline (TCCD-v2 BASE, TCCD-v5 PRE/POST,
      TCCD-v6 arms) for a matched comparison
    because: >-
      all required references are frozen formal artifacts that were read
      directly (TCCD-v5 stageA_seed0 0.2514181435108185); re-running would
      violate the no-baseline-rerun constraint and add noise, not information.
  - item: Open official ZINC valid or test
    because: >-
      the round is internal-dev only; official_test_loaded is false everywhere
      and the official test is closed.
consequences:
  - >-
    Single-layer shared-center identity is weakened as the primary explanation
    of the frozen ~0.25 TCCD ceiling: it is used, but it neither exceeds the
    existing global composition nor closes the gap to the strong reference.
  - >-
    The size stratification shows the binding effect is largest for small
    molecules and nearly absent for large ones, so the large-graph shortfall is
    not explained by lost center incidence.
  - >-
    The result is consistent with the v6 reading that recent gains are mostly
    coordinate/reader exposure; the next representation step (fuller assembly
    object or local-code sufficiency) needs a new preregistration.
revisit_if: >-
  A new preregistration specifies a richer assembly object that preserves
  incidence across more than one composition step with matched controls, or
  isolates local-code sufficiency independently of incidence; or a new
  diagnostic explains the large-graph error where incidence binding is inert.
  Not by adding depth to this operator, not by a reader sweep, and not by an
  official-test read.
next_action: >-
  NONE auto-authorized. Keep the single-layer incidence route stopped; draft a
  new preregistration only for a fuller assembly representation or a
  local-code sufficiency test; official ZINC test stays closed.
