decision_id: decision-structural-encoder-mechanism-decomposition-20260915
created: '2026-09-15T14:35:00'
kind: decision
study_id: zinc-context-gap
decision: >-
  Structural-encoder mechanism decomposition -> JOINT: connectivity axis
  Decision Case C1 (CONNECTIVITY SUPPORTED); composition axis INCONCLUSIVE;
  representation axis Decision Case R1 (RANK-1 FUNCTIONALLY SUFFICIENT). The
  single missing control B-bag (a permutation-invariant DeepSets bag over the
  same primitives, same output width 16, matched budget 84,511 vs 84,495,
  +0.019%, no message passing, never reads struct_src/struct_dst) was trained
  seed0 GPU0 + seed1 GPU1 under the frozen deterministic-A100 protocol. 2-seed
  Top-5 soup: A2 0.121914, B-bag 0.123806 (seed0 0.127382, seed1 0.120229),
  B-full 0.118972. Delta_composition = A2 - Bbag = -0.001891 (seed0 -0.005688,
  seed1 +0.001905; sign flip, mean negative); Delta_connectivity = Bbag - Bfull
  = +0.004833 (seed0 +0.007564, seed1 +0.002103; both positive);
  Delta_total = +0.002942. Because |A2-Bbag| = 0.001891 < 0.002 AND
  Bbag-Bfull = 0.004833 >= 0.002 AND the connectivity delta is direction-
  consistent, Case C1 fires: primitive composition alone does not provide a
  robust positive increment, while explicit rooted-patch connectivity provides
  an independent, reproducible one. The composition magnitude passes only by
  cancellation; combined with the input-information confound (A2 reads the
  146-D shell descriptor, B-bag does not) the composition axis is recorded as
  INCONCLUSIVE, not as proven neutral. The zero-training rank-1 audit of the
  frozen B-full checkpoints fires Case R1: near rank-1 on official train
  (PC1 EV 0.9793/0.9567, effective rank 1.106/1.196; unique-structure weighted
  at least as collapsed) and replacing e_struct by its train-fit rank-1
  reconstruction (train-fit mean + PC1 direction only; no retraining) changes
  soup valid by +0.000020/+0.000011. So the honest mechanism is: connectivity
  matters, but it is exploited as a scalar structural modulation, not as a rich
  explicit representation. The PC1 score is only partially predictable from the
  224 deterministic descriptors (fixed ridge train->valid R2 0.279/0.553), so it
  is not simply an existing statistic (between R3 and R4, seed-dependent).
alternatives_rejected:
- item: Claim "shared primitive composition recovers the B-full gain"
  because: >-
    B-bag is on average WORSE than the generic shared adapter A2
    (Delta_composition mean -0.001891) and the per-seed increment sign-flips.
- item: Claim "primitive composition is worthless / proven neutral"
  because: >-
    A2 and B-bag do not read the same input information (A2 reads the 146-D
    handcrafted shell descriptor, B-bag only the raw primitives); the
    composition comparison is confounded and only supports the weaker statement
    that a raw-primitive bag is not better than the generic adapter.
- item: "Resolve the composition axis by buying more seeds or sweeping the bag encoder width/depth/pooling"
  because: >-
    the brief forbids extra seeds and architecture sweeps; the ambiguity is
    recorded rather than chased.
- item: "Attribute the gain to rich connectivity-derived structural representation"
  because: >-
    the rank-1 audit shows the 16-D channel is functionally a scalar modulation
    (rank-1 soup delta +0.0000155, far below the 0.001 scale).
- item: Treat the rank-1 result as authorising a new scalar-only model
  because: >-
    the audit is a mechanism diagnostic; the brief explicitly forbids designing
    a scalar model from it.
- item: Open the ZINC official test or train MolHIV to confirm the mechanism
  because: >-
    the mechanism decision itself is valid-selection only; at decision time the
    official test was hard-locked. It was later read exactly once in a
    separately-authorized terminal closure (commit 4802ba8, tag sbpe-test), which
    changed no model/selection decision and is recorded below.
- item: "Change h/q/T, the optimizer, the relation/centre family, or add attention/Transformer/identity mechanisms"
  because: >-
    all are out of scope and none is needed to answer the mechanism question.
consequences:
  - >-
    The B-full +0.002942 gain is localised to explicit connectivity
    (+0.004833 over B-bag, same inputs/budget, both seeds same direction), NOT
    to shared composition; do not describe B-full as a shared-compositional /
    structural-prior gain.
  - >-
    Do not describe B-full as learning a rich explicit structural
    representation; it learns a functionally rank-1 (scalar) structural
    modulation.
  - >-
    The composition axis remains open/inconclusive; a future clean test would
    need identical input information on both sides (e.g. feed B-bag the same
    146-D descriptor) and is NOT authorized here.
  - >-
    ZINC Cell A remains the frozen configuration; B-bag is a mechanism control,
    not a candidate architecture and not a new benchmark result.
