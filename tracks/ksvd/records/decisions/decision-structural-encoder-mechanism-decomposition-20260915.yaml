revisit_if: >-
  A new pre-registered stage asks (a) whether the connectivity increment
  survives a same-input-information composition control, (b) whether the
  functionally-rank-1 channel can be replaced by a deliberately scalar
  connectivity statistic with a new pre-registered witness (not authorized
  here), or (c) whether the composition axis is resolvable with a different
  pre-registered control. No seed/width/depth/sweep follows from this decision.
