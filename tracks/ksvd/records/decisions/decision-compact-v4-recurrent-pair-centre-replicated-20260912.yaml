alternatives_rejected:
  - Do not reopen P1 (learned centre composer), P2 (single refresh), compact-v4-cell
    (cycle cells), covariance/triad/endpoint/topology-statistic routes.
  - Do not add attention, path features, extra statistics, alpha mixing, concat
    [q0;q1], per-round weights, a larger q dim, or a learned pooling to this
    variant.
  - Do not add a third centre round or more depth without a matched-horizon /
    matched-depth control; the depth-only stale control already captures ~69%
    of the seed0 gain.
  - Do not treat the seed1 horizon-boundary run or the late refresh increment as
    a clean representation win.
consequences:
  - "The one-shot-relation bottleneck hypothesis is WEAK/NO-GO: the dominant
    effect of the recurrent variant is the extra centre update (depth), not the
    refreshed pair relation."
  - "The relation-persistence line is not fully closed: refresh adds a small
    (+0.0021) and late increment on seed0; the next most informative test is a
    pre-registered shared-intermediate-k pair-to-pair interaction experiment
    (parameter-neutral, matched baseline, matched depth, matched horizon)."
  - Official test is recorded for this variant (mean 0.114951); the <0.10 target
    is not reached.
revisit_if: >-
  Reopen only with a genuinely different, independently pre-registered
  persistence mechanism (e.g. shared-intermediate-k pair-to-pair interaction),
  or with a longer-horizon matched-optimization protocol that resolves the
  late-convergence confound and a matched-depth control for seed1. Do not layer
  a second refresh / composer / cycle object / extra centre round onto the
  current recurrent variant.
