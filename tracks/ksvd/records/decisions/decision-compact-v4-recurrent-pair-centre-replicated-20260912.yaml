decision_id: decision-compact-v4-recurrent-pair-centre-replicated-20260912
created: '2026-09-12T21:22:00'
kind: decision
study_id: zinc-context-gap
decision: >-
  Run one parameter-neutral falsification of the relation-persistence
  hypothesis on the current best compact-v4-smallhead model: a 2-round,
  weight-tied recurrent pair--centre variant (q^(1) recomputed from h^(1) with
  the shared pair encoder; h^(2) = h^(1) + U([h^(1), A(q^(1))]) with the shared
  centre update; final readout unchanged). Verdict: the 2-round recurrence
  improves validation and frozen test on 2/2 seeds, BUT the depth-only stale
  control shows the gain is mostly extra centre depth, not relation
  persistence. The specific hypothesis that the one-shot relation computation
  is the bottleneck is therefore WEAK/NO-GO.
why_this_experiment: >-
  P2 (one-shot relation refresh, q^(1) pooled into the readout but never fed
  back into a centre update) was a sub-threshold positive (+0.001963 vs
  +0.004). The natural stronger test is whether making the relation persist
  across rounds -- with the updated centres acting back on the relation and the
  refreshed relation acting back on the centres -- moves the bottleneck. The
  experiment is deliberately parameter-neutral so any gain cannot be capacity.
protocol: >-
  Inherited frozen compact-v4-smallhead protocol (Adam lr 1e-3, wd 1e-5, batch
  128, max 240, patience 40, no scheduler, gradient clip 5.0, L1, best
  official-valid, single stage). Matched baseline = compact-v4-smallhead
  (82,115 params) under the same code path and shared initial tensors; it
  reproduced the existing smallhead seed0 (0.145334@176) and seed1
  (0.138059@143) exactly. Candidate = same modules, two weight-tied rounds,
  82,115 params (delta 0). Control = stale recurrence_mode: two centre updates
  but q^(0) reused in round 2, same 82,115 params, init-identical to baseline.
  Official test only in the explicit frozen `terminal_test` stage, gated on the
  positive validation verdict.
