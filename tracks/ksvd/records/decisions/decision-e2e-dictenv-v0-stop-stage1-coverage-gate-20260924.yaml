  in results/e2e_dictenv_v0/smoke_gate.json for provenance.
study_id: zinc-context-gap
why_this_experiment: >-
  Prior work localized the sparse SDB-v0 pure-topology dictionary coordinate
  inside a frozen FEC-S1 shared local environment (FEC-D1: local binding helps,
  but the gain was not dictionary-specific versus a matched PCA32 control).
  E2E-DictEnv-v0 asked the end-to-end question: can a task-coupled, sparse,
  shared pure-topology dictionary (phi65 -> D -> alpha32, tied-IHT) be the ONLY
  fine-grained learned structural coordinate from which local chemical
  environments are built, and is its value SPECIFIC versus a parameter-identical
  dense tied coordinate (z = phi @ Pbar on the same matrix)?  The round was
  pre-registered with fixed K=32, s=8, 10 IHT steps, frozen SDB K-SVD
  initialisation, 66,158 parameters, one-shot frozen lambda_rec, Sparse vs
  DenseTied arms only (no PCA), hard Gate 0 and a Stage-1 train-only mechanism
  smoke before any formal run.
protocol: >-
  Local-first implementation with targeted CPU tests, pre-registration frozen
  before any run.  Architecture: only coordinate phi65, no message passing,
  recurrence, pair->centre, relation refresh, attention, context writeback,
  typed/parent lookup, FEC-S1 146->214->24 adapter, patch_cont in the model,
  graph-level dictionary residual or pair-kernel dictionary side channel.
  Frozen: K=32, s=8, IHT=10, r_atom=64, r_bond=16, env MLP 86->329->48 SiLU,
  exact FEC-S1 strict-static composition backend (15,359 params), total 66,158.
  Training protocol OPTIMIZED_PROTOCOL: Adam lr 1e-3, wd 1e-5, batch 128,
  L1 + lambda_rec * normalised reconstruction, clip 5, no scheduler, 240
  epochs, no early termination, fixed Top-5 soup, seed 0, official train 10,000
  / official valid 1,000, official test never loaded.  Gate 0: G0..G12.
  Stage 1: first 512 official-train molecules, 3 epochs, Sparse arm, official
  valid never read; hard gate >= 24/32 atoms active, no single atom > 50%,
  effective atom count >= 8, environment rank > 1.
