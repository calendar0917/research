decision: >-
  STOP E2E-DictEnv-v0 at the Stage-1 mechanism gate (frozen verdict
  E2E_DICTENV_MECHANISM_COLLAPSED, case S1).  Do NOT run the formal Sparse or
  DenseTied arms, do NOT run the zero-code or assignment-shuffle interventions,
  do NOT evaluate the absolute band or the dictionary-specific gate, and do NOT
  apply any forbidden rescue (K / s / IHT steps / LISTA / soft dictionary /
  multiple or per-shell dictionaries / deeper decoder / attention / LayerNorm /
  lambda sweep / extra epochs / reader enlargement / seed 1).  The round is
  closed; the dictionary hypothesis remains untested by this round.
because: >-
  The pre-registered Stage-1 coverage gate requires >= 24/32 active dictionary
  atoms in the 512-molecule / 3-epoch train-only smoke and the trained smoke
  model leaves only 23/32, deterministically and under both the 512-subset and
  the full official-train measurement scopes.  The frozen verdict table makes
  any Stage-1 FAIL a STOP with no workaround, so the formal arms and all
  mechanism interventions were withheld.  The failure is a coverage-threshold
  miss, not a collapse: support stays exactly sparse (max l0 = 8), train MAE and
  reconstruction both fall, task gradients reach D, no atom dominates (top-1
  0.125), the effective atom count is 12.83 and the environment coordinate keeps
  effective rank 2.30; at initialisation the frozen K-SVD dictionary already
  covers 25/32 atoms on official train (24/32 on the 512 subset), so the short
  smoke merely prunes two rare atoms under the calibrated lambda_rec = 135.8.
  The preregistration did not specify whether the atoms-active gate is measured
  on the initialisation or on the trained smoke model, nor on the 512 subset or
  the full train distribution; the strictest reading fails and the gate is
  binding, so the negative stop is recorded rather than reinterpreted.
alternatives_rejected:
  - >-
    Reinterpreting atoms-active on the frozen initialisation (24/32 or 25/32)
    to pass the gate and proceed to formal training.  Rejected: the gate is
    frozen and the preregistration lists it among the post-training smoke
    checks; changing the measurement scope after seeing the number is exactly
    the rescue the protocol forbids.
  - >-
    Extending the smoke beyond 3 epochs, lowering lambda_rec, or adding an
    entropy/orthogonality/coverage term to keep rare atoms active.  Rejected:
    explicitly forbidden by the preregistration; the clean stop is the result.
  - >-
    Reporting a positive dictionary-specificity claim from the Gate-0
    mechanism checks alone.  Rejected: mechanism presence (gradients to D,
    exact sparsity, environment rank) is necessary but not sufficient; the
    round's claim requires the formal M_S / M_D / zero / shuffle comparison,
    which was never run.
  - >-
    Running the formal arms as an "exploratory" pass.  Rejected: the frozen
    verdict table makes a Stage-1 FAIL terminal, and any post-hoc continuation
    would contaminate the confirmatory status of the results.
revisit_if: >-
  A new pre-registration corrects the Stage-1 gate definition to match the
  gate's provenance (a full-official-train dictionary-coverage property of the
  frozen initialisation, with the trained-model coverage reported as a
  diagnostic), or supplies a stated power rationale for a trained-model
  coverage floor so that a single rare atom cannot trigger a false
  MECHANISM_COLLAPSED.  Under such a corrected gate the substantive question is
  unchanged: SparseDictEnv vs the parameter-identical DenseTiedEnv, with the
  zero-code (alpha -> 0) and assignment-shuffle interventions, the absolute band
  of M_S and G_sparse = M_D - M_S >= 0.003.  No seed 1, no sweep and no
  architecture change may be attached to this round.
