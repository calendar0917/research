revisit_if: A new preregistration either (a) states an explicit precision target and
  a matched paired control able to separate a ~+/-0.002 dev effect from training-seed
  and molecule-sampling variance (i.e. a design that fixes the two-seed direction flip
  observed here), or (b) changes the interface/supervision condition itself; any new
  purchase needs the same two-seed paired same-round control, the frozen verified
  basis/access, and the historical-anchor verification used here. A compression claim
  additionally needs a demonstrated time/memory saving, not only a parameter-count drop.
