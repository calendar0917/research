revisit_if: A new preregistration (a) gives the shared nonlinear endpoint projection
  (C) the line's paired two-seed same-round control with a stated precision target
  able to separate a ~0.002-0.003 dev effect, or (b) tests relational endpoint conditioning
  at a different interface (e.g. conditioning that also feeds the pair encoder or
  gate, or learned routes) rather than the pre-compression linear bucket split; any
  purchase keeps the frozen basis/access, the verified init identity, the route-untouched
  guarantee and the one-shot terminal.
