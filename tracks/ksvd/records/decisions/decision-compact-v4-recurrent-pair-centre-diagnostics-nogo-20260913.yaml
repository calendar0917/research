alternatives_rejected:
  - Do not run seed1 for signed-q (degraded on seed0).
  - Do not run T4/T5 (T=3 already saturated).
  - Do not try SiLU/GELU/LeakyReLU or other activation sweeps at the pair site.
  - Do not resume pair-to-pair composition.
  - Never load official test.
consequences:
  - The signed-relation-latent and deeper-recurrence hypotheses are both closed
    as no-signal single changes.
  - The T=2 recurrent pair--centre model (82,115 params; seed0 0.138376, seed1
    0.133440; frozen test mean 0.114951) remains the frozen best model.
  - The viable next direction is a relation-primitive redesign such as ordered
    shortest-path encoding, not activation or depth changes.
revisit_if: >-
  Reopen depth or signed-relation only with a genuinely independent
  pre-registered mechanism (not another activation/depth variant of this site),
  or after a relation-primitive change that moves the baseline.
