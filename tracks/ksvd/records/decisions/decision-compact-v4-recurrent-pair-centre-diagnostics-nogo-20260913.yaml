decision_id: decision-compact-v4-recurrent-pair-centre-diagnostics-nogo-20260913
created: '2026-09-13T13:20:00'
kind: decision
study_id: zinc-context-gap
decision: >-
  Run two single-change, seed0-only validation diagnostics on the frozen best
  compact-v4-smallhead 2-round recurrent pair--centre model (82,115 params;
  seed0 valid 0.138376): (A) signed-q -- remove only the final pair_encoder
  ReLU; (B) T=3 recurrent depth -- three weight-tied P/Q/U rounds. Verdict:
  NEITHER CARRIES ENOUGH SIGNAL. Signed-q degrades to 0.140051 (delta -0.001675
  vs T=2; strong/weak/noise gates +0.002/+0.001/-0.001) -> stop, seed1 not
  purchased. T=3 reaches 0.139022 (delta -0.000647, |delta| <= 0.001) with no
  horizon warning (best epoch 173, max 320, patience 40) -> saturated -> stop,
  no T4/T5. Pivot to changing the relation PRIMITIVE (e.g. ordered
  shortest-path encoding), not the activation or the recurrence depth.
why_this_experiment: >-
  The validated T=2 recurrent model was the best variant, but its control had
  shown the benefit is mostly extra centre depth while the one-shot relation
  computation is not the dominant bottleneck. A pre-training audit of the
  original ReLU model showed 85.1%/86.0% (q0/q1) of pair pre-activations are
  negative and zeroed by the final ReLU, making signed-q the cheapest test of
  a truncated relation latent; T=3 was the cheapest test of whether T=2 is
  depth-limited. These are the two pre-registered diagnostics requested before
  committing to a relation-primitive redesign.
protocol: >-
  Inherited frozen compact-v4-smallhead protocol verbatim (Adam lr 1e-3, wd
  1e-5, batch 128, patience 40, no scheduler, gradient clip 5.0, L1, best
  official-valid; seed0). Task A uses max 240 epochs. Task B uses the same
  protocol with max 320 epochs (patience unchanged) so a late-converging
  depth-3 model cannot be a horizon false negative. Validation only; official
  test never loaded. No activation sweep, no T-depth sweep, no pair-to-pair.
