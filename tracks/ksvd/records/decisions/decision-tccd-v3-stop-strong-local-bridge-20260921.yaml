decision_id: decision-tccd-v3-stop-strong-local-bridge-20260921
created: '2026-09-21T23:42:59Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  TCCD-v2 showed a large official-valid gap versus the canonical strong local
  reference. TCCD-v3 isolated the local-representation question by reusing a
  frozen pure-local 16-D structural encoder and adding only a matched 16-to-64
  linear adapter, while freezing the TCCD-v2 prototype/composition/reader
  protocol.
protocol: >-
  Preregistered GPU1-only diagnostic, seed 0, official train 10000 / valid
  1000, official test never loaded, one frozen strong-local checkpoint, exact
  TCCD-v2 K=64 vocabulary and five relations, DenseREL and PrototypeREL,
  evaluation-only assignment shuffle, Top-5 soup, and no rescue sweeps.
