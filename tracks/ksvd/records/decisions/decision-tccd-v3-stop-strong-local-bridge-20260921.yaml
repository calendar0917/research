decision: >-
  STOP TCCD-v3 at the preregistered L3 Strong-Local Bridge failure. The strong
  standalone local encoder does not rescue the frozen TCCD-v2 composition and
  reader interface. Do not unfreeze or retrain the strong encoder, add reader
  capacity, change relations, sweep K or temperature, add pair/topology or
  higher-order machinery, or spend rescue seeds.
alternatives_rejected:
  - item: Treat the prototype vocabulary as the remaining simple failure
    because: >-
      PrototypeREL beats DenseREL by 0.124521 MAE on the primary best-checkpoint
      metric and the vocabulary remains broad at 64/64 active prototypes.
  - item: Treat assignment composition as unnecessary
    because: >-
      Evaluation-only row shuffling worsens valid MAE by 0.260054 while keeping
      relation matrices fixed; the composition remains materially
      assignment-sensitive.
  - item: Add capacity or rescue sweeps inside TCCD-v3
    because: >-
      The preregistration stops after DenseREL, PrototypeREL, shuffle and
      vocabulary diagnostics; rescue changes would confound the bridge audit.
  - item: Open official test
    because: >-
      The official test is hard-frozen and was never loaded; the valid-side L3
      decision is already decisive.
consequences:
  - >-
    The absolute TCCD-v2 gap is not explained mainly by the simple 714-to-64
    local encoder alone.
  - >-
    Strong local features remain useful inside the fixed composition interface,
    but their standalone B-full performance does not transfer through the
    TCCD-v2 prototype/readout path.
  - >-
    The next research question, if reopened, is an interface or representation
    family redesign under a new preregistration, not another local encoder,
    reader, K, temperature or relation sweep in this round.
revisit_if: >-
  Only a separately preregistered architecture-level study may revisit the
  interface between learned local features and graph-level composition. It must
  preserve the official-test freeze and declare matched controls before any
  training.
