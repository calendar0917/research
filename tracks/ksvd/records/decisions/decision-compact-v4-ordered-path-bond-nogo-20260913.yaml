decision_id: decision-compact-v4-ordered-path-bond-nogo-20260913
created: '2026-09-13T14:30:00'
kind: decision
study_id: zinc-context-gap
decision: >-
  Ordered shortest-path bond-sequence encoding on the frozen T=2 recurrent
  pair--centre skeleton: NO-GO / DEGRADED at the seed0 gate. Phase A audited the
  current relation primitive and confirmed genuine path-order aliasing
  (official-valid bond-order collision 55.0% overall; 46% at d=3 rising above
  90% for d>=11; 23.6% of pairs have multiple shortest paths; official-train
  57.3%). A minimal ordered encoder (shared bond embedding + learned position
  embedding -> 2-layer MLP -> 8D s_ij, concatenated to the widened pair-encoder
  input; canonical min(seq, reverse(seq)) per shortest path; mean over paths)
  was added with all recurrent modules/params/protocol frozen. It adds +2,328
  params (84,443 total) and costs 1.06x epoch time, but degrades seed0
  official-valid MAE to 0.142814 @ epoch 120 versus the recurrent reference
  0.138376 @ epoch 199 (Delta = -0.004438, i.e. worse). At a matched horizon of
  140/160 epochs the ordered model is still slightly worse (Delta = -0.00138).
  Per the pre-registered gate (Delta >= +0.002 to continue; <= +0.001 stop),
  the matched orderless control was NOT run, seed1 was NOT purchased, atom
  sequence was NOT added, and official test was NEVER loaded.
why_this_experiment: >-
  Previous diagnostics on this frozen model closed depth (T=3 saturated) and
  relation activation (signed-q degraded), and explicitly recommended changing
  the relation *primitive*, e.g. ordered shortest-path encoding. The current
  descriptor retains distance, path count and the bond composition averaged
  over shortest paths, but not the bond order. Phase A first established whether
  that order is actually aliased before spending any training compute.
protocol: >-
  Inherited frozen compact-v4-smallhead protocol (Adam lr 1e-3, wd 1e-5, batch
  128, max 240, patience 40, no scheduler, gradient clip 5.0, L1, best
  official-valid, single stage) applied to the frozen T=2 recurrent pair--centre
  model. Path encoder geometry pre-registered: PATH_MAX_LEN=12, PATH_TOKEN_DIM=8,
  PATH_HIDDEN=16, PATH_DIM=8. s_ij = MLP(flatten(counts @ bond_embedding +
  position_embedding)); counts[pos,bond] = mean over canonicalised shortest
  paths. Baseline pair-encoder input columns copied bit-exactly; new columns
  small-normal (std=0.01). force_zero_path reduces exactly to the recurrent
  function. Seed0 only; validation only.
