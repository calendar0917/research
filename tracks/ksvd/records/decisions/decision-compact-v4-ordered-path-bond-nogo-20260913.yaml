alternatives_rejected:
  - Do not run the orderless matched control (Phase-C gate not met).
  - Do not add atom-type sequence, CNN/GRU/Transformer/attention path encoders,
    bigram/learned-order sweeps, or per-position parameter sweeps.
  - Do not buy seed1, do not reopen T=3, pair-to-pair, P1/P2, cycle cells,
    covariance/triad/endpoint, or the tokenizer branch.
  - Do not load official test.
consequences:
  - 'Path-order aliasing is real but does not convert to a validation gain with
    a minimal position-aware bond encoder on this frozen recurrent skeleton.'
  - 'The relation-primitive line suggested by the T=3/signed-q diagnostics is
    closed for this family of small ordered encoders.'
  - 'Next structural move, if any, must be a different pre-registered mechanism
    witness, not another path-encoder variant.'
revisit_if: >-
  Reopen only with (a) a pre-registered mechanism that explains why the missing
  order is task-relevant, e.g. a target-side witness on the ZINC synthetic
  substructure, or (b) a genuinely different relation object (not an ordered
  bond sequence on the same shortest paths) with its own matched control. Never
  by sweeping encoder variants or opening official test.
