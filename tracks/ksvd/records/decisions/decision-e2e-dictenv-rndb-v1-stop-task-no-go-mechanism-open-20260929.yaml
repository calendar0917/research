decision_id: decision-e2e-dictenv-rndb-v1-stop-task-no-go-mechanism-open-20260929
created: '2026-09-29T00:00:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  The closed CSSD-q1 round established a task-neutral, structurally healthier
  dictionary and left the open question whether the *binding* itself can be
  improved.  The parent CSSD / FINAL-CLEAN binding sums the per-role
  structure x chemistry responses linearly and only then passes the summed
  vector into the environment nonlinear decoder.  RNDB tested a single
  function-class change: insert one small shared nonlinear operator between the
  individual residual dictionary-role responses and their aggregation
  (rolewise product -> shared psi -> role sum), at essentially fixed capacity,
  with the dictionary required to stay behaviourally load-bearing.  The
  question was a narrow falsification: does this improve ZINC valid MAE while
  keeping the dictionary genuinely load-bearing?
protocol: >-
  Local CPU only (CUDA_VISIBLE_DEVICES="", no GPU/SSH/DDP), preregistration
  sha256 5d6bb0d87305..., implementation commit e233beb.  Stages: read-only
  historical references -> preflight (parent object / params / mask / subspace
  identity) -> correctness gates G0-G6 on synthetic and real ZINC batches ->
  8-epoch smoke (finite loss, non-zero D and psi gradients) -> exactly one
  from-scratch RNDB seed-0 trajectory (320 epochs, Top-5 soup) -> frozen
  inference-only interventions (psi off, node-only, edge-only, residual
  dictionary alpha -> 0, assignment shuffle node/edge at seeds
  101/202/303/404/505) -> analysis.  No baseline rerun, no seed 1, no sweep.
  Official ZINC test never loaded.
