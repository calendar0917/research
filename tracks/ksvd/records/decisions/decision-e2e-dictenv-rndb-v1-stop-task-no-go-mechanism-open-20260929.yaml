  case: F
  verdict: RNDB_NO_GO_TASK_LEVEL_MECHANISM_STRONGLY_SUPPORTED
  case_boundary: >-
    No pre-registered case enumerates M_R > 0.126 with strong new mechanism
    evidence: Case F literally also requires "no strong new mechanism evidence"
    and Case C requires M_R <= 0.126.  The dominant condition (M_R > 0.126,
    band P3) forces the task-level no-go; the strong mechanism is recorded.
decision: >-
  1. STOP RNDB as a task method: it does not improve ZINC valid MAE (band P3)
   and is 0.0031 worse than the historical CSSD-q1 soup (unmatched; not a
   regression claim because no baseline was rerun).  2. DO NOT run seed 1, do
   not sweep width / init / activation / lr / lambda / horizon, and do not
   apply a post-hoc rescue.  3. RECORD a durable mechanism finding: the shared
   rolewise nonlinearity is strongly load-bearing (G_psi = +0.1907 vs a 0.003
   gate) and the sparse residual dictionary is strongly load-bearing
   (G_dict = +0.2888 vs a 0.010 gate), and the learned node/edge assignment
   correspondence matters (shuffle deltas +0.137 / +0.158).  4. KEEP
   FINAL-CLEAN / CSSD-q1 as the line's reference; RNDB is not adopted.
  5. The next step is a *new* pre-registration only, and it must target task
   conversion (not a rescue): an explicit pre-registered psi-branch
   scale/normalisation variant or a matched dense control, with >= 3 seeds and
   a same-round matched baseline.  This round authorises no such implementation.
alternatives_rejected:
  - >-
    Buying seed 1 to firm up the P3 result.  Rejected: the round is frozen at
    one trajectory and the task band is not close to a useful gain.
  - >-
    Reporting the strong G_psi / G_dict as evidence that RNDB "works".
    Rejected: the pre-registered question is task improvement, and the task
    moved the wrong way; mechanism load-bearingness is not a task gain.
  - >-
    Rescaling / normalising / re-initialising the psi branch to "fix" the early
    transient.  Rejected: post-hoc rescue, forbidden by the pre-registration.
  - >-
    Calling Case C (mechanism supported, task neutral).  Rejected: Case C
    requires M_R <= 0.126 and M_R = 0.133117.
  - >-
    Calling the literal Case F "no strong new mechanism evidence".  Rejected:
    the mechanism evidence is very strong, so the conjunction does not hold;
    the boundary is flagged instead of silently forcing a case.
  - >-
    Reading G_hist as a regression against CSSD-q1.  Rejected: unmatched
    historical comparison, no baseline rerun.
revisit_if: >-
  A new preregistration is written for a matched-capacity task-conversion
  experiment: (a) an explicit residual-scale or normalised psi branch, or
  (b) RNDB vs a matched dense control at equal parameters, both with >= 3
  seeds, the same soup protocol and a same-round matched baseline.  Secondary:
  an intervention that separates the linear residual coordinate from its psi
  term to decompose G_dict; a small controlled study of the W2-init vs Adam
  step-size transient, read as architecture trainability and not as a rescue.
