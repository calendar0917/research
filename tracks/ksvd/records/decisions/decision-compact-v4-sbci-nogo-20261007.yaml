decision_id: decision-compact-v4-sbci-nogo-20261007
created: '2026-10-07T12:00:00'
kind: decision
study_id: zinc-context-gap
decision: >-
  Run exactly one pre-registered architecture falsification ticket
  (SBCI_N3600_I0T0) and register Decision Case A:
  SBCI MINIMAL SHARED-BASIS FACTORIZATION NO-GO. Do NOT buy seed1, do NOT run
  N=7200, do NOT run N=1800, do NOT run seed2/seed3, do NOT rescue with K, width,
  aggregation, relation-form or head changes, and never load official valid or
  official test.
why_this_experiment: >-
  The information-bottleneck line is closed (raw-graph patch-system sufficiency
  Case D; stagewise representation collision Case E) and the fixed
  compact-v4-smallhead family is strongly data-limited (each 3600->7200 doubling
  buys ~0.05 probe MAE). The localization audit (Case H) found no robust
  target-independent support predictor of the gain. The only remaining
  scientifically justified move was a function-class restriction: force
  structural effects through a shared low-rank functional basis and factorised
  relation-only composition.
protocol: >-
  Exact reused environment: D3600 nested target-independent subset (salt
  compact-v4-sample-efficiency-nested-subset-v1-20260912; dataset hash
  3be9f7e1...), 800 selection, 2000 probe; official valid/test never loaded;
  Adam lr 1e-3 wd 1e-5 batch 128 L1 no scheduler, gradient clip 5.0, max 13,680
  optimizer steps, selection every 57 steps, patience 40, earliest-step tie;
  RAW = lowest-800-MAE checkpoint, SOUP = K=5 equal-weight parameter average.
  SBCI = retained compact-v4 patch/embedding/global/topology branches plus
  phi(48->32->16), psi(23->32->16) with g = 1 + tanh(psi), p_ij = z_i*z_j*g_ij,
  5-bucket mean/std/log-count -> 165D, Linear(165,16) centre composer with
  c_i = z_i + delta_i, graph mean/std/sqrt-sum -> 48D, R = 88D, head
  88->16->1. Removed: pair projection, relation encoder, distance gate, pair
  encoder, 213D centre update, 302D R and 302->13->13->1 head. Candidate
  62,045 params (cap 82,115).
