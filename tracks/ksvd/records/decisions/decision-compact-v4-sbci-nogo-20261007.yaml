rejected:
  - buying N3600 seed1 after a negative delta_SE
  - running N7200 without a replicated low-data GO
  - running N1800, seed2 or seed3
  - K sweep, phi width sweep, attention, softmax, LayerNorm/dropout in SBCI modules
  - residual q/centre bypass, pair MLP after product, additive pair branch
  - task-specific global features
  - official valid/test access
  - any HPO or architecture sweep
