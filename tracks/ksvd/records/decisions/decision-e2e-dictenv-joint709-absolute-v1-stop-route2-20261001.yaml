revisit_if: >-
  A NEW preregistration targets one separable question: does a joint
  representation of the 709-D environment vector earn its place once the
  coordinate channel is demonstrably live?  Such a round must (i) pre-register
  a binding mechanism that cannot be shrunk away and make endpoint liveness an
  acceptance gate (|w|max > 1e-3 and a non-zero intervention delta, the shape
  already mandated by
  decision-e2e-dictenv-jointbond-decay-diagnostic-v1-no-branch-rescue-optimizer-attractor-next-20260930),
  (ii) justify the dictionary capacity, since K=48/s=12 codes the 709-D input
  at 0.895/0.941 relative error even with 60 IHT steps, (iii) carry its own
  matched control (the unbuilt PCA48 is the natural one) and paired seeds, and
  (iv) keep the official test closed.  Only then can a comparative statement
  about the joint object be attempted.  This decision's stop applies to the
  frozen candidate of this round, not to the research question.
study_id: zinc-context-gap
why_this_experiment: >-
  The previous round (decision-e2e-dictenv-rolecorr-increment-v2-stop-route1-20261001)
  left route 2 — the frozen joint dictionary over the train-scale-balanced
  709-D environment input — prepared but not entered, and the user authorised
  exactly one candidate this round: a seed-0, 320-epoch absolute-performance
  screen of that frozen joint representation, with no control arm.  The
  pre-registered question was whether this candidate lands in a better
  absolute band (<= 0.115 strong prospect, <= 0.120 promising, <= 0.1233
  borderline, else stop), before any future round invests in matched controls
  and paired seeds.
