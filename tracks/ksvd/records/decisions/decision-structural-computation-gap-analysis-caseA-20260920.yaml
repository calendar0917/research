decision_id: decision-structural-computation-gap-analysis-caseA-20260920
created: '2026-09-20T00:05:00'
kind: decision
study_id: zinc-context-gap
decision: >-
  Same-budget structural-computation gap analysis -> Decision Case A: ONE
  REPRESENTATION HYPOTHESIS AUTHORIZED (DESIGN ONLY; nothing is run in this
  stage). Top-1 representation-family hypothesis: incidence-preserving
  structural persistence of explicit higher-order objects. The compact-v4
  computation graph was reconstructed from real code (single pass;
  complete pair set whose state q_ij is computed once and then dissolved into
  per-(centre,bucket) mean/std/log-count and graph moments; no per-cycle
  object; cycle information only as a graph-level 25D vector). The same-scale
  reference CIN-small was verified from primary sources (130,945 params;
  induced-cycle 2-cells; persistent learned cell states over 2 rank-aware
  cellular message-passing layers with explicit incidence). Minimal
  falsification architecture = compact-v4-cell (explicit persistent cycle-cell
  states + exactly 2 pre-registered rank-aware incidence rounds; ~108-112K
  params <= 120K). Pre-registered seed0 gates: protocol = optimized
  compact-v4 protocol, baseline optimized compact-v4 seed0 valid 0.146420,
  primary gate delta_valid >= +0.004, mechanism-alive (cell-shuffle
  sensitivity > 1e-3 and true-incidence beats cell-shuffle), bulk-safe
  (<= +0.002); seed0 only; buy seed1 only on pass; never seed3 by default.
  Official test NEVER loaded. With a flagged method-philosophy sub-condition:
  the minimal architecture needs a small fixed number of rank-aware
  propagation rounds; if the gain requires extensive iteration, reclassify to
  Case B (method-philosophy tradeoff) and do NOT authorize implementation.
alternatives_rejected:
- item: Case B (dominant gap is repeated generic message passing)
  because: >-
    CIN No-Rings small (2 layers of persistent edge-state message passing,
    no rings) reaches only 0.174, weaker than our single-pass model; repeated
    refinement WITHOUT explicit higher-order objects is not sufficient, so
    depth alone is not the primary gap.
- item: Case C (no single dominant structural gap)
  because: >-
    one structurally identifiable difference is consistent across the reference
    No-Rings ablation, the ring-lifting theory, and the total absence of a
    per-cycle object in compact-v4.
- item: Case D (benchmark not comparable / reject the comparison)
  because: >-
    dataset, split, target, metric and edge features are verified identical
    from primary sources; only protocol/budget differ, which is handled by
    treating the performance gap as headroom evidence only.
- item: add another missing statistic / open compact-v7 by feature checklist
  because: >-
    endpoint association, centre covariance, triadic binding, frozen readout
    sufficiency and the optimized broad-state screen all closed that family
    (NO-GO / INCONCLUSIVE). The authorized hypothesis changes the computation
    graph, not the statistic set.
- item: enlarge radius / copy CIN / generic all-pairs message passing /
    attention or Transformer backbone
  because: >-
    each violates the project's method philosophy; the minimal plan changes
    exactly one principle (incidence-preserving persistence of a structural
    object) and keeps the parameter increment ~8-12K.
- item: use official test
  because: >-
    hard-locked for this stage and for the seed0 falsification.
consequences:
  - >-
    Design-only deliverable set committed under
    results/structural_computation_gap_analysis/ (14 files + answers_q1_q20 +
    information_path_examples + <=3 figures) and
    notes/structural_computation_gap_analysis.md (23 sections).
  - >-
    Next-stage compute budget locked: one seed0 full-training run of
    compact-v4-cell only; no HPO; no sweep of the ring size k; official test
    never loaded.
  - >-
    If the seed0 control shows the effect needs many/iterative rounds, the
    conclusion flips to Case B and implementation is not authorized.
  - >-
    The global topology channel is preserved (it is a positive component);
    the new hypothesis is complementary, not a replacement.
revisit_if: >-
  Run the pre-registered seed0 falsification of compact-v4-cell: it passes
  only if delta_valid >= +0.004 AND the true-incidence model beats the
  multiset-preserving cell-shuffle control AND the bulk is safe. A
  multiset-preserving, incidence-breaking control that wins (or ties) refutes
  the incidence-persistence hypothesis at this budget; a gain that requires
  extensive iteration reclassifies the decision to Case B.
