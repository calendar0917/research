decision: >-
  STOP the attributed-code-formation route at its frozen Case-C verdict.  Record
  the pairing signal as a positive mechanism finding (the real
  structure<->attribute assignment carries material task value inside the same
  32-D frozen sparse bottleneck: +0.00557, stable from 160 to 320 epochs), but do
  not invest further in placing chemistry inside the attributed dictionary: REAL
  is +0.01017 worse than the completed topology-only arm, outside the 0.003
  practical tolerance.  Keep the simpler retained route (topology sparse code
  followed by post-code chemistry binding) as the line of record.  Do not start
  IHT qualification, task-coupled E2E, mechanism/liveness, DenseTied specificity,
  a second seed, PCA32, continuity-v2, K64, s12 or any sweep; all of them stay
  DEFERRED_PENDING_USER_AUTHORIZATION.  The two earlier verdicts are untouched:
  E2E-DictEnv-A2 stays COMPUTE-BUDGET-TRUNCATED and E2E-DictEnv-A2-Lite stays
  NO_ATTRIBUTED_CODE_FORMATION_SIGNAL_AT_32D.
because: >-
  The preregistration froze the matrix before the run: G_pair_320 >= 0.003 makes
  the pairing material, and Delta_vs_TOPO = MAE(REAL) - MAE(TOPO) <= 0.003 is
  required for competitiveness.  The run delivered +0.005567 and +0.010169, i.e.
  exactly Case C: the pairing is real and material, yet the attributed
  dictionary/code formation is not a better overall representation than the
  topology-only dictionary.  The structural asymmetry explains the direction
  without excusing it: the REAL 433-D object is reconstructed poorly by the
  frozen OMP code (train_rec 1.965e-01 vs INDEP 2.119e-02 and TOPO 1.41e-05), so
  the attributed route pays a reconstruction cost that the topology-only route
  avoids while still losing the *assignment* comparison to nobody.  Case C is
  precisely the preregistered instruction to stop the attributed E2E/IHT route
  and keep the simpler one.
alternatives_rejected:
  - >-
    Reading the +0.00557 as a licence to continue into IHT qualification and
    task-coupled E2E.  Rejected: the preregistered Case-C rule forbids it, and
    the comparison that matters for the programme (REAL vs the completed TOPO
    arm) is unfavourable by more than 3x the practical tolerance.
  - >-
    Reading the round as a flat negative ("no pairing signal").  Rejected as
    false: G_pair_320 clears the frozen 0.003 bar and the gap is KEPT from the
    160 screen; the honest record is "material pairing signal, uncompetitive
    placement".
  - >-
    Re-labelling by adding a new late-window gate (0.7625 positive fraction) or a
    per-epoch win-rate criterion after seeing the curves.  Rejected: the
    preregistration declared those statistics diagnostic-only and forbids new
    gates after the fact.
  - >-
    Re-running the arms sequentially to remove the scheduling deviation.
    Rejected: it would cost another ~80 min of GPU1 for a scheduling-only
    difference that cannot change either arm's fixed-seed trajectory semantics,
    and the deviation is already recorded in stage_status.json and the notes.
  - >-
    Retraining TOPO or widening the comparison to other baselines.  Rejected:
    TOPO-OMP-320 is a completed parent artifact, and no new baseline was
    pre-registered.
revisit_if: >-
  The user re-opens the attributed route with a new preregistration that either
  (a) attacks the real bottleneck directly — e.g. a capacity/rank study (K, s or
  dictionary size) or a task-coupled E2E dictionary whose code can represent the
  real object at INDEP-like reconstruction quality before any attribution claim
  is made, or (b) tests whether the pairing effect is mechanistically tied to the
  code (REAL->INDEP code-pairing-removal, node-only / edge-only interventions,
  liveness audit) under a design that can attribute the +0.00557, or (c) buys a
  seed-level error bar for the pairing gap.  Any such round must be separately
  pre-registered and authorised; this round stops here.
