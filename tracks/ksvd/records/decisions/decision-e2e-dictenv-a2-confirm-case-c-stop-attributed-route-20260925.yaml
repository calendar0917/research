decision_id: decision-e2e-dictenv-a2-confirm-case-c-stop-attributed-route-20260925
created: '2026-09-25T05:40:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  The lite compute-budget screen answered only a 160-epoch version of the
  question: with the frozen exact-OMP code, ATTR-REAL was better than
  ATTR-INDEP by +0.005561161399818965, below the amendment's 0.006 strong bar
  and with an unstable late direction (0.65), while both arms were still
  improving at the horizon — so the parent round's own pre-registered 320-epoch
  Stage-1 gate (G_pair_OMP >= 0.003) remained formally unanswered, and the
  parent round itself had been truncated after its TOPO arm.  The user
  authorised exactly one more step: a minimal confirmation round that runs the
  two missing matched arms at the parent horizon and compares REAL with the
  already-completed TOPO arm.  No representation redesign, no PCA, no IHT/E2E.
protocol: >-
  Local-first: short preregistration written and committed before any training
  (4b9e206), reuse-only implementation 45d53df (+ single-arm stage a9d3e08 and
  stage-record fix 76f65af), targeted CPU tests (43) on the frozen protocol,
  then the remote-research-runner workflow on the shared A100 box: preflight
  (doctor 12 ok / 0 fail, GPU1 free, GPU0 foreign-occupied and never touched),
  clean deploy, GPU1 smoke, training, pull, independent local recomputation.
  Two matched 320-epoch frozen-OMP arms (REAL, INDEP) with the frozen H1 trainer
  (seed 0, matched init, batch order SEED+91011/91012, Adam 1e-3 / wd 1e-5 /
  clip 5.0, lambda 33.95873017865987, Top-5 soup, per-epoch official-valid
  evaluation), frozen K=32/s=8 dictionaries and exact-OMP codes reused
  bit-identically (verified by reference in 3 s), horizon 320 = the parent
  protocol, official ZINC test never loaded.  Exact continuation of the
  completed 160-epoch lite segments was inspected and refused: no optimizer,
  scheduler, RNG, loader or soup-member state was persisted and the frozen
  trainer has no resume path, so both arms restarted fresh under the same
  regime as the parent TOPO arm (no mixing, no pseudo-resume).  The two arms ran
  under a user-authorised parallel GPU1 schedule (two independent single-process
  CUDA jobs, ~0.84 GiB each, no DDP, no multi-GPU); the sequential job was
  stopped at the REAL->INDEP boundary so no arm was duplicated.
