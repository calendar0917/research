decision_id: decision-sbci-fit-generalization-triage-inconclusive-20261007
created: '2026-10-07T18:30:00'
kind: decision
study_id: zinc-context-gap
decision: >-
  Register Decision Case C: FIT_GENERALIZATION_TRIAGE_INCONCLUSIVE for the
  already-final compact-v4-SBCI NO-GO. Do NOT authorize Shared Structural
  Operator Dictionary (SSOD); do NOT authorize Direct Shared Structural
  Potentials (DSP); do NOT rescue SBCI; do NOT run seed1, N7200 or N1800; do
  NOT train anything; do NOT load official valid or official test.
why_this_experiment: >-
  The SBCI NO-GO is final and magnitude-negative, but a worse probe MAE alone
  cannot distinguish an over-constrained function class (redesign: restore
  cross-channel expressivity, i.e. SSOD) from an adequate-fit wrong inductive
  bias (redesign: abandon latent-basis sharing, i.e. DSP). The only way to
  choose was to measure deterministic D3600 training-set fit of the frozen
  baseline and candidate estimators.
protocol: >-
  Zero-training triage. Exact index-for-index reuse of the N3600/I0/T0
  environment: D3600 sha256 3be9f7e1..., 800-selection and 2000-probe hashes
  from the frozen split manifest, subset salt
  compact-v4-sample-efficiency-nested-subset-v1-20260912; Adam lr 1e-3 wd 1e-5
  batch 128 L1 no scheduler clip 5.0, max 13680 steps, eval interval 57,
  patience 40; K=5 equal-weight parameter soup. RAW = select-800 argmin; SOUP =
  K=5 mean. All 208 saved snapshots re-evaluated on D3600 under model.eval();
  recomputed train MAE matches the stored curves exactly (max|diff| 0.0).
