decision: >-
  STOP SRDA-v0 after the single seed-0 run. Do NOT purchase seed 1, do NOT sweep
  K / R / residual dim / width / tau, do NOT redesign the relation trunk, do NOT
  add residual bypasses or auxiliary objectives, do NOT rescue. The round is
  closed with SRDA_V0_NO_STRONG_PERFORMANCE_SIGNAL. Do not re-open the
  residual-dictionary / gamma line, and do not treat "the dictionary looks
  healthy" as a success criterion.
because: >-
  The preregistered seed-0 GO gate (Top-5 soup <= 0.1340 and best <= 0.1385)
  failed in the NEGATIVE direction: soup 0.149873 and best 0.155449, i.e.
  0.009079 / 0.009775 WORSE than the strict-static S0 seed-0 reference and
  0.010138 / 0.013255 worse than SDPK-v0 seed 0, and the model never reached
  valid MAE <= 0.15 in any of the 240 epochs. The regression exceeds the known
  S0 seed-to-seed movement (0.006285). The mechanism is nevertheless fully alive
  and now dominant: p_dict holds 81.8% of the pair-input energy (0.611 -> 2.256,
  3.69x), the pair encoder's first-layer weight norm on that block grew to 7.04
  (2.29x), and neutralising it collapses the prediction (mean |d pred| 1.2018,
  valid MAE 0.155 -> 1.232), while the 8D residual stayed flat
  (0.621 -> 0.659, 7.0% of energy; zeroing it costs 0.131 MAE). So the round
  answers its mechanism question ("the prototype algebra really is the
  computation; the 8D residual did not take over") and still fails its
  performance question. With absolute MAE as the first success criterion, there
  is no basis to spend the second authorized full run.
alternatives_rejected:
  - >-
    Buying seed 1. Rejected: the gate is explicit and failed in the wrong
    direction by an order of magnitude relative to the required improvement.
  - >-
    Sweeping K / tensor rank / residual dim / tau / pair width / local width or
    redesigning the relation trunk to rescue the number. Rejected: forbidden by
    the preregistration, and a parameter sweep on top of a 0.009 regression is
    not a scientific step.
  - >-
    Restoring the raw z-projection pair blocks (u_i+u_j, |u_i-u_j|, u_i*u_j) as
    a rescue. Rejected: that reintroduces exactly the SDPK-v0 generic raw bypass
    this round was designed to remove; it is a different architecture and would
    need a new preregistration with its own control.
  - >-
    Reinterpreting the healthy dictionary (64/64 active atoms, effective count
    14.5, dominant p_dict energy share) as success. Rejected: assignment health
    is a reporting diagnostic, never a GO gate.
  - >-
    Attributing the regression between "identity channels deleted" and "raw pair
    interaction replaced" without a matched control. Rejected: the round
    deliberately did not buy controls; the honest statement is that this round
    cannot separate the two changes, and it records that as a limitation.
revisit_if: >-
  A future preregistered round (i) establishes a same-session paired strict-static
  baseline and (ii) buys exactly one matched control that isolates the raw pair
  interaction (dictionary algebra WITH vs WITHOUT the raw z-projection blocks,
  identity channels deleted in both arms). Only a materially positive absolute
  effect from some dictionary-conditioned mechanism justifies further compute;
  a regression of this size with the mechanism demonstrably dominant does not
  justify a sweep. The identity-information finding (typed/parent channels
  unnecessary) is unchanged and remains usable by other architectures.
