decision_id: decision-zinc-srda-v0-stop-after-seed0-negative-20260922
created: '2026-09-22T00:00:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  Two earlier results framed the question: (a) the typed-token / parent identity
  channels are provably not necessary for strict-static ZINC performance
  (identity incremental-information study), and (b) SDPK-v0 showed that a
  dictionary-conditioned pair kernel can be live and load-bearing yet still fail
  to improve absolute MAE, because it was added on top of the raw pair
  interaction without changing what the pair kernel fundamentally computes.
  SRDA-v0 asked the remaining performance-first question: delete the identity
  channels outright and let the end-to-end dictionary assignment DEFINE the
  occurrence-level relation algebra (relation-conditioned prototype-pair tensor
  contraction), rather than compressing it into a generic coordinate and handing
  it to a generic raw-pair MLP. No gamma/residual-dictionary question, no
  ablation grid, no sweep, no rescue.
protocol: >-
  Local-first implementation with targeted CPU tests, then remote A100 execution
  under the remote-research-runner workflow (local Git as source of truth,
  deploy.sh, uv sync --frozen, research doctor, durable detached launch,
  pull_results.sh). Frozen architecture: standalone strict-static module;
  x_i = [patch_cont | patch_context] (146D); z_i = SiLU MLP(146 -> 96 -> 64);
  K=64 / rank=32 / tau_init=0.20; a_i = alpha_i @ A, b_i = alpha_i @ B,
  A,B in R^{64x32} (init std 2.0), proto_pair_ij = 0.5*(a_i*b_j + a_j*b_i);
  rel_hidden = SiLU(Linear(23,32)); rel_gate = 1 + tanh(G(rel_hidden) +
  bucket_embedding[bucket]); p_dict = proto_pair * rel_gate; eps_i = q_i -
  alpha_i @ D_norm; e_i = W_eps(eps_i) (32 -> 8); p_eps = [e_i+e_j |
  |e_i-e_j| | e_i*e_j]; pair input = [p_dict | p_eps | rel_feat] (72);
  pair encoder 72 -> 64 -> 32 evaluated once; 5-bucket mean/std/log-count pair
  moments (325), 129D unary, 32D global, 8D topology hinge, 494D graph vector,
  16/16 reader. Frozen protocol: Adam, lr 1e-3, wd 1e-5, batch 128, L1/MAE,
  clip 5.0, no scheduler, full 240 epochs with no early termination, best
  checkpoint + fixed Top-5 weight soup. One seed-0 full run on remote
  A100-SXM4-40GB GPU 0; official ZINC train 10000 / official valid 1000;
  official test never loaded.
