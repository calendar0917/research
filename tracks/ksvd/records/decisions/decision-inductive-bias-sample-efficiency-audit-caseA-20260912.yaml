kind: decision
study_id: zinc-context-gap
decision: >-
  Execute the pre-registered Compact-v4 Inductive-Bias & Sample-Efficiency Audit
  and register Decision Case A: STRONG WITHIN-FAMILY DATA-LIMITED REGIME.
  Authorize sample_efficiency_inductive_bias design only
  (authorized_for_design=true, full_training_authorized=false). Do NOT authorize
  any architecture training, do NOT run N=900, do NOT run seed2/seed3, and never
  load official valid or official test.
why_this_experiment: >-
  The information-bottleneck line is closed (raw-graph patch-system sufficiency
  Case D: LB(P3)=0, PATCH_FULL target geometry beats RAW references; stagewise
  representation collision Case E: no material degradation; parameter-allocation
  audit: compression-only opportunity). Checkpoint tuning is also closed as a
  main line (Top-5 soup is a fixed measurement stabilizer). The remaining
  question was not where information is lost but how hard the same information is
  to learn from a finite number of examples at fixed architecture, optimizer,
  selection set, probe set and optimizer-step budget.
protocol: >-
  Exact compact-v4-smallhead (82,115 params); Adam lr 1e-3, wd 1e-5, batch 128,
  L1, no scheduler; frozen official-train 7200/800/2000 split reused
  index-for-index; nested target-independent subsets D1800 subset D3600 subset
  D7200 via sha256(salt || original_official_train_index); max optimizer steps
  240 x 57 = 13,680 mechanically derived from run_I0T0.json; selection eval every
  57 steps; patience 40 selection evaluations; ties resolve to the earlier step.
  RAW = lowest-800-MAE checkpoint; SOUP = K=5 equal-weight parameter average.
  Staged purchase: N3600 seed0 first; N3600 seed1 only on a material +0.006
  SOUP gain with positive paired-bootstrap support and positive RAW; N1800 seed0
  only after two-seed replication; N1800 seed1 only on a material +0.006
  18->36 gain. The 7200 I0T0/I1T1 anchors were reused and never retrained.
