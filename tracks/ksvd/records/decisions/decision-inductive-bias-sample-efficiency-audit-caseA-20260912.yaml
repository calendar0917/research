alternatives_rejected:
  - item: retrain or alter the 7200 I0T0/I1T1 anchors
    because: >-
      the anchors are reused byte-for-byte; retraining would break the fixed
      reference and waste budget.
  - item: run N=900
    because: >-
      two consecutive data doublings over 1800-3600-7200 already resolve the
      local curve; N=900 is explicitly out of scope even if the plot is pretty.
  - item: run seed2 / seed3
    because: >-
      the maximum is two seeds at this stage; the two-seed replication is
      already unambiguous.
  - item: retune LR / weight decay / batch / scheduler / patience / max steps
      for small N
    because: >-
      the audit measures the effect of sample count under one canonical recipe;
      retuning would confound sample size with optimization.
  - item: compare against CIN / GIN / GCN or any external reference
    because: >-
      this is a within-family sample-efficiency audit; cross-family comparison
      needs its own pre-registered design and would add confounds.
  - item: fit a 3-parameter power law and report a scaling exponent
    because: >-
      three sample sizes make any asymptotic-floor fit unstable; the primary
      quantity is the measured MAE gained per data doubling.
  - item: report soup as a new method contribution
    because: >-
      soup is a fixed checkpoint-selection-noise-reduced measurement channel,
      not a research object.
  - item: add structural features / capacity / attention / message passing to
      rescue the gap
    because: >-
      a steep learning curve says the family is data-limited; it does not
      authorize reopening the closed missing-information NO-GOs.
  - item: treat the strong doubling gain as proof that more data closes the
      0.02 benchmark gap
    because: >-
      doubling gains generally diminish and cross-model protocols are not
      unified; this is a within-family local measurement.
consequences:
  - >-
    authorized_for_design=true with hypothesis_family=sample_efficiency_inductive_bias
    and full_training_authorized=false: future architecture candidates must
    explain why existing structural information is easier to use from fewer
    samples (parameter sharing, reusable composition, constrained interaction
    structure, factorized functional form) rather than adding information or
    capacity.
  - >-
    The next research budget should target sample efficiency, e.g. compare a new
    candidate E_new(3600) against the current E_current(7200) under the same
    frozen split and probe.
  - >-
    Outputs under results/inductive_bias_sample_efficiency_audit/ (protocol and
    architecture locks, split inventory, nested subset lock, anchor compatibility,
    seed lock, decision thresholds, integrity gates, per-stage JSON/decisions,
    learning-curve CSVs, doubling-gain and paired-bootstrap summaries, compute
    audit, final decision, Q1-Q20, curves, snapshots, soup states, 4 figures) and
    notes/inductive_bias_sample_efficiency_audit.md.
revisit_if: >-
  A new pre-registered architecture hypothesis has a sample-efficiency mechanism
  and a frozen same-subset / same-probe / same-step protocol; only then may a
  targeted E_new(3600) vs E_current(7200) test be run. Do NOT run N=900, do NOT
  add seed2/seed3, do NOT reopen the closed representation NO-GOs, and never
  load official valid or official test without separate authorization.
