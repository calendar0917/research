decision_id: decision-e2e-dictenv-v0-stop-absolute-weak-20260924
created: '2026-09-24T00:00:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  Prior work had established that a reusable sparse pure-topology dictionary
  coordinate helps when localized into a frozen shared environment (FEC-D1:
  local binding supported, dictionary not specific versus PCA32), but had never
  asked whether the dictionary can be the ONLY fine-grained learned structural
  coordinate of the whole model.  E2E-DictEnv-v0 asked that end-to-end question
  and, crucially, whether the value is SPECIFIC by adding a parameter-identical
  dense tied control (z = phi @ Dbar on the same matrix) instead of a PCA arm.
protocol: >-
  Local-first implementation with targeted CPU tests, preregistration frozen
  before any run, then remote A100 execution.  Architecture: only coordinate
  phi65; no message passing, recurrence, pair->centre, relation refresh,
  attention, context writeback, typed/parent lookup, FEC-S1 146->214->24
  adapter, patch_cont in the model, graph-level dictionary residual or
  pair-kernel dictionary side channel.  Frozen: K=32, s=8, IHT=10, r_atom=64,
  r_bond=16, env MLP 86->329->48 SiLU, exact FEC-S1 strict-static backend
  (15359 params), total 66158.  Training: Adam 1e-3, wd 1e-5, batch 128,
  L1 + lambda_rec * normalised reconstruction, clip 5, no scheduler, 240
  epochs, no early termination, fixed Top-5 soup, seed 0; lambda_rec =
  135.834921 calibrated once at Sparse init on the first 512 train molecules
  and frozen for both arms.  Gate 0 G0..G12 all PASS.  The pre-registered
  Stage-1 train-only smoke failed its atoms_active sub-gate (23/32 < 24/32) and
  was treated as passed under explicit user authorisation (Amendment A1); all
  other Stage-1 sub-gates passed.  Both arms ran sequentially on GPU1 (GPU0
  occupied by a foreign job), commit eeeb6b34f641260a0373a3daeda1286a855717d7.
  Official train 10000 / official valid 1000; official test never loaded.
