decision: >-
  STOP E2E-DictEnv-v0 with frozen verdict E2E_DICTENV_ABSOLUTE_WEAK (case D:
  M_S > 0.145).  Do NOT run seed 1, do NOT sweep K / s / IHT steps / LISTA /
  dictionary count / decoder / attention / LayerNorm / lambda / epochs / reader
  width, and do NOT reinterpret the mechanism PASSes as an absolute success.
  The mechanism/specificity half of the hypothesis is durably established and
  should be carried forward; the absolute-strength half is not.
because: >-
  Every mechanism gate passed and the specific contrast is large: the matched
  dense tied coordinate is 2.15x worse (G_sparse = +0.167539, ~56x the gate),
  neutralising the dictionary coordinate destroys the model (G_dict-use =
  +0.854839), assignment shuffle degrades it robustly across five permutations
  (G_assign = +0.017289), and the trained dictionary is healthy (27/32 active,
  effective 13.89, exact top-8, usage Spearman 0.998, rank 10.83, D moved far
  from the K-SVD init).  But the pre-registered PRIMARY criterion is the
  absolute band, and M_S = 0.145508 is above the frozen 0.145 viable boundary
  (and 0.015086 above the FEC-S1 anchor), so the architecture does not reach
  the viable band.  Two honest caveats are recorded rather than resolved: the
  Stage-1 atoms_active sub-gate failed (23/32) and was waived by explicit user
  authorisation, retrospectively justified because the fully trained soup
  reaches 27/32; and the single-seed GPU protocol is seeded but not
  bit-deterministic, so the 0.0005 band margin is inside execution noise even
  though the mechanism contrasts are far outside it.  Stopping, rather than
  buying seed 1 or widening the architecture, preserves the confirmatory status
  of the mechanism finding and leaves the absolute-strength question to a new
  preregistration.
alternatives_rejected:
  - >-
    Buying seed 1 or a paired seed set to move M_S across the 0.145 boundary.
    Rejected: the preregistration fixes a single seed and forbids seed 1; the
    band label must not be selected by extra draws.
  - >-
    Reporting dictionary-specificity as overall success because G_sparse,
    G_dict-use and G_assign all passed.  Rejected: the frozen table separates
    mechanism from absolute performance; case D is a stop regardless of the
    mechanism gates.
  - >-
    Rescuing the absolute number with a deeper environment decoder, wider
    reader, attention, LayerNorm, a larger K, or a lambda/epoch change.
    Rejected: all are explicitly forbidden rescues.
  - >-
    Reinterpreting the waived Stage-1 sub-gate as a genuine collapse and
    discarding the formal runs.  Rejected: the trained soup has 27/32 active
    atoms, so the smoke value was a 512-molecule/3-epoch transient; the waiver
    is recorded and the original failing value is preserved in smoke_gate.json.
revisit_if: >-
  A new preregistration either (a) stabilises the execution regime
  (deterministic scatter) or budgets a small paired seed set to resolve the
  weak-vs-viable band label at the 0.145 boundary - the label, not a rescue;
  (b) asks why the parameter-identical dense tied coordinate collapses
  (M_D = 0.313 with near-perfect reconstruction) so the value of sparse
  selection over a dense linear code is characterised directly; or (c) lifts
  the confirmed sparse dictionary core onto a different, stronger composition
  backbone as a new architecture question.  None of these is authorized by this
  round.
