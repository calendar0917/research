alternatives_rejected:
  - item: authorize a token-support architecture now
    because: >-
      token passes G1, G3 and G4 but fails G2 (rho < +0.15); the protocol labels
      this NON-ROBUST ASSOCIATION and does not authorize architecture on it.
  - item: claim Case E from the powered secondary coarse-key well-covered subset
    because: >-
      the well-covered subset must be defined on the pre-registered primary
      typed-endpoint relation key; using the coarser key would loosen the unseen
      definition, which the protocol prohibits.
  - item: loosen the unseen definition to make the primary stress test powered
    because: >-
      the protocol explicitly forbids rescuing an underpowered stress test by
      loosening the unseen definition; it requires honest reporting.
  - item: treat whole-molecule neighbour density as the mechanism
    because: >-
      its size-adjusted beta1 CI crosses zero in both doublings; the molecule-size
      proxy (atom count) is the confound.
  - item: reduce the size controls to C1 only despite the exact collinearity
    because: >-
      C2 is retained as the protocol-mandated second control even though
      relation_count == C(atom_count, 2) makes it a deterministic function of C1.
  - item: reopen old structural/representation NO-GOs
    because: >-
      this audit adds no evidence that changes their premises; it does not cleanly
      reject the coverage explanation on the primary key.
  - item: open official valid or official test
    because: >-
      both are hard-locked for this audit and no evaluation is authorized.
consequences:
  - >-
    No new architecture or full-training run is authorized for the
    sample-efficiency gap. The old NO-GOs remain binding.
  - >-
    The strongest partial signal is token support, but it is non-robust on the
    continuous association measure; whole-molecule density is size-confounded;
    relation-context support is regime-specific.
  - >-
    A Case E candidate (basic structural coverage insufficient) is documented via
    the non-authoritative coarser-key diagnostic and the Q1 retention, to be
    confirmed only after a properly powered primary-key stress test.
  - >-
    Outputs committed under results/sample_efficiency_gain_localization/,
    notes/sample_efficiency_gain_localization_audit.md (30 sections),
    tests/test_sample_efficiency_gain_localization_audit.py (17 pass).
revisit_if: >-
  (1) A larger probe or a pre-registered coarser primary relation key makes the
  primary WELL_COVERED stress test powered (n >= 200). (2) A pre-registered
  continuous support statistic with a more monotone relationship to gain
  re-examines whether the token association is genuinely non-robust. (3) An
  independent larger training-size sweep confirms the observed threshold shape is
  not a finite-sample artifact. Do NOT authorize architecture training before
  (1)-(3); do NOT loosen the primary unseen definition; never load official test.
