kind: decision
study_id: zinc-context-gap
decision: >-
  Execute the pre-registered Sample-Efficiency Gain Localization Audit and register
  the verdict Decision Case H: SAMPLE-EFFICIENCY GAIN LOCALIZATION INCONCLUSIVE.
  Do NOT authorize any new architecture or full-training run. The pre-registered
  strong gate is not passed by any target-independent support family, and the
  primary WELL_COVERED stress test is underpowered. Old NO-GOs remain binding.
why_this_experiment: >-
  The prior inductive-bias & sample-efficiency audit (Case A,
  STRONG_WITHIN_FAMILY_DATA_LIMITED_REGIME) established a roughly constant
  ~+0.05 MAE gain per data doubling on the frozen compact-v4-smallhead. The open
  question was which target-independent dimension of training-set support growth
  (token support, relation-context support, whole-molecule neighbour density, or
  a size confound) is associated with that gain. This audit answers it with a
  zero-new-training protocol: a target-free Phase U support inventory, hash-locked
  before any gain read, followed by a Phase Y gain-association analysis.
protocol: >-
  Phase firewall: target/prediction access is blocked until the Phase U support
  table and quartiles are hash-locked (target_used = false, prediction_used =
  false); official non-train splits are blocked at the loader level. Support uses
  document frequency over unique training molecules. Primary token key = historical
  typed_certificate. Primary relation key = canonical unordered typed-endpoint pair
  + exact integer shortest-path distance + adjacent bond (naturally discrete source
  fields only, no continuous binning). Secondary non-authoritative relation key =
  parent-endpoint pair + distance + adjacent bond. Neighbour density = frozen
  PATCH_FULL distance to k = 8 nearest D_N molecules, with the 7200-frozen
  normalization never refit per N. Size controls C1 = log(1+atom_count),
  C2 = log(1+relation_count). Deficiency D = (z(unseen) + z(rare) -
  z(meanlogdf))/3 equal-weight, z-scored within each N on the 2000 probe. Gains
  g(i) = |y_i - yhat_N(i)| - |y_i - yhat_2N(i)| on the two-seed SOUP estimator,
  RAW as robustness. All bootstraps B = 2000, seed 20261006; the old bootstrap
  provenance is reconciled with its own seed 20260912.
