revisit_if: 'A new preregistration (a) gives the interface-collision idea a different
  testable form (e.g. a parameter-matched redistribution of the +12k parameters, or
  joint endpoint conditioning at a different interface such as into the pair encoder or
  the distance gate) AND (b) first gives the C base the line''s paired two-seed
  same-round control with a stated precision target, since C itself is still only a
  single-seed directional lead; any purchase keeps the frozen basis/access, the verified
  init identity, the no-write-back guarantee and the one-shot terminal.'
