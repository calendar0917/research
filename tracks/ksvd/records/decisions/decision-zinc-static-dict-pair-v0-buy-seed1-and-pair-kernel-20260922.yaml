decision_id: decision-zinc-static-dict-pair-v0-buy-seed1-and-pair-kernel-20260922
created: '2026-09-22T00:00:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  The research direction is to stop detached statistics-then-MLP pipelines and
  learn an end-to-end structural representation without any learned message
  passing. The prior PSD-v0 and GSCN-v0 rounds rejected raw pair-state encoders
  and dictionary-core transitions, but they were tested without a modern,
  strongly-trained strict-static patch-pair baseline and without a
  parameter-matched generic dense control. This round isolated one minimal
  falsifiable question: on such a baseline, does a residual learnable dictionary
  beat a parameter-matched generic residual adapter?
protocol: >-
  Local-first implementation with targeted CPU tests, then remote A100 execution
  under the remote-research-runner workflow. Preregistration and implementation
  commit 033c1b6. Official ZINC train 10000 / official valid 1000, seed 0,
  inherited optimized protocol (Adam 1e-3, wd 1e-5, batch 128, 240 epochs,
  patience 40, no scheduler, L1, clip 5.0, best official-valid checkpoint), and
  a corroborating fixed Top-5 weight soup. S0 is the strict-static
  compact-v4-smallhead backbone (center_context=False, center_update=None,
  302D runtime representation, small raw head 302->13->13->1). S-Dict adds a
  residual dictionary (K=64, d=32, forward-normalized atoms, tau init 0.20,
  gamma init 0.1) on the local encoder output with no zero-init final
  projection. S-Dense adds a parameter-matched Linear(48,53)->SiLU->Linear(53,48)
  residual (5,189 vs 5,201 params, 0.23 % mismatch) with bit-identical shared
  tensors. Exactly three seed-0 full runs were purchased: S0 GPU0 first, then
  S-Dense GPU0 and S-Dict GPU1 in parallel. Official test never loaded.
