decision: >-
  Buy one paired seed-1 confirmation AND implement the occurrence-level
  dictionary-conditioned pair kernel in the next stage, under a new
  preregistration. Keep the current round closed at exactly three seed-0 runs.
because: >-
  Both the primary best-checkpoint metric and the corroborating Top-5 soup
  satisfy the pre-registered Case-A gate (M0 - MK >= 0.004 and MD - MK >= 0.002),
  while the matched generic dense adapter gives no gain over S0 on either
  metric. The dictionary is verifiably active (64/64 atoms, effective count 8.13,
  gamma 0.1 -> 0.184, inference ablation mean shift 0.304) and the strict-static
  contract, bit-identical initialization matching and step-0 gradient viability
  all pass. However the evidence is single-seed and the effect is near the
  training-noise scale, with the gain concentrated in a late noisy plateau and
  unequal optimizer steps across arms, so a paired seed-1 confirmation is
  required before any stronger claim. This is a qualified Case A, not a
  definitive success.
alternatives_rejected:
  - >-
    Claiming a definitive dictionary advantage from seed 0 alone. Rejected: the
    per-epoch valid-MAE noise is comparable to the effect and S-Dict used more
    optimizer steps than the early-stopped arms.
  - >-
    Concluding GENERAL_CAPACITY_SIGNAL from the failed dense control. Rejected:
    the dense control did not beat S0, and both primary and soup show a
    dictionary-specific gap above the 0.002 gate.
  - >-
    Running a sparsity / temperature / K / width sweep to stabilize the effect
    in this round. Rejected: the round forbids HPO and the preregistered gate
    already fired.
  - >-
    Using the historical compact-v4 baseline (center_context=True) as the
    strict-static S0. Rejected: it contains pair -> centre/patch feedback and is
    therefore not strict-static.
revisit_if: >-
  A paired seed-1 run shows MD - MK < 0.002 (effect not stable across seeds), or
  a seed-1 S0/S-Dense run changes the baseline enough that the Case-A gate no
  longer fires. Also revisit if the next round's occurrence-level
  dictionary-conditioned pair kernel cannot recover the residual-adapter gain
  with the same strict-static contract.
