decision: >-
  STOP after Stage A failure. PRE does not materially outperform matched POST,
  and the PRE-SHUFFLE intervention is negligible. The pair branch has additive
  predictive value versus BASE, but the causal early-versus-late nonlinearity
  hypothesis is not supported.
alternatives_rejected:
  - item: Run paired seed 1
    because: >-
      The preregistered failure rule fires directly: delta_place 0.000815183
      and delta_shuffle 0.000337422 are both below 0.005.
  - item: Proceed to Stage B PRE-E2E or POST-E2E
    because: >-
      Stage B requires a Stage-A pass; continuing would violate the frozen gate.
  - item: Open official-valid or official-test data
    because: >-
      Stage A failed and no official route is authorized. Official test remained
      blocked throughout.
  - item: Claim that global C^T R C early aggregation is proven as the primary bottleneck
    because: >-
      PRE did not beat POST, so this specific one-level placement intervention
      does not identify early global pooling as the causal explanation.
consequences:
  - >-
    TCCD-v5 ends at the frozen Stage-A screen; no Stage-B E2E artifacts,
    vocabulary diagnostics, official-valid run, or official-test evaluation.
  - >-
    The result supports pair-branch usefulness versus BASE but not the claim
    that nonlinear interpretation must occur before global pair aggregation.
  - >-
    Center-preserving composition is the next justified hypothesis, but it
    requires a new preregistration and matched controls before execution.
next_action: >-
  NONE auto-authorized. Draft a new preregistration only if continuing to
  center-preserving occurrence composition; keep official test closed.
revisit_if: >-
  A new preregistration retains centre identity through pair interactions and
  defines matched capacity, batching, shuffle, and no-leakage controls.
