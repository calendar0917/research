decision_id: decision-tccd-v5-stop-stage-a-pair-placement-20260922
created: '2026-09-22T00:00:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  TCCD-v4 showed that adding a parameter-free normalized S^2 moment did not
  rescue the TCCD-v2 ceiling. TCCD-v5 therefore tested one and only one
  aggregation-order variable: PRE E[phi(p_ij)] versus matched POST
  phi(E[p_ij]) over the same unordered prototype-labelled occurrence pairs.
protocol: >-
  GPU1-only remote A100 execution; seed 0; fixed internal 8000/2000 split;
  exact TCCD-v2 PrototypeREL checkpoint and mechanics; five exact frozen
  relations; all unordered i<j pairs; symmetric descriptor [c_i+c_j,
  |c_i-c_j|, c_i*c_j, r_ij] of width 197; matched
  Linear(197,64)-ReLU-Linear(64,16) pair MLP; identical reader and optimizer;
  PRE-SHUFFLE changed only the new pair branch; official test frozen.
