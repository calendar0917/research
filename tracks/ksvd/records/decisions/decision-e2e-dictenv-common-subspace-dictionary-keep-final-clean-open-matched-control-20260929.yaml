decision_id: decision-e2e-dictenv-common-subspace-dictionary-keep-final-clean-open-matched-control-20260929
created: '2026-09-29T00:00:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  The closed audit round localised the sparse-dictionary specificity problem
  to two structural causes: a near-universal DC/scale triplet (atoms 6/24/27
  active in 100 % of rows and 0.76-0.98 aligned with the train mean
  direction) plus a PC1-like atom 23, and a near-linear sparse/dense
  equivalence.  It recorded the next-round shape: remove the DC-triplet
  redundancy (or test the sparse arm on a phi65 variant not dominated by one
  DC direction) without changing anything else.  This round executed the
  first of those shapes as a representation-only question: if the common
  structural direction is modelled explicitly (dense c = U^T x, never
  dropped) and the sparse dictionary only ever sees the residual
  r = (I - U U^T) x, does the dictionary become a cleaner cross-graph
  reusable factor vocabulary?
protocol: >-
  Local CPU only (CUDA_VISIBLE_DEVICES="", no GPU/SSH), preregistration
  sha256 8e722afbc757... and implementation frozen at commit 5f0f284 before
  the first Stage-A process.  Stage A: real pipeline feature-space audit
  (train 231664x65, valid 23083x65, cache == data.dict_phi bit-identical,
  zero columns retained).  Stage B: train-only common subspace q1 (mean
  direction) and q2 (orthogonalised PC1 of r1) with frozen RMS scaling.
  Stage C: zero-training same-D probe across the three reused C6 soup
  dictionaries with four descriptor variants (RAW / mean-centred diagnostic /
  Q1 / Q2), frozen conditions A/B/C/D2 and a representation-only selection
  rule (valid primary).  Stage D: CSSD architecture - projected dictionary
  Dbar_perp = colnorm((I-UU^T) D_raw) enforced every forward, IHT-10 always
  receives the residual, z = [c~; alpha_res] of width 32+q, node/edge binding
  forms unchanged, widened rows zero-initialised.  Stage E: 24 focused tests
  including bit-equivalence with the frozen audit training loop.  Stage F:
  exactly one new trajectory (CSSD q1 seed 0, epochs 1 -> 40 -> 320, one
  optimizer state) with an in-process epoch-40 gate.  Stage G: frozen
  reusable-structure audit (usage, coverage, SMD specialization, common
  coordinate correlations, sparse<->dense recoverability) plus post-hoc
  descriptive graph-reuse / geometry / reverse-recoverability / profile
  diversity tables.  Official ZINC test never loaded.
