decision: >-
  1. KEEP FINAL-CLEAN as the line's reference model; CSSD q1 is adopted only
  as a supported exploratory variant (single seed, task-neutral, no
  demonstrated representation distinctness).  2. The common-subspace
  hypothesis is supported for dictionary structure: the frozen selection
  fired on 3/3 reused dictionaries, the epoch-40 gate passed, and the trained
  dictionary improves on every frozen structure metric while the soup MAE
  stays inside the neutral band.  3. No architecture adoption and no further
  training in this round.  4. The next round shape is a matched-capacity
  design (CSSD q1 vs DenseTied at 97727 params, >= 3 seeds, identical soup
  protocol) with usage-structure metrics preregistered as gates.
alternatives_rejected:
  - >-
    Adopting CSSD q1 as the new FINAL-CLEAN.  Rejected: task-neutral on one
    seed, +240 parameters, no matched dense control.
  - >-
    Running CSSD seed 1/2 or a second q to firm up the gain.  Rejected: the
    round is frozen at one trajectory; seed noise belongs to a new round.
  - >-
    Buying a DenseTied full run now for a like-for-like comparison.
    Rejected: it is a second training process and the historical 0.125563 is
    not matched; it belongs to the next preregistration.
  - >-
    Reporting the tiny residual reconstruction term as a task improvement.
    Rejected: the soup is +0.0015 worse than the reference; reconstruction is
    a diagnostic.
  - >-
    Reading the usage-structure gain as a new representation.  Rejected:
    recovery directions (0.9704 / 0.9813) and unchanged profile diversity
    leave Claim B open.
  - >-
    Dropping the nine identically-zero descriptors or editing the frozen
    phi65 layout.  Rejected: layout frozen; defect recorded only.
revisit_if: >-
  A new preregistration is written with a matched-capacity design: CSSD q1
  (97727 params) vs DenseTied at the same parameter count, >= 3 seeds, same
  soup protocol, and the usage-structure metrics (effective atoms per graph,
  minimum graph coverage, coherence max, top-5 share, atoms above 0.95) as
  frozen gates.  Secondary: cross-seed Hungarian alignment of CSSD atoms to
  test whether the rare specialists replicate; an ablation that keeps c1 in
  the reconstruction term but removes it from the binding (separating extra
  width from extra information); a q2 arm only if a new representation-level
  reason appears (q2 keeps too little centred variation and is not authorised
  here).
