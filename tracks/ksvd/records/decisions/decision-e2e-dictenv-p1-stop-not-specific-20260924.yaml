decision_id: decision-e2e-dictenv-p1-stop-not-specific-20260924
created: '2026-09-24T09:35:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  E2E-DictEnv-v0 established a dictionary-specific but absolute-weak no-message-
  passing environment (M_S = 0.145508); T1 showed the 0.145 ceiling was an
  INTERFACE property and could be relieved (0.125765) only by exposing the exact
  146-D FEC-S0 coarse chemistry beside the dictionary code, which made the
  dictionary non-load-bearing (G_zero 0.0179, G_node 0.0076).  The open question
  was whether a dictionary-core environment can be BOTH absolute-strong AND
  genuinely load-bearing once every coarse-chemistry bypass is deleted.  P1
  answered it with a primitive-only architecture whose only learned chemistry
  path is the dictionary code, and with the mechanism gates as the
  pre-registered primary criterion.
protocol: >-
  Local-first implementation with targeted CPU tests, preregistration frozen
  before any run, then remote A100 execution under the remote-research-runner
  workflow (preflight -> deploy -> env cache -> correctness -> GPU smoke ->
  formal run -> freeze -> terminal test) at formal-run commit 684675f and
  terminal-test commit e16ac15.  Frozen backend identical to v0/T1 (phi65
  FSAR-R2-AR0, K=32, s=8, 10 unrolled tied-IHT steps, SDB-v0 K-SVD D init,
  tied encode/reconstruct, task-coupled D, no message passing / recurrence /
  attention / pair->centre / relation refresh / typed lookup).  New primitive-only
  local core: 62-D anchor p_i, node binding A_i in R^288, edge binding E_i in
  R^288, z_i in R^638 -> SiLU MLP 638->102->48, 15-D pure-topology pair relation;
  97,865 parameters; lambda_rec 33.95873017865987; horizon 240; Adam 1e-3,
  wd 1e-5, batch 128, clip 5, seed 0.  Pre-registered order: correctness, smoke,
  formal Sparse seed 0, mechanism + health, GO gate, matched DenseTied control,
  seed-1 pair only if the specificity gate passed, freeze, terminal reporting-
  only test.  Remote A100 GPU0 was occupied by a foreign ~37 GB / ~91% job, so
  every formal run used GPU1.
