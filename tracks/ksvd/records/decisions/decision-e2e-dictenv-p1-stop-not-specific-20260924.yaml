decision: >-
  STOP E2E-DictEnv-P1 with frozen verdict
  P1_CLEAN_ENVIRONMENT_VIABLE_BUT_DICTIONARY_NOT_SPECIFIC (pre-registered
  case D).  Record both halves honestly: the primitive-only clean environment is
  absolute-strong and genuinely dictionary-load-bearing - which answers the T1
  question and shows the T1 mechanism loss was a coarse-interface property, not
  a dictionary-core weakness - but the sparse dictionary is NOT demonstrated
  specific, because the parameter-identical dense tied coordinate matches it on
  valid and beats it on test.  Do NOT claim a dictionary-specificity success, do
  NOT reinterpret the v0 improvement (+0.0135) as a dictionary win, and buy no
  rescue.  seed 1 is NOT purchased (specificity gate failed), and no K/s/IHT/
  LISTA/dictionary-count/attention/MP/recurrence/reader/optimizer/lambda/horizon
  change, no new relation block, and no re-read of the test are authorised by
  this round.  Any next step requires a new preregistration.
because: >-
  The mechanism layer, which the pre-registered decision order places first,
  passes decisively and reverses T1: zeroing the dictionary coordinate costs
  G_zero = +0.347116 (T1 +0.017903, v0 +0.854839), the node-assignment shuffle
  costs G_node = +0.013124 (clears the 0.010 gate that T1 missed at +0.007628),
  and the combined shuffle costs G_all = +0.072999; health passes every gate.
  With every coarse-chemistry pathway deleted, the only learned chemistry input
  is the bound dictionary code, so its removal is now destructive.  The absolute
  band is also strong (soup 0.131975, <= 0.135), materially better than v0
  (0.145508) and level with the FEC-S1 anchor (0.130422), confirming that the
  0.145 ceiling was an interface property.  However the pre-registered
  specificity step fails: the matched DenseTied control (same 97,865 parameters,
  only the coding operator changed) reaches soup valid 0.134534, so
  G_specific = 0.002559 < 0.003, and the terminal test reverses the sign
  (DenseTied 0.101661 vs Sparse 0.107593).  The correct reading is therefore
  narrow and precise: the bound code is load-bearing, but its sparse discrete
  structure is not demonstrated to be what produces the accuracy.  Reporting the
  mechanism success alone would overstate the result; reporting only the
  not-specific failure would hide that a clean no-message-passing dictionary
  environment can be both strong and load-bearing.
alternatives_rejected:
  - >-
    Claiming a dictionary-core success because M_S = 0.131975 is in the strong
    band and all mechanism gates pass.  Rejected: the pre-registered order
    requires the matched-control specificity step, and it fails on valid and
    reverses on test.
  - >-
    Treating G_specific = 0.002559 as effectively passing because it is close to
    0.003 and directionally favourable.  Rejected: the gate is frozen at 0.003
    before the run, the margin is within GPU run-to-run scale, and the test
    reversal removes any claim to a robust specific advantage.
  - >-
    Buying seed 1 anyway to see whether the valid-side sign replicates.
    Rejected: forbidden by the frozen stop rule; the test reversal already
    indicates the sign is not stable.
  - >-
    Rescuing specificity post hoc (e.g. re-weighting sparsity, changing K/s/IHT,
    or adding a denser coordinate as a new arm).  Rejected: that is a new
    architecture question, not an authorised change, and would be selected on
    the same valid set.
revisit_if: >-
  A new preregistration asks whether the dense tied coordinate is doing the same
  work for a structural reason - e.g. an ablation that isolates the anchor +
  binding capacity from the code dictionary (bindings with the dictionary code
  replaced by a fixed random projection at matched parameters), or a
  pre-registered two-seed paired comparison whose success criterion is the
  matched-control margin rather than the absolute band.  Neither is authorised by
  E2E-DictEnv-P1.
