decision_id: decision-zinc-clean-mechanism-keep-c6-paired-paired-20260929
created: '2026-09-29T00:00:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  The clarity audit left one seed-0 CPU result: deleting the graph-level chemistry
  marginal plus four dormant statistic blocks IMPROVED the matched base (0.143298 ->
  0.128499). Two things were unknown and blocked any further work: (i) is the C6 removal
  stable across seeds or a seed-0 accident, and (ii) if the chemistry shortcut is gone,
  what carries the reader -- fine per-occurrence structure-semantic correspondence, or only
  shell marginals, and how much of the relation bundle is actually needed? A third,
  orthogonal question was whether the sparse dictionary coordinate code is specific
  against a matched dense-tied control once the architecture is clean.
protocol: >-
  Preregistration and frozen implementation before any training
  (notes/e2e_dictenv_clean_mechanism_v1_preregistration.md, commits 19d69d2 / ace4187).
  CPU-only (CUDA_VISIBLE_DEVICES="", no GPU/SSH), 3 processes x 4 threads, matched
  protocol: official ZINC 10000/1000, Adam 1e-3 / wd 1e-5, batch 128, clip 5.0, 320
  epochs, Top-5 soup, matched init/data order per seed; official test never loaded.
  Stage A: BASE vs C6 seeds 1,2 (seed 0 reused bit-exactly), frozen 3-seed gate.
  Stage B: the full frozen clarity-audit probe registry re-run on every BASE/C6 checkpoint
  in two views (own mask, identity). Stage C: analytic assignment-independence nulls --
  frozen distribution-preserving replacement on the trained checkpoints, 20-epoch
  warm-start adaptations against a matched continuation control, and from-scratch 320-epoch
  controls, with frozen adoption rules. Stage D: relation provenance re-verification, a
  20-epoch screen of two nested candidates, then one 320-epoch run of the simplest
  survivor. Stage F: matched DenseTied vs sparse on the final clean architecture.
  Stage E deliberately not run.
