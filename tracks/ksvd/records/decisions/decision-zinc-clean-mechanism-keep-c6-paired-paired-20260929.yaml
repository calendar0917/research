decision: >-
  Keep C6 as CLEAN_BASE and adopt it as FINAL-CLEAN with paired node binding, paired edge
  binding and sparse tied-IHT coding; keep the full relation bundle
  (distance + overlap + boundary). Do not run any sparse-specificity confirmatory round,
  any relation simplification, any independence-null adoption, or Stage E. The next round,
  if any, must be a NEW preregistration about the concentration of the sparse code.
because: >-
  Q1: C6 costs nothing on every matched seed (max delta -0.000116) and passes the frozen
  gate; the honest reason is safety/stability, since the mean gain is carried by the BASE
  seed-0 outlier. Q2: both roles read fine correspondence and the effect is larger in C6
  than in BASE; the from-scratch controls fail adoption (node max +0.00925 > 0.005, edge
  mean +0.00755 > 0.003), so marginal-only bindings would lose real accuracy, most clearly
  in the edge channel. Q3: distance-only costs +0.005661 at the full horizon
  (inconclusive-keep-full), so the preregistered minimal supported relation is the full
  bundle. Q4: the matched dense control is not worse (it is marginally better), so sparse
  specificity cannot be claimed and no confirmatory spend is justified.
alternatives_rejected:
  - >-
    Adopting node independence from the 2/3 near-zero seeds. Rejected: the frozen rule
    requires max <= 0.005 and seed 2 costs +0.00925.
  - >-
    Falling back to C1 after the initial harness bug made gate A see only seed 0. Rejected:
    the fix was a lookup defect; the wave-1 runs were valid and the corrected 3-seed gate
    is STRONG_SUPPORT.
  - >-
    Adopting distance-only relation from the 20-epoch screen. Rejected: the prescribed
    320-epoch run is +0.005661 (INCONCLUSIVE_KEEP_FULL).
  - >-
    Extending dense seeds on a negative G_dict or re-running with a different threshold.
    Rejected: the gate is frozen and only licenses extension on G_dict >= +0.003.
  - >-
    Running Stage E because the round had CPU budget left. Rejected: its precondition
    (NODE-INDEP supported) is unmet.
revisit_if: >-
  A new preregistration targets the observed code concentration (top-5 atoms carry
  ~4.4-5.0 of the 8 activations per row; one atom active in nearly every row) and asks
  whether rebalancing or regularizing the coordinate usage changes the Sparse/DenseTied
  comparison, with the matched dense control and at least three seeds. Secondary: a 4th C6
  seed would pin down the near-threshold spread (range 0.014683 vs the 0.015 threshold) if
  a future claim needs tighter stability.
