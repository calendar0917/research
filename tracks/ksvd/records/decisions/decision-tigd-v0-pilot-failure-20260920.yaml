revisit_if: >-
  A revised graph-space dictionary object is pre-registered that (a) constrains
  or anchors the graph-specific transport so it cannot reshuffle endpoints for
  free, (b) breaks the transport-structure symmetry (stronger/coupled
  structural term or a transport prior tied to the real incidence), (c) keeps
  the code non-degenerate without the forbidden ad-hoc sparse penalty (e.g. an
  entropic code regulariser), and (d) uses a converged entropic solver. Re-run
  the same permutation / rewiring / random / structure-off mechanism audit and
  require Delta_perm << Delta_rewire <= Delta_random, descending L_B, and
  original/random reconstruction separation *before* any task-driven or sparse
  graph-dictionary round. If a revised object still shows Delta_rewire ~=
  Delta_perm and code collapse, stop dictionary-as-primary-representation.
