decision: >-
  STOP after Stage A failure. The normalized two-hop aggregated moment does not
  materially overcome the TCCD-v2 ceiling under the frozen representation and
  matched topology-mismatch control.
alternatives_rejected:
  - item: Run the ambiguous paired reader seed
    because: >-
      The preregistered failure rule fires directly: delta_topo is
      0.0000068843 and delta_add is -0.0000134408, both below 0.005.
  - item: Proceed to end-to-end +2hop training
    because: >-
      Stage B is authorized only after a Stage-A pass; continuing would violate
      the frozen sequential gate.
  - item: Run S^3 or higher walk orders
    because: >-
      The protocol explicitly forbids three-hop after a two-hop failure.
  - item: Attribute the result to topology irrelevance
    because: >-
      Gate 0 shows exact, permutation-invariant and intervention-sensitive S^2
      algebra. The supported claim is only that this added aggregated moment is
      not practically useful beyond the current relations.
  - item: Open official-valid or official-test data
    because: >-
      The Stage-A failure provides no authorization; official test remained
      blocked throughout.
consequences:
  - >-
    TCCD-v4 ends at the frozen Stage-A screen; no Stage-B, Stage-C, or
    official-valid artifacts are valid or expected.
  - >-
    The leading next hypothesis is early occurrence aggregation / lossy C^T R C
    contraction, not insufficient walk order.
  - >-
    An occurrence-preserving prototype-labelled graph representation would be a
    separate future round and requires a new preregistration.
next_action: >-
  NONE auto-authorized. Do not run additional TCCD-v4 experiments. Keep the
  official test closed.
revisit_if: >-
  A new preregistration defines an occurrence-preserving representation and
  matched capacity controls before any formal experiment.
