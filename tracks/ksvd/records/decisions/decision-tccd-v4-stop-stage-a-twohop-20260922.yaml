decision_id: decision-tccd-v4-stop-stage-a-twohop-20260922
created: '2026-09-22T00:00:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  TCCD-v2 showed useful task-learned prototypes and assignment-sensitive C^T R C
  composition but remained far above the canonical GPU1 reference. TCCD-v3b
  showed that a stronger local state alone did not improve the frozen interface.
  TCCD-v4 preregistered one parameter-free normalized two-hop assembly moment
  plus a matched fixed-permutation topology control.
protocol: >-
  GPU1-only remote A100 execution; seed 0; fixed internal 8000/2000 split;
  exact TCCD-v2 PrototypeREL checkpoint and mechanics; S=D^-1/2 A D^-1/2 from
  native untyped adjacency with no self-loop; R2=S^2 including diagonal;
  REAL2/MIS2 matched feature width and reader parameters; official test frozen.
