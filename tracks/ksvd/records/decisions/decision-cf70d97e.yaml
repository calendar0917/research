revisit_if: 'A cheap read-only follow-up (new authorization) localises the missing
  information: (a) dev e_g component/channel structure (from a future round''s own
  saved per-row predictions), (b) the k=-2/-1 tail (is it the same conflict/uncovered
  structure -> then the Q route is formally closed with ~0 recoverable budget; or
  covered-but-unfitted classes -> at most a <=0.005 Q repair candidate, pre-warned
  by its single-row-dominated history), (c) k=0 e_g structure (concentrated subgroups
  like large molecules / |g| tails -> a consumer readout candidate under a new preregistration
  with the basis and its injection frozen; diffuse -> the interface family is near
  its data floor and the budget moves to the open whole-graph representation question).'
