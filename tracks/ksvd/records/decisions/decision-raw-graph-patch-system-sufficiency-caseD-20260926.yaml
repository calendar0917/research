decision: >-
  Execute the pre-registered zero-full-training Raw-Graph -> Patch-System
  Sufficiency Audit and register Decision Case D: CURRENT PRE-NEURAL PATCH
  SYSTEM SUFFICIENCY NOT REFUTED. On the official-train 10K molecules the
  complete model-accessible pre-neural signature P3 has ZERO raw-non-isomorphic
  collisions and empirical alias lower bound LB(P3) = 0.0 (< 0.002 material
  gate). The historical tokenizer alias is real at P0 (2 raw-non-isomorphic
  token-level classes, LB 7.95e-5) but is fully resolved by the continuous
  146D shell descriptor at P1. On the frozen target-independent 7200/2000/800
  split the current patch-system geometry is MORE target-local than both
  generic raw-graph references: eta(PATCH_FULL) = 0.5459 vs eta(RAW) = 0.6337,
  eta(WL) = 0.7455, eta(SP) = 0.6024; Delta_pre = -0.0878 (95% CI
  [-0.0999,-0.0748]), 800 replication -0.0909, both raw views and the
  collision metric agree. No representation-family redesign is authorized
  (top1_pre_neural_hypothesis.json authorized_for_design = false,
  full_training_authorized = false). Zero neural training; official valid and
  official test never loaded.
why_this_experiment: >-
  The previous stagewise audit began at X_patch, which is already a human
  structural abstraction, so it could not test the G_raw -> F_pre(G) boundary.
  Every local architectural patch on the compact-v4 line had already returned a
  clean or sub-threshold NO-GO, leaving the pre-neural abstraction as the only
  unaudited boundary that could explain a target-relevant information or
  geometry loss. The audit was therefore designed to either authorise one
  pre-neural representation-family redesign hypothesis or formally close the
  "where did information get lost?" line.
protocol: >-
  Phase H (hard aliasing, all 10K official train): progressive deterministic
  signatures P0 token multiset, P1 full patch-object system (token + parent +
  146D shell descriptor bytes), P2 canonical patch-relational object system
  (relation descriptor bytes + bucket + incidence), P3 P2 + 62D global + 25D
  topology. Canonicalisation = coloured-incidence pynauty certificate +
  canonical semantic colour sequence (exact coloured-graph invariant);
  permutation invariance and VF2 collision checks verified. Target-free
  signatures SHA-256 locked before LB. Phase S (soft locality): 7200 reference
  / 2000 primary / 800 replication official-train split; raw references =
  edge-aware typed 1-WL rounds 0..4 and typed shortest-path histogram; patch
  blocks B1 identity, B2 217D patch-descriptor sketch, B3 217D pair-relation
  sketch, B4 z-scored 87D global+topology; per-block random-pair median
  scaling; k=8; all neighbour manifests SHA-256 locked before targets.
  eta = V8/V_rand; Delta_pre = eta(PATCH_FULL)-eta(RAW); paired bootstrap
  B=2000 over query molecules.
