revisit_if: >-
  Revisit only with a new preregistration that (a) explains how it will close
  the measured generalisation gap (soup train 0.0912 vs valid 0.1823) rather
  than adding structure, (b) carries matched arms for any performance claim
  (dense/PCA node projection, random or shuffled dictionaries, no-relation
  variant) and paired seeds, and (c) states in advance which of the two
  questions it is buying — mechanism liveness (already established on seed 0)
  or absolute performance (this candidate failed at 0.182343).  A future round
  may legitimately reuse the proven-live relation channel as a building block
  inside a different backbone, but must not present that as a gain of this
  round.
study_id: zinc-context-gap
why_this_experiment: >-
  The previous round's Joint709 coordinate collapsed to the denormal floor and
  was inert at its endpoint, leaving the question "is a learnable static
  dictionary over local environments useful at all?" unanswered, and leaving the
  cluster's older absolute numbers (0.1198-0.1324) unexplained by any live
  mechanism.  This round asked a narrower, falsifiable question: with the
  dictionary entering the prediction in a *different* way — all 128 node
  coordinates kept (no top-k), environments shared within (molecule, atom type)
  and split into mu/delta, a single symmetric 228-D relation object per physical
  edge, one sparse relation dictionary and one graph readout — what is the
  absolute official-valid performance of one seed-0 candidate, and are the
  channels actually used?  Both questions were answered before any rescue was
  considered.
