protocol: >-
  Local CPU only (runtime.device=cpu, 8 threads), official ZINC train 10000 /
  official valid 1000, official test never instantiated.  Preregistration and
  code committed before the formal runs (a90584b + runner/report fixes
  f25984a / 934ed97 / cc4cf83 found by a two-epoch dry run); formal stages
  executed through the new control-plane runner
  `zinc_e2e_dictenv_hier_relation_v1` (prepare `20261001-173750-21b32689`
  scratch 30.9 s; screen `20261001-173831-2814f28e` 1328.3 s).  One candidate,
  seed 0, 320 epochs, batch 128, Adam lr 1e-3 / wd 1e-5 / clip 5.0, fixed LR,
  Top-5 soup by valid MAE, no early stop, no control arm, no sweep.  Separately:
  17 focused local tests, a correctness stage (all gates passed), a smoke stage
  (3 epochs on 2048/512) and a fixed-probe activity diagnostic at epochs
  0/5/20/80/160/240/320 that never updates parameters.
