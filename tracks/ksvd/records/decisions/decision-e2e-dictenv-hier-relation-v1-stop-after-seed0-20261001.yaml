decision: >-
  Stop the E2E-DictEnv-Hier-Relation-v1 candidate after seed 0
  (`HIERREL_STOP`).  Record the band result (soup official-valid MAE
  0.182343094, best 0.193210 @ 316, `stop` > 0.1233) and, separately, the
  mechanism result (relation code, node pooling, relation delta and endpoint
  pairing are all load-bearing: +0.473 / +0.645 / +0.230 / +0.206 / +0.200 MAE
  with prediction-RMS changes 0.11-0.62).  Do not retrain, do not seed 1, do not
  tune K / s / dropout / horizon / lambda for this candidate.  Treat the
  hierarchical static relation dictionary as a live mechanism with an
  unresolved generalisation gap (train 0.0912 vs valid 0.1823), not as a failed
  mechanism, and do not merge the two readings.
