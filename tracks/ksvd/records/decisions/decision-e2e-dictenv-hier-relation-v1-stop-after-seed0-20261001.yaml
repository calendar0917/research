alternatives_rejected:
- >-
  Buying a second seed for this candidate.  Rejected: the pre-registered
  absolute band returned `stop` (0.182343 versus a 0.1233 borderline edge), and
  the mechanism question was answered on seed 0 (all channels live, four orders
  of magnitude above the sensitivity floor), so a second seed would add a
  variance estimate for a configuration that is already 0.059 MAE out of band.
- >-
  Rescuing the run (larger node/relation K, different sparsity, more IHT steps,
  stacked relation layers, a second relation pass, an MLP endpoint encoder,
  refitting the frozen relation scaler, lowering dropout / raising weight decay,
  extending the horizon).  Rejected: every one of these is a new candidate, the
  pre-registration forbids them in this round, and the endpoint is not near the
  band edge where a small change could plausibly cross it.
- >-
  Building a matched control post hoc (dense/PCA node projection, random or
  shuffled dictionaries, no-relation arm) to reinterpret the 0.182343.  Rejected:
  post-hoc arms would not be pre-registered, could not be used as a performance
  comparison either way, and the round's question (absolute performance of the
  single frozen candidate) is already answered.
- >-
  Re-using the previous rounds' numbers (Joint709 0.132442, legacy A/B/C /
  Sem108 / RPD) as a control for this model.  Rejected: the architectures, input
  representations, parameter counts and inheritance differ; those numbers are
  background orientation only.
- >-
  Reading the positive intervention results as "the relation dictionary route
  works".  Rejected: they are sensitivity statements without a matched control
  and without a performance gain, and the band verdict is negative; both
  statements are reported separately.
because: >-
  The frozen candidate was implemented, gated, trained for the full 320 epochs
  on the official train split and evaluated once on the official valid split;
  the pre-registered band rule returned `stop`, so the configuration is closed.
  The mechanism diagnostics came out positive (unlike the previous round's
  inert coordinate), which makes the round scientifically informative without
  making it a success: sensitivity without absolute performance is exactly the
  case the preregistration required to be reported as two separate statements.
