decision: >-
  STOP SDPK-v0 after the single seed-0 run. Do NOT purchase seed 1, do NOT sweep
  K / rank / coord_dim / tau / pair width, do NOT add sparsity / entropy /
  orthogonality / reconstruction terms, do NOT add a second dictionary layer or
  a residual, do NOT add message passing or a dense pair-kernel control in this
  round. The round is closed with SDPK_V0_NO_STRONG_PERFORMANCE_SIGNAL.
because: >-
  The seed-0 top-5 soup improvement over the historical strict-static S0
  reference is +0.001059 and the best-checkpoint improvement is +0.003481, both
  below the pre-registered thresholds (soup delta >= 0.008, best delta >= 0.006,
  absolute soup <= 0.1328). SDPK soup 0.139735 is essentially on top of S0 seed-0
  soup 0.140794 and worse than S0 seed-1 soup 0.136423, i.e. no new band. The
  known S0 seed-to-seed movement (0.006285) is larger than the observed gain, so
  the effect is inside baseline variability. Importantly, this is not an inert
  mechanism: the dictionary is live and load-bearing at the best checkpoint
  (tau 0.20 -> 0.15, 43 argmax-used atoms, neutral-dictionary intervention shifts
  predictions by mean 0.059 / max 1.78 MAE), so promoting the dictionary into
  the pair kernel does not by itself add enough predictive information over the
  raw pair interaction. A greater-than-gate absolute effect is a prerequisite
  for spending further compute on mechanism controls, and it did not appear.
alternatives_rejected:
  - >-
    Buying seed 1 despite the failed seed-0 gate. Rejected: the gate is explicit
    and the primary metric is absolute soup, which is an order of magnitude
    below the required delta.
  - >-
    Sweeping K / rank / coord_dim / tau / pair width or adding a sparsity,
    entropy or orthogonality term to rescue the number. Rejected: forbidden by
    the preregistration; the clean negative is the result.
  - >-
    Adding a matched dense pair-kernel control. Rejected for this round: the
    round asks whether the architecture opens a new absolute band, not whether
    the dictionary beats generic capacity; a mechanism control is only worth
    buying after a materially positive absolute effect exists.
  - >-
    Reinterpreting the live dictionary diagnostics (entropy 2.25, 43 used atoms)
    as success. Rejected: assignment entropy is a reporting diagnostic, never a
    GO gate; absolute MAE is the first success criterion.
revisit_if: >-
  A future preregistered round first observes a greater-than-noise absolute
  strict-static improvement from some dictionary-conditioned mechanism, or a
  paired multi-seed baseline establishes a tighter S0 seed-0 reference and the
  SDPK soup lands materially below it. Only then does a matched dense
  pair-kernel control (dictionary vs generic capacity inside the pair kernel)
  become the justified next question. Gamma/residual-dictionary work remains
  closed.
