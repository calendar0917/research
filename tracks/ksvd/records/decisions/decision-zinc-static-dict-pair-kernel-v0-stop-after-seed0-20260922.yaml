decision_id: decision-zinc-static-dict-pair-kernel-v0-stop-after-seed0-20260922
created: '2026-09-22T00:00:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  The previous round showed that a learnable dictionary attached as a local
  residual adapter (h_i = h0_i + gamma * delta_dict) either works or is
  bypassed: in seed 1 gamma collapsed to ~0 and the dictionary became inert.
  This round deleted that concept entirely and asked the single
  performance-oriented question of whether promoting the dictionary to the core
  coordinate system of the occurrence-level static pair / relation kernel opens
  a new absolute strict-static ZINC band. The old "gamma collapse" question was
  explicitly out of scope and no ablation grid was authorized.
protocol: >-
  Local-first implementation with targeted CPU tests, then remote A100 execution
  under the remote-research-runner workflow. Preregistration and implementation
  commit f0a778dd07f5eeee4b2c8473115cdf980b45ac22. Frozen architecture: S0 local
  encoder unchanged (h_i = h0_i, no residual, no gamma), end-to-end dictionary
  K=64 / rank=32 / coord_dim=16 / tau_init=0.20, dictionary coordinates in an
  occurrence-level pair kernel with an occurrence-specific multiplicative gate
  and a 112D input to one static pair encoder (112 -> 64 -> 16), inherited
  302D invariant readout, topology hinge and small raw head 302 -> 13 -> 13 -> 1.
  Frozen training protocol: Adam, lr 1e-3, wd 1e-5, batch 128, L1/MAE, clip 5.0,
  no scheduler, full 240 epochs with no early termination, best-checkpoint and
  fixed Top-5 weight soup. One seed-0 full run on remote A100-SXM4-40GB GPU 0.
  Official ZINC train 10000 / official valid 1000; official test never loaded.
