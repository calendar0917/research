decision: >-
  STOP DTX-v0 after the two seed-0 runs, which are the round's entire budget. Do
  NOT purchase seed 1, do NOT sweep K / tau / cross width / topology features,
  do NOT add explicit ring inputs or ring dictionaries, do NOT add a second
  topology dictionary or a K^2 dictionary-pair matrix, do NOT reintroduce
  dictionary residuals into h_i, and do NOT rescue. The round is closed with
  NO_ALIGNED_CROSS_SIGNAL. Do not treat "the aligned statistic is load-bearing"
  as success. The ring-blind dictionary x generic-topology cross line is closed
  in its graph-level aligned form.
because: >-
  The preregistered Case D fired: Delta_align = M - A = -0.005330 (best) /
  -0.006027 (soup), so the aligned cross is not merely null but worse than the
  matched marginal-only control at equal budget, while the marginal control is
  itself non-degenerate (soup 0.144330 <= the 0.1450 safety line, so no
  base-regression confound; 0.0055 better than SRDA-v0 but 0.0035-0.0046 worse
  than S0 seed 0 and SDPK-v0). The mechanism is nevertheless fully alive: on the
  Arm A soup checkpoint, replacing J_align with J_indep costs +0.0184 MAE and
  shuffling s_i within graphs costs +0.0338 MAE, both far above the 0.010 / 20x
  noise gates; the role vector is strongly ring-relevant post-hoc
  (shell1_shell2_edge_density ring_any delta -0.271) and the dictionary learns
  ring-correlated atoms without any ring input. So the round answers its
  mechanism question ("the ring-blind aligned cross is real and used, and both
  marginals are individually informative") and still fails its causal question
  ("alignment beats the matched marginal control"): the marginal control already
  mixes every dictionary atom with every topology coordinate, and the
  within-graph pairing adds optimization burden / variance without a
  compensating signal. With absolute MAE as the first success criterion and the
  direction negative, there is no basis to spend further compute. The mixed
  dictionary health (effective atoms 2.5-2.9 of 64) is recorded as a caveat, not
  as a licence for a sweep.
alternatives_rejected:
  - >-
    Buying seed 1. Rejected: the preregistered case fired in the negative
    direction; the preregistration does not authorize seed 1 for Case D.
  - >-
    Sweeping K / tau / cross width / topology-feature set or adding
    entropy / sparsity / orthogonality regularizers to fix the concentrated
    dictionary and retest alignment. Rejected: forbidden by the preregistration;
    a sweep on top of a negative causal gate is not a scientific step, and the
    concentration caveat is recorded for a future independent round.
  - >-
    Adding explicit ring/cycle context (ring5/ring6/fused labels, ring
    dictionaries, cycle enumerations) into the cross branch to see whether
    "aligned but ring-aware" helps. Rejected: that abandons the round's
    ring-blind premise and needs a new preregistration with its own controls.
  - >-
    Rescuing with message passing / centre update / dictionary-to-local writeback
    so alignment can act locally rather than once at the graph level. Rejected:
    violates the strict-static contract; the graph-level sufficient-statistic
    question was the only one this round asked.
  - >-
    Reinterpreting "the aligned statistic is load-bearing" (interventions clear
    the gates) as a positive result. Rejected: mechanism liveness is a reporting
    diagnostic; the causal gate requires beating the matched marginal control,
    which Arm A does not.
  - >-
    Blaming the negative on the concentrated dictionary alone. Rejected as
    unsupported by this round's evidence: the marginal arm reaches its best MAE
    under the same concentration, so the aligned-vs-marginal contrast is not
    obviously explained by concentration; the honest statement is that richness
    of the dictionary was not separated from alignment value here.
revisit_if: >-
  A future preregistered round may revisit dictionary x topology alignment only
  if it (i) first establishes a richer, non-degenerate dictionary (effective
  atom count well above the 2.5-2.9 observed here) under a frozen, claim-bearing
  objective, and (ii) buys matched controls that separate "alignment value" from
  "dictionary richness" (e.g. marginal vs aligned at two different
  dictionary-entropy regimes, same backbone and budget). A graph-level aligned
  cross with a concentrated dictionary and a negative matched-control result is
  not worth another seed. The permanent, reusable findings from this round are:
  (a) the explicit cycle-rank coordinate in patch_cont is index 143 and can be
  deleted cleanly (dictionary_input_width 145) to make a dictionary query
  ring-blind; (b) a generic untyped radius-2 topology role of 8 bounded
  coordinates is strongly ring-relevant without any ring input; (c) a
  dictionary trained on ring-blind static descriptors learns ring-correlated
  atoms post-hoc. These are usable by other architectures under their own
  preregistrations.
