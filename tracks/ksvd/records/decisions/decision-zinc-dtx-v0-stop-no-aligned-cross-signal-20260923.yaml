decision_id: decision-zinc-dtx-v0-stop-no-aligned-cross-signal-20260923
created: '2026-09-23T00:00:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  Three earlier results framed the question. (a) SRDA-v0 showed the typed-token
  (16D) and parent (8D) identity channels are permanently deletable, and that a
  dictionary whose assignments define the pair algebra can be dominant yet
  regress absolute MAE. (b) SDPK-v0 showed a live dictionary-conditioned pair
  kernel still adds no absolute signal when it is layered on the raw pair
  interaction. (c) The mentor no-ring line showed explicit ring-context blocks
  carry signal but weaken the "self-discovery" hypothesis. DTX-v0 asked the
  remaining controlled question: if a ring-blind dictionary and a ring-blind,
  generic, untyped topology role are crossed with an ALIGNED joint statistic
  (J_align = mean_i alpha_i outer s_i) and compared against a matched
  marginal-only control (J_indep = mu_alpha outer mu_s) with everything else
  identical, does the within-graph alignment add value — without ever feeding
  ring/cycle context into the new branch?
protocol: >-
  Local-first implementation with 13 targeted CPU tests and a synthetic
  cycle-rank coordinate audit, then remote A100 execution under the
  remote-research-runner workflow (local Git as source of truth, deploy.sh,
  uv sync --frozen, research doctor, durable detached launch, pull_results.sh).
  Frozen architecture: standalone strict-static module; x_i = [patch_cont |
  patch_context] (146D); h_i = SiLU MLP(146 -> 64 -> 48); x_dict_i = patch_cont
  with the explicit cycle-rank coordinate 143 deleted (145D); z_dict_i =
  SiLU MLP(145 -> 64 -> 32); q_i = l2_normalize(z_dict_i); D_k =
  l2_normalize(dictionary_atom_k); tau = 0.05 + 0.95 sigmoid(tau_logit) init
  0.20; alpha_i = softmax(q_i D_norm^T / tau) (K = 64); ring-blind generic
  topology role s_i in R^8 from the untyped radius-2 induced patch; mu_alpha =
  mean_i alpha_i (64); mu_s = mean_i s_i (8); J_align = mean_i alpha_i outer
  s_i (512) vs J_indep = mu_alpha outer mu_s (512); e_cross = SiLU Linear(512 ->
  32); inherited raw S0 pair backbone u_i = pair_projection(h_i) 48 -> 16,
  pair_input = [u_i+u_j | |u_i-u_j| | (u_i*u_j)*gate | rel] (64), pair encoder
  64 -> 64 -> 16 evaluated once, 5-bucket pair pooling (165); R_final =
  [unary 97 | pair 165 | global 32 | topology hinge 8 | mu_alpha 64 | mu_s 8 |
  e_cross 32] = 406; head 406 -> 16 -> 16 -> 1; 60,442 params. Frozen protocol:
  Adam, lr 1e-3, wd 1e-5, batch 128, L1/MAE, clip 5.0, no scheduler, full 240
  epochs with no early termination, best checkpoint plus fixed Top-5 weight
  soup. Exactly two full runs: GPU0 MARGINAL seed 0, GPU1 ALIGNED seed 0, in
  parallel; deterministic algorithms on; official ZINC train 10000 / official
  valid 1000; official test never loaded.
