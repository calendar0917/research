decision_id: decision-e2e-dictenv-a2-lite-stop-no-confirmed-signal-at-32d-20260925
created: '2026-09-25T03:35:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  The user asked for a compute-budget contraction of the running round
  E2E-DictEnv-A2 (its parent preregistration 1813f53 is unchanged) and for the
  minimum paired experiment that answers one question: under the frozen
  exact-OMP code, does the real structure<->attribute pairing (REAL) carry task
  value over the assignment-independent control (INDEP)?  The parent round had
  already completed its identity gate (26/26), Gate-0 reproduction, the
  continuity-v2 diagnostic and its TOPO arm, but no REAL/INDEP prediction
  comparison existed anywhere (A1's decision.json records stage1_omp = null).
  The amendment therefore truncated the parent plan at that arm boundary and
  registered a separate minimum protocol (E2E-DictEnv-A2-Lite) with a 160-epoch
  two-arm screen and an optional cheap train-only PCA32 diagnostic.
protocol: >-
  Local-first implementation with targeted CPU tests (28 tests), amendment and
  lite modules frozen and committed (rules 457c276, boundary 02bc3f5, run
  4f184dd) before execution, then the remote-research-runner workflow on the
  shared A100 box: deploy of the committed revision, durable detached launch on
  physical GPU1 only (CUDA_VISIBLE_DEVICES=1, one CUDA process at a time,
  deterministic algorithms, CUBLAS_WORKSPACE_CONFIG=4096:8), await, pull,
  independent local recomputation.  Screen: REAL-OMP vs INDEP-OMP, 160 epochs,
  the frozen H1 trainer (seed 0, identical init/batch order/optimizer/lambda/
  Top-5 soup), frozen K=32/s=8 dictionaries and exact OMP codes reused
  bit-identically by reference (verify 3.0 s, no recomputation).  Dense control
  (only because the screen was not strong): REAL/INDEP-PCA32, train-only rank-32
  PCA via sdb_v0.fit_pca_rank, same horizon/trainer.  Official ZINC train 10000 /
  valid 1000, test never loaded.
