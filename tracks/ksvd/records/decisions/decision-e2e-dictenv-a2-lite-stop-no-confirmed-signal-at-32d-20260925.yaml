decision: >-
  STOP this round at the frozen label NO_ATTRIBUTED_CODE_FORMATION_SIGNAL_AT_32D
  and do not start any further stage automatically.  Do not treat the
  +0.005561 sparse direction as a qualified pairing signal, and do not treat the
  -0.001405 dense gap as a compression bottleneck.  The parent round stays
  COMPUTE-BUDGET-TRUNCATED with its 320-epoch Stage-1 REAL/INDEP arms NOT RUN;
  the frozen 0.003 gate of the parent protocol remains formally unanswered.  The
  next compute decision belongs to the user: (a) buy the two 320-epoch
  frozen-OMP arms (approximately 1.4 h of GPU1 at 7.1-8.1 s/epoch, producing the
  parent pre-registered G_pair_OMP verdict with TOPO already complete), (b) buy a
  fresh pre-registered second seed of the 160-epoch screen to size the screen
  noise before spending on 320 epochs, or (c) close the attributed-code-formation
  line at 32-D.  IHT qualification, task-coupled E2E, mechanism, DenseTied
  specificity, capacity work (K/s), seed 1 and the official test stay
  DEFERRED_PENDING_USER_AUTHORIZATION in every case.
because: >-
  The amendment's frozen rule requires both a material gap (>= 0.006) and a
  stable paired late-window direction (>= 0.75 agreement, positive mean and
  best-epoch deltas) for PAIRING_SIGNAL_WORTH_FULL_CONFIRMATION.  The screen
  delivered +0.005561 with 0.65 late agreement, i.e. a positive but
  sub-material, epoch-noisy direction, and neither sparse arm had converged at
  160 epochs (REAL best 158/160, INDEP 145/160).  The dense rank-32 control then
  failed to reproduce the direction (soup -0.001405; best-epoch +0.000359), so
  the alternative compression-bottleneck label (>= 0.003) is unsupported: REAL's
  advantage is not a low-rank linear-compression effect, and REAL's dense arm is
  even worse than its sparse arm despite the denser code reconstructing its
  object better in the affine sense (0.1119 vs 0.197).  With both frozen bars
  unmet, the only labels the rule permits are NO_ATTRIBUTED_CODE_FORMATION_SIGNAL_AT_32D
  or a stop-and-report, and the label is reported together with the two
  qualifications above so the numbers are never hidden behind it.
alternatives_rejected:
  - >-
    Declaring PAIRING_SIGNAL_WORTH_FULL_CONFIRMATION from the +0.005561 soup gap.
    Rejected: it is below the amendment's own 0.006 strong bar and the frozen
    late-window stability check failed (0.65 < 0.75); re-labelling it would be a
    post-hoc gate change.
  - >-
    Declaring ATTRIBUTED_PAIRING_SUPPORTED_COMPRESSION_BOTTLENECK from the dense
    control.  Rejected: G_pair_PCA = -0.001405 < 0.003, and the dense REAL arm is
    worse than its sparse counterpart.
  - >-
    Declaring a flat negative (no signal at all, full stop) from the frozen
    label.  Rejected as an overstatement: the sparse screen did favour REAL by
    +0.005561 (above the parent MATERIAL bar) and the arms were still improving,
    so the honest record is "positive direction, sub-material screen, parent
    320-epoch Stage 1 unanswered".
  - >-
    Rescuing the screen by extending it to 320 epochs, adding seeds, sweeping
    K/s/lambda/horizon, or entering IHT/E2E/mechanism now.  Rejected: the
    amendment defers all of these to explicit user authorisation, and no gate
    may be modified after seeing the screen value.
revisit_if: >-
  The user authorises the frozen 320-epoch parent Stage-1 arms (the direct
  answer to the parent 0.003 gate), or authorises a new pre-registration with a
  second seed / longer screen and a pre-declared noise model for the paired
  late-window direction.  A materially positive, directionally stable 320-epoch
  G_pair_OMP would open the parent's own sparse route (coder qualification then
  E2E), and a material dense gap would open the compression/capacity route
  (K/s) under a new pre-registration.
