alternatives_rejected:
  - item: declare a pair-graph-compression bottleneck from the sub-threshold D2 signal
    because: >-
      the pre-registered materiality gate requires BOTH seeds >= +0.02 and the
      collision-consistency clause requires non-negative collision deltas; D2
      seed0 is +0.0113 < +0.02 and D2 collision deltas are negative on every
      seed/split.
  - item: declare an early local / relation / centre bottleneck
    because: >-
      A, B and D1 are material GAINS and C is sub-threshold seed-unstable; the
      earliest stable material degradation does not exist.
  - item: classify Case F (inconclusive)
    because: >-
      Case F requires a credible localization disagreement (different stages
      implicated across seeds, or probe material but replication reversed).
      Contrast C's sign flip is an order of magnitude below materiality and no
      stage is implicated at all.
  - item: run the second-projection and k=4/16 robustness reruns anyway
    because: >-
      the pre-registered rule triggers them only when a contrast reaches the
      material gate; fabricating partial robustness results is forbidden.
  - item: use official valid to pick a stage
    because: >-
      the audit is official-train only; official valid and test are locked.
  - item: treat a low effective rank or a large representation drift as a bottleneck
    because: >-
      the audit localises target-alignment geometry transitions, not capacity or
      drift.
consequences:
  - >-
    The hypothesis "model error is caused by a specific compact-v4 stage
    destroying target-relevant geometry" is NOT supported by the real
    computation graph on official train. Future work should not default to
    another structural module.
  - >-
    The patch encoder and relation encoder CREATE useful target-aligned
    geometry (large material gains), and the unary moment summary does not lose
    it; this is descriptive and does NOT authorize widening any encoder.
  - >-
    The pair moment summary is the only boundary with a stable positive
    degradation direction, but it is sub-threshold and collision-inconsistent;
    it is recorded as a descriptive watch item only. Do NOT build a
    pair-compression rescue on the basis of this audit.
  - >-
    Recommended next direction (not a training authorization): generalisation /
    regularisation, training stochasticity, scalar-target-mapping geometry,
    finite-data sample efficiency.
revisit_if: >-
  (1) A future audit may re-examine the pair graph-compression sub-threshold
  signal with more seeds and an independently pre-registered gate, but this
  audit does not authorize it. (2) Case E explicitly does NOT authorize a new
  architecture; only a genuinely new, independently pre-registered,
  non-geometric hypothesis (generalization / regularization / sample
  efficiency) should be pursued. (3) Existing P1/P2/cell/covariance/triad/
  endpoint/readout/lookup NO-GOs remain binding. (4) Never load official test
  without a separate locked benchmark stage.
