study_id: zinc-context-gap
decision: >-
  Execute the pre-registered analysis-only stagewise representation collision
  audit and register the verdict Decision Case E: NO CLEAR STAGEWISE
  REPRESENTATION COLLISION. Along the real compact-v4-smallhead computation
  graph (both small-head seeds), no pre-registered contrast reached the
  two-seed material degradation gate (delta_eta >= +0.02 with paired-bootstrap
  95% CI lower > 0 on the 2000 probe, delta_eta > 0 on the 800 selection, and
  non-negative collision delta). Patch encoder, pair encoder and unary graph
  compression show material geometry GAIN; centre contextualization is
  seed-unstable at sub-threshold magnitude; pair graph compression is a stable
  sub-threshold positive signal that is also collision-inconsistent. No
  architecture or representation hypothesis is authorized
  (top1_representation_hypothesis.json authorized_for_design = false,
  next_full_training_budget = "not yet authorized"). Zero full-backbone
  training was performed; only the two existing 82.1K checkpoints were reused;
  official valid was not used for stage selection; official test was never
  loaded.
why_this_experiment: >-
  Three consecutive clean local-repair NO-GOs (P1 learned centre composer, P2
  one-shot relation refresh, compact-v4-cell persistent cycle cells) plus
  covariance / triad / endpoint witness NO-GOs and an inconclusive optimized
  broad frozen-state screen made a fourth additive module scientifically
  indefensible. The unresolved question was not "which new module helps?" but
  "where does the EXISTING representation geometry first degrade in a stable,
  target-relevant way?". This audit answers that question with the real module
  inputs/outputs and a target-independent set-aware sketch, without training
  and without reading the target until the nearest-neighbour manifests are
  frozen.
protocol: >-
  Phase U (unlabeled): instrumented replica of PatchPathModel.encode capturing
  S0 patch_encoder_input (170), S1 h0 (48), S2 pair_encoder_input (64), S3 q0
  (16), S4 centre_update_input (213), S5 h1 (48), S6 unary_fixed (97), S7
  pair_fixed (165), S8 global (32), S9 topology (8), S10 R (302); verified
  bit-identical to the original forward (R and yhat max abs diff 0.0). Pooled
  object normalisation and per-coordinate z-score fit ONLY on the 7200
  adapter_fit references. Deterministic projected-quantile set sketch (P=24,
  quantiles 0.1..0.9, +log1p(n) = 217D; base_seed 1729; stage seed
  sha256(base_seed|stage)); empty set = 0. Fixed-size stages use
  ||z_a - z_b||_2/sqrt(d). k=8 nearest references; random-neighbour manifest
  seed fixed. All four aggregated JSONL neighbour files plus 44 per-stage
  shards written and SHA-256 hashed before target read. Phase Y: read
  official-train targets only; compute V_8, eta = V_8/V_rand, collision rate
  C_8 (tau_far = 3.3656 = 80th percentile over fixed random reference pairs),
  NN8 MAE diagnostic; paired bootstrap B=2000 over query molecules only.
