decision_id: decision-zinc-h1-clarity-audit-keep-h1-freeze-c6-candidate-20260928
created: '2026-09-28T00:00:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  The H1 / P2-ABS main line was carried by a single GPU number and a
  description ("decoder h1, K=32, s=8, IHT-10, d_e=48") rather than by a
  verified account of WHERE its information comes from.  Two specific risks
  motivated a CPU-only audit before any further GPU budget was spent: (i) the
  reader input may be dominated by hand-written summaries that bypass the
  frozen dictionary entirely, in which case the dictionary-mediated part of the
  story is not the mechanism that produces the number; and (ii) parts of the
  302-D input may be removable, in which case the line is carrying unnecessary
  shortcut capacity.  The audit was therefore scoped to one question: what does
  this checkpoint actually read, and what can be deleted without loss?
protocol: >-
  Local-first CPU-only round (CUDA_VISIBLE_DEVICES="", no GPU, no SSH to the
  remote host at any point).  Preregistration and frozen intervention registry
  written before any run:
  notes/e2e_dictenv_h1_clarity_audit_preregistration.md.  Phase A is a
  zero-training static inventory that re-derives every reader-input slice from
  its producing function and verifies it against the forward pass on 64 real
  molecules.  Phase B is a frozen table of 82 pre-registered interventions on
  the frozen checkpoint (anchor A0-A6/EA1-EA2, global G0-G3/EG1-EG2, topology25
  T0-T1, node/edge binding N0-N6/EB1-EB3, relation R0-R5/ER1, readout
  P0-P4/EP1-EP3) evaluated under four probe families: zero, mean-fill,
  cross-molecule graph-row shuffle, cross-graph readout-row shuffle and
  cross-pair relation-row shuffle.  Phase C is a tiered training budget: Tier 1
  is 20-epoch warm-start adaptation from the frozen soup with a same-protocol
  continuation control (extended to 40 epochs for candidates with a visible
  recovery trend), Tier 2 is matched from-scratch CPU retraining of one baseline
  plus two finalists at the inherited 320-epoch protocol with identical
  initialisation, data order, optimizer, LR, wd, batch and split.  Official
  ZINC train 10000 / official valid 1000; official test never loaded.
