decision: >-
  Keep H1 / P2-ABS frozen as the current main-line baseline; do NOT replace it
  with candidate C6 on the strength of this round; do NOT authorise any GPU
  budget for the cleanup until a preregistered two-arm two-seed GPU round
  exists.  Accept C6 (remove the graph-level atom and bond histograms, the
  relation log path count, and the unary and pair count blocks) as the recorded
  removable-bypass candidate, and record the verified information map as the
  canonical description of what the H1 reader actually consumes.  Stop this
  round here: the structural questions are answered and further CPU work would
  not change the verdicts.
because: >-
  Three findings settle the round.  (1) The information map is now verified
  rather than described: global_context62 really does carry a 32-coordinate
  graph chemistry marginal, anchor62 really does carry 32 coordinates of patch
  chemistry marginals, and the used relation block really is raw[0:14]+raw[18],
  so any future claim about "the dictionary-mediated environment" must be
  qualified against 205 of the 302 reader coordinates arriving as direct
  hand-written summaries.  (2) The anchor is load-bearing under every probe
  (zero and mean-fill agree within 0.003 for every anchor row), so the
  "minimal root-relative information" framing of this line is refuted for this
  checkpoint, and removing the patch marginals is not recoverable under short
  adaptation (+0.0216 at 20 epochs, still +0.0151 at 40 epochs against a
  matched continuation).  (3) The graph chemistry marginal behaves as
  redundant shortcut capacity: it is materially used by the frozen model
  (+0.0574 under a distribution-preserving row shuffle) yet deleting it, plus
  four blocks that every distribution-preserving probe classifies as dormant,
  IMPROVED the matched from-scratch CPU result by 0.0148 in MAE with identical
  initialisation and data order.  The decision is nevertheless to keep H1
  frozen, because the same matched protocol shows the untouched architecture is
  itself 0.0197 worse on CPU than its own historical GPU run: the CPU regime is
  offset, C6 has only been tested in that offset regime, and at 12.6
  s/epoch/process the confirmatory two-arm two-seed design is a GPU round, not
  a CPU round.
alternatives_rejected:
  - >-
    Promoting C6 to the main line from the CPU Tier 2 result alone.  Rejected:
    single seed, and the historical GPU H1 (0.123549) still beats every CPU arm
    (best 0.128499); the regime offset makes the CPU comparison informative
    about the removal, not about the absolute number.
  - >-
    Reporting the zero-probe table as the mechanism table.  Rejected: zeroing is
    an out-of-distribution corruption.  R3 (boundary zeroed, +0.7341) is worse
    than R5 (all 15 relation coordinates zeroed, +0.1638), and the unary second
    moment reads +1.0045 under zeroing but +0.3692 under a marginal-preserving
    row shuffle.  Three rows are flagged zero_probe_inflated in the artifacts.
  - >-
    Running the preregistered candidate C4 ("clean model + distance-only
    relation").  Rejected on Phase B evidence: the 3-D boundary block alone
    carries +0.5541, so "distance-only" is the deletion of the dominant relation
    block and not a simplification.  The registered definition is kept in the
    registry and documented as never trained.
  - >-
    Removing the anchor marginals (C2/C3) or the second moments (C5).  Rejected:
    +0.0216 / +0.0233 / +0.0389 behind the matched continuation control, with C2
    still +0.0151 behind after 40 epochs.
  - >-
    Adding a second seed, more adaptation epochs, or an architecture search in
    this round.  Rejected as out of scope; the round was explicitly a
    mechanism/information audit, and the next step (if any) is a preregistered
    GPU confirmation, not further CPU screening.
revisit_if: >-
  A preregistered GPU round runs BASE and C6 as two arms on >=2 seeds with
  identical initialisation and data order and shows C6 not worse than BASE by
  more than 0.003 on the seed-mean Top-5 soup while the frozen GS1 / EG2 / PS3 /
  PS6 / RS4 deltas reproduce on the new checkpoints; then C6 becomes the
  candidate main-line architecture.  Also revisit if a future checkpoint's
  frozen table stops reproducing the anchor load-bearing pattern (e.g. A3/A4
  collapse below 0.05), which would mean the model found a different route to
  chemistry and the "anchor is required" statement is checkpoint-specific.
