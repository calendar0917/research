alternatives_rejected:
  - item: buy seed1 before seed0 cleared the non-inferiority gate
    because: >-
      the pre-registered budget rule purchases seed1 only if seed0 loses no more
      than +0.002 MAE.
  - item: run seed2 / seed3 because both seeds looked favourable
    because: >-
      this stage only decides whether the small head is worth becoming a compact
      baseline candidate; a third/fourth seed is a different (performance) claim.
  - item: reallocate the freed 17,498 parameters to a new pair / centre /
      patch-encoder module
    because: >-
      compression-only stage; reallocation would re-open closed hypotheses
      (P1/P2/cell/covariance/triad) and conflate two questions.
  - item: use the frozen-head refit numbers as the result
    because: >-
      frozen readout fitting on a valid-selected backbone is screening
      evidence, not an end-to-end compression proof.
  - item: open official test after the two-seed success
    because: >-
      official test is hard-locked; a benchmark needs a separate locked stage.
  - item: rescue / tune the head (width, LayerNorm, dropout, activation, warm
      start)
    because: >-
      the small-head definition is frozen from prior evidence; there is no
      head search in this stage.
consequences:
  - >-
    compact-v4-smallhead (82,115 params, backbone unchanged, head 4,135) is a
    new compact baseline candidate. Future architecture claims may still compare
    against optimized compact-v4, but the smaller core is now available.
  - >-
    The "frozen readout capacity redundancy" hypothesis is shown to translate
    into genuine end-to-end parameter redundancy for this representation and
    protocol: the large head is not needed for joint representation learning.
  - >-
    The released 17,498 parameters remain unused. They may only be spent after a
    separate, independently pre-registered, R-SUPPORTED representation
    hypothesis, staying under the original ~100K ceiling.
  - >-
    Outputs committed under results/compact_v4_smallhead_e2e/ (lock, baseline
    inventory + anchor, parameter audit, seed0/seed1 init matching, integrity
    gates, compute audit, stage1, stage1 decision, stage2, replication decision,
    two-seed summary, bulk seed0/seed1, representation drift, curves, final
    decision, Q1-Q18, 3 figures) and
    notes/compact_v4_smallhead_e2e_compression.md; tests 15 pass.
revisit_if: >-
  (1) A separate locked official-test benchmark stage is explicitly authorised.
  (2) A genuinely new, independently pre-registered representation hypothesis
  with its own witness may spend part of the released budget. Do NOT reopen
  P1/P2/cell/covariance/triad/endpoint/FM/head-family, do NOT add a scheduler or
  extend the horizon to rescue anything, do NOT run seed2/seed3 here, and never
  load official test without a separate authorisation.
