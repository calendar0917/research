decision_id: decision-compact-v4-smallhead-e2e-replicated-non-inferior-20260912
created: '2026-09-12T09:40:00'
kind: decision
study_id: zinc-context-gap
decision: >-
  Execute the pre-registered end-to-end small-head compression confirmation and
  register the verdict Decision Case D: END-TO-END SMALL-HEAD COMPRESSION --
  REPLICATED NON-INFERIOR WITH FAVOURABLE POINT ESTIMATES. Replacing the
  21,633-parameter graph head with the fixed 4,135-parameter raw small head
  (82,115 total, -17,498) is validation-non-inferior on both development seeds:
  D0 = -0.001086 (seed0 0.145334 vs 0.146420), D1 = -0.011273 (seed1 0.138059 vs
  0.149332), mean D = -0.006180 <= +0.0015, both D_s <= +0.002 and both < 0.
  Budget rule honoured exactly: baseline reused (never retrained), seed1
  purchased only after seed0 passed, seed2/seed3 never run, released parameters
  never reallocated, official test never loaded. The ~82.1K compact-v4-smallhead
  becomes a new compact baseline candidate. The primary claim is compression
  non-inferiority, NOT a small-head performance GO.
why_this_experiment: >-
  The Parameter Allocation & Representation Leverage audit identified the graph
  head as an H-STRONG donor on frozen optimized backbones (frozen R -> refit
  small head: seed0 0.143208, seed1 0.147754) but explicitly noted this is a
  readout-fitting screening device, not a proof that the head can be deleted
  during representation co-training. The only remaining budget-level question
  was therefore whether the large head is redundant end to end. This experiment
  closed that question with a from-scratch compressed architecture; it is not a
  new representation, parameter reallocation, new recipient, architecture
  expansion, P1/P2/cell rescue, HPO, head-family search or test benchmark.
protocol: >-
  Inherited frozen optimized protocol (Adam lr 1e-3, wd 1e-5, batch 128, max 240,
  patience 40, no scheduler, gradient clip 5.0, L1, best official-valid, single
  stage). Candidate: PatchPathSmallHeadModel -- all compact-v4 representation
  modules unchanged, graph head replaced by the historical Sraw / Hsmall
  GenericReader (302 -> 13 -> 13 -> 1, raw R, direct yhat=f(R), ReLU, no
  LayerNorm, no dropout). Shared initial tensors copied exactly from the
  canonical baseline init (40 tensors, max abs diff 0.0); small head initialised
  independently under head_seed 0. R = 302D; 82,115 params. All Stage-0 gates
  pass (G0.1-G0.10). No head-width / activation / normalisation / dropout /
  residual / warm-start / distillation / scheduler / horizon change. Official
  test blocked.
