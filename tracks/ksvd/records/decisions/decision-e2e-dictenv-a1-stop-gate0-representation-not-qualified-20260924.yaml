kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  The previous rounds established a clean, absolute-strong, dictionary-load-bearing
  end-to-end environment (P1: soup valid 0.131975, G_zero 0.347116, G_node
  0.013124) whose advantage was NOT demonstrated to be specific to the sparse
  discrete dictionary (P1 specificity 0.002559 < 0.003; P2-ABS reached the
  target band, soup valid 0.123549).  Those environments had no real
  structure<->attribute pairing: they used a chemistry-free anchor plus bindings
  whose dictionary input was the pure-topology phi65.  A1 asked the narrower,
  earlier question the FSAR-R2-AR0 and SRDA antecedents left open: does REAL
  structure<->attribute pairing participating in the sparse dictionary code alpha
  give a stable increment over (a) topology-only and (b) the parameter-matched
  assignment-independent ATTR-INDEP object?  The pre-registered order was
  Gate 0 (correctness, assignment semantics, continuity, dictionary health) ->
  Stage 1 OMP screen (G_attr_OMP >= 0.003) -> Stage 2 IHT qualification -> Stage
  3 E2E (G_attr >= 0.003) -> Stage 4 dense-tied conditional -> mechanism + liveness,
  with an unconditional stop at the first failed gate and no rescue.
protocol: >-
  Local-first implementation with targeted CPU tests, preregistration frozen and
  committed (bd3700a) before implementation, then the remote-research-runner
  workflow on the shared A100 box: preflight, deploy, uv sync, resumable stages
  (cache -> scaler -> dictionaries -> omp-codes -> correctness -> assignment ->
  health -> continuity -> posthoc-continuity -> omp-screen -> iht-diag -> formal
  -> mechanism -> liveness -> specificity -> accounting -> decision -> report).
  Objects frozen: chi_REAL = [phi65; vec(JV 11x28=308); vec(JE 15x4=60)] = 433-D
  from the audited fsar_v2._explicit_basis_for_patch, chi_INDEP with
  P^V = (1/n)(sum b^V)(sum q)^T and P^E = (1/m)(sum b^E)(sum r)^T (zero when
  m = 0); train-only scaling (per-coordinate RMS, no mean subtraction, zero-RMS
  masked, then block-energy normalisation); identical treatment for REAL/INDEP.
  Budget K=32, s=8, H1 decoder, d_e=48, horizon 320,
  lambda = 33.95873017865987, seeds 0 (seed 1 only if G_attr >= 0.003); TOPO
  reuses the frozen SDB-v0 dictionary.  All CUDA work on physical GPU1
  (CUDA_VISIBLE_DEVICES=1 asserted in code); GPU0 was foreign-owned all round;
  the official ZINC test split was never loaded.
