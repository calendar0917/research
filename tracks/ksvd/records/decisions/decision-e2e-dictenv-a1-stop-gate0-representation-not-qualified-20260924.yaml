decision: >-
  STOP E2E-DictEnv-A1 at Gate 0 with the frozen verdict
  REPRESENTATION_NOT_QUALIFIED.  Spend no Stage-1/2/3/4 budget, run no mechanism
  or liveness/specificity stage, buy no seed 1, and do not reinterpret the
  failure as evidence about ATTR-REAL versus ATTR-INDEP: the round's primary
  question G_attr is UNANSWERED and must not be reported as if it had been
  measured.  Record honestly what the round did establish - a qualified,
  parameter-identical pair of 433-D attributed objects (assignment semantics,
  invariance, health and accounting all pass; cross-machine bit-identical
  caches; exact frozen-dictionary reuse) plus a refuted measurement criterion -
  and require a NEW pre-registration for any continuation, with the corrected
  continuity criterion proposed in the analysis note (>= 10-atom equal-size
  molecule-disjoint population, graded Spearman criterion with a paired
  REAL-vs-INDEP contrast, scale-invariant representation distance, and an
  in-gate sanity check that the statistic separates the chemistry-blind TOPO arm
  from an attribute arm).
because: >-
  The pre-registered stop rule is unconditional: G0.3 requires REAL code-space
  AUC >= 0.70 and the formal run measured 0.534375.  The gate was frozen before
  implementation and is reported verbatim; no rescue, re-thresholding or
  alternative stratum is authorised after the fact.  Every other Gate-0
  component passes, and the objects are exact (INDEP == REAL == 109,263
  parameters; 19/19 correctness gates; REAL sensitive to pairing at 3.6243 while
  INDEP is exactly invariant at 0.0; health 30-32/32 atoms, unit-norm columns,
  train/valid usage Spearman 0.999).  The failure is attributed to the criterion
  and its population rather than to a demonstrated defect of the object, on two
  independent grounds.  First, the stratum diagnostics: the audit pool is
  dominated by tiny rooted patches (mean size 6.07, only 1.07 % >= 10 atoms) and
  the near stratum is 100 % size-equal, root-category-equal and molecule-disjoint
  with mean size 5.35, so attributed-WL identity is nearly implied by (size, root
  type); the REAL object places such pairs FARTHER apart than its (size, root
  category)-matched controls (code 3.917 vs 3.087, x 1.295 vs 1.141) under
  Euclidean, angular (0.531) and norm-matched (0.527) distances, while the
  chemistry-blind TOPO arm scores worst (0.443) and the assignment-independent
  INDEP object scores best (0.715) - exactly the ordering a criterion that
  rewards forgetting residual detail must produce, and the opposite of what
  G0.3 is meant to certify.  On graded equal-size molecule-disjoint pairs the
  attribute arms do track attributed-WL similarity (REAL 0.287, INDEP 0.281)
  where chemistry-blind TOPO does not (0.128), so a corrected criterion has
  measurable signal to work with.  Second, the same frozen criterion had already
  failed on the unrelated TCCD-v0 object (code AUC 0.4675), i.e. it has now
  failed twice on objects built from unrelated principles.  The REAL object's
  3x harder K-SVD fit (0.5174 vs 0.1701 at identical parameters) and 9x larger
  OMP holdout error (1.97e-01 vs 2.11e-02) independently corroborate that the
  real pairing retains heterogeneous interaction detail rather than being
  degenerate.
alternatives_rejected:
  - >-
    Read 0.5344 < 0.7056 as evidence that ATTR-REAL is a worse representation
    than ATTR-INDEP.  Rejected: the criterion's validity is contradicted by the
    stratum diagnostics, and a chemistry-marginal statistic beating a
    pairing-sensitive one on a WL-histogram criterion is the expected artefact,
    not a performance measurement.
  - >-
    Re-run G0.3 with a patch-size floor, a graded statistic, a relaxed
    threshold, or a different control to unlock Stages 1-4 in this round.
    Rejected: that is an unpreregistered rescue of a failed frozen gate; it must
    be a new pre-registration with its own frozen thresholds.
  - >-
    Run Stages 1-4 anyway 'for information' and report them as diagnostics.
    Rejected: the frozen decision order makes G0.3 a round-stopping gate, the
    stage budget is a finite scientific resource, and reporting stage results
    obtained after a frozen FAIL would silently violate the protocol.
  - >-
    Buy seed 1 because the failure may be a seed artefact.  Rejected: seed 1 was
    authorised only after G_attr >= 0.003, which was never measured.
  - >-
    Change K, s, the IHT rollout, the reader, lambda or the horizon so that the
    caches/codes satisfy the continuity gate.  Rejected: explicitly forbidden by
    the frozen brief, and it would be a rescue selected on the same audit set.
  - >-
    Load the official ZINC test split to check whether REAL/INDEP differ on test.
    Rejected: forbidden; the round stopped before any predictor existed and the
    test must never drive a decision.
revisit_if: >-
  A new pre-registration replaces the continuity criterion as proposed in
  notes/e2e_dictenv_a1_analysis.md section 5 (>= 10-atom equal-size
  molecule-disjoint population; graded Spearman criterion with a paired
  REAL-vs-INDEP contrast instead of an absolute 0.70 bar; scale-invariant
  angular or norm-matched representation distance; in-gate sanity check that the
  statistic separates chemistry-blind TOPO from an attribute arm, which it does
  on graded pairs at 0.128 versus 0.287), or a new pre-registration keeps a
  binary continuity gate but calibrates its threshold and population on frozen
  artifacts so that a FAIL is interpretable, or the primary question is re-asked
  with the continuity audit reported as a diagnostic rather than a
  round-stopping prerequisite.  Any such round must also declare how it handles
  the now-repeated evidence that the REAL object is much harder to represent
  sparsely than the marginal one (K-SVD 0.5174 vs 0.1701).
