revisit_if: >-
  Revisit only with a new pre-registration that either (a) buys confirmation of
  this exact candidate — a second paired seed plus a parameter-matched control
  (dense 48x96x48 adapter, random/frozen bridge, no-bridge rerun) under one
  protocol, with the band rule and the code-density report pre-declared — or
  (b) changes the local object / learning objective instead of iterating
  K / s / lambda on this representation, per the task package's section 6.  A
  future round may reuse the proven-live insertion point (fusion output h) and
  the moved-but-near-dense dictionary as building blocks, but must not present
  that as a gain of this round, and must not read the unmatched +0.002647
  background difference as an increment without a matched control.
study_id: zinc-context-gap
why_this_experiment: >-
  The previous round showed that a live hierarchical static relation dictionary
  can be learned but loses on absolute performance (soup 0.182343 vs the Sem108
  background 0.123705).  This round asked the narrower question the task
  package posed: with the effective Sem108 local encoding, static relations and
  readout frozen, does one shared low-dimensional task dictionary inserted at
  the fusion output (h[48] -> alpha[96] -> E[48], tied unrolled ISTA, 9,216 new
  parameters) reach the pre-registered absolute bands on a single seed-0 screen,
  and is the inserted dictionary actually learned and used?  Both questions were
  answered at the frozen endpoint before any rescue or control was considered:
  the candidate landed in the borderline band, and the bridge is learned and
  load-bearing but near-dense and unvalidated against any matched alternative.
