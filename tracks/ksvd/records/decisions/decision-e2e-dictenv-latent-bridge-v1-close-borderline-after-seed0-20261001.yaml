kind: decision
protocol: >-
  Local CPU only (runtime.device=cpu, 8 threads), official ZINC train 10000 /
  official valid 1000, official test never instantiated.  Pre-registration and
  code committed before the formal run (039355e + 34d7c0e, endpoint patch
  9d4cbed; prereg sha 00faf4d52b98 enforced by preflight).  Formal stages
  executed through the new control-plane runner
  `zinc_e2e_dictenv_latent_bridge_v1` (screen run 20261001-220925-9bbcc5c9,
  train wall 2434.8 s at 7.609 s/epoch, plus 61.3 s interventions/analysis;
  two earlier local attempts of 2026-10-01 were discarded before training or
  interrupted for the endpoint patch and contributed no results).  One
  candidate, seed 0, 320 epochs, batch 128, Adam lr 1e-3 / wd 1e-5 / clip 5.0,
  fixed LR, Top-5 soup by valid MAE, no early stop, no control arm, no sweep.
  Separately: 10 focused local tests, a 13-gate zero-training acceptance audit,
  a correctness stage (all gates passed), a smoke stage (8 epochs on
  2048/512), a 40-epoch paired short-trainability dev check and inference-only
  mechanism probes at epochs 1/20/40/80/160/240/320.
