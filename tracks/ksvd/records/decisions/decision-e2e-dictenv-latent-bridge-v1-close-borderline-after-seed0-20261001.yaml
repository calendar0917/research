alternatives_rejected:
- >-
  Buying a second seed for this candidate.  Rejected: the pre-registered
  confirmation rule requires M_S <= 0.120 AND a learned dictionary before seed 1
  is considered; the endpoint is 0.121058 (borderline, 0.001058 above the
  edge), so seed 1 would buy a variance estimate for a configuration that did
  not clear its own gate.
- >-
  Building a matched control post hoc (parameter-matched dense adapter, random
  or frozen bridge, no-bridge rerun) to reinterpret the borderline endpoint or
  the +0.002647 difference against Sem108.  Rejected: a post-hoc arm is not
  pre-registered and could not ground a performance claim in either direction;
  the round's question (absolute band of one frozen candidate) is already
  answered.
- >-
  Rescuing the run (dictionary size K, sparsity/lambda regime, more or fewer
  IHT steps, d != 48, learning rate, horizon, dropout, refitting the frozen
  scaler or the Sem108 body).  Rejected: each is a new candidate, the
  pre-registration forbids them in this round, and the task package's section 6
  explicitly warns against iterating K/s/lambda on this representation after a
  non-promising outcome.
- >-
  Reading the intervention deltas (+1.185 zero-code, +0.288 permutation, +1.232
  reset-to-init) as evidence that dictionary learning beats a matched trained
  alternative.  Rejected: they are sensitivity statements inside one model, and
  the insertion topology guarantees a large zero-code delta because E = 0
  removes the whole local encoding from the readout.
- >-
  Reading the +0.002647 difference against Sem108 0.123705 (or the other
  historical numbers T1 0.125765, FINAL-CLEAN-C6 0.128499, CSSD-q1 0.130028,
  P1-sparse 0.131975) as a causal increment.  Rejected: the candidate adds
  9,216 parameters, the comparison is single-seed and unmatched, and the
  training-loop fit at epoch 320 is essentially identical to the parent
  (0.085155 vs 0.085076).
- >-
  Fixing the near-dense code with post-hoc thresholding or a top-k readout at
  evaluation time.  Rejected: the code density is a measured endpoint property
  of the frozen lambda regime, not a defect to repair after the fact; any
  sparsity intervention would be a new candidate and would invalidate the
  frozen comparison.
- >-
  Reading the official ZINC test split for a borderline candidate.  Rejected:
  screen-mode discipline (test blocked) and the frozen band rule; the test was
  never instantiated (official_test_loaded false).
because: >-
  The frozen candidate was implemented, gated by the zero-training acceptance
  audit and a smoke stage, trained for the full 320 epochs on the official
  train split and evaluated once on the official valid split through the new
  control-plane runner; the pre-registered band rule returned the borderline
  band, which by the pre-registered confirmation rule does not authorise seed 1
  or matched controls.  The mechanism diagnostics are positive but only
  establish channel liveness and dictionary movement, not comparative value;
  the near-dense code measurement additionally blocks any sparse-coding
  reading.  The round therefore closes with both statements recorded separately
  and no further runs.
created: '2026-10-01T23:10:00'
decision: >-
  Close the E2E-DictEnv-Latent-Bridge-v1 round after seed 0
  (`LATENT_BRIDGE_BORDERLINE`) without seed 1, without a matched control, and
  without tuning dictionary size / sparsity / steps / lambda.  Record the band
  result (soup official-valid MAE 0.12105831989, best 0.12997499 @ 309,
  borderline 0.120 < M_S <= 0.1233; background Sem108 0.123705 unmatched) and,
  separately, the mechanism result (learned: D_L / V_L movement 5.7622 / 5.6371
  with MAE-only gradients 0.269395 / 0.240133; load-bearing: zero-code +1.185274,
  permutation +0.288035, reset-to-init +1.231997 MAE; near-dense code mean
  non-zero 89.10/96).  Do not merge the two readings, do not present the result
  as an improvement over Sem108 or as sparse coding, and do not continue this
  representation by iterating K/s/lambda.  Any continuation requires a new
  pre-registration that buys either confirmation (seed 1 + parameter-matched
  dense/random adapter + paired seeds) or a different local object / learning
  objective.
