decision: >-
  STOP the round at its frozen pre-registration 10.2 verdict
  REFERENCE_REPRODUCTION_FAILURE, before interpreting the candidate, and record
  the round as an architecture-consolidation success plus an unmeasured
  performance question.  The purified structure is real and verified (all three
  local raw-chemistry bypasses gone, 1.8 % fewer parameters, deterministic path
  bit-identical to H1), but no non-inferiority statement may be made: the fresh
  matched reference drifted +0.006330 above the historical H1 context, more than
  the frozen 0.005 tolerance and more than the candidate's own
  delta_purification (+0.005619).  Do not buy seed 1, do not run the mechanism /
  constant-channel-ablation / dictionary-health stages, do not re-read
  delta_seed0 as evidence, and do not re-anchor the round on any other historical
  number.  Adopt the diagnosis as a programme-level protocol fact: this training
  protocol is not bit-reproducible on the shared A100 (identical CUDA forwards
  differ by up to 1.4e-04 in the pooled read-outs while CPU is exactly 0.0, and
  two identical 2-epoch runs differ by 0.009-0.042 in valid MAE), so historical
  point estimates are context only and every future non-inferiority claim needs a
  same-round paired baseline with >= 2 seeds and a tolerance that exceeds the
  measured dispersion of the gated quantity.  The purified architecture stays
  open but unmeasured; re-asking it requires a new preregistration and must not
  reuse this round's delta_seed0.
because: >-
  The preregistration was explicit and one-sided: if (fresh reference seed-0
  soup) - 0.12354862861608853 > 0.005 then verdict REFERENCE_REPRODUCTION_FAILURE,
  STOP, diagnose, and "the candidate is not interpreted while the baseline
  drifts".  The measured drift is +0.006329554833471779, so the rule fired and
  the runner raised by itself.  The mandated diagnosis excluded every
  implementational cause by direct evidence (data cache predates H1's run;
  dictionary sha256 identical; no commit touched the model or trainer since H1's
  commit 122db5dc; init is `torch.manual_seed(0)` in a dropout-free model; the
  round's evaluator reproduces H1's recorded soup 0.12354863 and rec 1.4615e-04
  exactly from the stored H1 state; batch order is generator-seeded) and
  localised the drift to the execution regime: non-deterministic CUDA
  accumulation in the `index_add_` pooling read-outs, whose two-epoch
  amplification (0.009-0.042 valid MAE) already exceeds the 0.005 tolerance.  The
  fresh reference's own epoch-1 train MAE (1.011811) falls between two identical
  probe reruns (1.011238, 1.012584), i.e. it is an ordinary draw of the protocol
  rather than a mis-specified baseline, so no re-run was warranted and no rescue
  was available inside the frozen rules.
alternatives_rejected:
  - >-
    Re-running the fresh reference (or the whole paired round) hoping to land
    within 0.005 of the historical H1 point.  Rejected: the protocol's measured
    run-to-run dispersion (0.009-0.042 at two epochs, and the H1 curve's own
    +-0.02 epoch-to-epoch jitter) makes this a lottery, i.e. seed hunting on the
    baseline, and the frozen rule forbids rescues after a failure.
  - >-
    Reporting delta_seed0 = +0.005619 as a non-inferiority result or as a
    performance failure of the purified architecture.  Rejected: the baseline
    drifted by more than the effect being read, there is no seed-1 replicate, and
    section 10.2 explicitly forbids interpreting the candidate while the baseline
    drifts.
  - >-
    Switching the decision baseline to the fresh reference only and calling the
    round valid (the within-round comparison is paired, matched and arguably
    cleaner than the historical anchor).  Rejected: the frozen preregistration
    makes the historical-anchor check a blocking gate that is checked *before*
    the candidate, and silently re-basing a frozen rule after seeing the numbers
    is exactly the goalpost move this round was designed to prevent.  The
    within-round design stays on record as the correct pattern for a future
    round; this round simply cannot supply the verdict.
  - >-
    Continuing into seed 1, the mechanism interventions, the constant-channel
    ablation or dictionary health because "the architecture work is clearly
    fine".  Rejected: those stages exist to interpret a performance verdict that
    this round is not allowed to produce; running them would spend GPU1 on
    uninterpretable evidence and pre-empt the next preregistration.
  - >-
    Quietly relaxing the 0.005 tolerance to, e.g., the measured dispersion.
    Rejected: changing a frozen threshold after seeing the data is the same
    violation as switching the baseline; the tolerance is recorded as exceeded
    and the *future* protocol recommendation (dispersion-aware tolerances, or a
    deterministic measurement) is recorded separately in the analysis note.
revisit_if: >-
  The user re-opens the purification question with a new preregistration that
  (a) makes the measurement deterministic first — torch.use_deterministic_algorithms
  with a deterministic pooling replacement (or CPU pooling) and a re-measured
  dispersion — so that a 0.002 band is testable at all, or (b) keeps the current
  stochastic regime but budgets >= 2 seeds per arm and derives the tolerance from
  the measured protocol dispersion instead of anchoring it to a historical point,
  or (c) chooses a different, dispersion-tolerant primary quantity.  The purified
  architecture itself (constant structural channel, size-only anchor, zero local
  raw-chemistry bypasses, 95,711 params) may be re-tested under any such round,
  but this round's delta_seed0 must not be reused as evidence.
