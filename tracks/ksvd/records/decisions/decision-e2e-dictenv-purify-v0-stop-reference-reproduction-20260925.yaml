kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  The retained line of record is topology sparse code -> post-code chemistry
  binding, built on the H1 "clean dictionary core" (97,487 params, Top-5 soup
  valid MAE 0.123549).  Its remaining weakness is architectural: local
  zeroth-order chemistry re-enters the model through three raw bypasses in the
  62-D anchor (root atom identity 28, patch atom marginal 28, patch bond
  marginal 4), so the environment slice is not purely structural and the
  dictionary's opportunity set is contaminated.  The user authorised exactly one
  consolidation round: a pre-registered, GPU1-only attempt to fold that
  chemistry into the attributed structural measure (node beta_v = [1; alpha_v],
  edge gamma_uv = [1; g_uv], size-only 2-D anchor) while preserving performance,
  with a functionally-equivalent semantic refactor as Stage 0, a fresh matched
  reference, and no rescue paths.
protocol: >-
  Local-first with remote A100 GPU1 compute.  Architecture audit
  (notes/e2e_dictenv_purify_v0_architecture_audit.md) and frozen preregistration
  (notes/e2e_dictenv_purify_v0_preregistration.md) committed at bbcaf58 before
  any run; implementation and runner at 8657ffc; amendment A1 at 6ec6218
  (device-aware equivalence gate, rules unchanged); reproducibility probe at
  79fb460; 24 CPU tests green.  Remote: preflight pass (uv 0.12.13, torch
  2.5.1+cu124, doctor 12 ok / 0 warn / 0 fail), clean deploy, GPU1 smoke on both
  arms, then the formal pipeline `all --device cuda`: Stage 0 equivalence on CPU
  and CUDA, matched seed-0 320-epoch arms (seed 0, lambda 33.95873017865987,
  Adam 1e-3 / wd 1e-5 / clip 5, batch 128, Top-5 soup on official valid), paired
  comparison, then (only if authorised) seed 1 and the mechanism / ablation /
  health stages.  GPU0 was foreign-contended throughout and was never touched;
  the official ZINC test was never loaded.  The runner stopped itself in-process
  when the pre-registered reproduction check failed.
