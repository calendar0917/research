decision: >-
  CASE D — NO MATERIAL GLOBAL SIGNAL, with the shuffle precedence also firing.
  G_global 0.000522052258 is an order of magnitude below the 0.005
  small-signal floor, G_bind 0.001300863860 is below the 0.005 precedence
  threshold, and only 0.29% of the 0.2514 -> 0.1198 gap is closed. The
  bias-only control is already worse than base, so there is no intercept
  miscalibration to remove. Because the head fits train residuals while dev
  stays flat, the tiny movement must be read as head capacity / optimization
  effect. Close the "frozen TCCD is missing plain graph-level statistics"
  explanation; no global-context architecture rescue.
alternatives_rejected:
  - item: Add topology 25-D / patch_cont 146 / pair_relation / local-state
      bridge / RDKit descriptors to the same probe
    because: >-
      the preregistration froze the 62-D block as the single variable; prior
      compact-v4 topology work already bounded the topology increment near
      ~0.01 MAE, and the registered Case D explicitly forbids widening the
      block within this round.
  - item: Sweep head width/depth or swap the MLP for a linear probe
    because: >-
      the head is fixed once by preregistration with no sweep; the train L1
      fell from 0.1515 to 0.1135 while dev stayed flat, so additional capacity
      addresses the wrong failure mode.
  - item: Run a paired seed 1
    because: >-
      GLOBAL62-v0 is a single-seed screen; the registered Case D rule fires on
      G_global, and the seed-1 route was never authorized.
  - item: Re-run TCCD-v2/v5/v6 or B-Full for a matched comparison
    because: >-
      the base prediction is the exact frozen v5 PRE soup and reproduces the
      formal number to 1.69e-8; re-running would add noise, not information.
  - item: Open official ZINC valid or test
    because: >-
      the round is internal-dev only and the official test stays closed.
consequences:
  - >-
    B-Full's 62-D graph-level summary block is not a hidden reservoir of
    task-relevant information that frozen TCCD fails to use; the ~0.13 MAE
    gap is not a missing-plain-statistics problem.
  - >-
    Together with TCCD-v6 (gains are coordinate exposure) and CENTER-COMP-v0
    (single incidence layer used but insufficient), the frozen-ceiling
    bottleneck is now not attributable to global summary statistics, nor to
    single-layer occurrence placement.
  - >-
    The large-molecule error (base MAE 0.328138 for n 25-37) is not repaired
    by the 62-D global block (improvement 0.001239), so the large-graph
    shortfall also needs a different explanation.
revisit_if: >-
  A new preregistration specifies a different, richer global representation
  with matched controls and a binding-shuffle control; or a new diagnostic
  isolates local-object adequacy (radius-2 canonical patch coordinates plus
  the frozen prototype vocabulary) independently of any pooling or context
  channel. Not by adding feature blocks to this probe, not by a head sweep,
  and not by an official-test read.
next_action: >-
  NONE auto-authorized. Do not build a global-context rescue. Draft a new
  preregistration only for a local-object adequacy question with matched
  controls; official ZINC test stays closed.
