decision_id: decision-global62-v0-stop-missing-global-stats-20260922
created: '2026-09-22T00:00:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  TCCD-v6 showed the recent frozen gains are base-reconstructible coordinate
  exposure, and CENTER-COMP-v0 showed a single pair-to-center incidence layer
  is used but does not break the ~0.25 ceiling. Both are local/incidence
  stories. The one remaining naive explanation was that the frozen TCCD route
  is simply not using the plain graph-level statistics that a strong model
  like B-Full feeds to its global encoder. TCCD-GLOBAL62-v0 tested exactly
  that single block: with the frozen TCCD prediction fixed and correct, does
  the exact 62-D B-Full global context add material signal beyond a bias-only
  control, and only if the molecule<->global binding is correct?
protocol: >-
  Local CPU execution; seed 0; fixed internal 8000/2000 split (split seed
  20260922); exact frozen TCCD-v5 PRE Top-5 soup state forwarded over the
  reused TCCD-v5 pair cache (no TCCD training); exact B-Full
  global_feature_views(...)["global_all"] 62-D context (= short 15 + long 15
  + atom histogram 28 + bond histogram 4); train-only standardizer; residual
  target r = y - yhat_base on internal train only; final prediction
  yhat_base + f(g); one fixed residual head 62 -> Linear(62,32) ->
  LayerNorm(32) -> ReLU -> Linear(32,32) -> ReLU -> Linear(32,1), 3169
  parameters; L1 on the final prediction; Adam lr 1e-3, wd 1e-5, batch 128,
  max 240 epochs, patience 40, Top-5 soup, no clipping; bias-only control
  b* = median train residual; evaluation-only deterministic dev derangement
  (seed 20260923, no fixed points, multiset preserved) on the trained head.
  No baseline rerun, no seed 1, no width/depth sweep, no feature selection, no
  topology/patch/pair features, no official valid, official test never
  loaded.
