alternatives_rejected:
- 'Buying seed 1 or a matched control -- rejected: forbidden by the preregistration
  once the absolute band fails, and a single seed-0 endpoint above the edge is not
  a basis to spend more compute.'
- 'Widening the ring encoder / reader, or changing ring length / pooling / loss --
  rejected: same-family rescue explicitly excluded by the preregistration.'
- 'Reinterpreting the live, load-bearing mechanism (zero_ring and permutation deltas)
  as success -- rejected: mechanism liveness is a reporting diagnostic, never a band
  gate.'
because: 'The frozen pre-registered band rule is absolute-performance-first: <=0.115
  promising, 0.115-0.120 limited, >0.120 stop. The single seed-0 320-epoch run gave
  soup valid 0.120779, just above the 0.120 edge, and best 0.127393 @269; it is essentially
  flat against the unmatched Small latent-bridge background 0.121058 (-0.000279) and
  worse than the same-family Full m=3 0.119154. The Phase-A train-only OOF gain (0.031298,
  3/3 folds) did NOT transfer to the full model''s absolute band. The new object is
  nevertheless genuinely live and load-bearing (zero_ring +0.279311 MAE; cross-molecule
  same-length ring permutations +0.215760/+0.208004 MAE; ring-encoder task gradient
  0.338665; shared D_L/V_L 0.240076/0.244196), so the stop is a performance verdict,
  not an inertness finding, and the near-dense code (91.18/96) is a soft-threshold
  dictionary, not a sparse advantage.'
created: '2026-10-02T09:30:46'
decision: 'STOP the typed-cycle static-object round after the single seed-0 screen:
  verdict TYPED_CYCLE_STOP (soup official-valid MAE 0.120779 > 0.120). Do NOT widen
  the ring encoder or reader, do NOT add seeds, do NOT tune ring length / hash / regulariser
  / threshold, do NOT read the official test. The typed-cycle line is sealed at this
  scale; any reopening needs a new preregistration.'
decision_id: decision-e2e-dictenv-typed-cycle-v1-stop-no-absolute-gain-20261002
kind: decision
revisit_if: A new preregistered round explains why the Phase-A train-only OOF gain
  (0.031298) did not become an absolute full-model gain, and buys a matched control
  (e.g. ring branch vs a parameter-matched control at equal params, or a different
  graph-level readout / pooling that preserves object identity) with >=3 seeds, same
  soup protocol and a same-round matched baseline. A materially positive absolute
  effect is required before any further typed-cycle compute.
