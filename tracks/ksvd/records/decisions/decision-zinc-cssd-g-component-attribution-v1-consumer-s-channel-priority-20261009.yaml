alternatives_rejected:
- Dictionary-object redesign as the first-priority next study: no positive
  evidence purchases it in the current consumer/interface (component-level
  paired deltas are null on s and significantly negative on ell; the s
  difficulty is arm-symmetric; the RAW containment suppresses the
  information-addition version; zldc and graph-info branch B are aligned);
  it remains only "not excluded" for future object classes.
- Any new candidate purchase from this round (bias correction, COMP weight
  change, subgroup-specific training, feature additions): explicitly not
  bought; dev is exploratory and the triage constraint against bias-only
  rescues stands.
because: >-
  The pre-registered attribution answered the triage round's missing
  information (1) and (3): dev e_g is now decomposed per component, and the
  k=0 bulk has stable coarse gradients (small molecules, N/O composition) but
  no dominant subgroup and no dictionary-specific failure.  The triage
  decision branch "concentrated subgroup -> consumer readout candidate" is
  only partially met: gradients exist and are interpretable, but the error
  mass is broad (top-20 = 7.7% of sum|e_s|), so any candidate must target the
  s channel broadly, not a located subgroup.
created: '2026-10-09T01:35:00'
decision: >-
  Record the attribution result and STOP this round without buying any
  candidate.  Priority order for the next zinc-context-gap study, by evidence
  weight: (a) consumer-side s-channel generalization (readout/regularization/
  supervision-shape), to be designed under a NEW preregistration with the
  arm-symmetry and mirror-bias facts as design inputs; (b) the open
  whole-graph representation question in STATE remains the fallback if a
  future preregistration shows the s gradients are not actionable within this
  consumer family; (c) dictionary-object redesign stays unpurchased until some
  round produces positive evidence for a specific structure-chemistry object
  class.  The k=-2/-1 Q-tail localization (triage missing piece 2) remains
  open and unchanged.
