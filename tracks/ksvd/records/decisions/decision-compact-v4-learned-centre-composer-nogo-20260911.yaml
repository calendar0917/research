decision_id: decision-compact-v4-learned-centre-composer-nogo-20260911
created: '2026-09-11T22:30:00'
kind: decision
study_id: zinc-context-gap
decision: >-
  Run the single authorise-and-stop falsification of the P1 hypothesis: a small
  end-to-end learned permutation-invariant relation composer placed BEFORE
  centre contextualization can extract task-useful composition structure that
  the fixed coordinatewise mean/std/log-count cannot. Verdict: Decision Case A -
  P1 MINIMAL LEARNED COMPOSER NO-GO under the locked protocol. P1 seed0 valid
  0.147229 vs reused optimized compact-v4 seed0 reference 0.146420 ->
  delta_P1,0 = -0.000809, far below the +0.004 architecture gate. Budget rule
  honoured exactly: only ONE new full-training run was spent; the matched
  post-pooling capacity control was NOT purchased and seed1 was NOT run.
why_this_experiment: >-
  compact-v4 spends learned computation on the pair relation q_ij then
  compresses it with a hand-fixed operator before the centre update. This is the
  one architecture assumption under test: unlike the historical frozen-state
  probes (which added a statistic/readout on top of a frozen q/h) and unlike the
  CIN-driven compact-v4-cell object-class experiment, P1 changes the computation
  graph inside the backbone so the pair encoder can co-adapt. Architecture value
  and mechanism evidence are different questions, so the pre-registered budget
  staged P1-seed0 (architecture gate) before the matched capacity control.
protocol: >-
  Inherited frozen optimized protocol (Adam lr 1e-3, wd 1e-5, batch 128, max
  240, patience 40, no scheduler, L1, best official-valid, single stage).
  Candidate: shared phi = 16->24->24 (ReLU), permutation-invariant mean of
  phi(q) per (centre,bucket) = z_ib in R^24, u_ib = [z_ib ; log1p(n_ib)] in
  R^25, shared rho = 25->33->33 (ReLU, final Linear zero-init), a^P1 = a^fixed
  + rho(u) as a residual; empty bucket residual exactly 0; R = 302D; centre
  update input 213D; 102,601 params. Fixed moments retained as residual path.
  No relation refresh (q computed once), no attention, no change to tokenizer /
  radius / patch encoder / pair definition / relation descriptor / q dim / pair
  encoder / bucket count / centre-update architecture / final pair moments /
  global descriptors / topology branch / graph head / optimizer / lr / batch /
  wd / horizon / patience.
