alternatives_rejected:
  - item: purchase the matched post-pooling capacity control after a sub-threshold seed0
    because: >-
      pre-registered rule: do not pay for the control unless the architecture
      itself clears +0.004 valid MAE; a whole-architecture gain below the gate
      makes a mechanism run uninformative.
  - item: run seed1 to "see"
    because: >-
      seed1 is conditional on seed0 passing BOTH the architecture gate and the
      mechanism gate; only P1 seed0 runs first.
  - item: rescue with attention / wider phi or rho / sum or max pooling / bucket
      embedding / centre conditioning / q refresh / deeper composer
    because: >-
      each is explicitly forbidden in this stage; a gain requiring them would be
      a different architecture family / a different pre-registered hypothesis.
  - item: load official test
    because: hard-locked throughout architecture development.
consequences:
  - >-
    The minimal learned pre-pool relation-composition hypothesis is closed in
    the form q -> mean(phi(q)) -> rho -> 33D residual; compact-v4-hinge remains
    the current candidate.
  - >-
    The pre-pooling mechanism is untested (not refuted): the architecture gate
    failed first, so no mechanism claim is made in either direction.
  - >-
    Outputs committed under results/compact_v4_learned_centre_composer/ (lock,
    audits, integrity gates, stage1 result/decision, common-input bulk,
    composition diagnostics, final decision, Q1-Q20, curve, 2 figures) and
    notes/compact_v4_learned_centre_composer.md; tests 22 pass.
revisit_if: >-
  Reopen only with a genuinely different, independently pre-registered
  hypothesis (e.g. P2 one-shot relation refresh h -> q -> h' -> q') that does
  not depend on this minimal residual-composer form clearing +0.004 first. Do
  NOT tune phi/rho width, pooling, activation, bucket embeddings or residual
  scaling to rescue this result, do NOT add attention or centre conditioning,
  and never load official test without a separate authorisation.
