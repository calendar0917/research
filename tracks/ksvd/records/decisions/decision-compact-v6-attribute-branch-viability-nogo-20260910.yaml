decision_id: decision-compact-v6-attribute-branch-viability-nogo-20260910
kind: decision
study_id: zinc-context-gap
created: '2026-09-10T18:47:00'
decision: >-
  CLOSE -- TOPOLOGY-ATTRIBUTE FACTORIZATION, permanently. Outcome 2: BRANCH REPAIRED,
  ARCHITECTURE NO-GO. The frozen historical compact-v4-hinge patch path stays the
  ZINC-12k representation. Stop the compact-v6 attribute branch: no init-scale sweep,
  no attribute-dimension increase, no deeper attribute MLP, no extra role features,
  no dictionary/KSVD route, no topology/attribute gate. Seed 1 is not run.
because: >-
  (1) Root cause verified by gradient trace: the original zero-initialised final fusion
  makes e_attribute exactly zero at step 0, so the entire upstream attribute branch and
  the eight new patch_encoder columns receive EXACTLY zero gradient at step 0 (only the
  final 10->8 projection is trainable then); over the canonical training the attribute
  encoder's nonlinear layers degenerate to a near-constant function and e_attribute
  becomes a constant (per-patch std 7.6e-12) absorbed by the following LayerNorm, giving
  exact shuffle invariance. (2) The minimal pre-registered repair (only
  attribute_fusion_init zero -> normal(std=0.01)) makes the branch demonstrably active
  over 100 optimizer steps: V1 e_attribute patch std 3.87e-4 (>1e-4), V2 final/upstream/
  patch-column gradients alive, V3 role-shuffle max |delta| 3.70e-5, V4 attr-zero
  ablation max |delta| 1.38e-2 -- all pass. (3) Nevertheless the fresh seed-0 full run
  (canonical 60 epochs, test blocked, params 101,083) gives valid MAE 0.170209 vs the
  canonical v4 seed-0 0.170066: delta -0.000143, below the +0.003 GO gate, and the
  branch re-degenerates to a near-constant output (per-patch std 3.62e-7; role/type
  shuffle mean |delta| ~1.2e-7). (4) Bulk gate fails: historical Q1/Q2 combined
  degradation +0.023831 (gate <= +0.002), with the whole gain coming from Q5 (+0.051138)
  -- the same redistribution fingerprint as the original collapsed v6 and the corrected
  exact tokenizer. (5) Per the pre-registered rule (seed-0 performance AND mechanism)
  this is a STOP AT SEED0; the repaired branch cannot produce a reproducible seed-0 gain,
  so the branch is closed permanently rather than tuned.
alternatives_rejected:
- because: >-
    The repaired branch passes the 100-step viability gate, so the previous
    "could not test placement" caveat no longer applies; a demonstrably active branch
    still gives no seed-0 gain (delta -0.000143) and re-collapses under full training.
  item: CONTINUE -- topology-attribute factorization (compact-v6-viable) to seed 1 / 4 seeds
- because: >-
    The seed-0 viable model shows the same easy-bulk-vs-hard-tail redistribution
    fingerprint (Q1/Q2 degradation +0.023831; Q5 gain +0.051138), so an apparent
    whole-model gain is not an attribute-placement effect.
  item: GO on the Q5 hard-tail improvement alone
- because: >-
    The only code change is the final projection init; a different scale, an attribute
    dimension change, a deeper attribute MLP, or extra role features would be tuning a
    branch that has already been shown, once active, to yield no reproducible gain.
  item: tune the repair (init scale / attribute dim / role features / MLP depth)
- because: >-
    The count-only control gave no gain and the factorized branch is placement-insensitive
    at convergence; composition alone is not the missing signal.
  item: attribute-composition-only encoding (count control) as a standalone route
- because: >-
    No evidence in this stage supports a dictionary/KSVD, message-passing, ring-node,
    gate, pooling or graph-head change as a follow-up to this collapse.
  item: open dictionary/KSVD, attention, message passing, or a topology/attribute gate
revisit_if: >-
  Only a fundamentally different architecture stage may reopen the factorization
  question, and it must carry its own pre-registered graph-side-observable gate and a
  fresh seed sweep. Specifically NOT reopenable by: tuning this repair, re-reading the
  original collapsed seed-0 checkpoint as evidence, or varying the 8D appended-embedding
  realisation. The prior revisit condition (fix the zero-init collapse and re-test) is
  hereby discharged: the collapse was diagnosed and fixed, and the repaired branch still
  fails the seed-0 performance+breadth gates.
