decision_id: decision-e2e-dictenv-t1-stop-mechanism-lost-20260924
created: '2026-09-24T06:58:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  E2E-DictEnv-v0 established that a task-coupled sparse pure-topology dictionary
  can be the only fine-grained learned structural coordinate of a
  no-message-passing environment model, that it is dictionary-specific
  (G_sparse = +0.1675 over a parameter-identical dense tied coordinate) and
  assignment-mediated (G_assign = +0.0173, G_dict-use = +0.8548), but that its
  absolute band is weak (M_S = 0.145508, just above the 0.145 viable boundary).
  T1 asked the single diagnostic question: is that ceiling caused by a weak
  dictionary core, or by an unnecessarily compressed dictionary->environment
  interface and an over-constrained reconstruction/task balance?  Only three
  axes were authorised (interface, lambda, horizon) with a hard budget of 6 new
  full Sparse runs.
protocol: >-
  Local-first implementation with targeted CPU tests, preregistration frozen
  before any run, then remote A100 execution under the remote-research-runner
  workflow at commit 3c13c816cede53e5e03d5933fdada5e908561201.  Frozen backend
  identical to v0 (phi65 FSAR-R2-AR0, K=32, s=8, 10 unrolled tied-IHT steps,
  SDB-v0 K-SVD D init, tied encode/reconstruct, task-coupled D, no message
  passing / recurrence / attention / pair->centre / relation refresh / typed
  lookup).  The environment decoder input becomes z_i = [x_i^146 ; m_i^D], where
  x_i^146 is the exact FEC-S0 factorized train-fit-standardized 146-D coarse
  chemistry descriptor (checked by gate G0b, max_abs 0.0) and m_i^D is the
  dictionary->environment code; v0's separate 16-D bond marginal is removed
  because bond chemistry is already in x_i^146.  Stage A: A1 pooled64 (z 210),
  A2 slot48 (z 290), A3 slot64 (z 338).  Stage B: lambda_0 = 135.834928 and
  0.5x / 0.25x.  Stage C: conditional 320 epochs.  Training: Adam 1e-3, wd 1e-5,
  batch 128, L1 + lambda_rec * normalized reconstruction, clip 5, no scheduler,
  240 epochs, fixed Top-5 soup, seed 0.  Official valid = tuning set; official
  test = terminal reporting only, loaded exactly once after the freeze.  All 32
  correctness sub-gates PASS; CPU suites 15/15.  Operational note: the first
  monolithic launch was split so independent tuning runs could use both A100s
  (runner extended with --only); a leaked orphan process from the aborted first
  launch was detected via nvidia-smi and killed, and A3 was restarted from
  scratch on the idle GPU1 after GPU0 proved contended.
