decision: >-
  STOP E2E-DictEnv-T1 with frozen verdict E2E_DICTENV_TUNED_MECHANISM_LOST
  (pre-registered case 4, precedence over the Breakthrough absolute band and the
  seed-1 specificity pass).  Record the answer to the diagnostic question - the
  0.145 ceiling was an interface/architecture property, not a weak dictionary
  core - together with the mechanism loss: the authorised interface (exact
  146-D coarse chemistry exposed alongside the dictionary code) gives the reader
  a dictionary-independent pathway, so the dictionary is no longer load-bearing.
  Do NOT claim a dictionary-core success for the tuned configuration, do NOT
  reinterpret the accuracy gain as a dictionary win, and do NOT buy a rescue
  (K/s/IHT/LISTA/dictionary-count/attention/MP/recurrence/reader/optimizer
  change, no 400/500-epoch run, no new lambda).  The round is closed; any next
  step requires a new preregistration.
because: >-
  The absolute result is unambiguous and large: moving only interface, lambda and
  horizon lifted the fixed Top-5 soup official-valid MAE from v0's 0.145508 to
  0.125765 (+0.019743), into the pre-registered Breakthrough band and 0.004657
  below the FEC-S1 static-composition anchor, with K, s, IHT, the K-SVD D init
  and the tied coding operator untouched - a weak dictionary core cannot explain
  that, so the ceiling was architectural.  The frozen seed-1 pair also confirms
  specificity (Sparse 0.125496 vs DenseTied 0.131315, G = +0.005819 >= 0.003).
  However the pre-registered mechanism layer, which the decision table places
  first, fails: neutralising the dictionary coordinate costs only +0.017903 MAE
  (v0: +0.854839) and the 5-permutation assignment shuffle costs only +0.007628
  (below the 0.010 gate; v0: +0.017289), while dictionary health passes on every
  tag.  The mechanism is visible in the architecture: the decoder input is
  z_i = [x_i^146 ; m_i^D] with E = env_mlp(z), so alpha -> 0 removes only m_i^D
  and leaves the coarse descriptor, and the model predicts almost as well.  Two
  sub-findings reinforce this and are worth carrying forward: the pooled
  interface makes the task loss exactly detached from the dictionary
  (||dL/dD|| = 0 after a real backward pass, versus 0.0795/0.0339 for the slot
  candidates), and structural health is not behavioural load-bearing (a fully
  health-PASS dictionary whose removal barely changes the output).  Recording
  the mechanism loss rather than the headline number keeps the round's claim
  honest and preserves the v0 dictionary-core finding as the reference.
alternatives_rejected:
  - >-
    Reporting the tuned configuration as a dictionary-core success because it
    reached the Breakthrough band and passed the seed-1 specificity gate.
    Rejected: the pre-registered precedence runs mechanism loss first; a
    dictionary whose removal costs 0.018 MAE is not the predictive core.
  - >-
    Reinterpreting G_dict-use = 0.017903 as still "load-bearing" because it is
    above the 0.010 gate while treating G_assign = 0.007628 as a marginal miss.
    Rejected: the two interventions are independent and agree, and the 48x
    collapse against v0 is far outside execution noise; the honest label is
    mechanism loss with a marginal absolute shuffle margin.
  - >-
    Running more seeds or a 400/500-epoch run to try to restore the mechanism or
    push the absolute number further.  Rejected: forbidden by the frozen budget
    and stop rule; the budget (6 Sparse runs) is spent.
  - >-
    Rescuing load-bearing by re-weighting lambda or shrinking the coarse channel
    after seeing these results.  Rejected: that is a new architecture question,
    not an authorised change, and would be tuned on the same valid set.
revisit_if: >-
  A new preregistration asks either (a) for an interface that keeps the coarse
  signal's accuracy but forces the reader's prediction through the dictionary
  coordinate (so that alpha -> 0 and assignment shuffle are destructive by
  construction), with the mechanism gates rather than MAE as the primary success
  criterion; or (b) whether the coarse-chemistry interface alone (dictionary
  removed) is simply a stronger backbone, in which case whether to keep the
  dictionary becomes an explicit engineering trade rather than a mechanism
  claim.  Neither is authorised by E2E-DictEnv-T1.
