alternatives_rejected:
  - Do not run hidden-size, aggregation-type, number-of-layers, attention,
    T=3/T=4, or path/cycle-feature sweeps to rescue this operator.
  - Do not interpret the seed0 weak positive as a representation gain; it does
    not replicate and the matched-epoch profile is late/unstable.
  - Do not attribute the seed1 early/mid advantage to a final representation
    gain; the recurrent model converges to the same final MAE.
  - Never load official test for this operator.
consequences:
  - The direct shared-k relational-composition operator is closed as a
    no-independent-signal result.
  - The recurrent pair--centre T=2 model (validated 2/2 seeds, test mean
    0.114951) remains the best compact-v4-smallhead variant on this line.
  - Remaining relation-persistence options are all now weak/no-go; if the line
    is revisited it must be with a genuinely different mechanism and a fresh
    pre-registration.
revisit_if: >-
  Reopen only with an independently pre-registered mechanism that is not a
  variant of the shared-k composition tested here, or with a matched-capacity
  control showing the extra parameters are not the source of any future gain.
  Do not layer composition onto the current recurrent model again.
