decision_id: decision-compact-v4-pair-to-pair-nogo-20260913
created: '2026-09-13T12:10:00'
kind: decision
study_id: zinc-context-gap
decision: >-
  Run one minimal, parameter-scoped direct pair-to-pair composition experiment
  on the validated compact-v4 recurrent pair--centre model: after the first
  recurrent round (h0 -> q0 -> A0 -> h1 -> q1 = Q(h1)), compose relations
  through a shared intermediate k, q1*_ij = q1_ij + phi(q1_ij,
  mean_k psi(q1_ik, q1_kj)), and feed q1* into the existing second centre
  aggregation and pair readout. Verdict: NO INDEPENDENT SIGNAL. Seed0 was a
  weak positive (+0.001388) but seed1 was a near-exact tie (+0.000066); the
  mean (+0.000727) lies inside the pre-registered +/-0.001 no-signal band.
  Two seeds show opposite matched-epoch profiles (seed0 wins only late;
  seed1 wins early/mid but converges to the same final MAE). Stop the
  pair-to-pair line; no hyper-parameter sweep and no more complex variants.
why_this_experiment: >-
  The feedback-control study (decision-compact-v4-recurrent-feedback-controls)
  showed that the refreshed relation's value requires re-entering the centre,
  not merely a better final pair representation. The cheapest next test of
  whether relations can exchange information directly (rather than only
  through the centre aggregate) is a shared-k pair-to-pair composition before
  the second centre aggregation, with the first recurrent round kept exactly
  unchanged.
protocol: >-
  Inherited frozen compact-v4-smallhead protocol verbatim (Adam lr 1e-3,
  wd 1e-5, batch 128, max 240, patience 40, no scheduler, gradient clip 5.0,
  L1, best official-valid). Matched reference = the validated recurrent T=2
  model (82,115 params; seed0 0.138376, seed1 0.133440). Candidate adds only
  two small MLPs: psi Linear(48->24)->ReLU->Linear(24->16) on
  [q_ik+q_kj; |q_ik-q_kj|; q_ik*q_kj] and phi Linear(32->24)->ReLU->
  Linear(24->16) on [q_ij; mean_k psi], phi last layer zero-initialised.
  q1* replaces q1 in both the second centre aggregation and the pair readout;
  P/Q/U stay weight-tied; no attention, no new relation descriptor, no
  tokenizer/patch/global/topology/readout/head/optimizer change. Only real
  (i,k)/(k,j) triples are enumerated via cached per-graph-size local patterns;
  no dense (i,j,k) tensor. Seed0 run first; seed1 run only after the
  pre-registered weak-positive seed0 result.
