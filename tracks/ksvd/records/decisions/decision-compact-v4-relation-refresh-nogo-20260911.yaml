decision_id: decision-compact-v4-relation-refresh-nogo-20260911
created: '2026-09-11T23:40:00'
kind: decision
study_id: zinc-context-gap
decision: >-
  Run the single authorise-and-stop falsification of the P2 hypothesis: the final
  graph representation currently mixes the contextualized unary state h^(1) with
  the stale pre-context relation state q^(0); replacing q^(0) in the final pair
  summary with one parameter-shared refresh q^(1) = Q(P(h^(1)), r) should make
  the final relation representable at the same contextual stage as the final
  endpoints. Staged as: (Stage A) a zero-training, label-free staleness-magnitude
  audit that either STOPS on near-identity or authorizes exactly one seed0 run;
  (Stage B) P2 seed0 with a +0.004 architecture gate. Verdict: Stage A ADVANCED
  (relation drift is non-trivial) but Stage B is Decision Case B - ONE-SHOT
  RELATION REFRESH NO-GO. P2 seed0 valid 0.144457 vs reused optimized compact-v4
  seed0 reference 0.146420 -> delta_P2,0 = +0.001963, a sub-threshold positive
  strictly below +0.004. Budget rule honoured exactly: only ONE new
  full-training run was spent; seed1 was NOT purchased.
why_this_experiment: >-
  P1 (learned centre composition) closed NO-GO and it was explicitly stated that
  P2 is a SEPARATE pre-registered hypothesis, not a rescue. P2 tests computation
  ORDERING / shared-operator reuse at the exact site P1 did not touch: compact-v4
  computes q_ij once, before the centre update, but then pools that pre-context
  relation into the same final readout as the post-context unary state. P2 asks
  only whether the explicit relation object should be re-evaluated (with the same
  learned operator) once the endpoint states have changed. It adds exactly zero
  parameters, so any gain cannot be attributed to extra capacity.
protocol: >-
  Inherited frozen optimized protocol (Adam lr 1e-3, wd 1e-5, batch 128, max 240,
  patience 40, no scheduler, L1, best official-valid, single stage). Candidate:
  compact-v4 unchanged through centre contextualization; one parameter-shared
  refresh u^(1) = P(h^(1)), q^(1) = Q(u^(1), r) reusing the SAME pair_projection,
  pair_encoder, relation_encoder, distance_gate tensors and the same r_ij; final
  pair moments pool q^(1); q^(1) does not feed a centre update; refresh count = 1;
  no alpha mixing; no concat; R = 302D; total params = 99,613 (delta 0). Stage A
  probe = 2000 official-train molecules from the reused target-independent
  deterministic hash split (train_probe role of
  optimized-manifold-broad-state-screen-v1-20260919). No change to tokenizer /
  radius / patch encoder / pair definition / relation descriptor / q dim / bucket
  count / centre pooling / final pair moments / global descriptors / topology
  branch / graph head / optimizer / lr / batch / wd / horizon / patience.
