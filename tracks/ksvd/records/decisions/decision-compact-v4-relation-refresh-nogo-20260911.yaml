alternatives_rejected:
  - item: run seed1 to "see" even though seed0 gain is +0.001963
    because: >-
      pre-registered rule: a sub-threshold positive (even +0.002/+0.003) still
      STOPs; expensive full training is continued only for clear architecture
      effects (>= +0.004 on seed0). No seed2/seed3 exist in this stage.
  - item: rescue with a second refresh / depth sweep (T=2,3,4) / separate q1
      weights / alpha mixing / concat [q0;q1] / attention / larger q dim /
      learned pooling / P1 composer / new or changed topology
    because: >-
      each is explicitly forbidden by the P2 mandate; a gain that requires them
      is a different (generic message-passing) architecture family, not the
      one-shot explicit relation refresh under test.
  - item: report the seed0 gain as a GO and buy seed1
    because: >-
      +0.001963 < +0.004; the mandate forbids continuing seed1 below the gate.
  - item: treat Stage A's non-negligible drift as evidence that refresh helps
    because: >-
      Stage A is a label-free magnitude audit, not a performance test; it only
      establishes that the refresh is non-trivial enough to spend one seed0 run.
  - item: load official test
    because: hard-locked throughout architecture development.
consequences:
  - >-
    The one-shot parameter-shared relation-refresh architecture (q^(1) replacing
    q^(0) in the final pair summary) is closed under this protocol; compact-v4
    remains the current candidate.
  - >-
    Positive but sub-threshold signal: the trained model does depend on q^(1)
    (refresh-off valid 0.175 vs on 0.144), so the branch is real and used, but
    the effect does not clear the bar. No mechanism-isolation claim is made
    (refresh-off is a dependency check only).
  - >-
    Together with P1 (learned centre composer NO-GO) and compact-v4-cell (cycle
    object NO-GO), a clean P2 failure weakens the "compact-v4 just has a small
    local computation-ordering defect" explanation and points future work toward
    broader representation-family / parameter-allocation redesign rather than
    further local patches of the existing computation graph.
  - >-
    Outputs committed under results/compact_v4_relation_refresh/ (Stage A lock,
    probe manifest, integrity gates, drift/prediction-shift metrics and decision;
    Stage B architecture/parameter/init/compute audits, seed0 result/decision,
    common-input bulk, mechanism diagnostics, final decision, Q1-Q20, curve, 3
    figures) and notes/compact_v4_relation_refresh.md; tests 24 pass.
revisit_if: >-
  Reopen only with a genuinely different, independently pre-registered
  hypothesis at the same site (e.g. a single refresh that is NOT parameter
  neutral, or a refresh whose cost is reduced by parameter reallocation). Do NOT
  tune the refresh count / placement / q width / pooling / mixing to rescue this
  specific NO-GO, do NOT stack P1 + refresh + cells + attention at once, and
  never load official test without a separate authorisation.
