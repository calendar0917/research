study_id: zinc-context-gap
decision: >-
  Register the final SBCI diagnostic: FIT_DEPENDENT_FRONTIER_CROSSING. At matched
  D3600 empirical training fit, SBCI's 800 generalization difference materially
  crosses zero (3 anchors >= +0.003, 3 anchors <= -0.003), so no next
  architecture family can be inferred from the SBCI failure. Do NOT authorize
  Shared Structural Operator Dictionary (SSOD); do NOT authorize Direct Shared
  Structural Potentials (DSP); do NOT rescue SBCI; do NOT run seed1; do NOT run
  a fourth SBCI diagnostic (no fit-bin subdivision, no 5/9/11 anchors, no
  tolerance/threshold sweep, no subgroup analysis); do NOT train anything; do
  NOT load official valid or official test. Close the SBCI branch for
  architecture inference.
why_this_experiment: >-
  The prior fit triage was mixed (RAW better for SBCI, SOUP worse, dF_min just
  over the gate, dF_late the other way), so it could not separate an
  endpoint-fit confound from a genuine matched-fit generalization ordering. The
  clean way to decide between "capacity/over-constraint failure" (DSP) and
  "wrong inductive bias despite adequate fit" (SSOD) was to match individual
  frozen RAW trajectory snapshots by D3600 training fit, fully blind to
  held-out performance, and then compare the locked pairs on 800, with 2000
  reserved for conditional confirmation.
protocol: >-
  Zero-training, three-firewall diagnostic. Exact index-for-index reuse of the
  N3600/I0/T0 environment: D3600 sha256 3be9f7e1..., same 800/2000 index hashes,
  subset salt compact-v4-sample-efficiency-nested-subset-v1-20260912; Adam
  lr 1e-3 wd 1e-5 batch 128 L1 no scheduler clip 5.0, max 13680 steps, eval
  interval 57, patience 40; 20 shared tensors bit-identical (max_abs_diff 0.0).
  Phase F: recompute every saved snapshot's D3600 train MAE in model.eval()
  (208/208, max|diff| vs stored 0.0), exclude steps < 0.25*5814 = 1453.5,
  build the common fit overlap and K=7 anchors, deterministic minimum-cost
  matching with later-step tie-break, SHA-256 lock before any 800 access.
  Phase G800: evaluate only the six valid locked pairs on the 800
  selection-generalization set. Phase G2000: only if Stage 1 authorizes it;
  here it did not, so 2000 was never opened.
