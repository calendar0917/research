decision_id: decision-compact-v4-recurrent-feedback-controls-20260912
created: '2026-09-12T15:36:00'
kind: decision
study_id: zinc-context-gap
decision: >-
  Run two low-cost mechanism controls on the compact-v4-smallhead recurrent
  pair--centre line, without any architecture sweep and without official test:
  (A) stale seed1 replication of the depth-only control, and (B) a
  parameter-neutral one-shot late-refresh variant on seed0 in which A^(0) is
  replayed into both centre updates and q^(1) is recomputed from h^(2) but fed
  only to the pair readout. Verdict: the seed0 "gain is mostly depth" reading
  does NOT replicate (stale is worse than baseline on seed1), and late-refresh
  does not beat stale while recurrent clearly beats late-refresh. The relation
  refresh therefore earns its gain through feedback into the centre, not as a
  standalone final pair representation. Next: persistent relation /
  direct pair-to-pair composition, not K=3 centre depth.
why_this_experiment: >-
  The seed0 depth-only stale control sat between baseline and recurrent, which
  suggested most of the T=2 gain was extra centre depth and only ~+0.0021 came
  from the refreshed relation. Two cheap falsifications were needed: (A) does
  the baseline > stale > recurrent ordering replicate on seed1, and (B) is the
  refresh-over-depth increment explained by a better final pair representation
  alone (late-refresh) or does the refreshed relation have to re-enter the
  centre (recurrent)?
protocol: >-
  Inherited frozen compact-v4-smallhead protocol verbatim (Adam lr 1e-3,
  wd 1e-5, batch 128, max 240, patience 40, no scheduler, gradient clip 5.0,
  L1, best official-valid, single stage). stale seed1 uses the existing
  recurrence_mode="stale" builder. late-refresh adds the mode
  recurrence_mode="late_refresh": A^(0) pooled once from q^(0), replayed into
  both centre updates (centre path bit-identical to stale), then
  q^(1)=Q(h^(2)) recomputed and consumed only by pair_moments. P/Q/U remain
  weight-tied; no hidden-dim, tokenizer, relation descriptor, readout, head,
  optimizer, or protocol change. All variants built with the exact shared
  baseline initialisation and the same training loop.
