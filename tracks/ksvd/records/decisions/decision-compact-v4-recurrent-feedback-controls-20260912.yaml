alternatives_rejected:
  - Do not claim the seed0 depth-only ordering replicates; stale is worse than
    baseline on seed1.
  - Do not attribute the refresh increment to a better final pair
    representation alone; late-refresh is worse than stale on seed0.
  - Do not run a K=3 centre-refinement-depth sweep on the strength of this
    evidence; the feedback path, not extra depth, carries the refresh gain.
  - Do not add attention, path features, extra statistics, per-round weights,
    or a larger q dimension.
  - Never load official test for these controls.
consequences:
  - The depth-only explanation of the recurrent gain is weakened; the stale
    effect is seed-specific and can be negative.
  - The late-refresh result localises the refresh benefit to the feedback of
    q^(1) into the centre.
  - The next pre-registered experiment should be a parameter-neutral,
    matched-depth persistent relation / direct pair-to-pair composition.
revisit_if: >-
  Reopen the depth-only interpretation only with a matched-horizon multi-seed
  stale run (including seed1) and a matched-epoch analysis. Reopen the
  late-refresh interpretation only with a late-refresh seed1 replication.
