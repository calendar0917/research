decision_id: decision-zinc-cga-v0-deprioritise-local-dictionaries-20260923
created: '2026-09-23T00:00:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  The recurring question after SRDA-v0 / SDPK-v0 / DTX-v0 was whether the strong
  recurrent pair-centre model has an advantage that strict-static local
  dictionaries cannot replicate - i.e. whether the same local environment, in
  different molecule contexts, produces substantially different contextual
  states after recurrence, and whether that contextualization drives the
  recurrent gain. Resolving it decides whether to keep investing in
  local/pair/topology-cross dictionary designs or to stop them.
protocol: >-
  Local-first implementation (13 targeted CPU tests pass) under the
  remote-research-runner workflow (local Git as source of truth, deploy.sh,
  uv sync --frozen, research doctor, detached launch, pull results). HARD
  BUDGET: 0 new full training runs; only existing-checkpoint deterministic CPU
  inference / state export and train-only, target-free probes. Preregistration
  frozen at commit c174ab3 including Amendment A1 (measurement robustness).
  Data policy: train-only neighbour index / prototypes; official valid as
  queries (no y in representation audits A/B/C); official test never loaded.
  Primary comparator: recurrent_seed{0,1} vs matched baseline_seed{0,1}
  (82,115 params, equal protocol/seed/local machinery/budget). Auxiliary:
  B-Null seed0. Primary metrics: k=16 train-h0 NN; P_local / P_context /
  context_abs_gain; matched-random retention ratio; K=64 target-free spherical
  k-means (fixed seed, no tuning, no sweep); Spearman(C_h, gain) with 10,000
  bootstrap 95% CI and quartile gain.
results:
  preregistration_commit: c174ab3
  formal_run_commit: c174ab36c14e69059be43b7bbe9ff977433bdcf1
  decision: C_CONTEXTUAL_STATE_LOCALLY_COMPILABLE
  integrity_passed: true
  official_test_loaded: false
  new_full_training_runs: 0
  seed0:
