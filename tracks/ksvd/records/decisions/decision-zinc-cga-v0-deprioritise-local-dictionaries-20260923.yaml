    context_abs_gain: 0.014455189414035863
    retention_dDelta_over_random: 0.26203039288520813
    spearman_C_h_gain: 0.0648989928989929
decision_summary: >-
  CASE C. The recurrence's contextual refinement is 93-96% predictable from the
  local state; context adds only 1-4% of the shift variance (0.6-0.9% of the h2
  variance); the task link is marginal and seed-unstable; the recurrent gain
  (+0.00696/+0.00462 MAE) is therefore not attributable to contextual
  computation.
closure:
  - STOP the local / pair / topology-cross dictionary line as a route to
    recover the recurrent advantage. The three-way evidence chain fails at
    local-unpredictability and task-linked-gain.
  - No seed 2, no sweep, no new architecture, no dictionary rescue, no entropy
    rescue, no new ring feature, no static compiler training this round.
  - Do not re-run these audits with a different K or k as a rescue; K=64 and
    k=16 were frozen a priori and the conclusion is insensitive across two
    seeds and the auxiliary B-Null.
authorized_next_steps:
  - At most ONE bounded preregistered test of a strictly-local two-update
    compiler (per-patch, no pair->centre context, matched depth and parameter
    budget), with a LOW prior because the context residual is small and its task
    link is null. This is a new question and needs its own preregistration.
  - Prefer no new round at all if effort is the constraint; the representation
    result is already sufficient to deprioritise dictionary work.
not_authorized:
  - another local / pair / topology-cross dictionary design
  - retraining the backbone, seed sweep, architecture modification, HPO
  - official ZINC test
alternatives_considered:
  - 'Keep designing local dictionaries: rejected - they target the local
    transformation, which is not the missing ingredient, and previous absolute
    gains were unstable.'
  - 'Accept controlled contextual refinement as necessary: rejected as the
    headline - context is real but explains only 1-4% of the shift and has no
    consistent task link; it is not the bottleneck.'
  - 'Declare inconclusive: rejected - both seeds and the auxiliary B-Null agree
    on high local predictability and small absolute context gain.'
revisit_if:
  - a new backbone/objective changes the local state so that
    context_abs_gain > 0.05 with a task link whose bootstrap CI excludes zero
    in two seeds.
  - the recurrent pair-centre model becomes the production model and the
    compiler question becomes a deployment-latency question rather than a
    scientific one.
