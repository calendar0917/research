decision: >-
  CONTINUE the dictionary-core mainline and treat cross-dataset transferability
  as DEMONSTRATED.  The P1 primitive-only dictionary core transfers to
  OGBG-MolHIV as a valid and terminal architecture with only a label-free
  dictionary re-fit plus a train-only anchor scaler: frozen 2-seed Top-5-soup
  ensemble test ROC-AUC 0.789059, the strongest MolHIV result in this project
  (patch-path-pooling 0.785195, recurrent pair-centre 0.762605) at 102,325
  parameters with no message passing, no recurrence, no attention and no
  pair->centre.  The valid-side verdict M1_TRANSFER_STRONG is NOT revised by the
  test read; the honest terminal band is "competitive".  Two scope limits are
  carried forward rather than reopened: (a) the 5-bucket distance relation
  saturates on MolHIV (52.2% of train node pairs clip into 5+), so relation
  granularity is a live design question for larger molecules; (b) the dictionary
  is re-learned almost entirely during the task phase, so this result does not
  establish that the K-SVD initialisation is necessary.  No further MolHIV
  architecture search is authorised in this round; the MolHIV test is not read
  again.
next: >-
  Carry the dictionary-core mainline forward on the home benchmark: the ZINC
  clean dictionary-core absolute-performance search (E2E-DictEnv-P2-ABS) is the
  active workstream, and its winner defines the next frozen dictionary-core
  configuration.  MolHIV-specific follow-ups (relation granularity, K-SVD-init
  necessity) are recorded as open questions, not scheduled.
