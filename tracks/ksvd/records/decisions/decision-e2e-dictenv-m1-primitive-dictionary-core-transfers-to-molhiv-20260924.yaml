decision_id: decision-e2e-dictenv-m1-primitive-dictionary-core-transfers-to-molhiv-20260924
created: '2026-09-24T12:20:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  E2E-DictEnv-P1 established that a primitive-only, chemistry-free dictionary
  core is absolute-strong and dictionary-load-bearing on ZINC, but that its
  advantage is not specific to sparsity (a parameter-equal DenseTied control
  matched it on valid and beat it on test).  P1's capability was therefore
  demonstrated only inside the ZINC molecular scale.  The open question for the
  mainline was whether the dictionary-core architecture itself is a ZINC
  artefact or a transferable primitive, i.e. whether the same frozen-shape
  primitive-only design can be made valid and terminal on a chemically and
  topologically different benchmark (OGBG-MolHIV) when the only adaptation is a
  label-free re-fit of the topology dictionary on the new train split.
protocol: >-
  Local-first implementation with targeted CPU tests, pre-registration frozen
  before any run, then remote A100 execution under the remote-research-runner
  workflow (preflight -> deploy -> dictionary -> env cache -> anchor scaler ->
  lambda calibration -> correctness G0-G14 -> GPU smoke -> formal seeds ->
  freeze -> analyze -> terminal one-shot test).  Frozen objects: phi65 unchanged
  (fsar_r2_ar0.build_phi); K-SVD dictionary K=32, s=8, IHT=10, epochs=10, seed
  20260924 on a deterministic 500,000-node sample of the 830,936 official-train
  nodes; OGB categorical chemistry embeddings only (atom 24-D, bond 12-D);
  62-D primitive anchor with a train-only per-coordinate scaler; node/edge
  dictionary binding; z_i in R^638 -> 638->102->48 SiLU MLP; 15-D pure-topology
  pair relation with P1's 5 distance buckets; 102,325 parameters; lambda_M =
  0.25 * lambda_base calibrated train-only; horizon 240, patience 40, Adam 1e-3,
  wd 1e-5, batch 128, grad clip 5; Top-5 valid-AUC soup; seeds 0 and 1.  No
  MolHIV architecture search and no architecture tuning of any kind.  Pre-
  registered order: correctness, smoke, seed 0, seed 1, freeze, analyze, then the
  single terminal test read authorised only after the freeze.  Remote GPU0 was
  occupied by a foreign ~37 GB job for the whole round, so GPU1 carried both
  workstreams; a Case-B concurrency gate was executed first and passed
  (T_parallel 6.504 s vs T_M + T_Z 12.484 s, ratio 0.521 <= 0.85; combined peak
  534.8 MiB << 30 GiB; no OOM/NaN).
