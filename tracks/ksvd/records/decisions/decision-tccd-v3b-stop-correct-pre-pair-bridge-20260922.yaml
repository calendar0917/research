decision: >-
  STOP TCCD-v3b at the preregistered L3 Correct-Strong-Local Bridge failure.
  The complete fused B-full pre-pair local state materially improves over the
  historical isolated `e_struct` bridge, but it still does not rescue the
  frozen TCCD-v2 composition and lightweight reader to the registered absolute
  threshold. The failure is not due to locality, freezing, cache mismatch,
  prototype collapse, or composition insensitivity.
alternatives_rejected:
  - item: Reinterpret the result as prototype failure
    because: >-
      PrototypeREL beats DenseREL by 0.012265 MAE and the vocabulary remains
      broad at 64/64 active prototypes with effective count 63.8328.
  - item: Treat composition as unnecessary
    because: >-
      Evaluation-only assignment shuffling worsens valid MAE by 0.277115 while
      relation matrices remain fixed.
  - item: Continue with rescue sweeps
    because: >-
      K, temperature, reader, relation, pair/topology and unfreezing changes
      were explicitly outside the registered diagnostic and would confound the
      interface conclusion.
  - item: Open official test
    because: >-
      Official test access is frozen and the valid-side L3 result is decisive.
consequences:
  - >-
    Historical TCCD-v3 is narrowed to the isolated `e_struct` channel claim;
    its numeric artifacts remain unchanged.
  - >-
    Complete strong local B-full features are useful but insufficient when
    passed through the frozen TCCD-v2 composition/readout interface.
  - >-
    The next legitimate question is an interface or representation-family
    redesign under a new preregistration, not another local-channel or reader
    sweep in this round.
next_action: >-
  NONE auto-authorized. Any follow-up requires a new preregistration; official
  test evaluation remains prohibited.
revisit_if: >-
  A separately preregistered architecture-level study freezes matched controls,
  GPU1 execution, provenance, and the official-test freeze before training.
