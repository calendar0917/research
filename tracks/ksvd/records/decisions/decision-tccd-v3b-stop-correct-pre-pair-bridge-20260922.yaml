decision_id: decision-tccd-v3b-stop-correct-pre-pair-bridge-20260922
created: '2026-09-22T00:00:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  Historical TCCD-v3 tested only the isolated 16-D B-full `e_struct` channel.
  TCCD-v3b corrected the bridge by extracting the complete fused pure-local
  B-full `patch_encoder` output before pair projection and keeping every
  downstream TCCD-v2 mechanism fixed.
protocol: >-
  Preregistered GPU1-only diagnostic, seed 0, official train 10000 / valid
  1000, official test never loaded, frozen source checkpoint, 64-D pre-pair
  `patch_encoder` output, matched Linear(64,64) adapter in DenseREL and
  PrototypeREL, exact TCCD-v2 K=64 vocabulary and C^T R C relations,
  evaluation-only assignment shuffle, vocabulary diagnostics, and no rescue
  sweeps.
