decision_id: decision-e2e-dictenv-p2-abs-adopt-h1-and-target-the-iht-rollout-20260924
created: '2026-09-24T15:40:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  P1 left the dictionary-core mainline absolute-strong but not specific
  (0.131975 valid), and M1 showed the same core transfers to OGBG-MolHIV.  The
  open question for the home benchmark was purely absolute: what is the best
  official-valid MAE this clean primitive-only dictionary core can reach, and
  which pre-registered capacity / weighting axis buys the gain?  P2-ABS answered
  it inside a staged 8-run budget with no reader / LR / activation / dropout /
  attention / MP / recurrence / patch_cont / atom_shell / bond_shell /
  multi-dictionary sweep and with the official ZINC test never loaded.
protocol: >-
  Staged, winner-carries-forward search, one winner per stage, pre-registered
  before any run and frozen at commit 122db5d.  Stage A lambda/horizon
  {Z1 x0.25/h320, Z2 x0.125/h240, Z3 x0.0625/h240} against the P1 reference; Stage
  B hierarchical dictionary-slot decoders {H1 shared compact, H2 shared wider} on
  the Stage-A winner's lambda and horizon; Stage C edge capacity {E64 d_E 48->64};
  Stage D dictionary capacity {K64S8 with a matched ZINC-train re-fit and a
  recalibrated lambda} plus a conditional K64S12 allowed only on a >= 0.001
  improvement.  Every candidate carried a cheap integrity gate (task gradient to
  D, exact top-s, dictionary not collapsed, no forbidden bypass, no MP/recurrence,
  parameter budget).  Remote GPU0 was foreign-occupied for the whole round; a
  Case-B concurrency gate was run first and passed, and the two workstreams shared
  GPU1.  Official ZINC test: not read.
