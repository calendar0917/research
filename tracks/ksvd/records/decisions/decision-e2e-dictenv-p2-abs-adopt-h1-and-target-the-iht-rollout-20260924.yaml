decision: >-
  ADOPT H1 as the frozen clean dictionary-core configuration for the ZINC
  mainline, and RE-AIM the next absolute round at the tied-IHT rollout rather
  than at dictionary or decoder capacity.  H1 (horizon 320, shared compact
  dictionary-slot decoder, 97,487 parameters, everything else identical to P1)
  reaches 0.12354862861608853 official-valid Top-5 soup MAE, a -0.008426
  improvement over P1 and the first entry in the target band.  Every enlargement
  tried inside the frozen sweep surface lost (H2, E64, K64S8), so the winning
  interface is the smallest one.  The reporting-only diagnostic
  (k64_diagnostic.json) shows the frozen 10-step tied IHT is ~700x worse than
  exact OMP on the winning dictionary while still hitting exact top-8, and that
  K64/s8 overtakes K32 once the rollout is lengthened (100 steps: 0.001896 versus
  0.010084).  The binding constraint on this family's absolute performance is
  therefore the coder, not the representation, and a longer / better sparse-coding
  rollout is the highest-value next axis.  The K64S8 row is explicitly NOT
  evidence against K=64 capacities because the mandated lambda recalibration
  (lambda 12.43) confounded it.
next: >-
  Highest-value next round (requires a NEW preregistration, since the IHT step
  count is outside this round's frozen surface): an IHT-rollout round on the H1
  interface, e.g. steps {10, 30, 100} at matched lambda recalibration, with the
  OMP-exact code as an upper-bound reference, and with the MLP decoder readout
  for the optimal-code path as a diagnostic only.  Carry H1 unchanged into any
  other ZINC work in the meantime.  Open questions not scheduled: whether the
  H1 gain survives a second seed, and whether the M1 MolHIV relation-granularity
  limit (52.2% pair clipping) matters for transfer.
