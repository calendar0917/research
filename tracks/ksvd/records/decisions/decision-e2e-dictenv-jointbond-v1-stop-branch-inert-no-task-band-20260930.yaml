decision_id: decision-e2e-dictenv-jointbond-v1-stop-branch-inert-no-task-band-20260930
created: '2026-09-30T00:00:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  The parent round (e2e-dictenv-sem108-v1) left a specific asymmetry: the
  direct shell-resolved interface is strongly load-bearing, the node-level
  dictionary binding is exactly dead (G_node = 0.0, W_A_C/W_A_S at float32
  denormals), and the surviving increment is carried by the edge assignment
  (G_edge = +0.038245). This round tested the single falsifiable follow-up:
  if structure and semantics are bound at the key (per-bond-endpoint) level
  instead of being pooled through the node path, does the fusion become
  load-bearing and move the ~0.13 valid-MAE band? One architecture change, one
  seed-0 trajectory, no baseline rerun, no sweep, no rescue.
protocol: >-
  Local-first implementation with targeted CPU tests, preregistration frozen
  before the run, then the formal control-plane run
  (uv run research run zinc_jointbond_v1 --mode scratch, run id
  20260930-100245-e164e7e7, test_access blocked). CPU only, 8 threads, seed 0,
  320 epochs, official ZINC train 10000 / official valid 1000. Parent parameters
  keep the exact build_sem108_model RNG stream and are bit-identical; the
  branch is initialised afterwards. Required correctness gates J0-J13 ran and
  passed before the 64-step smoke and before training; then frozen-soup
  interventions (branch off, residual-code zero, branch-local residual-code and
  atom-type row shuffles at seeds 101/202/303) plus the parent probes. No
  matched control (the pre-registered rule for buying one was not met), no
  seed 1, no parameter search, official test never loaded.
