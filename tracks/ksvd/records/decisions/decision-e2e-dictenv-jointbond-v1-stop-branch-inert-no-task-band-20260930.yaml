decision: >-
  STOP the key-level joint structure-semantics branch. Do not run a matched
  control, seed 1/2, a width/init/gate rescue, a bias/norm variant, or a
  retrained branch-off arm in this round; do not open the official test. Record
  the negative mechanism result and move the line to the optimizer-level
  diagnostic below under a new preregistration.
because: >-
  The branch has exactly zero causal benefit at the endpoint: G_branch_off = 0.0
  exactly (every prediction bit unchanged when j_uv is removed), and the
  residual-code zero probe and both branch-local shuffles at seeds 101/202/303
  each reproduce M_S = 0.12793026330223073 bit-for-bit. The state explains why:
  every branch tensor is at the float32 denormal floor (absmax ~7.0e-38), so
  joint_A underflows to exactly 0 and j_uv = F(0)*(bB) = 0. The branch was
  already numerically sub-resolution at initialisation (response norm 2.2e-02
  vs a parent edge response of O(1); prediction influence 5.96e-06; first-epoch
  dL/dA = 1.73e-06) and Adam's L2 weight decay (wd=1e-5) then annihilated it
  against a gradient that reads exactly 0.00e+00 from epoch 20 on. The channel
  was also redundant: the frozen parent edge path still carries the same
  content (W_E_C 0.636, W_E_S 0.564, G_edge +0.026822, G_sem_shuffle +0.573315)
  while the parent's node binding is dead at the same denormal scale. The task
  band did not move: M_S = 0.127930 > 0.123, and the +0.004225 gap to the
  historical unmatched parent soup cannot be attributed to the branch (with the
  branch exactly inert the soup is a Sem108 parent, so the gap is a
  trajectory-level difference between two single unmatched runs). Both clauses
  of the pre-registered matched-control rule fail (band <= 0.123 AND
  G_branch_off >= 0.003), so buying a control would spend budget on an arm
  whose mechanism is already known to be inert.
alternatives_rejected:
  - >-
    Buying the matched branch-off control because G_branch_off is only 0.000.
    Rejected: the measured branch effect is exactly zero, not merely below the
    0.003 gate; a retrained control would answer a question the frozen-soup
    interventions have already answered decisively.
  - >-
    Rescuing the branch (larger F init, tanh/linear gate, bias, LayerNorm,
    wider hidden width, no weight decay on the branch). Rejected: forbidden by
    the round, and it would be an architecture rescue of a channel that is both
    numerically dead and redundant with the live edge channel.
  - >-
    Reading the +0.004225 gap to the parent soup as "the branch hurts".
    Rejected: G_branch_off = 0.0 exactly proves the endpoint branch contributes
    nothing; the gap mixes seed/RNG trajectory effects and the early
    (pre-denormal) branch perturbation of the shared dictionary and cannot
    isolate a mechanism.
  - >-
    Declaring a candidate signal on the strength of the branch's well-formed
    swap response (J5/J6). Rejected: response shape at untrained scale is not a
    trained mechanism; the trained branch is exactly inert.
revisit_if: >-
  A preregistered optimizer-level diagnostic shows the Adam-L2-decay/denormal
  attractor can be switched off (e.g. no weight decay on residual channels, a
  denormal guard, or a decoupled-decay formulation) and that the frozen Sem108
  parent's dead node binding (W_A_C 7.04e-38, W_A_S 7.06e-38, G_node = 0.0) is
  revived by that single change. Only then does a key-level binding round
  (additive, unit-scale init, matched controls, >= 2 seeds, mandatory liveness
  gates |w|max > 1e-3 and G_branch_off >= 0.003 before any task
  interpretation) become a candidate next experiment.
