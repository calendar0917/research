decision_id: decision-e2e-dictenv-jointbond-decay-diagnostic-v1-no-branch-rescue-optimizer-attractor-next-20260930
created: '2026-09-30T00:00:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  JointBond-v1 could only report that its added branch ended exactly inert
  (all joint_* tensors at the float32 denormal floor 7e-38, G_branch_off = 0.0,
  dL/dA = 0.00e+00 from epoch 20).  That left three competing explanations
  unresolved: (a) an initialisation/parameterisation that is numerically
  untrainable, (b) Adam's coupled L2 weight decay annihilating the branch, and
  (c) the key-level structure-semantics signal being redundant with the parent.
  This round isolated (a) and (b) with a 2 x 200-step diagnostic under a frozen
  parent, a fixed input and the identical non-zero initialisation.
protocol: >-
  Pre-registration frozen before the run (notes/
  e2e_dictenv_jointbond_decay_diagnostic_v1_preregistration.md); implementation
  and control-plane entry committed before the promoted run; single formal run
  through the control plane (uv run research run
  zinc_jointbond_decay_diagnostic_v1 --mode scratch, run id
  20260930-114703-8e2b5e5e, test_access blocked).  Frozen parent = original
  Sem108 soup checkpoint (canonical sha 7a721984...), verified by hash, never
  updated and never retrained.  One fresh JointBond-v1 branch initialisation
  (seed 0, v1 architecture/init exactly) deep-copied into two arms that differ
  only in Adam weight decay (1e-5 coupled L2 vs 0.0); fresh identical optimizers
  containing only the 5 branch tensors (4224 params), global clip 5, eval()
  (dropout off) with autograd through the frozen parent, C6 mask, L1 objective.
  Official train only: seed-0 permutation, fit = first 128 graphs repeated for
  200 steps, probe = next 128 disjoint graphs as observation only.  15
  pre-training gates D0-D12 (parent identity, fresh-and-alive branch, arm
  identity, step-0 prediction identity, branch-off == frozen parent bit-wise,
  optimizer identity, coupled-L2 probe, no parent update, data provenance,
  training graph, reporting self-test) all passed before step 1; official valid
  and test never loaded; no soup, no second seed, no architecture change.
