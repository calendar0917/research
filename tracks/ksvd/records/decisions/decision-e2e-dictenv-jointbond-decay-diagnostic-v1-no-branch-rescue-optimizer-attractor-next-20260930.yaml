decision: >-
  Do NOT open a new full training experiment for the JointBond key-level branch
  (no JointBond-v2, no larger/zero init, no gate/bias/normalisation variant, no
  no-weight-decay branch rescue, no matched control, no second seed, no soup).
  Record the diagnostic as the closing evidence on this branch and keep the
  remaining authorized-shape step as the optimizer-level denormal-attractor
  diagnostic (not started, not authorized here).
because: >-
  The two hypotheses that would have justified a rescue are removed.  (1) The
  parameterisation is trainable: with the parent frozen and one fixed batch, the
  same architecture/init/scale reduces fit MAE by 0.0280-0.0289 (~48-50 %) in
  200 steps, G_branch rises from -3.1e-05 to +0.028, and the branch/parent
  response ratio rises from 0.005 to 0.28-0.31.  (2) Weight decay does not block
  it: coupled L2 at wd=1e-5 costs only 8.6e-04 MAE (3.0 % of the improvement)
  and the reference decay norm never dominates the task gradient (0.0009-0.203
  at step 1, < 0.008 by step 200); both arms are still improving at step 200.
  At the same time the branch that does fit the batch does not transfer at all:
  probe MAE worsens in both arms (0.05693 -> 0.05886/0.05914) and
  G_branch_probe is negative, while the previous round showed the key-level
  channel duplicates the still-live edge channel (G_edge +0.0268, W_E_S 0.564,
  W_E_C 0.636) against a node binding that is dead at the same denormal floor.
  Spending a full clean run on a branch that (a) already has a working gradient
  path under a frozen parent, (b) buys batch fitting rather than a transferable
  response, and (c) duplicates an existing live channel, would not test a live
  hypothesis.  The unresolved question this round leaves behind is not about the
  branch but about the optimiser/scale regime that lets an entire channel drift
  to the 7e-38 floor.
alternatives_rejected:
  - >-
    Launching JointBond-v2 (bigger F2 init, additive unit-scale injection,
    bias/norm, or no weight decay on residual channels) from the positive
    trainability result. Rejected: the diagnostic shows the parameterisation is
    already trainable when the parent is frozen, and that a trained branch does
    not transfer even in-split; the missing piece is the from-scratch gradient
    path, which an init/gate change would not be testing.
  - >-
    Reporting weight decay as the cause of the JointBond-v1 death. Rejected:
    wd=1e-5 leaves learning intact here; the narrow supported statement is that
    the from-scratch endpoint gradient path was exactly zero (not merely small),
    which is a different claim.
  - >-
    Reporting "the gradient is below float32 precision". Rejected: first
    per-tensor gradients are 2.0e-04 ... 4.2e-03 in float32 with float64 norms
    agreeing to ~7 digits, and no float32-norm-zero/float64-nonzero case
    occurred anywhere (the D12 self-test shows the distinction is implementable,
    but it did not fire).
  - >-
    Reading the probe result as a generalisation improvement. Rejected: the
    probe batch is official-train data and the branch made it worse
    (G_branch_probe < 0).
revisit_if: >-
  A preregistered optimizer-level diagnostic (the shape recorded in
  decision-e2e-dictenv-jointbond-v1-stop-branch-inert-no-task-band-20260930)
  measures how many Sem108 channels already sit at the 7e-38 denormal floor and
  whether a single change (no weight decay on residual channels, an explicit
  denormal guard, or a decoupled-decay formulation) revives the dead node
  binding - and additionally explains why the from-scratch endpoint gradient
  becomes exactly zero while the frozen-parent gradient is 2e-04 ... 4e-03.
  Only then does a key-level binding round become a candidate again, and only as
  an additive unit-scale increment with matched controls, >= 2 seeds, mandatory
  liveness gates (|w|max > 1e-3, G_branch_off >= 0.003) and a disjoint
  train/valid transfer check.
