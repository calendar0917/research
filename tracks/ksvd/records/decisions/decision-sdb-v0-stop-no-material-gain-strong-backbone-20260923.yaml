decision: >-
  STOP SDB-v0 after Stage-4 seed 0. Do NOT buy a second seed for Stage 3 or
  Stage 4, do NOT sweep K or s, do NOT add LISTA / attention / a new reader /
  a dense bypass, do NOT retrain any historical baseline, do NOT run the
  implemented supplementary Stage-4 task-coupled arm, and do NOT open the
  official test. Record the two durable outcomes: (a) the structural-role axis
  CAN be replaced by a reusable sparse (K=32, s=8) chemistry-free dictionary
  coordinate with no loss of the validated assignment (supported); (b) the same
  replacement adds no material task gain on the strong strict-static S0
  backbone (supported negative). A clean STOP is preferred over an
  unattributable extra run.
because: >-
  Stage 1 showed the sparse dictionary is a faithful, label-free coding of the
  phi axis (E_bind dev 3.45e-04, 32/32 atoms, exact l0 8) and Stage 2 showed on
  3 seeds that the compressed dict32 statistic beats the full 65-D phi65 oracle
  and every matched control (mean recovery 1.159, mean shuffle degradation
  0.245, phi65 drift 8.2e-09). So the replacement/reuse half of the question is
  decisively positive and cheap. The incremental-value half is negative: after
  fixing a train-split validation leak, task coupling helps only marginally
  (delta -0.009097 on one seed, threshold 0.003), and on the strong S0 backbone
  the frozen-dictionary branch fails two of three pre-registered gates -- gain
  vs base 0.002381 < 0.003, assignment-shuffle degradation 0.016131 < 0.02 --
  even though it is slightly BETTER than the parameter-matched dense control
  (0.143294 vs 0.144183), so it is neither inert nor a capacity artefact. The
  branch also does not beat the already-existing S0 Top-5 soup (0.143294 >
  0.140794). The mechanism is consistent: on the weak M0 base the assignment
  statistic dominates and compresses freely, whereas S0 already internalises
  the topology<->chemistry assignment, leaving too little residual for a
  per-molecule linear C_D readout. With the direction negative and the effect
  sub-threshold, there is no basis to spend further compute.
alternatives_rejected:
  - >-
    Buying Stage-4 seed 1. Rejected: the pre-registered gate failed in the
    negative direction on seed 0; the preregistration does not authorize seed 1
    for a FAIL, and the effect is sub-threshold rather than near-miss.
  - >-
    Running the implemented supplementary Stage-4 arm with a task-coupled D on
    the frozen S0 base. Rejected as a rescue: the corrected Stage-3 effect is
    only -0.009 on the weak base and the frozen-D strong-backbone gain is
    0.0024, so a material (>0.003) strong-backbone gain is not expected; the
    arm stays implemented but documented as a follow-up, not executed.
  - >-
    Sweeping K / s / lambda_rec, or adding LISTA / attention / a new reader /
    a dense bypass to move the Stage-4 number. Rejected: forbidden by the
    preregistration; a sweep on top of a failed causal gate is not a scientific
    step.
  - >-
    Retraining the strict-static S0 to reproduce the Top-5 soup so the branch
    could be trained against the exact strong baseline. Rejected: no historical
    baseline is retrained; Amendment A2 records the selection-state base and
    the reason (soup member states were never persisted).
  - >-
    Treating "recovery > 1 vs phi65" in Stage 2 as proof of a strong-backbone
    task gain. Rejected: Stage 2 is measured on the weak frozen M0 base; the
    strong-backbone question is Stage 4, which fails.
revisit_if: >-
  A future preregistered round may revisit strong-backbone dictionary binding
  only if it (i) persists the strict-static S0 Top-5 soup member states so the
  branch can be trained and selected against the exact strong baseline, and
  (ii) buys matched controls that separate dictionary richness / task coupling
  from assignment value at the strong-backbone operating point (e.g. frozen vs
  task-coupled D at two dictionary-health regimes, same backbone and budget).
  The permanent reusable findings from this round are: (a) a chemistry-free
  K=32/s=8 dictionary coordinate is a loss-free, causally-used replacement for
  the R^65 pure-topology structural-role axis under the FSAR-R2-AR0 node
  assignment; (b) the centered binding tensor C_D in R^{32x28} may be used
  uncompressed under a single linear readout; (c) on a strong backbone this
  branch is used but sub-threshold, reinforcing the track's recurring
  "dictionary used, no absolute gain" pattern.
