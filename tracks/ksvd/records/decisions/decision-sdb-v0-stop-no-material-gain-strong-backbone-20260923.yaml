decision_id: decision-sdb-v0-stop-no-material-gain-strong-backbone-20260923
created: '2026-09-23T00:00:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  FSAR-R2-AR0 established (2-3 seeds) that the pure-topology structural role
  phi_v (R^65) and the one-hot atom chemistry q_v (R^28) carry a real node
  assignment residual C_phi = sum_v (phi_v - phi_bar)(q_v - q_bar)^T read by a
  bias-free linear W. SDB-v0 asked whether the structural-role axis can be
  replaced by a REUSABLE, SPARSE, task-coupled dictionary coordinate (K=32,
  s=8, one shared chemistry-free dictionary D) without losing the object's main
  task information, and whether the replacement adds a material task gain when
  attached to a strong backbone. This is the natural next step after the
  track's recurring pattern (dictionary branches are often used but fail to add
  absolute signal on strong backbones).
protocol: >-
  Local-first CPU-only, protocol sdb_v0, frozen before runs in
  notes/sdb_v0_preregistration.md (+ Amendment A1 before Stage 1 reporting, A2
  before the formal Stage-4 run). Frozen config: K=32, s=8, phi_v in R^65,
  C_D in R^{32x28} never compressed, dictionary input chemistry-free. Stages:
  (0) data-free sanity + synthetic ridge controls; (1) label-free K-SVD
  dictionary identity with E_phi / E_bind vs random, dense-coded-same-D and PCA
  references; (2) FSAR mechanism preservation on the frozen M0 Top-5 soup with
  dict32 vs the frozen phi65 oracle and matched controls (pca32, dict_dense32,
  dense32, dense32_frozen, rand32) + within-molecule assignment shuffle, 3
  seeds; (3) task-coupled tied-IHT dictionary (learnable D, lambda_rec
  calibrated once, held-out validation) vs frozen-D readout, seed 0; (4)
  strict-static S0 frozen base + linear DictBinding vs parameter-matched
  DenseBinding + assignment shuffle, seed 0. Official ZINC test never loaded;
  no historical baseline retrained; no K/s sweep, LISTA, attention, new reader
  or dense bypass.
