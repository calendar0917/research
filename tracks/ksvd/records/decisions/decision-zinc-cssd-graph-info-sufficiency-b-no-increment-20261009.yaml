revisit_if: >-
  A new preregistration (a) identifies a DIFFERENT frozen-statistic family with a
  label-free mechanism argument for why it must be non-injective w.r.t. R_G AND
  materially different from all five closed statistics (richer set readout,
  endpoint association, centre covariance, triad closure, this co-coverage
  binding), and (b) powers a design whose paired head comparison can separate
  >= +0.001 g-MAE with head-seed replication. Absent both, the next zinc-context-gap
  budget belongs to the input representation (phi65/chemistry interface) or the
  Reader/generalisation side, not to further post-hoc statistics on this frozen
  consumer.
