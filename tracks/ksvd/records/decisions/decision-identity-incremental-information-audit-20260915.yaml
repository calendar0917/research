decision_id: decision-identity-incremental-information-audit-20260915
created: '2026-09-15T09:42:00'
kind: decision
study_id: zinc-context-gap
decision: >-
  Adopt a multi-label reading of the typed identity token from the
  zero/full-training-free audit: Case A (mostly redundant at the molecule level)
  + Case B (distinguishability matters, learned semantics not structural) + Case
  C (genuine per-patch descriptor ambiguity), and REJECT Case D (unique
  task-relevant learned semantics) for lack of any isolating evidence. The core
  answer is that identity is a mixture dominated by distinguishability plus
  task-specific arbitrary categorical memory, not missing raw structural
  information. No new architecture is proposed and no identity mechanism is
  changed by this decision. Pre-registered interpretation guidance is fixed for
  the two sibling experiments: Agent A (exp/identity-capacity-control, A0/A1/A2)
  and Agent B (exp/shared-structural-patch-encoder).
why_this_experiment: >-
  The repository had many partial identity results (tokenizer correctness,
  fragmentation, sharing oracle, v6 factorisation, SBCI, recurrent Cell A,
  MolHIV parameter attribution) but no single zero-training audit that separates
  "identity carries structural information", "identity provides categorical
  distinguishability", and "identity is task-specific memory". The three
  sibling tasks (this audit + two training experiments) were designed together,
  so the audit must fix its interpretation before the training results arrive.
protocol: >-
  Twelve target-free computations plus one bounded diagnostic: dataflow
  accounting; exact-byte descriptor->identity collision and conditional entropy;
  identity->descriptor variability; label-free kNN identity purity at fixed
  k=1,8 (no sweep); learned-embedding geometry vs structural geometry on frozen
  checkpoints; frequency/OOV/parameter share; with-ID vs without-ID molecule
  expressivity on official ZINC train with a signature lock written before any
  official-train target is read; MolHIV OOV/rarity vs error with
  prevalence/size/patch-count/frequency controls; historical reconciliation;
  final Case A/B/C/D map. No backbone trained, no architecture selection, ZINC
  official test never opened, MolHIV test only re-read read-only.
