alternatives_rejected:
  - Do not claim the historical coarse certificate is the "exact typed identity"
    for either dataset; the corrected coloured key is the exact object.
  - Do not interpret high OOV-subgroup prediction error as a causal effect of
    OOV; it is descriptive and partly prevalence-confounded.
  - Do not propose Case D without a new isolating evidence source; lookup
    performance alone is not evidence.
  - Do not train a backbone, delete identity, design a new embedding, choose a
    top-K cutoff, hash-compress, build a compositional encoder, or sweep the
    optimizer in this audit.
  - Do not open the ZINC official test.
consequences:
  - 'Identity is retained unchanged; this decision only fixes interpretation.'
  - >-
    Agent A (exp/identity-capacity-control): threshold 0.002 on the 2-seed Top-5
    soup valid mean (A0 = 0.126368). Expected Case I (A0 ~= A1 << A2) =
    distinguishability matters but per-ID memory is not necessary; Case II
    (A0 << A1 ~= A2) = memory-dominance; Case III (all equal) = lookup largely
    dispensable (strengthens A/B); Case IV = require quantitative
    decomposition. Require exact parameter parity (85,763 +/- 1%) and report A2
    error by token-frequency stratum. Never open ZINC test.
  - >-
    Agent B (exp/shared-structural-patch-encoder): strong success if
    improvement >= 0.002 on both seeds and same sign; neutral success if
    |delta| < 0.002 with no vocab-sized lookup and vocabulary-independent
    parameters; failure if regression > 0.003 on both seeds. Because the learned
    rows are not structural, a shared connectivity encoder is replacing
    arbitrary memory with a principled function, so a neutral outcome is already
    meaningful. A large regression implies optimisation / inductive bias, not
    missing structural information. Report per-OOV-stratum valid error. Do not
    train MolHIV.
  - >-
    Joint reading: A Case I + B neutral -> distinguishability + generic shared
    capacity, per-ID memory dispensable (headline unchanged); A Case II + B
    failure -> memory-dominance (Case B strengthens, Case D still unestablished);
    A Case III + B success -> identity largely dispensable, retire the lookup
    line.
revisit_if: >-
  Reopen only with (a) a new isolating experiment that separates task-relevant
  semantics of learned identity rows from the structural information already
  present (the only route to Case D), or (b) a demonstrated structural encoding
  of the identity signal (it would contradict the geometry finding), or (c) a
  measured scaffold-frequency control for the MolHIV OOV difficulty signal.
  Never by sweeping embeddings/cutoffs or opening official test.