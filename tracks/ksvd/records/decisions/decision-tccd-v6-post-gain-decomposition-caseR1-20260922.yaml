decision: >-
  CASE R1 — NONLINEARITY NOT MATERIAL / RECON SUFFICIENT. The 69
  base-reconstructible POST coordinates recover 99.51% of G_FULL (99.25%
  without ReLU); the nonlinearity gap 0.000196368 is far below the 0.005 R1
  threshold; no paired seed 1 was authorized or run. Case M also holds
  (NOVEL-NL rho 0.931877) but is redundant under the registered R > M
  precedence. Within the frozen TCCD-v2 representation the primary bottleneck
  is readout / coordinate geometry, not missing structural information.
alternatives_rejected:
  - item: Run a paired seed 1 for the RECON nonlinearity question
    because: >-
      the registered ambiguity interval is 0.005 <= gap < 0.010 and the
      observed gap is 0.000196368, so the R1 branch fires directly.
  - item: Continue to Stage B or any end-to-end / official-valid training
    because: >-
      TCCD-v6 is a frozen decomposition round; no E2E or official route is
      authorized by its preregistration.
  - item: Open the official ZINC test
    because: >-
      never loaded by design; no test read is authorized by this decision.
  - item: Prioritize center-preserving occurrence composition next
    because: >-
      the POST gain is fully recoverable from base-reconstructible coordinates
      without any new occurrence information, so occurrence placement is not
      supported as the missing ingredient.
  - item: Deepen the pair MLP or add a nonlinear 10,464-D reader
    because: >-
      ReLU removal changes the result by 0.000196; more nonlinear capacity is
      not the explanation and would destroy the parameter-matched diagnostic.
consequences:
  - >-
    TCCD-v5's POST gain is re-attributed: it is a coordinate-exposure /
    readout-geometry effect of the normalization 2*BAG/n and the normalized
    relation density, not new structural or occurrence information.
  - >-
    Genuinely new prototype-distribution moments (B dispersion, C_prod
    product) suffice alone but are not necessary; the blocks are substantially
    redundant because they are functions of the same frozen assignments.
  - >-
    The next representation hypothesis is an explicit
    normalization/moment-complete frozen representation with a simple reader,
    under a new preregistration.
revisit_if: >-
  A new preregistration specifies a normalization/moment-complete
  representation with a matched simple reader and pre-declared controls; or a
  new frozen-representation diagnostic isolates the A block from the D block.
  Not by widening the MLP, not by reopening occurrence placement, not by an
  official-valid/test read.
next_action: >-
  NONE auto-authorized. Draft a new preregistration only for the explicit
  normalization/moment-complete frozen representation with a simple reader or
  for a new frozen diagnostic; keep the official test closed.
