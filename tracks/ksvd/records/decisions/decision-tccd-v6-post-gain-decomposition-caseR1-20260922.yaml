decision_id: decision-tccd-v6-post-gain-decomposition-caseR1-20260922
created: '2026-09-22T00:00:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  TCCD-v5 produced a real POST Top-5 soup gain over the frozen TCCD-v2 BASE
  (0.2783639132976532 -> 0.2522333264350891, G_FULL 0.0261305868625641) while
  the PRE-vs-POST placement hypothesis failed. TCCD-v6 therefore ran a strict
  frozen-representation diagnostic instead of a new architecture: it
  decomposed the 197-D POST mean pair descriptor into coordinates exactly
  reconstructible from h_base (RECON) and coordinates that are not (NOVEL),
  and asked which block, and whether a ReLU, explains the gain.
protocol: >-
  GPU1-only remote A100 execution; seed 0; fixed internal 8000/2000 split
  (split seed 20260922); exact frozen TCCD-v2 PrototypeREL checkpoint and
  exact TCCD-v5 pair cache; all unordered i<j pairs; descriptor blocks
  A = E[c_i+c_j] (64), B = E|c_i-c_j| (64), C_prod = E[c_i*c_j] (64),
  D = E[r_ij] (5); label-free A/D reconstructibility audit before any training;
  frozen partition RECON 69 / NOVEL 128; four parameter-matched arms
  (24,193 trainable parameters each) with identical bit-level initialization
  (checksum 9fbedb92...e8487f) and the exact TCCD-v5 Adam / Top-5-soup protocol;
  FULL-NL reused from v5 and verified by re-evaluation (delta 0.0); RECON-NL
  and RECON-LINFACT differ only by the ReLU; NOVEL-NL uses the novel mask;
  no PRE, no center-preserving model, no official-valid, official test frozen.
