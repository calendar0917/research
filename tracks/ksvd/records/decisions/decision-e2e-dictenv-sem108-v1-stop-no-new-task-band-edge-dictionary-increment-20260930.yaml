  mechanism_note: >-
    The node-side dictionary correspondence is exactly zero because W_A_S and
    W_A_C collapsed to float32 denormals during training (healthy in the
    8-epoch smoke state, alive in the parent CSSD-q1 soup at absmax 1.45), so
    node slots are identically zero and the node assignment shuffle is a no-op.
    The pre-registered G_corr = max(G_node, G_edge) therefore reflects the edge
    correspondence only.
decision: >-
  1. STOP the round after the single pre-registered seed-0 trajectory and the
  frozen probes.  CSSD-Sem108 is NOT adopted as a task improvement: M_S =
  0.123705 is inside the existing 0.123-0.127 band and 0.000705 above the
  pre-registered promising threshold; the strong claim (<= 0.120) and the
  promising band (<= 0.123) are both missing.  2. DO NOT run seed 1, do not
  change width / init / lr / lambda / horizon / batch / soup, do not add a
  node-binding rescue, do not rerun a baseline.  3. RECORD the durable
  mechanism findings: the direct shell-resolved semantic interface is strongly
  load-bearing (G_sem0 = +1.307, G_sem_shuffle = +0.493, atom/bond blocks
  +1.098 / +0.480), while the compressed node dictionary-atom binding is
  fully redundant and collapses to zero; the edge dictionary correspondence
  remains load-bearing (G_edge = +0.038) and is the only basis of the
  pre-registered G_corr.  4. KEEP CSSD-q1 / FINAL-CLEAN / T1 as the line's
  references; the early-compression hypothesis is neither adopted nor
  refuted by a task break-out.  5. Authorize nothing further in this round:
  any follow-up needs a new pre-registration.
alternatives_rejected:
  - >-
    Claiming a task improvement from the unmatched historical comparison
    (+0.006323 vs CSSD-q1).  Rejected: no matched baseline was rerun and the
    round's thresholds were not reached.
  - >-
    Buying seed 1 to firm up the band position.  Rejected: the round is frozen
    at one trajectory and the pre-registration forbids it.
  - >-
    Re-running with a node-binding removal / zero init to "fix" the collapse.
    Rejected: post-hoc rescue; the collapse is reported as an observation.
  - >-
    Reporting the round as Case C (backbone signal, dictionary increment not
    established).  Rejected: the pre-registered G_corr = +0.038 >= 0.010, so
    Case D is the frozen rule.
  - >-
    Reporting a joint node+edge dictionary increment.  Rejected: the node side
    is a structural zero (dead binding), so the increment claim is edge-only;
    this is recorded as a mechanism note rather than silently folded in.
  - >-
    Using the T1 block ablation to attribute T1's 0.12577.  Rejected: A3
    returned T1_BLOCK_AUDIT_UNAVAILABLE (non-durable state tensors) and the
    round forbids retraining T1.
revisit_if: >-
  A new preregistration is written for: (a) a matched node-binding-amputation
  control — the identical Sem108 architecture trained with the node dictionary
  binding removed or zero-initialised, >= 3 seeds, same soup — to separate
  "the direct interface replaces the compressed node path" (mechanism) from
  "the collapse is an Adam/coupled-weight-decay accident" (trainability);
  (b) a multi-seed confirmation of the 0.1237 band position; or (c) a
  same-round matched anchor-interface vs Sem108-interface pair at identical
  capacity to isolate the compression effect without historical comparison.
  Secondary: sparse-usage regularisation to move the 0.823 top-1 usage back
  under 0.75 is a new hypothesis, not a rescue.
