decision_id: decision-e2e-dictenv-sem108-v1-stop-no-new-task-band-edge-dictionary-increment-20260930
created: '2026-09-30T00:00:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  Every round of the closed CSSD / DictEnv line compresses the primitive
  chemistry of a patch into the coarse 62-D anchor and then through
  anchor_encoder (62 -> 32 -> 32) before the environment decoder, so the
  decoder never reads the shell-resolved primitive semantic blocks directly.
  Three independent rounds (FINAL-CLEAN C6 0.1285, T1 0.1258, CSSD-q1 0.1300)
  and RNDB 0.1331 sit in the same 0.126-0.133 band.  The round asked a single
  either/or question: is the plateau caused by that early compression (and not
  by a weak dictionary fusion function)?  One architectural change, one
  trajectory, one pre-registered decision table.
protocol: >-
  Local CPU only (CUDA_VISIBLE_DEVICES="", no GPU/SSH/DDP), preregistration
  sha256 838b46fc0874..., formal-run commit f836b04 (audit commit 69435e3,
  analysis additions c841c6d).  Stages: read-only historical references ->
  zero-training Phase-A audit A1-A4 (exact Sem108 identity and scaler
  provenance, full-split anchor relations, T1 block audit availability,
  redundancy/collision structure) -> preflight (parameter contract) ->
  14 correctness gates G0-G13 -> 8-epoch / 64-step smoke -> exactly one
  from-scratch seed-0 trajectory (320 epochs, Top-5 soup) -> frozen
  inference-only probes (Sem108 block zero, 5-seed Sem108 row shuffle, atom and
  bond block zero, residual alpha -> 0, node/edge assignment shuffle at seeds
  101/202/303/404/505) -> analysis.  No baseline rerun, no seed 1, no sweep,
  official ZINC test never loaded.
