revisit_if: >-
  Revisit only with a new pre-registration that either (a) buys a confirmation
  design for the shared task dictionary — paired seeds plus a parameter-matched
  dense/random adapter under one protocol, with the band rule and the code
  density report pre-declared — or (b) changes the local object / learning
  objective instead of widening K or d on this representation.  A future round
  may reuse the validated unified Small/Full construction (exact parameter
  budgets, containment witness, frozen Sem108 modules) and the measured
  liveness of the shared task dictionary as building blocks, but must not
  present the 0.119154 endpoint or the unmatched background differences as a
  validated gain of this round.
study_id: zinc-context-gap
why_this_experiment: >-
  The previous round trained a 9,216-parameter shared task dictionary at the
  Sem108 fusion output and ended borderline (0.121058) with a near-dense code
  and no capacity comparison.  This round asked the plan's capacity question
  with one unified Small/Full model and one authorised Full seed-0 screen: does
  widening the task-local path (m=3, 408,651 exact parameters) reach the
  pre-registered absolute bands on official valid, and is the enlarged shared
  task dictionary actually learned and used?  Both questions were answered at
  the frozen endpoint before any rescue, seed 1 or control was considered: the
  candidate landed in the limited-signal band, and the enlarged dictionary is
  learned and load-bearing but again near-dense and unvalidated against any
  matched alternative.
