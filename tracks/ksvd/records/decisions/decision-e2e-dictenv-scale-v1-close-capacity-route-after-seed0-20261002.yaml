alternatives_rejected:
- >-
  Widening further (m = 4/5, larger K or d, wider fusion/reader) to push M_S
  below 0.115.  Rejected: the pre-registration's case C (0.115 < M_S <= 0.120)
  closes the capacity route without further widening, and the round bought
  mostly fitting (soup train 0.055133 -> 0.045397) rather than validated
  generalisation (soup valid 0.121058 -> 0.119154).
- >-
  Buying a second seed or a matched control for this candidate post hoc
  (parameter-matched dense adapter, random/frozen dictionary, no-dictionary
  rerun, paired seeds).  Rejected: not pre-registered for this round, and the
  round's question (does the unified Full m=3 reach the pre-registered bands,
  and is the shared dictionary learned and used) is already answered; a
  post-hoc arm could not ground a performance claim in either direction.
- >-
  Rescuing the run (lambda1/lambda2, unrolled ISTA steps, sparsity regime,
  lr, horizon, dropout, refitting the frozen scaler or the Sem108 body).
  Rejected: each is a new candidate; the pre-registration forbids them in this
  round, and the previous round already established that the soft-threshold
  regime stays near-dense (this round measured 250.89/288 = 0.871 non-zero).
- >-
  Reading the endpoint differences against the unmatched backgrounds
  (latent-bridge 0.121058, Sem108 0.123705) as increments.  Rejected:
  different parameter counts (106,925 / 97,709 vs 408,651), single seed each,
  unmatched protocols; the analysis note lines them up as context only.
- >-
  Reading the zero-code (+1.436962), permutation (+0.394184) or reset-to-init
  (+1.329684 MAE) probes as evidence that dictionary learning beats a matched
  trained alternative.  Rejected: they are sensitivity statements inside one
  model, and the insertion topology makes a large zero-code delta expected by
  construction.
- >-
  Fixing the near-dense code with post-hoc thresholding or a top-k readout at
  evaluation time.  Rejected: the density is a measured endpoint property of
  the frozen lambda regime; any sparsity intervention would be a new candidate
  and would invalidate the frozen comparison.
- >-
  Reading the official ZINC test split for a limited-signal candidate.
  Rejected: screen-mode discipline (test blocked) and the frozen band rule;
  the test was never instantiated (official_test_loaded false).
because: >-
  The unified Small/Full model was implemented, accepted by the seven
  zero-training correctness gates, authorised by the pre-registered CPU timing
  gate (6657 s with margin vs 14400 s budget, confirmed by the actual 6274 s
  training wall) and trained for the full 320 epochs on the official train
  split with one evaluation on the official valid split through the new
  control-plane runner; the pre-registered band rule returned case C
  (limited signal, 0.115 < 0.119154 <= 0.120), which closes the capacity route
  without authorising widening, seed 1 or matched controls.  The mechanism
  diagnostics are positive but only establish liveness and use of the shared
  task dictionary, not comparative value; the near-dense code, the widened
  train-to-valid gap and the unmatched backgrounds block any stronger reading.
created: '2026-10-02T03:10:00'
decision: >-
  Close the E2E-DictEnv-Scale-v1 round after seed 0
  (SCALE_LIMITED_SIGNAL_CLOSE_CAPACITY_ROUTE) without further widening, without
  seed 1, without a matched control and without any K / d / lambda / steps / lr
  rescue.  Record the band result (Full m=3 soup official-valid MAE 0.119154,
  best 0.123307 @ 299; unmatched backgrounds latent-bridge 0.121058, Sem108
  0.123705), the construction result (m=1 = 106,925 bit-identical to the
  LatentBridgeSEM108 parent, m=2 = 233,203 audit-only, m=3 = 408,651 exact with
  all Sem108 modules frozen and a containment witness) and, separately, the
  mechanism result (learned: D_L/V_L movement 16.4566/12.8033 with MAE-only
  gradients 0.0963/0.2431; load-bearing: zero-code +1.436962, permutation
  +0.394184, reset-to-init +1.329684 MAE; near-dense code mean 250.89/288).
  Do not merge the three readings, do not present the endpoint as an
  improvement over any background, and do not continue this representation by
  widening K or d.
