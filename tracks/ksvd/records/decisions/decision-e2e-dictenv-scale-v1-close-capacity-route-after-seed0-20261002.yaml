protocol: >-
  Local CPU only (runtime.device=cpu, 8 threads), official ZINC train 10000 /
  official valid 1000, official test never instantiated.  Pre-registration and
  code committed before the formal run (5335301; reporting-only dtype fix
  638d6a3 for the completion run; prereg sha c65d6e223aa9 enforced by
  preflight).  Formal stages executed through the control-plane runner
  zinc_e2e_dictenv_scale_v1: training run 20261002-004025-2196abdb completed
  320/320 epochs at 19.608 s/epoch (wall 6274.4 s, peak RSS 3053.4 MB) and
  failed only in a probe-reporting dtype line after writing run_seed0.json /
  soup.json / checkpoints; completion run 20261002-023535-07a8b584 cache-hit
  the frozen training state (identical state hashes) and produced the probes,
  summary, REPORT and DECISION in 58.9 s.  One candidate, seed 0, 320 epochs,
  batch 128, Adam lr 1e-3 / wd 1e-5 / clip 5.0, fixed LR, Top-5 soup by valid
  MAE, no early stop, no control arm, no sweep.  Separately: 9 focused local
  tests, a 7-gate zero-training correctness stage, a timing gate, a smoke stage
  and inference-only mechanism probes at the frozen soup state.
