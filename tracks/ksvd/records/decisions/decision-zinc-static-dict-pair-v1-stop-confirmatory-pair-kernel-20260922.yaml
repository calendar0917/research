decision_id: decision-zinc-static-dict-pair-v1-stop-confirmatory-pair-kernel-20260922
created: '2026-09-22T00:00:00Z'
kind: decision
study_id: zinc-context-gap
why_this_experiment: >-
  The v0 strict-static dictionary-pair round produced a Case-A seed-0 signal but
  carried a documented confound: S-Dict ran 240 epochs (best 225) while S0
  stopped at 204 (best 164) and S-Dense at 210 (best 170), so the dictionary
  checkpoint was selected from more optimizer steps.  This round isolated one
  falsifiable question: after removing the unequal-checkpoint-opportunity
  confound, does the dictionary-specific signal replicate on seed 1?
protocol: >-
  Local-first implementation with targeted CPU tests, then remote A100 execution
  under the remote-research-runner workflow.  Preregistration and implementation
  commit 1cb4fc7eec47cbc474cd14d3fff6a880bb1c7477.  Phase A is a zero-training
  common-horizon audit of the existing seed-0 curves.  Phase B is exactly three
  seed-1 full-training runs (S0 GPU0, S-Dict GPU1 in parallel; S-Dense GPU0
  after a provisional check) with the v0 architecture, tokenizer, topology, head,
  optimizer, LR, wd, batch, split, shuffle-seed convention and parameter
  matching unchanged.  Every arm is forced to the full 240 epochs and a shadow
  early-stopping tracker (patience 40) simulates the v0 protocol without
  stopping the optimizer, so each run yields both the equal-horizon and the
  original-protocol views.  Official ZINC train 10000 / official valid 1000,
  seed 1, official test never loaded.
