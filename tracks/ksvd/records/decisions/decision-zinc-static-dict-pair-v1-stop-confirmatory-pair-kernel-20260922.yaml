decision: >-
  Do NOT authorize the occurrence-level dictionary-conditioned pair kernel as a
  confirmatory next round.  First run a separate preregistered stability round
  on the residual dictionary itself (gamma / liveness dynamics under the same
  strict-static contract, with matched controls and mandatory gamma + ablation
  liveness diagnostics).  Only if the dictionary is demonstrably live and
  seed-stable may the pair kernel be registered as a confirmatory experiment.
because: >-
  The seed-1 confirmation is B2 directional replication only.  Arm-level, S-Dict
  beats S0 on both views by a sub-gate margin (+0.001369 best / +0.001726 soup,
  gate 0.004) and beats the matched S-Dense control (+0.007811 / +0.006912,
  sign-consistent with seed 0), and the zero-training common-horizon audit shows
  the seed-0 signal survives inside the shared 204-epoch window.  But the
  mechanism did not replicate: at the seed-1 best checkpoint the residual scale
  gamma collapsed to 3.75e-04 (0.0021 by epoch 100, ~0 from ~epoch 140), the
  residual-disable ablation moves predictions by only 1.0e-05 (max 1.0e-04)
  versus 0.304 in seed 0, the code became near-uniform (entropy 4.068 of 4.159,
  58.45 effective atoms, tau 0.20 -> 0.547), and the matched dense branch
  collapsed likewise.  So the seed-1 S-Dict endpoint is effectively the
  strict-static base network and the Dense - Dict ordering reflects early
  residual-induced base-trajectory differences, not a live dictionary at the
  endpoint.  Additionally seed-1 S0 improved 0.006285 over seed-0 S0, ~4.6x the
  S0 - Dict margin, so that margin is inside baseline seed variability.
  Building the pair kernel on this unstable mechanism would be premature.
alternatives_rejected:
  - >-
    Declaring SEED1_DICT_SPECIFIC_REPLICATION from the arm-level Dense - Dict gap.
    Rejected: B2 requires the S0 gate (0.004) which fails, and the dictionary
    residual is provably inert at the seed-1 best checkpoint.
  - >-
    Declaring SEED1_NO_REPLICATION from the sub-gate S0 - Dict margin.  Rejected:
    the direction is positive on both views and both metrics, and the
    dictionary still beats the parameter-matched dense control on both seeds.
  - >-
    Stopping before buying S-Dense seed 1.  Rejected: the provisional check gave
    a positive-but-subthreshold direction, so the matched dense control was
    required to evaluate the B-gates.
  - >-
    Retraining seed 0 to a symmetric 240-epoch table, or adding seed 2/3, or
    sweeping K/tau/gamma/regularizers in this round.  Rejected: forbidden by the
    round; the gamma collapse is recorded as a finding, not rescued.
revisit_if: >-
  A preregistered stability study shows the residual dictionary stays live
  (gamma bounded away from 0 with a non-trivial residual ablation) across at
  least two seeds under the same strict-static contract; then the
  occurrence-level dictionary-conditioned pair kernel becomes a candidate
  confirmatory round.  Also revisit if a seed-2 S0 run lands near 0.1457 (making
  the seed-1 S0 0.1394 look like an outlier) or near 0.1394 (confirming the
  stronger baseline and further shrinking the S0 - Dict margin).
