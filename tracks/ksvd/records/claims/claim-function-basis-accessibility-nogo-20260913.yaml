- results/function_basis_accessibility/final_decision.json
- tests/test_function_basis_accessibility.py
contradicting_evidence:
  - >-
    E is not a dead reader: its hinge terms carry most of its expressive
    power (removing them costs +0.047791 MAE, 5/5 folds), and E is globally
    non-collapsed (prediction sensitivity min 1.117). This does not reverse
    the result: the fact that the explicit basis expresses useful shape is
    exactly what makes its failure to beat the same-budget MLP informative.
  - >-
    The target-independent hinge basis is only one member of the explicit
    basis family. A basis with explicit coordinate interactions, a shared or
    learned sparse response dictionary, or an MAE-compatible boosted-tree
    family could in principle behave differently; none of these was tested.
  - >-
    The compact-v4-hinge success itself is consistent with a
    parameterisation/function-basis effect (spectrum already contains L and
    the hinge only adds L^2 and ReLU(L-t) ladders, with an all-zero
    equal-capacity control at Delta ~ 0), but v4 also differs in feature set,
    parameterisation, target-audit inspiration and preprocessing, so this
    audit does not prove v4's gain was a pure function-basis effect.
limitations:
- One frozen backbone seed only (pre-registered CLEAR NO-GO stopped the
  second seed); one reader init (Stage 1b not triggered).
- The experimental reader E is deliberately additive (no hidden MLP), so the
  result closes the additive coordinatewise hinge basis specifically, not
  every explicit basis expansion.
- Five outer folds of 400 adapter-evaluation molecules each; the effect is
  large and same-signed on all folds, but it is a screening budget.
- The frozen R is fixed; no statement is made about representations that
  already contain explicit interactions or about jointly trained bases.
implication: >-
  Stop the frozen-R basis-engineering route. Do NOT next try more or learned
  knots, B-splines, polynomial, RBF, Fourier or wavelet bases, and do NOT open
  the KSVD / learned shared response dictionary as the main line on the back
  of this negative. The next decision should move to the representation-family
  level (does the model need a different representation family / structured
  computation, rather than another function transform of frozen R?). A
  separate, later, pre-registered experiment may compare MAE-compatible
  function families (generic ReLU MLP, additive spline/hinge dictionary,
  boosted trees) once the function-family question is independently motivated.
