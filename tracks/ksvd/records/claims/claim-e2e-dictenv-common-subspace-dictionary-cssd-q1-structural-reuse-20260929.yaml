contradicting_evidence:
  - >-
    The task metric did not improve: soup 0.130028 vs 0.128499 (+0.001529)
    for +240 parameters, so no task claim exists and DenseTied 0.125563 was
    not re-measured under matched capacity.
  - >-
    RAW and CSSD sparse codes remain mutually near-linear (R2 0.9704 /
    0.9813; c1 adds nothing beyond the CSSD code: 0.9815), and the top-5 SMD
    feature-profile diversity is unchanged (0.136 vs 0.125), so the new
    vocabulary is not demonstrably a distinct information channel.
  - >-
    The graph argmax stays concentrated: atom 19 is the top-mass atom in
    75.5 % of CSSD train graphs (atom 9 in 16.5 %), i.e. a single generalist
    still dominates graph-level ranking even though the mass is spread.
  - >-
    Single seed only; the historical DenseTied reference is not matched; the
    graph-reuse, geometry, reverse-recoverability and diversity tables are
    post-hoc descriptive additions.
limitations:
  - 'One new seed (0), one dataset, one architecture family, valid split only.'
  - >-
    No matched-capacity DenseTied control, no CSSD seed 1/2, no q2 training;
    the specificity comparison remains open.
  - >-
    The MC (mean-centering) diagnostic shows part of the raw concentration is
    the non-zero mean magnitude, so the separation effect is a combination of
    removing the mean and removing the common direction; the two were not
    split into separate arms.
  - >-
    train_rec in training/curve.csv is the frozen full-descriptor
    diagnostic (~0.976); the optimised residual term is train_rec_term.
  - >-
    phi65 is topology-only; no chemistry motif names are assigned to atoms.
implication: >-
  The dictionary-concentration problem localises to the dataset-common
  direction and is fixable without touching the task model, at neutral task
  cost, single seed.  The decisive next experiment is a matched-capacity
  comparison (CSSD q1 vs DenseTied at 97727 parameters, >= 3 seeds, same
  soup protocol) with the usage-structure metrics preregistered as gates;
  until then FINAL-CLEAN remains the reference model and no specificity
  claim is made.
