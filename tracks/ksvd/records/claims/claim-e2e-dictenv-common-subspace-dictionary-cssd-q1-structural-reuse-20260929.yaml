claim_id: claim-e2e-dictenv-common-subspace-dictionary-cssd-q1-structural-reuse-20260929
created: '2026-09-29T00:00:00Z'
kind: claim
status: supported
study_id: zinc-context-gap
statement: >-
  On the closed ZINC dictionary-environment line (FINAL-CLEAN = C6 + paired
  node/edge structure-semantic binding + sparse tied-IHT K=32/s=8/IHT-10 +
  full relation; CPU-only; official test never loaded), the near-universal
  concentration of the sparse dictionary is caused by the dataset-common
  structural direction, and separating that direction explicitly (CSSD q1:
  c = U^T x dense, dictionary sees only r = (I - U U^T) x with
  Dbar_perp = colnorm((I - U U^T) D_raw)) yields a structurally healthier,
  reusability-shaped dictionary at unchanged task accuracy, on one seed.
  (1) The only three RAW atoms with |cos(atom, u1)| > 0.5 are exactly the
  universal triplet 6/24/27 (0.965/0.941/0.819; all-atom median 0.022; only
  two atoms above 0.9), and the mean direction u1 = mu/||mu|| is not PC1
  (|cos(u1, PC1)| = 0.524; PC1 = 57.7 % of centred variance); raw energy is
  DC-dominated (E_common(q1) = 0.9772 of ||x||^2) while the centred residual
  fraction is 0.7811 train / 0.7851 valid.  (2) The zero-training same-D
  probe on 3/3 reused C6 soup dictionaries selects q1 by the frozen rule:
  the triplet falls to 0.03-0.40 activation (condition A, 3/3), top-5 usage
  drops 1.06-1.87 (condition B, 3/3) and the residual keeps >= 0.5 of the
  centred variation (condition C); q2 also passes A/B and demotes atom 23
  (ratio 0.10-0.38) but keeps only 0.334 of the centred variation, so it was
  stored as a diagnostic only.  (3) The epoch-40 gate passed on the live
  model (0 atoms above 0.95 vs reference 3; top-5 2.746 vs 4.796; N_eff
  22.725 vs 14.520; weighted-Spec ratio 1.320; ||dL/dD|| = 6.65e-2;
  projected column min 0.317; max |U^T Dbar_perp| = 4.2e-16) and the single
  trajectory ran to epoch 320 (97727 = 97487 + 240 params, 0 dead-column
  fallbacks), soup valid MAE 0.130028 vs the frozen FINAL-CLEAN sparse
  seed-0 soup 0.128499, delta +0.001529 (inside the frozen neutral band
  |delta| <= 0.003 -> CSSD_REPRESENTATION_SUPPORTED /
  TASK_NEUTRAL_SINGLE_SEED; the no-representation-gain clause is not
  triggered).  (4) The trained dictionary is healthier on every frozen
  metric: 32/32 active atoms (RAW 27), N_eff 21.39 vs 14.52, top-5 3.007 vs
  4.796, max activation rate 0.796 vs 1.000, zero atoms above 0.95 (RAW 4),
  coherence max 0.780 vs 0.987, usage-weighted Spec 0.258 vs 0.207,
  minimum graph coverage 0.0126 (126/10000 graphs) vs five never-active RAW
  atoms; atom 6 becomes the most specialized atom (rate 1.000 -> 0.010,
  Spec 0.000 -> 0.965) and atom 19 the broad generalist (rate 0.796,
  Spec 0.080); post-hoc graph-mass statistics give 6.14 -> 16.69 effective
  atoms per graph, 4.01 -> 7.67 atoms with >= 5 % mass and 0.278 -> 0.133
  maximum atom share, identical train/valid (6.15/16.66).  (5) The common
  coordinate c1 is a patch-scale coordinate (valid Spearman patch_nodes
  0.960, patch_edges 0.952, root degree/shell2/walk2 0.891).  (6) Claim
  decision within the frozen framework: Claim C (separation does not
  resolve concentration) refuted; Claim A (reusable cross-graph structural
  factors beyond the common background) supported at the usage/reuse level;
  Claim B (shared coordinate, no distinct reusable vocabulary) NOT excluded,
  because task MAE is unchanged, top-5 SMD profile diversity is unchanged
  (Jaccard 0.136 over 32 CSSD atoms vs 0.125 over 27 active RAW atoms; 28 vs
  29 of 65 descriptors) and RAW<->CSSD sparse codes remain mutually 0.9704 /
  0.9813 linearly recoverable.  Sparse/dense equivalence is preserved:
  dense residual -> IHT-10 R2 0.9709 and IHT-10 -> dense R2 0.9993 vs the
  RAW audit reference 0.970825 / 0.998845.
scope: >-
  CPU-only local round (single process, 4 threads), preregistration sha256
  8e722afbc757..., implementation freeze commit 5f0f284, treated as frozen
  before the first Stage-A process; one new training trajectory (CSSD q1
  seed 0, epochs 1 -> 40 -> 320, one optimizer state).  Data: frozen phi65
  cache from the official ZINC train (10000 molecules / 231664 nodes) and
  valid (1000 / 23083) splits; official test never loaded
  (official_test_loaded = false in every payload).  Reused, never retrained:
  the three C6 soup dictionaries (seeds 0/1/2) for the zero-training probe
  and RAW seed-0 for the audit; historical DenseTied seed-0 soup 0.125563 is
  context only and is NOT a matched control.  No architecture/coder/feature/
  relation/split change beyond the frozen CSSD substitution; no GPU, no SSH.
  Single-seed exploratory evidence only.
