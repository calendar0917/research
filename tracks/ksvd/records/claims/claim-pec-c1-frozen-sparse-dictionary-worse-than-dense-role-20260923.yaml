claim_id: claim-pec-c1-frozen-sparse-dictionary-worse-than-dense-role-20260923
created: '2026-09-23T19:12:00'
kind: claim
status: supported
study_id: zinc-context-gap
statement: >-
  PEC-C1 (2026-09-23, remote A100-SXM4-40GB, commit
  bf8b5a628d99eedaf52f0b6e95e79cf583c4ba7b, seed 0, full official ZINC train
  10,000 / official valid 1,000, official test NEVER loaded, official_test_loaded
  = false).  QUESTION: inside the pure environment -> static-composition function
  class, is the SparseDict structural role still not worse than (ideally better
  than) a parameter-matched non-dictionary structural-role control?  ANSWER: NO -
  the FROZEN sparse dictionary is materially WORSE.  M_CK = 0.160971 (SparseDict,
  tied-IHT K_V = K_E = 16, s_V = s_E = 4, 10 IHT steps, atoms unit-normalized,
  exact top-s, over a K-SVD dictionary fit once on the full official train with
  DICT_SEED 20260924 and then frozen with requires_grad = False and excluded from
  the optimizer) versus M_CD = 0.151767 (DenseRole, trainable
  Linear(11->16) + Linear(15->16) initialized from the same dictionary D^T);
  delta_dict = M_CD - M_CK = -0.009204, i.e. SparseDict is 0.009204 MAE worse,
  beyond the pre-registered 0.003 materiality threshold.  Both arms report
  94,049 total parameters; the only functional difference is the role coordinate.
  Declared asymmetry (pre-registration D1/D2): CK's 416 role parameters are
  frozen (role_trainable 0, optimizer_trainable_params 93,633, and the recorded
  drift max|D - D0| is exactly 0.0 after training and after the soup) whereas
  CD's 416 role parameters are trained (role_trainable 416,
  optimizer_trainable_params 94,049, drift max|M - M0| = 0.375 / 0.613).
  Consequently the comparison is CONSERVATIVE AGAINST CK and the frozen statement
  is: a reusable K-SVD sparse structural-role dictionary is not a better role
  coordinate than a trainable dense map inside this pure class at this scale, and
  this round does NOT estimate a TASK-COUPLED dictionary, which is a different
  hypothesis explicitly reserved for a hypothetical future PEC-C2 and which this
  result does not authorize.  Corroborating context: the frozen sparse branch is
  alive (neutral-dictionary intervention shifts predictions by 2.093377 and costs
  +1.967415 MAE), so the result is 'used but not better', not inertness.
  Label-free dictionary diagnostics on the full official train (1,418,500 node /
  1,232,844 edge occurrences, 1930 s): node E_rec train/valid 0.024673/0.024777
  with 13/16 atoms used, edge E_rec train/valid 0.074966/0.075086 with only 8/16
  atoms used and 8 dead, exact l0 = 4 for both roles - i.e. the edge dictionary
  degenerates under overcompleteness (K = 16 > dim 15).  SCOPE / LIMITS: single
  seed (the 0.009204 gap is large versus the ~0.004-0.007 documented seed spread,
  but one seed cannot establish 'stably worse'); the whole comparison sits inside
  an architecture that itself failed the absolute band, so this is a relative
  statement within a weak class and not evidence that sparse dictionaries are
  useless in general; K and s were not swept, by pre-registration.
