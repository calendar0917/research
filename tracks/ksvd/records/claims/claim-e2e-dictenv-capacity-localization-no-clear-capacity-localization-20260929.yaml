contradicting_evidence:
  - >-
    All three candidates passed the secondary Delta_last10 <= -0.003
    condition (-0.004266 / -0.004466 / -0.006732), i.e. the added capacity
    does change the late-window behaviour; this is not part of the frozen
    primary metric and does not fire the gate.
  - >-
    Step-0 prediction shifts and the F/R residual projections are non-zero,
    so the null is not caused by an inert architecture at initialisation;
    the gate failure is a measurement-power failure of the adapter, which
    means the claim is about the protocol as executed, not a proof that
    F/R/G cannot help capacity.
limitations:
  - >-
    Single seed, one base checkpoint, one 40-epoch warm-start adapter
    (fresh Adam lr 1e-3); the screen ran in a degradation regime where even
    the control lost 0.0056 (best) to 0.026 (epoch 40) of valid MAE.
  - >-
    The Top-5 soup over a noisy window is dominated by variance reduction;
    its noise floor (control soup minus control start = -0.00037) is of the
    same order as the candidate deltas.
  - >-
    The late-window stabilisation signal is descriptive (post-hoc), based on
    epochs 31-40 of a single seed, and cannot distinguish added capacity
    from a different noise trajectory.
  - >-
    No from-scratch 320-epoch evidence exists for any candidate; no
    mechanism probes P1-P5 were run.
implication: >-
  The capacity question on this line stays open, but it requires a
  discriminative screen first: a new preregistration should either use the
  from-scratch epoch-40 checkpoint gate style of the CSSD round or a
  low-rate warm adaptation (e.g. lr 1e-4) whose M0-measured noise floor is
  preregistered and whose gate effect size exceeds that floor, before any
  capacity search or combination candidate is authorised.  CAP-BASE remains
  CSSD-q1; no width/rank/seed/epoch rescue of this round is allowed, and the
  stabilisation hypothesis (added capacity slows late-epoch valid drift) is
  recorded only as a candidate secondary question for such a new round.
