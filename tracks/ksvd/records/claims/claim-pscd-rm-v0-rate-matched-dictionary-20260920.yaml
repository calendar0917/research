revisit_if: >-
  A merge-only parameterisation whose MDL eligibility admits the high-merge rules
  (or a split / replacement / retirement dictionary) lets a task-driven
  dictionary reach the frequency-level R_state/R_occ budget AND then beats
  FREQ-LOOSE by Delta_task^low-rate >= 0.04 with healthy reuse -> task
  boundaries, not compression, drive the gain; or a reader-gradient /
  differentiable dictionary update escapes the same rate-construction failure.
