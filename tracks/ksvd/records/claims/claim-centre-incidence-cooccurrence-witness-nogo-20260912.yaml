contradicting_evidence:
  - >-
    The algebraic non-uniqueness is real and occurs in practice: two relation
    sets with (1,0),(0,1) and (1,1),(0,0) share mean, std AND count but have
    covariance off-diagonals of opposite sign. The target-free ambiguity
    audit confirms this is measurable in the frozen states (normalized
    conditional Var(c | 16-NN m) = 0.285). So the retained summary genuinely
    does not determine the discarded quantity. This does NOT reverse the
    result: it is precisely the "mathematical non-uniqueness is not a
    task-relevant bottleneck" distinction the audit was designed to test.
  - >-
    delta_R is positive in 3/5 folds (+0.00092 pooled), so the covariance
    witness is not uniformly worse than the matched-budget R-only head; the
    confidence interval straddles zero. This is why the verdict rests on the
    depth-matched, parameter-matched delta_M rather than on delta_R alone.
  - >-
    The matched-budget 1-layer R-only head underperforms B0 here, while the
    historical 2-layer head at the same budget is much stronger
    (B1_hist 0.190499). A fixed, non-swept depth sensitivity measures the
    extra hidden layer at +0.01198 mean MAE (5/5 folds), i.e. the same order
    as the whole delta_M scale. The historical-head comparison is therefore
    depth-confounded and is robustness evidence only. The confound cuts
    against the negative conclusion.
limitations:
- One frozen backbone seed only (the pre-registered CLEAR NO-GO rule stopped
  the second seed); one adapter init (Stage 1b not triggered); the channel
  shuffle surrogate control was not run (gated on E clearly beating B2).
- One fixed frozen 8D random projection. A larger, learned or full 120D
  covariance pathway was deliberately NOT searched; a NO-GO here must not be
  rescued by "learn the projection" or "use the full covariance".
- The witness is a low-capacity projection-based graph summary; it does not
  prove that moment pooling is sufficient in general, nor that the centre
  update is globally well-parameterized.
- The frozen pair states are very sparse (86-97% zero entries), which
  structurally limits how much cross-channel co-occurrence exists to detect;
  a differently trained pair encoder could in principle expose more.
implication: >-
  Close within-centre cross-channel relation co-occurrence as the current
  bottleneck for compact-v4. Do NOT build a covariance / joint-relation /
  centre-incidence architecture, do NOT test full covariance, a larger or
  learned covariance projection, attention over relations, a DeepSets centre
  encoder, a second centre update, or relation-set Transformer. Do NOT
  re-register a third "missing statistic along the compute graph" probe.
  The next question must move to a different level: information
  accessibility / learnable parameterization / whether the one-shot centre
  update is the right function class — each as its own pre-registered
  hypothesis.
