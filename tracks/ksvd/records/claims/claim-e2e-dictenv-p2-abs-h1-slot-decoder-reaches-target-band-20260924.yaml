caveats:
  valid_only: >-
    The official ZINC test was never loaded in this round by protocol, so
    0.123549 is a valid-split MAE.  The frozen P1 valid->test improvement
    (0.131975 -> 0.107593) must NOT be assumed to carry over to H1.
  horizon_lambda_confound: >-
    Z1 is (lambda x1.0, horizon 320) while Z2/Z3 are (lambda x0.5/x0.25, horizon
    240), so the round does not separate "lambda = 33.959 is optimal" from
    "longer horizons help".  The lambda ordering is only read within the fixed
    240-epoch horizon.
  k64_lambda_confound: >-
    The K64S8 row mixes a dictionary-capacity change with a mandated lambda
    recalibration that lands at 12.43; it is not evidence that K=64 dictionaries
    are worse for this family.
  no_mechanism_intervention: >-
    No dictionary-zero / assignment-shuffle interventions were run in this tuning
    round, so H1 inherits P1's mechanism evidence and has not re-established it.
  single_seed: >-
    Every candidate is a single seed; run-to-run valid variation is at the ~1e-3
    scale, so the H1-vs-Z1 margin (0.004359) is above it while the H1-vs-target
    margin to the 0.120 band edge (0.003549) is of the same order.
  cross_architecture_anchors: >-
    The comparison against T1 and FEC-S1 crosses architectures and protocols and
    is anchor context only, never a decision input.
