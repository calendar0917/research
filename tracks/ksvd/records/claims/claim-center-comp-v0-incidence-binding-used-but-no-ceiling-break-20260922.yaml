kind: claim
status: supported
study_id: zinc-context-gap
statement: >-
  On the fixed internal ZINC split, with the exact frozen TCCD-v2 PrototypeREL
  representation and the exact TCCD-v5 pair cache, a single explicit
  incidence-preserving composition operator pair -> center -> graph
  (e_ij = phi(p_ij); q_i = sum_{j!=i} e_ij; u_i = rho([c_i, q_i]);
  h_center = sum_i u_i; h = [h_base, h_center]) does NOT break the existing
  frozen-representation ceiling. Its Top-5 soup MAE is 0.2543369984066812
  versus the best existing frozen composition TCCD-v5 PRE 0.2514181435108185,
  i.e. G_center = -0.0029188548958627436. The branch does add capacity over
  BASE (+0.0240269149) but less than the v5 POST/PRE gain. The evaluation-only
  CENTER-BIND-SHUFFLE (q_i -> q_{pi(i)} with c_i fixed) raises soup MAE to
  0.2636783788445173, giving G_bind(soup) = 0.009341380437836055 and
  G_bind(best) = 0.007225432144477975: the trained model clearly uses center
  binding, with 51.25% of dev molecules moving by >= 0.01, but the aggregate
  effect is just below the preregistered 0.010 material threshold. The
  preregistered case is therefore D (NO MATERIAL SIGNAL, borderline binding):
  one layer of pair-to-center incidence is used but is insufficient, and it
  does not explain the 0.25 -> 0.12 gap (gap_to_strong 0.1345190). Read-only
  size stratification shows the binding effect is strongest for small
  molecules (G_bind 0.018894) and nearly absent for large molecules
  (0.000781), opposite to a graph-size/complexity-scaling story.
