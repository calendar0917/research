decision: OUTCOME_D_SINGLE_LAYER_INCIDENCE_INSUFFICIENT
interpretation: >-
  Retaining pair-to-center incidence before global pooling is not the missing
  ingredient that unlocks the frozen TCCD-v2 ceiling. The trained operator does
  use center binding (G_bind 0.009341), but below the preregistered material
  threshold, and it does not exceed the existing global pair/statistical
  representation (G_center -0.002919). The binding effect shrinks with graph
  size, contrary to a complexity-scaling account. This is direct evidence
  against single-layer shared-center identity as the primary 0.25 bottleneck,
  and consistent with the v6 reading that recent gains are mostly
  coordinate/reader exposure rather than new occurrence-level information.
next_hypothesis: >-
  Do not add a second incidence layer or a GNN rescue. The next representation
  question (a fuller assembly object, or local-code / representation
  sufficiency) requires a new preregistration.
