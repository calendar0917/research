    G_bind(soup) 0.009341 is 93.4% of the 0.010 material threshold and the
    shuffle changes over half the predictions by >= 0.01, so center binding is
    clearly non-negligible even though the registered D rule fires.
  - >-
    Only one seed; internal-dev only; the sum pooling registered here scales
    with graph size, and no normalization or layer-depth alternative was
    tested by design.
