contradicting_evidence:
  - >-
    The primary adapter init is weakly positive on both backbones
    (+0.00037/+0.00115); the screen cannot exclude a very small (< ~0.001)
    increment. The second init is sign-unstable, which is why the verdict is
    INCONCLUSIVE rather than an information-theoretic NO-GO.
  - >-
    The checkpoints were valid-selected, so backbone-selection dependence
    remains; the valid-based estimate is not a clean OOF mechanism estimate.
  - >-
    Only the historical low-complexity reader is tested; a different
    (higher-capacity / learned) state parameterisation is NOT ruled out.
