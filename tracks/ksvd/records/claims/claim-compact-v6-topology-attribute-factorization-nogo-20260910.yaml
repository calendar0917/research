claim_id: claim-compact-v6-topology-attribute-factorization-nogo-20260910
kind: claim
status: supported
study_id: zinc-context-gap
created: '2026-09-10T18:10:00'
statement: >-
  A topology-attribute factorized patch representation (compact-v6: frozen historical
  compact-v4-hinge patch path PLUS a shared, permutation-invariant, exact-token-free
  attribute encoder over (atom/bond type, coarse-rooted-automorphism-orbit role)
  primitives, zero-init fused as an 8D e_attribute appended to the patch encoder input,
  +1,470 params to 101,083) does NOT improve ZINC-12k official-validation MAE over the
  frozen v4-hinge baseline across seeds. Paired delta (v4 - v6) over seeds 0-2 is
  +0.013645 / -0.017017 / +0.002487, mean -0.000295, median +0.002487, std 0.012671,
  2/3 positive -> below the pre-registered multi-seed GO gate (mean >= 0.003). The seed-0
  Strong-GO point (+0.013645) does not replicate. The seed-0 gain is also a
  tail-for-bulk trade: historical difficulty quintiles Q1/Q2 combined degrade by
  -0.017265 (gate <= +0.002 FAIL) while Q5 improves by +0.091709, reproducing the
  corrected-exact-tokenizer redistribution fingerprint. Mechanism: the frozen seed-0
  factorized model's predictions are EXACTLY invariant to within-patch attribute-type
  shuffle and role-association shuffle (clean MAE 0.156421 == shuffled 0.156421,
  per-molecule max |delta| = 0.0) and its e_attribute has mean norm 0.002749 with
  std 2.3e-10 (near-constant) -> the branch collapsed and the model does not use
  attribute placement. The count-only control (same params, roles zeroed) also gives
  no seed-0 gain (-0.000865) and multi-seed mean -0.002243 (1/3), so chemistry
  composition alone is not sufficient; factorized vs count mean +0.001948 (1/3) is
  below the mechanism gate. The only consistent signal is factorized > the
  param-matched capacity control in 3/3 seeds (mean +0.006180), but because the branch
  is shuffle-invariant this reflects training trajectory, not attribute usage.
scope: >-
  ZINC-12k official train/valid, historical compact-v4-hinge patch path
  (typed_tokenizer_v1_historical), seeds 0/1/2 (seed 3 not run), validation MAE only;
  no test split loaded; serial CPU, deterministic, identical optimizer/protocol to v4.
