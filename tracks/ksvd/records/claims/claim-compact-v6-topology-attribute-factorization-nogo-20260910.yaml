contradicting_evidence:
- 'At seed 0 the factorized variant improves validation MAE by +0.013645 over v4, above the pre-registered Strong-GO threshold, and beats the param-matched capacity control in all three seeds (mean +0.006180).'
- 'The permutation-invariance and exact-token-avoidance properties of the role/attribute primitives hold exactly (>=120 relabelings per graph, zero corrected-token lookups), so the representation itself is well-formed.'
limitations:
- 'Only seeds 0-2 were run (the multi-seed sweep was stopped early on a compute-time instruction, so the pre-registered 4-seed protocol is incomplete); if seeds 0-1 only are used the paired mean is -0.001686 (1/2).'
- 'The zero-init final fusion plausibly causes the observed branch collapse, so the v6 configuration may not be a fully fair test of attribute-placement value; the decision record registers this as the sole revisit condition.'
- 'Difficulty quintiles are the frozen historical (v4-audit) quintiles reused for comparability, not re-derived from the v6 split.'
- 'The 8D e_attribute and 8-feature role descriptor are one specific realization; a differently parameterised attribute encoder is not excluded by this claim.'
implication: >-
  Close the topology-attribute-factorization branch on this evidence. Do not enlarge the
  attribute dimension, deepen its MLP, add role features, or open a dictionary/KSVD route.
  Any reopening must first fix the branch-collapse initialization/regularization problem
  and pre-register a graph-side-observable gate; the seed-0 tail-for-bulk trade must be
  treated as a failed bulk gate, not as a partial success.
