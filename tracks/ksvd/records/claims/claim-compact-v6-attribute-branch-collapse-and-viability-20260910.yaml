contradicting_evidence:
- 'The repaired branch passes the full 100-step viability gate V1-V4, so the earlier "the configuration could not test attribute placement at all" caveat is now resolved: even a demonstrably active branch yields no seed-0 gain.'
- 'The repaired init makes the branch several orders of magnitude more active than the original at the frozen checkpoint (patch std 3.6e-7 vs 7.6e-12; fusion weight norm 0.035 vs 0.008), so the repair is real, not cosmetic.'
limitations:
- 'Only seed 0 was run; the pre-registered rule stops at seed 0 when the performance gate fails, so no two-seed or four-seed statement is made here.'
- 'The collapse in the repaired full run is a training-dynamics attractor (v4 path fits the target alone); the exact epoch at which it re-collapses was not traced (only the 100-step window and the frozen endpoint were measured).'
- 'Difficulty quintiles are the frozen historical (v4-audit) quintiles reused for comparability, not re-derived from the v6 split.'
- 'The 8D e_attribute and 8-feature role descriptor remain one specific realisation; a fundamentally different (non-appended) attribute interaction is not excluded by this claim.'
implication: >-
  The topology-attribute-factorization branch is closed permanently on this evidence.
  The original seed-0 gain (+0.013645) is invalid as mechanism evidence (its branch was
  collapsed). Do not tune init scale, attribute dimension, role features, or optimizer;
  any reopening requires a fundamentally different architecture stage and its own
  pre-registered graph-side-observable gate.
