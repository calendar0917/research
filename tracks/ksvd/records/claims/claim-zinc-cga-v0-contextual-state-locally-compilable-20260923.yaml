claim_id: claim-zinc-cga-v0-contextual-state-locally-compilable-20260923
created: '2026-09-23T00:00:00Z'
kind: claim
status: tentative
study_id: zinc-context-gap
statement: >-
  CGA-v0 (preregistration + Amendment A1 in
  notes/zinc_contextualization_gap_audit_v0_preregistration.md; formal run
  commit c174ab36, remote A100 host res, deterministic CPU inference, official
  ZINC train 10000 / official valid 1000, official test never loaded, 0 new
  full training runs) reuses the durable recurrent pair-centre checkpoints
  (recurrent_seed{0,1}, 82,115 params, training commit a3515e76) and the matched
  one-shot baseline (baseline_seed{0,1}, same commit/budget) plus the auxiliary
  B-Null seed0 (49,343 params). Valid MAE and all exports reproduce the recorded
  behaviour (|MAE diff| <= 2.4e-8; q0/A0 reconstruction and repeat-export
  bit-identical; gates A/B/C/D pass). KEY OBSERVED STRUCTURE: the h0 space is
  massively duplicated - 72.3% of valid patches have an exact h0 match in train
  (median 77 duplicates), so Jaccard(NN_h0, NN_h2) is tie-confounded and the raw
  amplification d2/(d0+eps) is degenerate; Amendment A1 therefore bases the
  decision on a matched-random retention ratio computed BEFORE the formal run.
  RESULT: the recurrent contextual refinement delta_h = h2 - h0 is largely a
  locally determined transformation. The local state alone predicts delta_h with
  P_local = 0.926 (seed0) / 0.961 (seed1); centre context [h0;A0] raises this
  only to P_context = 0.963 / 0.976, i.e. context explains an absolute
  context_abs_gain = 0.037 / 0.014 of the delta variance (0.85% / 0.57% of the
  h2 variance). h0-neighbour deltas disagree only ~0.26-0.30 as much as matched
  random patches (retention_dDelta), and identical-h0 patches disagree by
  0.18 / 0.08 of sqrt(2) sigma_delta. K=64 target-free local prototypes carry
  only 13-18% of the delta variance within-atom (weighted mean S_k 0.184 /
  0.128); 82-87% is between prototypes. The task link is marginal and
  seed-unstable: Spearman(C_h, gain) = 0.026 (95% CI [-0.036, 0.092]) / 0.065
  (95% CI [0.0005, 0.130]), Q4-Q1 gain +0.0088 (CI crosses 0) / +0.0044,
  size-residualised Spearman 0.018 / 0.042 (CIs include 0). Auxiliary B-Null
  seed0 shows the same structure (P_local 0.864, context_abs_gain 0.069).
  Preregistered decision -> CASE C: CONTEXTUAL_STATE_LOCALLY_COMPILABLE.
  Supported statement: the strong recurrent pair-centre model's contextual
  refinement is not a hidden, locally inaccessible computation; it is 93-96%
  predictable from the local state, its context-only increment is 1-4% of the
  shift, and that increment has no consistent task link. This deprioritises
  further local / pair / topology-cross dictionary designs as a way to recover
  the recurrent advantage.
