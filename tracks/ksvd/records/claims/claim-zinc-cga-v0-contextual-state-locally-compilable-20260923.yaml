caveats:
  - h0 is a learned local representation; the audit asks whether the model's own
    local state already determines its contextual refinement, not whether a raw
    graph invariant does.
  - P_local is a non-parametric upper bound for a local-only predictor; it does
    not prove an end-to-end strictly-local model recovers the recurrent task
    performance.
  - context_abs_gain is small but non-zero; the honest reading is "context is
    real but not the bottleneck", not "context is absent".
  - B-Null is a single seed and auxiliary only; it is not used for the verdict.
  - The h0-space duplication forced a measurement amendment (A1); both the
    original and the amended quantities are reported, and the amendment was
    frozen before the formal run.
