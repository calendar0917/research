  - tests/test_zinc_pair_dict_v0.py
  - results/zinc_pair_dict_v0/stage0_tests.json
  - results/zinc_pair_dict_v0/synth_mechanism.json
  - results/zinc_pair_dict_v0/params.json
  - results/zinc_pair_dict_v0/overfit_pair.json
  - results/zinc_pair_dict_v0/overfit_raw.json
  - results/zinc_pair_dict_v0/screen_pair.json
  - results/zinc_pair_dict_v0/screen_raw.json
  - results/zinc_pair_dict_v0/screen_raw_wide.json
revisit_if: >-
  A NEW pre-registration (i) proposes a structurally different object class /
  parameterisation rather than a local patch; or (ii) supplies full-10000 or
  effective-capacity-matched evidence that the pair lift's 2048 overfitting is a
  pure data-size effect (e.g. the gap closes when the pair encoder is trained on
  all 10000 official-train graphs or when its effective capacity is matched to
  the node-MPNN); or (iii) re-scopes the dictionary question onto the working raw
  node representation (raw_wide), which is the one raw encoder that does match
  the raw baseline family here.
