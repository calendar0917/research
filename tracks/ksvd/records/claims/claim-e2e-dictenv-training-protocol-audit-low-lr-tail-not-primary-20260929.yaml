claim_id: claim-e2e-dictenv-training-protocol-audit-low-lr-tail-not-primary-20260929
created: '2026-09-29T00:00:00Z'
kind: claim
status: supported
study_id: zinc-context-gap
statement: >-
  On the frozen ZINC dictionary-environment base CSSD-q1 (C6 clean mask + q1
  common structural coordinate + q1-orthogonal sparse residual dictionary
  K=32/s=8/IHT-10 + paired node/edge structure-semantic binding + full clean
  relation + first/second-moment readout; exactly 97727 params; CPU only;
  official test never loaded), the fixed training protocol (Adam lr=1e-3,
  weight decay 1e-5, batch 128, clip 5.0, 320 epochs) is NOT the primary
  bottleneck of the 0.128-0.130 Top-5 soup plateau.  Design: one shared
  trajectory for epochs 1-280 at lr=1e-3, then an exact clone of
  model/optimizer/RNG/loader state at epoch 280 and a single-variable fork for
  epochs 281-320 - CONTROL keeps lr=1e-3, LOW-LR uses lr=1e-4, with no
  optimizer reset (only param_group lr changes) and identical per-epoch batch
  order (40/40 tail hashes equal).  The fork is exact: prediction max |delta|
  0.0 in eval mode and 0.0 in train mode with dropout active, model state
  identical, optimizer exp_avg/exp_avg_sq/step identical before the lr edit.
  Primary frozen metric (Top-5 by valid MAE over epochs 1-320, averaged state,
  evaluated on official valid): M_control = 0.12742769679048796, M_low_lr =
  0.1268179698883905, G_schedule = M_control - M_low_lr =
  +0.0006097269020974572 = 1.016x the v2-measured CPU soup-level
  reproducibility floor (~6e-4) -> frozen Case A
  TRAINING_PROTOCOL_NOT_PRIMARY_BOTTLENECK (G < 0.002; Case C/D conditions
  also fail: G << 0.005 and M_low_lr = 0.126818 > 0.125).  The shared prefix
  alone soups to 0.12972567650018027 over epochs 1-280, already better than
  the historical fixed-protocol soup 0.13002798487985273, and both
  continuations are also below the v2 low-rate warm soup 0.1287231611124589;
  the plateau is therefore a property of the architecture/data regime, not of
  the LR schedule.  Secondary (reported, not primary): the low LR is a strong
  LATE-RUN STABILITY effect, not a capacity effect - epoch-320 valid 0.128793
  vs 0.148608, last-10 mean 0.128832 vs 0.146977, tail-only soup (281-320)
  0.126818 vs 0.128055 (delta 0.001237, 2.1x floor), full-run best 0.127857 @
  309 vs 0.133430 @ 311; update norm drops ~9x (0.0479 -> 0.0056) and
  pre-clip grad norm ~1.6x (4.34 -> 2.64); train/valid deltas read
  joint_improvement_late_optimization (train -0.024452, valid -0.010762) vs
  overfitting_or_noise (train -0.002202, valid +0.009053) for the control;
  the reconstruction term is preserved in both arms (lambda*rec at 320
  5.99e-05 low / 4.96e-05 control).  Dictionary health is preserved on both
  arms (32/32 active, N_eff 20.281 at 320, N_eff 20.762 at 280; max activation
  rate 0.928 low vs 0.847 control; movement vs fork 0.281 low vs 1.079
  control, i.e. the control tail churns the dictionary ~3.8x more).  The
  control's full-run soup still selects 3 tail epochs [297, 311, 313], so the
  best-of-run metric absorbs the low-LR stability gain at the floor; only
  epoch 313 is a soup member in both arms.  horizon_may_still_be_binding =
  False (low-LR best epoch 309, late slope 311-320 +7.66e-05/epoch vs control
  +1.51e-03).  Historical attribution caveat: the fresh prefix reproduces the
  historical trajectory exactly at epoch 40 (delta 0.0) and then drifts
  chaotically (mean |delta| 0.007038, median 0.003433, p90 0.020866, max
  0.055604 over epochs 1-280), an order of magnitude larger than the LR
  effect, so cross-run comparisons against 0.130028 / 0.128723 cannot isolate
  the LR schedule; only the paired fork is decision-grade.
scope: >-
  Local CPU-only round (4 threads, peak RSS 2348 MB), preregistration sha256
  0fdcef2099cc4fb6141642685e90d1160e41af3f4ff7ab37ca772564364713a2 frozen
  with module and runner at commit ea54826 before the first training process;
  harness repair of a runner-side best-seed integer cast (bookkeeping only, no
  re-training, both trajectories untouched) committed as ced2570.  One
  architecture only (exactly 97727 params, mismatch would stop the round), one
  seed (0), one candidate rate (1e-4, no sweep and no scheduler), one fork
  epoch (280, frozen before the run; historical soup members 282/299/307/312/
  313 all lie after it), both arms stop at exactly epoch 320 even if the best
  epoch is 320 (no horizon extension).  Data: frozen phi65 cache from the
  official ZINC train (10000) / valid (1000) splits; official test never
  loaded in any payload; dictionary sha256 b0c5da98... and the stored q1
  subspace are unchanged.  The claim is about the fixed 320-epoch protocol on
  this base, not about optimizers in general and not about warm adaptation
  from a different checkpoint.
