contradicting_evidence:
  - >-
    The secondary views show a large, consistent late-run effect of the low
    LR: epoch-320 and last-10 gaps of ~0.018-0.020, and a tail-only soup gap
    of 0.001237 (2.1x the floor).  This does not change the primary verdict
    (the frozen metric is the full-run soup, chosen to measure attainable
    model quality), but it shows the LR schedule is not irrelevant: it
    controls late-run stability, and a metric that read out the final epochs
    instead of the best-of-run would have reported a material difference.
  - >-
    The control continuation did produce one epoch better than the entire
    prefix (best 0.133430 @ 311 vs prefix 0.133978 @ 277), so lr=1e-3 is not
    strictly harmful late in training; the control tail remains a high-energy
    random walk that occasionally visits good points.
  - >-
    Single seed (0) and a single trajectory pair: the sub-floor effect
    estimate cannot exclude an even smaller true effect of either sign; the
    round was powered only to exclude a material effect (>= 0.003 = 5x floor).
limitations:
  - >-
    Single seed; no seed 1/2 (forbidden by the frozen contract unless a
    material effect appeared), so the +0.000610 estimate rests on one paired
    trajectory.
  - >-
    The primary effect is at the measured CPU soup floor (1.02x), so the sign
    of a smaller true effect is unresolved; this was pre-declared.
  - >-
    Historical references (0.130028, 0.128723) are confounded by chaotic
    cross-run drift of the same protocol (mean |delta| 0.007), so the round
    answers the question only through the paired fork.
  - >-
    The stability interpretation is supported by large secondary deltas but
    was not the primary endpoint; no last-epoch or tail-only metric was
    preregistered as a decision variable.
implication: >-
  The fixed 320-epoch lr=1e-3 protocol is not what holds CSSD-q1 at the
  0.128-0.130 plateau, so the next round should not search optimizers or
  schedules: per the frozen preregistration decision tree (Case A,
  G_schedule < 0.003) the next architecture study is a
  Dictionary-Conditioned Semantic Operator (e_v = sum_k alpha_vk f_k(q_v),
  shared dictionary roles driving a transferable structure->semantics map),
  still with no message passing and no environment update.  The canonical
  protocol remains 320@1e-3 for comparison against the historical baseline;
  the low-lr=1e-4 tail is recorded as a cheap late-run stabiliser (not
  adopted as canonical, since the Case B/C promotion rule did not fire) to be
  reconsidered only if a future substrate shows late-run divergence.
