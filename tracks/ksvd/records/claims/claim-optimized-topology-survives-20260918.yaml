- results/optimized_baseline_critical_revalidation/part_a_decision.json
- results/optimized_baseline_critical_revalidation/runs/v2_hist_seed0.json
- results/optimized_baseline_critical_revalidation/curves/v2_hist_seed0_curve.csv
- results/optimized_baseline_critical_revalidation/states/v2_hist_seed0_selection_state.pt
- results/compact_v4_training_sufficiency/runs/Pstar_A2_long_seed0.json
- configs/luyin16/zinc_optimized_v2_historical.yaml
- tests/test_optimized_baseline_critical_revalidation.py
contradicting_evidence:
  - >-
    This is a SINGLE seed (seed0) result by design; the strong-survival branch
    was pre-registered to stop at seed0 because the topology claim already had
    4/4 historical directional gains. A future paper-core claim should still add
    optimized-v2 seed1.
  - >-
    The optimized compact-v2 best-valid epoch 166 is an isolated dip on a noisy
    batch-128 curve (late-phase std ~0.011); the gap is nonetheless ~0.02, far
    larger than that noise scale and larger than the historical gap.
