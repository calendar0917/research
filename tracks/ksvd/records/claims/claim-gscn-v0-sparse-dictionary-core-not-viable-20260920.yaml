revisit_if: >-
  A dictionary-core parameterisation with a different objective/optimization
  (e.g. a learned encoder that stays coupled to reconstruction, a continuum /
  annealing of lambda, T unbounded, or a dictionary-core WITHOUT the extra
  LayerNorms) both reproduces B-Null-Raw AND beats it by >=0.02 through the sparse
  code (with sparse, non-collapsed codes) -> the negative result is specific to
  the frozen ISTA/ReLU parameterisation; or a raw baseline that is NOT better than
  the generic control appears, which would change the capacity-only reading.
