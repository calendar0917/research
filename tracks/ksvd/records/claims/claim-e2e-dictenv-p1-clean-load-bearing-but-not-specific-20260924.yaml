caveats:
  single_seed: >-
    Only seed 0 was run; seed 1 was not authorised because the seed-0
    specificity gate failed.  The G_specific margin (0.002559 vs 0.003) is close
    in absolute terms, but the test-side reversal (DenseTied 0.0059 better)
    makes the not-specific conclusion robust rather than marginal.
  gpu_not_bit_deterministic: >-
    Remote A100 floating point is not bit-deterministic; run-to-run valid
    differences are at the ~1e-3 scale, which is the order of the specific
    margin.
  cross_architecture_anchors: >-
    The comparison against v0/T1/FEC-S1 crosses architectures and horizons and is
    anchor context only, never a decision input.
  official_test_not_project_pristine: >-
    Historical unrelated ZINC official-test reads exist; this round's single read
    is reporting-only and post-freeze.
