caveats:
  two_seeds_only: >-
    Only seeds 0 and 1 were run, as pre-registered.  The soup mean 0.818462 has a
    two-seed population std of 0.009930, which is larger than the valid->test gap
    of the ensemble; single-seed test spread (0.753551-0.770266) is the dominant
    source of uncertainty and the ensemble is the reported headline object.
  valid_test_gap: >-
    MolHIV uses a scaffold split, so valid -> test costs ~0.03-0.05 AUC.  The
    frozen valid verdict M1_TRANSFER_STRONG (>= 0.80) is deliberately NOT revised
    by the test read (0.789059, below the strong band, above the competitive
    band).
  cross_architecture_anchors: >-
    The comparison against molhiv_patch_path_pooling and
    molhiv_recurrent_pair_centre crosses architectures and protocols and is anchor
    context only, never a decision input.
  dictionary_not_initialisation: >-
    Because the dictionary moves almost completely during training, this claim is
    about the learned environment; it does not establish that the K-SVD
    initialisation is necessary.
  official_test_not_project_pristine: >-
    Historical unrelated MolHIV test reads exist in this project; this round's
    single read is reporting-only and post-freeze.
