claim_id: claim-tccd-v4-twohop-assembly-no-material-increment-20260922
created: '2026-09-22T00:00:00Z'
kind: claim
status: supported
study_id: zinc-context-gap
statement: >-
  On the fixed internal ZINC split, a parameter-free normalized two-hop walk
  moment M2 = C^T S^2 C does not materially add predictive information beyond
  the exact TCCD-v2 relation set under a frozen TCCD-v2 PrototypeREL
  representation and matched lightweight readers. The primary topology-mismatch
  delta is 0.0000068843 MAE and the BASE-vs-REAL2 additive delta is
  -0.0000134408 MAE, both far below the preregistered 0.005 Stage-A failure
  threshold. This does not show that topology is irrelevant; it supports the
  narrower conclusion that one additional normalized two-hop aggregated moment
  does not overcome the TCCD-v2 ceiling and that early occurrence aggregation
  may be the leading bottleneck.
scope: >-
  TCCD-v4 preregistration; formal implementation commit
  2e0218a121d26737a5fff9e45bfaf4cbad4a4b25; remote A100 GPU1; seed 0; fixed
  internal split seed 20260922 with 8000 train and 2000 dev; exact TCCD-v2
  714-to-64 local encoder, K=64 prototypes, temperature, regularizers, and
  existing relations; S=D^-1/2 A D^-1/2 from native untyped adjacency, R2=S^2
  including diagonal; deterministic permutation seed 20260922; official test
  never loaded.
