statement: >-
  The single authorised candidate of this round — the frozen joint K48/s12
  dictionary over the train-only scale-balanced 709-D input (struct residual 65
  + Sem108 108 + RoleCorr 536), coordinate [c~; IHT_10(alpha_48)] of width 49,
  seed 0, 320 epochs, fixed Top-5 soup — reached an official-valid soup MAE of
  0.132442119 (best single epoch 0.135177988 @ 320) under the local CPU
  regime, landing in the pre-registered `stop` band (> 0.1233): the candidate
  did not enter a better absolute interval, and the frozen rule terminates the
  route without a seed 1, rescue or sweep.  The frozen dictionary's real
  coding diagnostics are weak: tied-IHT(10) relative error 0.895192 (train) /
  0.941186 (valid; per block struct 0.979 / sem 0.899 / corr 0.935), OMP(12)
  reference 0.646282, 60-step IHT 0.772 / 0.865, K-SVD final fit MSE 1.165291
  with 40/48 atoms active, effective atoms 24.55, exact l0 mean 12.0 and top-1
  activation share 0.878.  At the soup state the coordinate path is switched
  off: all four binding matrices are denormal-zero, the joint-code zero probe
  and both within-molecule row-shuffle probes (seeds 11, 22) give a prediction
  change of exactly 0.0, and the channel was live before training (init-time
  prediction shift 8.035e-05, joint binding gradients 1.6e-05), decaying in a
  reproduced per-epoch probe (~x0.85/epoch node pair, ~x0.975/epoch edge pair).
  Consequently the 0.132442 endpoint reflects the frozen protocol with an
  inert dictionary coordinate (soup train MAE 0.056584, train-valid gap
  -0.075858), not the joint dictionary route's ceiling.
