implication: >-
  The joint-object route is answered negatively for this frozen candidate and
  is stopped; it is not answered as a research question.  A future round that
  wants the joint dictionary's real ceiling must first pre-register a fix for
  the observed failure mode (the multiplicative coordinate binding's collapse
  under the frozen objective) and/or a capacity increase, and must carry its
  own matched control (e.g. the unbuilt PCA48) and paired seeds.  The frozen
  dictionary diagnostics (tied-IHT 0.895/0.941 vs OMP(12) 0.646) indicate that
  a 48-atom code over a 709-D input is itself a major limitation, so capacity
  is the first thing such a preregistration should justify.
kind: claim
limitations:
- >-
  Single seed, single trajectory, no control arm (PCA48, random / shuffled /
  no-dictionary training were explicitly not authorised), so no increment,
  sparse-vs-dense or causal statement can be made; the frozen absolute band
  (stop > 0.1233) is the only endpoint rule applied.
- >-
  The endpoint measures the frozen protocol with an INERT dictionary
  coordinate: at the soup/best states all four coordinate binding matrices are
  denormal-zero (|W_A_S|max = 7.05e-38, |W_A_C| = 7.04e-38, |W_E_S| = 7.05e-38,
  |W_E_C| = 6.77e-38), and zeroing / row-shuffling the joint code changes the
  soup MAE by exactly 0.0 (seeds 11 and 22).  The run therefore does not
  measure the joint-dictionary route's achievable error.
- >-
  The zero/shuffle probes are diagnostic only (per the pre-registration they
  can neither support "the dictionary is useless" nor be converted into a
  rescue).  The dead *node* pair is pre-existing and already in the record
  (claim-e2e-dictenv-jointbond-v1-key-level-fusion-inert-denormal-collapse-20260930:
  frozen-parent node binding at the 7e-38 floor, G_node = 0.0; the route-1 /
  RoleCorr-v1 soup states checked here show the same floor with only the edge
  pair alive), so the route-2-specific observation is only that the edge pair
  also reaches the floor.  The prior decay diagnostic
  (claim-e2e-dictenv-jointbond-decay-diagnostic-v1-frozen-parent-branch-trainable-decay-slows-not-blocks-20260930)
  shows weight decay alone does not block a live branch, so this is read as a
  sub-resolution task signal on this coordinate, not as a global optimizer bug.
- >-
  CPU regime (runtime.device=cpu, 8 threads) on the authoring machine; matched
  within the local CPU runs of this track but not to historical A100 numbers
  as if the regime were identical.
- >-
  One dictionary geometry only (K = 48, s = 12, 10 K-SVD epochs, seed
  20260924, tied-IHT 10 iterations, train-only scaler); no K / s / epochs /
  steps / scaler / width / horizon / lr variation was authorised.
