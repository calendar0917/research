claim_id: claim-e2e-dictenv-joint709-absolute-v1-stop-inert-coordinate-20261001
contradicting_evidence:
- >-
  The best single epoch is the LAST epoch (0.135177988 @ 320) and the top-5
  members all come from the final 36 epochs, so the curve had not flattened;
  a longer horizon would continue to improve slightly.  This does not change
  the band: the endpoint is 0.0091 MAE above the borderline edge 0.1233, i.e.
  the verdict is not a few-epochs artifact.
- >-
  The endpoint does not measure the joint dictionary route's ceiling, because
  the coordinate channel was inert; a statement of the form "the joint K48/s12
  dictionary route cannot pass 0.1233" is NOT supported by this run.
