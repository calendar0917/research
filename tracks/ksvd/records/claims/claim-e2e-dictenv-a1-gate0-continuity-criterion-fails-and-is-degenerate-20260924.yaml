caveats:
  single_seed: >-
    Only seed 0 exists for this round; seed 1 was conditional on G_attr >= 0.003
    and G_attr was never measured.  The Gate-0 numbers are seed-0 formal-run
    values, and the continuity audit uses the frozen seed 20260933 pool.
  criterion_not_object: >-
    The continuity FAIL is interpreted as a property of the frozen criterion and
    population, supported by the stratum diagnostics and the independent
    TCCD-v0 precedent.  This interpretation is post hoc; the frozen verdict
    REPRESENTATION_NOT_QUALIFIED stands unchanged, and no statement is made that
    REAL is a better (or worse) representation than INDEP.
  local_reproduction_float32: >-
    The local re-run of the frozen paired statistic reproduces 0.53625 versus the
    remote 0.534375 (3 of 1,600 comparisons flip under float32 norm rounding
    between machines); the near/control pair sets are bit-identical (near WL
    cosine min 0.9999999999979995, mean 0.9999999999980003, mean size 5.35).
  tiny_patch_population: >-
    The pool is sampled uniformly over (molecule, root) patches of the official
    train split, so the 1.07 %-of-patches- >= 10-atoms composition is a property
    of ZINC rooted patches under this sampler, not a filtering choice.
  no_test_access: >-
    The official ZINC test split was never loaded in this round
    (official_test_loaded: false in every artifact); no absolute-MAE or
    target-band statement is made.
