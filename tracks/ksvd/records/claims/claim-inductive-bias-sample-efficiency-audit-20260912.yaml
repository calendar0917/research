limitations: >-
  Within-family only. This does NOT prove that compact-v4 has inferior inductive
  bias relative to CIN/GNN or any external model; a cross-family sample-efficiency
  comparison needs the same subsets and probe with another representation family.
  The 2000 probe already participated in prior hypothesis formation and is not a
  pristine holdout; it was locked for preregistered measurement only. The
  per-doubling gain is a local 1800-7200 measurement; with three sample sizes no
  power-law or asymptotic-floor claim is made and no extrapolation to 14.4K /
  28.8K / infinite data is authorized. The larger N=7200 anchors were run at full
  budget while smaller-N runs early-stopped under patience; at matched optimizer
  step 6,783 the 3600 seed1 800-selection MAE 0.205394 is still much worse than
  the 7200 anchor at epoch 119 (0.1698), so the effect is not an artifact of
  early stopping. A steep curve means the family remains data-limited; it does not
  by itself prove that more data would close the benchmark gap. It also does not
  authorize adding structural features or capacity.
