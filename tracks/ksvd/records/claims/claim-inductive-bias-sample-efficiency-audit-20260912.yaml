claim_id: claim-inductive-bias-sample-efficiency-audit-20260912
kind: claim
status: supported
study_id: zinc-context-gap
created: '2026-09-12T14:40:00'
statement: >-
  Under the locked compute-matched protocol (exact compact-v4-smallhead 82,115
  params; Adam lr 1e-3 wd 1e-5 batch 128 L1 no scheduler; frozen official-train
  7200/800/2000 split; max 13,680 optimizer steps derived from the real 7200
  anchor steps_per_epoch=57 x 240; selection every 57 steps; patience 40
  selection evaluations; K=5 equal-weight soup of the lowest-800-MAE
  checkpoints; nested target-independent subsets), held-out 2000-probe MAE for
  the fixed model family falls sharply as unique training examples double. SOUP
  probe MAE: N=1800 seed0 0.225184 / seed1 0.240017; N=3600 seed0 0.176633 /
  seed1 0.175501; N=7200 seed0 0.127517 / seed1 0.124268 (7200 anchors reused,
  never retrained). RAW agrees in direction throughout. Doubling gains
  (G_soup = E(N) - E(2N)): N3600->7200 seed0 +0.049116 (paired 95% CI
  [+0.042053, +0.056636]) / seed1 +0.051234 (CI [+0.042389, +0.061006]),
  two-seed mean +0.050175 (CI [+0.043256, +0.057999]); N1800->3600 seed0
  +0.048551 (CI [+0.041398, +0.055593]) / seed1 +0.064516 (CI [+0.056034,
  +0.072706]), two-seed mean +0.056533. Average per-doubling gain +0.053354,
  roughly constant over 1800-7200 (descriptive slope b = -0.053354 MAE per
  log2(N)); the curve is close to linear in log2(N) over the observed range.
  All four new runs early-stopped under canonical patience (N3600 seed0 6,042
  steps/106 evals, seed1 9,063/159; N1800 seed0 6,555/115, seed1 7,581/133);
  no run is boundary-pinned. Initial state hashes exactly match the historical
  smallhead I0/I1 fingerprints. Train/probe gaps grow as N shrinks (SOUP gap
  0.128/0.126 at 3600; 0.187/0.199 at 1800). All 18 integrity gates pass.
  Official valid was never loaded; official test was never loaded. Verdict:
  Decision Case A STRONG_WITHIN_FAMILY_DATA_LIMITED_REGIME.
scope: >-
  ZINC official train only (frozen internal 7200/800/2000 split); official valid
  and official test never loaded; two parameter-initialization seeds (0,1) and
  two trajectory seeds (0,1); N in {1800, 3600, 7200}; exact compact-v4-smallhead
  architecture, optimizer, loss, batch size, selection set and probe set held
  fixed; 7200 anchors reused from the internal-generalization trajectories.
