decision: CASE_D_NO_MATERIAL_GLOBAL_SIGNAL
interpretation: >-
  The 62-D B-Full global context does not carry material task-relevant
  information beyond the frozen TCCD-v5 PRE prediction. G_global 0.000522 is
  an order of magnitude below the 0.005 small-signal floor, G_bind 0.001301 is
  below the 0.005 shuffle-precedence threshold, and only 0.29% of the
  0.2514 -> 0.1198 gap is closed. The head demonstrably fits train residuals
  while dev is flat, so the residual movement is capacity/optimization, not
  transferable graph-level signal. The "missing plain graph-level statistics"
  explanation for the TCCD ceiling is closed.
next_hypothesis: >-
  No global-context architecture rescue and no added feature blocks. A new
  preregistration should test whether the frozen ceiling is a local-object
  adequacy question (radius-2 canonical patch coordinates plus the prototype
  vocabulary learned on them), with matched controls; official test stays
  closed.
