claim_id: claim-stagewise-representation-collision-audit-caseE-20260912
kind: claim
status: supported
study_id: zinc-context-gap
created: '2026-09-12T10:30:00'
statement: >-
  Along the real computation graph of the already-trained 82,115-parameter
  compact-v4-smallhead model (seed0 valid 0.145334, seed1 valid 0.138059;
  R = 302D; zero full-backbone training), target-relevant neighbourhood
  geometry does NOT reproducibly degrade at any pre-registered computation
  boundary. Decision Case E: NO CLEAR STAGEWISE REPRESENTATION COLLISION.
  Using the official-train deterministic 7200/800/2000 split (reference =
  7200 adapter_fit, primary query = 2000 train_probe, replication = 800
  adapter_selection), a target-independent set-aware projected-quantile sketch
  (24 fixed Gaussian unit projections x 9 quantiles + log1p(count) = 217D,
  base_seed 1729, empty-set policy defined) for the variable-size stages and
  per-coordinate z-score Euclidean for the fixed-size stages, and the primary
  metric eta(Z) = V_8(Z)/V_rand: the patch-encoder boundary (X_patch -> h0) and
  the pair-encoder boundary (X_pair -> q0) and the unary graph-compression
  boundary (h1 -> U_97) all show MATERIAL_GEOMETRY_GAIN (probe delta_eta:
  A -0.1927/-0.1820, B -0.0397/-0.0336, D1 -0.0883/-0.0526 for seeds 0/1;
  bootstrap 95% CIs exclude 0). The centre-contextualization boundary
  (X_centre -> h1) is SEED_UNSTABLE at sub-threshold magnitude (probe +0.0071
  seed0, -0.0115 seed1; both far below +/-0.02). The pair graph-compression
  boundary (q0 -> P_165) is the only stable positive degradation direction
  (probe +0.0113 seed0, +0.0432 seed1; selection +0.0115/+0.0565) but it FAILS
  the pre-registered two-seed +0.02 materiality gate (seed0 is +0.0113) AND
  fails the collision-consistency clause (Delta collision is negative on every
  seed/split: -0.0109,-0.0052,-0.0096,-0.0088). R is the best target-aligned
  representation (eta ~= 0.212, collision ~= 0.004). No contrast reached the
  material gate, so the second-projection and k=4/16 robustness reruns were not
  triggered. Official valid was not used for stage selection; official test was
  never loaded; all neighbour manifests were hashed before any target read.
scope: >-
  ZINC-12k official train only; official valid not used for stage selection;
  official test never loaded; exactly the two already-trained 82,115-parameter
  small-head checkpoints reused; zero full-backbone training; official-train
  deterministic 7200/800/2000 split; primary k = 8; set sketch dim 217. No new
  architecture, no P1/P2/cell rescue, no new pooling / attention / width /
  depth sweep, no new learned reader, no error-based subgroup mining.
