limitations: >-
  This is GEOMETRY evidence, not information-theoretic proof: kNN geometry
  degradation is not identical-representation collision. Two development seeds
  are not a population. The pair-compression sub-threshold signal (D2) is
  direction-stable but non-material and collision-inconsistent; it is recorded
  as a descriptive watch item, NOT a bottleneck and NOT an authorization.
  Official test was never loaded, so nothing is claimed about test MAE. The
  set-aware sketch is a deterministic projected-quantile sketch, not an exact
  Wasserstein distance. Existing NO-GOs (P1 / P2 / cell / covariance / triad /
  endpoint / richer frozen readout / low-rank lookup donor) remain binding.
  Case E does NOT authorize an architecture: the next direction is
  generalisation / regularisation / training stochasticity / scalar-target
  mapping geometry / finite-data sample efficiency.
