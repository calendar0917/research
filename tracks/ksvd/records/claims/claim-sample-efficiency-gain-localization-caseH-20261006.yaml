kind: claim
status: inconclusive
study_id: zinc-context-gap
created: '2026-10-06T00:00:00'
statement: >-
  In a zero-new-training audit of the frozen 82,115-parameter compact-v4-smallhead
  over the nested official-train subsets D1800 subset D3600 subset D7200 (six
  frozen SOUP states, RAW anchors as robustness; official valid and official test
  never loaded), no target-independent training-set support family passes the
  full pre-registered strong gate in both doublings. Token support has the
  strongest partial signal (quartile contrast Q4-Q1 = +0.027594 [0.008935,
  0.047188] at 18->36 and +0.033577 [0.017212, 0.050005] at 36->72; size-adjusted
  beta1 = +0.012594 [0.004136, 0.022076] and +0.015861 [0.008052, 0.024032]) but
  fails the continuous Spearman gate (rho = 0.060642 / 0.060983 < +0.15), so it is
  labelled NON-ROBUST ASSOCIATION rather than strong support-limited signal.
  Whole-molecule PATCH_FULL neighbour density has a comparable quartile contrast
  (+0.028177 / +0.037888) but its size-adjusted beta1 CI crosses zero
  (SUPPORT SIGNAL EXPLAINED BY SIZE / WEAK). Relation-context support passes only
  at 36->72 (REGIME-SPECIFIC / PARTIAL). The primary WELL_COVERED stress test on
  the exact typed-endpoint relation key is underpowered (n = 1), so the strict
  pre-registered verdict is Case H (localization inconclusive); a pre-registered
  secondary coarser parent-endpoint relation key yields a powered well-covered
  subset (n = 361) retaining R_covered = 0.722 / 0.603, which is only a Case E
  candidate and is explicitly non-authoritative. Fixed 5-fold hash-split OLS OOF
  R2 is at most +0.004 (full model negative), i.e. deficiency does not predict
  per-molecule gain out of sample. Gain values reproduce the prior
  learning-curve audit exactly: G_soup 18->36 +0.056533, 36->72 +0.050175.
  authorized_for_design = false; full_training_authorized = false.
scope: >-
  ZINC official train only; exactly six frozen SOUP states (1800/3600/7200 x
  seed0/seed1) plus their RAW anchors; no new training, no architecture/feature/
  tokenizer/probe/OOF search/HPO/EMA-SWA/checkpoint averaging, no external data,
  no official valid and no official test. Support metrics are document
  frequencies over unique training molecules; Phase U is hash-locked before any
  target or prediction is read.
