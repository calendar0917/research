contradicting_evidence:
  - >-
    The seed-0 selected minimum (0.146420 at epoch 169) is an isolated dip: only
    2/209 epochs fall below 0.15 and the late-phase (last half) valid median is
    0.167. The smoother batch-512 regimes have a floor ~0.151-0.154. The exact
    selected-checkpoint value is therefore partly validation-selection noise;
    this is why the frozen test gain (+0.0117) is smaller than the valid gain
    (+0.0223).
  - >-
    Seed-2/3 historical selection-checkpoint test MAE (0.144614 / 0.137019) is
    read from the committed multiseed confirmation file, not re-derived here;
    the paired test gain uses the four historical values as recorded there.
