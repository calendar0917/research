limitations: >-
  Single N3600 seed0 pair; fit-matched frontier built from individual trajectory
  snapshots, not soup states; the 800 set was used for original checkpoint
  selection and the 2000 probe has been used in prior mechanism audits, so
  neither is a pristine final holdout; no official valid/test claim is made;
