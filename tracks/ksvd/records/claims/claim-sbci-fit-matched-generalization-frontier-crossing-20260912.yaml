statement: >-
  Zero-training final diagnostic on the SBCI branch. Using only the frozen
  N3600/I0/T0 compact-v4-smallhead (106 snapshots) and compact-v4-SBCI (102
  snapshots) RAW trajectories, the D3600 empirical training fit was recomputed
  for all 208 snapshots under model.eval() (max |recomputed - stored| = 0.0).
  After a pre-registered 25% burn-in (common final step 5814, threshold 1453.5;
  81 baseline / 77 SBCI eligible) the common D3600 train-fit overlap is
  [0.0590017, 0.1680832]; 10% edge trimming gives [0.0699098, 0.1571750]
  (width 0.0872652) and K=7 equally spaced fit anchors. A deterministic
  minimum-cost bipartite assignment (cost = |train MAE - anchor|, later-step
  tie-break via epsilon 1e-12) matched 6 valid anchors for both families
  (K_valid = 6 >= 5; median cross-model fit gap 0.0008688 <= 0.001; anchor 6
  invalid because the baseline trajectory has no snapshot within 0.002 of
  0.15718). The pairs were SHA-256 locked before any 800 access. On the 800
  selection-generalization diagnostic set (not pristine; used for original
  checkpoint selection) the equal-weight per-anchor differences are
  D_k = [+0.006618, -0.003695, +0.008842, +0.021548, -0.003175, -0.010575]:
  D_mean = +0.003261, paired-molecule bootstrap (B=2000, seed 20260912)
  95% CI [-0.004861, +0.012669], median D_k = +0.001722, f_+ = 0.50,
  f_{<=0.002} = 0.50. Because 3 anchors are >= +0.003 and 3 anchors are
  <= -0.003, the pre-registered material-frontier-crossing condition fires.
  Decision: FIT_DEPENDENT_FRONTIER_CROSSING. The 2000 internal probe was
  correctly NOT opened (no stage2_2000 artifacts exist). No next architecture
  family is authorized: authorized_for_design = false, family = null,
  full_training_authorized = false,
  sbci_branch_closed_for_architecture_inference = true. The SBCI endpoint
  NO-GO is unchanged and is not re-judged.
scope: >-
  ZINC official train only; frozen internal D3600/800/2000 environment; official
  valid and official test never loaded; single N3600 seed0 pair; zero gradient
  updates (runtime guard forbids Tensor.backward / Optimizer.step); the 800 set
  is a selection-generalization diagnostic set, not a pristine holdout; the
  2000 probe is an internal development probe and was not opened; soup states
  are contextual endpoint markers only and never enter the frontier.
