claim_id: claim-pec-v0-sparse-role-dictionary-preserves-coarse-rooted-role-20260923
created: '2026-09-23T16:51:00'
kind: claim
status: supported
study_id: zinc-context-gap
statement: >-
  PEC-v0 label-free gate (2026-09-23, local CPU, commit
  883e529b159cae49fd1a9d279db2b40b8ff5e77c plus this round's implementation;
  ZINC canonical official train 10,000 split into internal fit 8,000 / monitor
  2,000 by the frozen protocol seed; official valid and official test NEVER
  loaded; NO labels used anywhere in this gate).  QUESTION: is a SMALL SPARSE
  DICTIONARY (K=16, s=4, tied-IHT with 10 steps, unit-normalized atoms,
  deterministic power-iteration step, exact top-s support) fit by K-SVD on the
  audited FSAR explicit rooted OCCURRENCE bases a valid structural-role
  coordinate - one that reconstructs its own basis, beats a matched random
  dictionary, is actually reused, does NOT collapse, and PRESERVES the coarse
  rooted structural role?  ANSWER: YES on all four sub-questions, subject to the
  recorded frozen-threshold caveat below.  (1) RECONSTRUCTION: monitor E_rec
  node 0.036866 and edge 0.054270 versus matched random-normalized dictionaries
  0.330513 and 0.529933, i.e. the K-SVD dictionary is 9.0x (node) and 9.8x (edge)
  better on held-out occurrences; PCA-16 reconstruction is exact to ~1e-31, so
  the 11-D / 15-D bases are low-dimensional and the dictionary is best read as a
  DISCRETISED ROLE COORDINATE rather than a compression of a high-dimensional
  signal.  (2) REUSE / NO COLLAPSE: exact l0 = 4 for every occurrence (max l0 4),
  row coverage 1.0, no dead rows, used atoms 12/16 (node) and 11/16 (edge),
  argmax-used 7 (node) and 3 (edge), effective atom count 6.000 (node) and 4.454
  (edge), top-1 mass 0.575 (node) and 0.488 (edge), assignment entropy 0.989 /
  1.178 bits of 4.  (3) COARSE-ROLE RECOVERABILITY (the pre-registered
  user-specified STOP condition): a logistic probe trained on 50,000 monitor
  rows maps alpha^V -> {shell 0,1,2} with macro-F1 1.000 (majority 0.217, margin
  +0.783) and alpha^E -> shellpair with macro-F1 1.000 (majority 0.180, margin
  +0.820); a dictionary that destroys the coarse rooted role is therefore
  excluded.  (4) FROZEN-THRESHOLD CAVEAT (reported verbatim, no rescue): the
  frozen numerical verdict of this gate is FAIL because 3 of 10 self-set,
  uncalibrated criteria are missed - node_random_ratio 0.111541 > 0.10,
  edge_random_ratio 0.102410 > 0.10, edge_used 11 < 12.  The two ratio misses are
  +0.0115 and +0.0024 absolute, and K=16 > dim 15 / dim 11 makes an unused atom
  expected, so the FAIL is read as a threshold-design artifact and NOT as a
  mechanism failure (Amendment A2, notes/pec_v0_gate1_decision.md); the frozen
  FAIL is nevertheless preserved unchanged.  SCOPE / LIMITS: label-free,
  single split seed, K=16/s=4 only (no K/s sweep is authorized or performed);
  this claim is about the ROLE COORDINATE, not about downstream performance;
  the alpha -> shell probe is near-tautological because the occurrence basis row
  already contains the shell one-hot (Amendment A1), so (3) is weak evidence and
  (1)/(2) carry the claim; Gate 3 not run.
