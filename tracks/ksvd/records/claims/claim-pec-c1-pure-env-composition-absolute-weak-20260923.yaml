claim_id: claim-pec-c1-pure-env-composition-absolute-weak-20260923
created: '2026-09-23T19:10:00'
kind: claim
status: supported
study_id: zinc-context-gap
statement: >-
  PEC-C1 (2026-09-23, remote A100-SXM4-40GB, commit
  bf8b5a628d99eedaf52f0b6e95e79cf583c4ba7b, clean worktree, seed 0, full official
  ZINC train 10,000 / official valid 1,000, official test NEVER loaded,
  official_test_loaded = false; new confirmatory round that does NOT amend
  PEC-v0).  QUESTION: under a completely frozen PEC-v0 architecture / feature
  definition / dictionary K,s / static composition / training semantics, does
  the pure Environment -> Static-Composition model (NO message passing, NO
  recurrence, NO mixed chemistry bypass) have enough ABSOLUTE capacity in the
  full official-train -> official-valid regime?  ANSWER: NO.  Frozen verdict
  PURE_ENV_COMPOSITION_ABSOLUTE_WEAK: min(M_CK, M_CD) = 0.151767 > 0.145, where
  M is the fixed equal-weight Top-5 official-valid epoch-checkpoint prediction
  soup under a frozen 240-epoch schedule with no early stopping.  Arms: CK =
  SparseDict (tied-IHT K=16/s=4 over a K-SVD dictionary fit once on the full
  official train and then GENUINELY frozen) soup 0.160971 (best 0.169599 @210);
  CD = parameter-matched trainable DenseRole soup 0.151767 (best 0.159782 @235).
  Both arms have 94,049 total parameters.  Context (orientation only, different
  computation class, never re-run, never a gate): strict-static S0 seed0 soup
  0.140794, seed1 soup 0.136423, B-Null ~0.123, B-Full ~0.119-0.118; the pure
  class is +0.020177 (CK) / +0.010973 (CD) worse than the S0 seed-0 soup.
  DESCRIPTIVE deficit decomposition against the same-family strict-static S0
  seed-0 reference (best 0.145674 @163, train-at-best 0.075434, gap 0.070241)
  shows the deficit is real on both sides: CK +0.023924 = fit +0.015014 (63 %)
  + gap +0.008911 (37 %); CD +0.014108 = fit +0.006084 (43 %) + gap +0.008023
  (57 %).  The pure class cannot even fit the training set as well as the
  strict-static backbone (train minima 0.080633 / 0.073690 versus 0.067595), so
  this is a representation/optimization ceiling, not a pure overfitting story;
  the decomposition is descriptive, not causal, because the architectures
  differ.  The fixed horizon cannot change the verdict: CK's minimum is at epoch
  210 with a flat-to-worse tail, CD's minimum is at epoch 235 and its whole last
  48 epochs move within 0.003 while reaching 0.145 would need -0.0148.  SCOPE /
  LIMITS: single seed 0 as pre-registered, so no stability claim; CK's dictionary
  is frozen while CD's role map is trainable (declared deviations D1/D2), which
  is conservative against CK; K_V = K_E = 16 is overcomplete for the 11-D / 15-D
  bases and the edge dictionary uses only 8 atoms (report-only, not repaired);
  the S0 / B-Null / B-Full comparison is orientation only; the fit/gap split is
  not causal.  This is NOT a statement about task-coupled dictionaries, and it
  does not modify PEC-v0's historical frozen gate verdicts (in particular PEC-v0
  Gate 1 remains a historical frozen FAIL).
