study_id: zinc-context-gap
statement: >-
  On the fixed internal ZINC split with the exact frozen TCCD-v2 PrototypeREL
  representation and the exact TCCD-v5 pair cache, the TCCD-v5 POST Top-5 soup
  gain (BASE 0.2783639132976532 to FULL 0.2522333264350891, G_FULL
  0.0261305868625641) is essentially fully explained by POST coordinates that
  are exactly reconstructible from h_base. A label-free algebra audit over all
  10,000 cached graphs proves A_G = 2*BAG_G/n_G (max abs diff 4.62e-07) and
  all five relation marginals D_G[r] = sum_{i<j} R_r[i,j] / C(n,2) (max
  per-relation diff 1.53e-07) are deterministic functions of h_base; B and
  C_prod are not. The frozen RECON mask has 69 nonzero coordinates and the
  NOVEL mask 128, FULL = RECON + NOVEL, and all four arms share identical
  24,193 trainable parameters, identical bit-level initialization
  (9fbedb92...e8487f, equal to the v5 POST init checksum). RECON-NL reaches
  Top-5 soup 0.252360463 (G_RECON 0.026003450, rho 0.995135); removing the ReLU
  (RECON-LINFACT, identical parameters) gives 0.252556831, a nonlinearity gap
  of only 0.000196368, far below the registered 0.005 R1 threshold. NOVEL-NL
  reaches 0.254013419 (G_NOVEL 0.024350494, rho 0.931877), so genuinely new
  prototype-distribution moments also suffice alone, but they are not
  necessary. The preregistered final Case is R1: NONLINEARITY NOT MATERIAL /
  RECON SUFFICIENT. The v5 POST gain is a readout / coordinate-geometry effect
  (exposing the size-normalized prototype mean and normalized relation density
  to a linear reader), not evidence of missing structural information or of a
  need for occurrence-preserving / center-preserving composition. One seed per
  new arm; no paired seed was authorized because the nonlinearity gap lies
  below the ambiguity interval; internal-dev only.
scope: >-
  TCCD-v6 preregistration commit 822a235; formal implementation commit
  e016b4d8031994ca0d33f15242b444488fbe8713; device-fix commit
  ac94daea613d8d19bf5ef978756c82568918a157; remote A100 GPU1 only; seed 0;
  fixed internal split seed 20260922 with 8000 train and 2000 dev; exact
  TCCD-v2 PrototypeREL checkpoint (SHA-256
  093e0e46d4d5dab7e5558b807d993d1136df58d8f531d6b9b3621e8ab05c0f42); exact
  TCCD-v5 pair cache; 197-D mean pair descriptor decomposed into A (64),
  B (64), C_prod (64), D (5); no prototype, encoder, temperature, relation, or
  reader-protocol changes; PRE / PRE-SHUFFLE / center-preserving composition /
  official-valid / official test never run or loaded.
