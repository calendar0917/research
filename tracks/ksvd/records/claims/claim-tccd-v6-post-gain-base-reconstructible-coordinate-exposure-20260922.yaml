    equivalence 2.98e-08, relabel / batching / pair-order invariance, empty-pair
    zero, official_test_loaded false.
  - >-
    FULL-NL reuse re-evaluated exactly: soup 0.2522333264350891 (delta 0.0),
    best 0.2608269155025482 (delta 0.0) against the frozen v5 result.
  - >-
