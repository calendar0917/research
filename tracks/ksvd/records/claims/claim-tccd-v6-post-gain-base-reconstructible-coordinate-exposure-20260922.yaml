interpretation: >-
  The v5 POST gain is recovered to 99.51% by 69 base-reconstructible
  coordinates with a small nonlinear decoder and to 99.25% with the
  nonlinearity removed. The primary TCCD bottleneck within the frozen
  representation is readout / coordinate geometry (normalization and
  conditioning of the global summary), not missing structural information.
  Genuinely new prototype-distribution moments are not required, and
  occurrence-preserving / center-preserving composition is not supported as
  the next priority.
next_hypothesis: >-
  An explicit normalization/moment-complete frozen representation with a
  simple reader, under a new preregistration; no deeper MLP, no new pair
  enumeration, no structural channel, official test remains closed.
