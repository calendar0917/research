contradicting_evidence:
  - >-
    Condition 1 of the frozen gate shows a large absolute reconstruction
    improvement from IHT-30 (2.9e-3 to 3.9e-3), so calling the coder fully
    'converged' is true for the support / usage structure but not for the
    amplitude; a downstream task could in principle exploit the coefficient
    refinement even though this audit did not test it.
  - >-
    dense->IHT-10 R2 is 0.971-0.977, not 1.0; a 2-3 % nonlinear residual of the
    sparse code is not explained by the dense coordinate and is left
    unresolved.
  - >-
    cross-seed stability is only partial; the claim of a stable learned
    vocabulary holds for the universal/mid-frequency core and not for the rare
    atoms.
limitations:
  - 'Three seeds, one architecture family, one dataset, valid split only.'
  - >-
    OMP is an approximate greedy solver, never a proven globally optimal top-8
    solver; no exact-optimum sparse code is claimed anywhere in this round.
  - >-
    The DC-triplet explanation is correlational (cosines, usage, Spearman);
    no causal intervention on atoms 6/24/27 was authorised or run.
  - >-
    Two of the 32 structural descriptors (root_neighbour_shell1, root_walk1)
    are identically zero in the frozen phi65 provenance; their entries are nan
    and carry no information (recorded defect, no verdict affected).
  - >-
    The convergence table, the CSV exports and the per-atom markdown section
    were added after the gate decision; they re-read stored payloads or
    re-call frozen coder functions and change no threshold.
implication: >-
  Sparse specificity cannot be recovered by a longer IHT; the actionable object
  is the dictionary's DC/scale redundancy and usage balance.  A justified next
  preregistration would (a) remove the 6/24/27 DC-triplet redundancy
  (orthogonalise the triplet, or add a coherence / usage-balance penalty on D)
  and test at matched capacity whether reconstruction, concentration and the
  Sparse-vs-DenseTied margin move, and (b) test the sparse arm on a phi65
  variant not dominated by one DC direction.  OMP must not be used as the
  ground-truth coder reference on a trained dictionary in future rounds.
