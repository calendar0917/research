claim_id: claim-e2e-dictenv-dict-coder-audit-20260929
created: '2026-09-29T00:00:00Z'
kind: claim
status: supported
study_id: zinc-context-gap
statement: >-
  In the closed ZINC dictionary-environment line (FINAL-CLEAN = C6 + paired node
  binding + paired edge binding + sparse tied-IHT K=32/s=8/IHT-10 + full
  relation; CPU-only; official test never loaded), a zero-training audit of the
  three reused C6 soup dictionaries disentangles the previously unestablished
  sparse specificity into two structural facts and excludes two coder
  explanations.  (1) The frozen 10-step IHT support is already the IHT fixed
  point: IHT-30/100 reduce valid Frobenius reconstruction 27-40 % (absolute
  2.9e-3 to 3.9e-3) but change support (IHT-10 vs IHT-30 Jaccard 0.972-0.980,
  exact support 0.889-0.916, code cosine 0.9999), usage concentration
  (N_eff 14.5-15.3, top-5 4.4-4.8 of 8, max activation rate 1.000) and
  coefficient geometry (top1/L1 0.28-0.30) only in the third decimal, so the
  coder's residual defect is amplitude-only.  (2) The learned dictionary is
  intrinsically concentrated: in every seed atoms 6, 24 and 27 are active in
  100 % of valid rows and are 0.76-0.98 aligned with the dataset mean direction
  mu (6 and 24 are 0.884-0.987 collinear), a fourth atom 23 is the PC1 atom
  (|cos(., PC1)| 0.71-0.80, active 0.83-0.98), and the dominant atom-6
  coefficient is a patch-mass coordinate (Spearman 0.93-0.94 with patch_nodes;
  |cos(atom 6, PC1)| only 0.32-0.44 although PC1 carries 57.7 % of phi65
  variance).  (3) The sparse tie code and the dense tied coordinate are
  near-linear re-parameterisations of each other: train-only OLS on valid gives
  dense->IHT-10 R2 0.9708/0.9763/0.9770 and IHT-10->dense R2
  0.9988/0.9989/0.9989 (code cosine 0.9996-1.0000, CKA 0.9987-0.9999), and the
  DenseTied control's own dictionary reproduces the pattern (0.9720/0.9978),
  so sparsification loses no linearly recoverable information (H4 not
  supported) while adding almost no independent content (H3 supported).
  Frozen gate fired = False on all three seeds (condition 1 factor
  0.683/0.732/0.704 vs the frozen <=0.5; condition 2 support / concentration /
  geometry fails on every axis with |gain| <= 0.006 vs +0.05, N_eff
  <= +0.32 vs +1.0, top-5 <= 0.063 vs 0.10, max-rate 0.000, top1/L1
  <= 0.001 vs 0.05, code cosine <= 0.0007 vs 0.05), so NO NEW TRAINING WAS
  SCIENTIFICALLY JUSTIFIED and the decision is robust to the condition-1
  threshold because the substantive condition 2 fails everywhere.  (4) OMP is
  not an oracle coder on a trained dictionary: with the same normalised Dbar,
  OMP(s=8) reconstructs 3.2-5.5x worse than IHT-10 (0.0398/0.0418/0.0654 vs
  0.0124/0.0109/0.0119) with much heavier top-1 mass (0.56-0.67 vs 0.28-0.30),
  verified against an independent sklearn.orthogonal_mp call with
  well-conditioned selected supports; the prior 'exact OMP is 700x better'
  diagnostic was measured on the K-SVD dictionary that was fit for OMP.
  (5) Cross-seed vocabulary stability is PARTIAL (mean matched |cos| 0.775,
  #>=0.90 = 11.7 of 32, median profile cosine 0.853): universal/mid-frequency
  atoms replicate exactly, rare atoms only partially.
scope: >-
  CPU-only local audit (3 processes x 4 threads), preregistration and
  implementation commit b325770, preregistration sha256 cc8856d96f6a...,
  treated as frozen before the first Stage-A process.  Reused checkpoints (no
  retraining): C6 soup D of seeds 0/1/2 from
  results/e2e_dictenv_h1_clarity_audit/matched_cpu/C6_e320_soup_state.pt and
  results/e2e_dictenv_clean_mechanism_v1/stage_a_cpu_baseline/C6_seed{1,2}_soup_state.pt,
  plus the DenseTied seed-0 control dictionary (context only).  Splits: official
  ZINC train 10000 (231664 nodes) / valid 1000 (23083 nodes) from the frozen
  phi65 cache; official test never loaded (official_test_loaded = false in every
  payload).  Dictionary always column-normalised (the model operator); every
  coder sees one identical Dbar per seed.  No architecture, loss, feature,
  relation, split, K/s/lambda/step-count change; no GPU, no SSH.
