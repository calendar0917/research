claim_id: claim-tccd-v3b-correct-pre-pair-bridge-20260922
created: '2026-09-22T00:00:00Z'
kind: claim
status: supported
study_id: zinc-context-gap
statement: >-
  The corrected TCCD-v3b bridge uses the complete frozen B-full fused pure-local
  `patch_encoder` output before pair projection, with raw width 64, rather than
  the isolated 16-D `e_struct` input block used by historical TCCD-v3. With the
  exact TCCD-v2 K=64 prototype vocabulary, C^T R C relations, lightweight reader,
  temperature and regularizers unchanged, CorrectStrongLocal-PrototypeREL
  reaches best official-valid MAE 0.315263 and Top-5 soup MAE 0.312643 on the
  registered GPU1 seed-0 run. This is a large correction versus the historical
  isolated-channel result, but it still fails the preregistered absolute rescue
  gate relative to TCCD-v2 PrototypeREL best valid 0.287337: Delta_local is
  -0.027926, so the result is L3. The complete fused pre-pair local state alone
  is therefore insufficient to rescue the frozen TCCD-v2 composition/readout
  interface.
scope: >-
  One frozen seed-0 B-full source checkpoint, official ZINC train 10000 and
  valid 1000, remote A100 GPU1, formal implementation commit f942a00, source
  checkpoint SHA-256 785dff866fa8d952d6e9764549761a7019a4e46ffd70d625110b618f51e6a2c4,
  selected `patch_encoder` output before pair/global operations, raw width 64,
  matched Linear(64,64) adapter, exact TCCD-v2 downstream mechanics, and
  official-test freeze. The source checkpoint was selected on official-valid in
  its source study, so this is a diagnostic bridge audit rather than an
  unbiased final-model comparison.
