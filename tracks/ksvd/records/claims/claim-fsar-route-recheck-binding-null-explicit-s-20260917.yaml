statement: >-
  FSAR route recheck (deterministic A100, ZINC-12K official train/valid only,
  official test never loaded, fixed equal-weight Top-5 soup, valid MAE).  FOUR
  SEPARATE ANSWERS, no merged verdict.  (A) Historical replication: FSAR-v1
  SAB < SAM replicates in direction on both seeds (SAM - SAB = +0.003270 seed0 /
  +0.001886 seed1) but SAM has NO aligned channel (its edge_role_mlp /
  binding_fuse / node_role_projection do not exist; only a 663-|w| capacity_mlp),
  so this replicates a logged comparison rather than testing binding.  (B) Clean
  binding NOT supported: against a genuinely operator-matched, total- and
  B-parameter-matched, assignment-independent null (B_indep), delta_B_latent =
  MAE(SABI) - MAE(SAB) = +0.014466 (seed0) / -0.002719 (seed1), mean +0.005874;
  the pre-registered gate (both seeds > 0 and mean >= 0.001) fails, and the only
  seed on which the two B channels have the same edge-sub-branch fate (seed1) is
  NEGATIVE.  (C) Structural explicitness SUPPORTED with a caveat: the explicit
  local structural basis beats the latent topology-GNN local S on the S-only
  comparison (SAE - SA_v1 = -0.007199) and is ~3x more seed-stable (SABE range
  0.004195 vs SAB 0.012788); on S+B the mean cost is +0.003896 (moderate band)
  concentrated in the seed where the latent B kept an extra sub-branch.  (D)
  Explicit binding NOT supported: delta_B_explicit(seed0) = -0.004190 on a
  function-class-matched pair (the null is better).  MECHANISM: the B channel's
  edge sub-branch is annihilated by Adam+L2, and it is seed-UNSTABLE in FSAR-v1
  itself (alive |w| 92.4 at SAB seed0, 1.6e-36 at SAB seed1), which is why
  answer B's seed0 and answer C's "large cost" are edge-confounded.  No mode in
  this round beats the frozen external baselines B-Bag / B-Full / A2 on either
  seed (SAB - B-Bag = +0.003531 / +0.023472).
scope: >-
  ZINC-12K official train/valid only; deterministic NVIDIA A100-SXM4-40GB;
  seeds 0 and 1; frozen FSAR-v1 A / R_S / G_S unchanged and not retrained;
  A_exact not retrained and not used; official test never loaded; no A width
  sweep, no DeepSets / Transformer / attention variant, no auxiliary binding
  loss.  Training revision 50b5972; Wave-6 harness control at 2146a24.
