contradicting_evidence:
  - >-
    The reference's mechanism is confounded: object vocabulary (rings),
    incidence persistence, multi-rank interaction and depth (2 layers) cannot
    be isolated from the published ablations; no 1-layer ring model is reported.
  - >-
    Parameter budget and training protocol differ (130,945 vs 99,613; 10 seeds
    / <=1000 epochs / LR schedule / GPU vs 1-4 seeds / 240 epochs / CPU), so
    part of any raw gap may be budget, not mechanism (G8 confound).
  - >-
    The incremental value of per-cycle objects over compact-v4's existing
    graph-level topology channel (a surviving architecture GO, optimized
    delta_topo +0.019846) is unproven and must be isolated by a
    multiset-preserving incidence-breaking control.
  - >-
    The minimal architecture needs a small fixed number of rank-aware
    incidence rounds, which touches structured propagation; if the effect
    requires extensive iteration this is a method-philosophy tradeoff
    (Decision Case B) and not authorized.
