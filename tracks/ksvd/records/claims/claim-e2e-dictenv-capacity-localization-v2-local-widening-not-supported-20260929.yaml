claim_id: claim-e2e-dictenv-capacity-localization-v2-local-widening-not-supported-20260929
created: '2026-09-29T00:00:00Z'
kind: claim
status: supported
study_id: zinc-context-gap
statement: >-
  On the frozen ZINC dictionary-environment base CAP-BASE = CSSD-q1 (C6 clean
  mask + q1 common structural coordinate + q1-orthogonal sparse dictionary
  K=32/s=8/IHT-10 + paired node/edge structure-semantic binding + full
  relation + first/second-moment readout; 97727 params; seed-0 soup valid MAE
  0.13002798487985273; CPU only; official test never loaded), the repaired
  capacity-localization round establishes two things.  (1) A warm-adaptation
  protocol that does NOT destroy the trained representation exists: M0 from
  the frozen soup with fresh Adam(lr = 1e-4, wd 1e-5), batch 128, clip 5.0,
  the CSSD objective and 20 epochs gives soup(1-20) 0.128984 <= 0.1320,
  mean(valid 16-20) 0.130331 <= 0.1350, epoch20 0.129672 <= 0.137 and a late
  slope of -1.55e-4/epoch, i.e. the frozen gate
  WARM_ADAPTATION_PROTOCOL_VALIDATED; deltas vs the anchor are -0.000356
  (best), -0.001044 (soup) and +0.000303 (last-5), so the low-rate
  continuation holds and slowly improves the checkpoint (the v1 failure was
  the fresh-Adam lr = 1e-3 restart: same control went 0.1435 at epoch 1 and
  0.1356 best at lr 1e-3).  (2) Under that validated protocol (40 epochs,
  base lr 1e-4 / new-capacity lr 1e-3, Top-5 soup over epochs 21-40 as
  primary metric), none of the three frozen single-block capacity directions
  beats the matched control or the absolute anchor: soup M0 0.128723, F
  0.128613 (Delta -0.000110), R 0.129422 (+0.000699), G 0.128879 (+0.000156);
  last-10 M0 0.130721, F 0.130971 (+0.000250), R 0.133506 (+0.002785),
  G 0.130604 (-0.000116); best single-epoch valid M0 0.128668, F 0.129047,
  R 0.129948, G 0.128998.  The frozen gate S1 (matched Delta <= -0.003),
  S2 (absolute soup <= 0.1270) and S3 (last-10 Delta <= -0.003) fail for all
  three candidates; S4 (finite non-zero new-branch gradient AND update) passes
  for all three, so the branches were trainable and trained (per-epoch
  new-group gradient norms: F 0.19 falling to 0.011-0.024, R 7.4 falling to
  1.2-1.4, G 0.054 falling to 0.003-0.02).  Frozen decision
  LOCAL_CAPACITY_AUGMENTATION_NOT_SUPPORTED; no full 320-epoch run was bought
  (180/500 authorised epochs spent; full/NOT_RUN.json; mechanism/probes.json
  run=false).  (3) The round also measures its own resolution: the M0
  calibration run and the M0 screening arm are the same configuration under
  different CPU concurrency (no dropout exists, RNG streams equal by test) and
  differ by mean 0.00121 / median 0.00082 / max 0.00490 valid MAE per epoch,
  with a Top-5-mean(1-20) difference of -0.00060; the soup-level
  reproducibility floor is therefore ~6e-4, the frozen -0.003 effect size is
  ~5x it, F and G sit at or under the floor and R exceeds it by 2-5x as a
  small regression.  Conclusion, scoped: one extra bilinear-rank fusion block
  (H=4/d_h=24, +29568), two extra residual FiLM pair-composition blocks
  (hidden 256, +34400) or one extra gated invariant readout summary (dim 192,
  +30336) is not the missing ingredient that moves this base off the
  0.128-0.130 plateau in a 40-epoch adaptation at the frozen sizes and rates;
  the tested objects are one-shot static compositions, and simple local
  widening in this regime is not supported.
scope: >-
  CPU-only local round (16 cores / 27 GiB; wave 1 = M0/F/R as 3 processes x 4
  threads, wave 2 = G as 1 x 4), preregistration sha256
  c5004e3d2aee8de377a6b66c822a92483a397eb6794a2d5f0bbe46ff9e042f8e,
  implementation frozen at commit dccc149 (harness fix cc11654) before the
  first training process.  Candidates are v1's architectures verbatim (same
  parameter names, shapes and counts; shape fingerprints recorded in
  architecture_fingerprints.json) with only the residual-projection scale
  changed (F 0.0008, R 0.0016, G unchanged 0.01) to satisfy the near-zero
  residual contract (step-0 mean shift 0.00080 / 0.00059 / 0.00113 versus v1
  0.01053 / 0.01948 / 0.00113; zeroing the residual reproduces CAP-BASE
  exactly for all three; all new-module gradients finite and strictly
  positive).  Data: frozen phi65 cache from the official ZINC train (10000)
  and valid (1000) splits; official test never loaded.  Single seed (0), one
  frozen size per direction, no hyper-parameter search, no combination
  candidate, no second LR protocol.  The claim is about 40-epoch warm
  adaptation on the converged CAP-BASE checkpoint; it does not test
  from-scratch 320-epoch training of the same blocks.
