contradicting_evidence:
  - >-
    All three candidates pass S4 with live branches, so the null is a real
    measurement, not dead initialisation; and R's branch was the most active
    (gradient 7.4 at step 0) while producing a small regression, which shows
    the protocol can move the model when the new branch is strongly driven.
  - >-
    Every arm, candidates included, improves on the absolute anchor
    M_start = 0.130028 (soup -0.0006...-0.0014), but that improvement comes
    from the low-rate base adaptation (M0 alone: -0.001305); no candidate
    adds to it, so this supports the "adapter, not capacity" reading and does
    not support a capacity gain.
  - >-
    The screen is a 40-epoch warm adaptation at one frozen size per direction;
    it cannot exclude that these blocks help under 320-epoch from-scratch
    training (that run was never authorised by the frozen gate) or at other
    widths/ranks/depths.
limitations:
  - >-
    Single seed (0), single base checkpoint, one 40-epoch adapter per arm and
    one frozen size per candidate direction.
  - >-
    The soup-level reproducibility floor (~6e-4) is measured from two runs of
    the same M0 configuration in different CPU-concurrency regimes, not from
    repeated full batches of arms; the F/G deltas lie at that floor, so they
    are recorded as "no detectable effect" rather than as exact zeros.
  - >-
    No from-scratch 320-epoch evidence exists for any candidate; no P1-P5
    mechanism probe was run (no winner checkpoint exists).
implication: >-
  Two one-shot local-widening families have now been tested on this base -
  v1's lr = 1e-3 warm restart (no measurement power) and v2's validated
  stable screen (no effect) - so the next capacity round should stop widening
  single blocks and test the compositional hypothesis instead: whether
  one-shot static composition itself is the ceiling, via a small number of
  controlled iterative environment-contextualisation stages
  (E_i^(l+1) = E_i^(l) + eta_l Agg_j psi(E_i^(l), E_j^(l), r_ij), l = 0, 1)
  under the v2 residual-zero contract and the validated low-rate/differential
  adapter, with the gate effect size stated relative to the ~6e-4 floor.
  CAP-BASE remains CSSD-q1; the F/R/G blocks are not authorised for
  standalone full training by this round.
