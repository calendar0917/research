claim_id: claim-e2e-dictenv-latent-bridge-v1-borderline-near-dense-code-no-control-20261001
contradicting_evidence:
- >-
  The insertion topology makes the intervention deltas weak evidence of value:
  zeroing the code sets E = 0 and removes the whole local encoding from the
  readout, so the +1.185274 MAE is expected by construction, and the
  reset-to-init +1.231997 shows only that the trained dictionary differs from
  the frozen frame, not that it is better than any trained alternative.
- >-
  The code is near-dense at the endpoint (mean non-zero 89.10/96, fraction
  0.928, p50 89, p95 94), so the round cannot claim sparse dictionary coding in
  this lambda regime; it measures a low-dimensional soft-threshold re-encoding,
  and the "dictionary" interpretation is structural, not sparse.
- >-
  The training-loop fit at epoch 320 is essentially identical to the Sem108
  parent (0.085155 vs 0.085076), i.e. the bridge did not buy fitting capacity;
  the small endpoint difference is at the level single-seed noise, and the
  same-protocol train-to-valid gap is +0.065926, so no generalisation benefit
  is demonstrated either.
- >-
  The round did not run seed 1, a matched parameter-count dense/random adapter,
  a no-bridge rerun, or any K/s/lambda/steps variation; the borderline endpoint
  is 0.001058 above the promising edge and 0.002242 below the stop edge, both
  far below any resolution this design could claim.
