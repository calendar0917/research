implication: >-
  The Sem108 + low-dimensional task-dictionary bridge route is CLOSED as an
  unconfirmed borderline candidate: it is usable (trained, load-bearing) but not
  demonstrated to be valuable (borderline absolute performance, near-dense code
  at the frozen lambda regime, no matched control, single seed).  No rescue
  (K/s/lambda/steps/dim), no seed 1 and no post-hoc control is authorised under
  this round.  A continuation requires a new pre-registration that either buys
  confirmation (seed 1 + parameter-matched dense/random adapter + paired seeds
  for a performance claim) or changes the local object / learning objective per
  the task package's section 6 warning against iterating K/s/lambda on this
  representation.  The proven-live insertion point (fusion output h) remains a
  building block, but must never be presented as a gain of this round.
kind: claim
limitations:
- >-
  Single seed, single trajectory, no control arm (no parameter-matched dense or
  random adapter, no no-bridge rerun, no shuffled-dictionary arm), so no
  increment, sparsity or dictionary-vs-dense causal statement is made; the
  frozen absolute band is the only endpoint rule applied.
- >-
  The zero-code / permutation / reset probes are sensitivity statements inside
  this one model: they show the bridge channel carries prediction, not that
  learning D_L / V_L beats a matched trained alternative.
- >-
  Sem108 0.123705 (and T1 0.125765, FINAL-CLEAN-C6 0.128499, CSSD-q1 0.130028,
  P1-sparse 0.131975) are unmatched historical background: the candidate adds
  9,216 parameters and the comparison is a single seed, so the +0.002647
  difference is NOT a causal or significant improvement in either direction.
- >-
  CPU regime (runtime.device=cpu, 8 threads) on a single authoring machine; one
  bridge geometry only (d 48, K 96, 16 unrolled ISTA steps, lambda1 0.05,
  lambda2 0.01, tied V_L), no K / s / lambda / steps / width / horizon / lr
  variation authorised; the frozen Sem108 body, relations and readout were
  never modified.
- >-
  The short-trainability parent-vs-candidate gap (0.362907 vs 0.317501 at 40
  epochs) is scratch/dev evidence outside the formal chain and is not used as a
  claim.
