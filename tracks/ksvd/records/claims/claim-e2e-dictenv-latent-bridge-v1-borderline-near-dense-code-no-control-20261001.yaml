statement: >-
  The single authorised candidate of this round — the frozen Sem108 model with
  one shared low-dimensional task dictionary inserted at the fusion output
  (h[48] -> rho-normalised 16-step unrolled ISTA -> alpha[96] -> E = rho * alpha
  @ V_L[48], D_L 48x96 / V_L 96x48, 9,216 new parameters, no bypass, static
  relations and readout unchanged) — reached an official-valid soup MAE of
  0.12105831989 (best single epoch 0.12997499 @ 309, Top-5 soup members
  285/296/303/307/309) under the local CPU seed-0 regime, landing in the
  pre-registered borderline band (0.120 < M_S <= 0.1233): 0.001058 above the
  promising edge and 0.002242 below the stop edge, so the frozen confirmation
  rule (M_S <= 0.120 with a learned dictionary) was NOT met and no seed 1,
  control arm, rescue or sweep is authorised.  The mechanism statement is
  positive and separate: D_L / V_L moved 5.7622 / 5.6371 from the frozen frame
  and both receive non-zero MAE-only task gradients (0.2694 / 0.2401 at the
  endpoint), zeroing the bridge code costs +1.185274 valid MAE (prediction-RMS
  +1.696537), a 5-seed within-molecule code permutation costs +0.288035
  (+0.473635) and resetting D_L / V_L to init costs +1.231997 (+1.809348).
  The measured limitation is that the code is near-dense at the endpoint (mean
  non-zero 89.10/96, fraction 0.928, p50 89, p95 94), so this round cannot call
  the bridge a sparse code, and the +0.002647 difference against the unmatched
  Sem108 background (0.123705) is not a causal increment because the candidate
  adds 9,216 parameters and no matched control was run.  The borderline band
  result and the positive liveness result are two separate statements and must
  not be merged.
