claim_id: claim-zinc-graph-dictionary-readout-v1-fixed-prototype-stop-20261002
contradicting_evidence: []
created: '2026-10-02T10:40:00'
implication: >-
  Do not buy a new full neural training run from this result; do not increase K,
  scan the bandwidth, swap the normaliser/object, or add an L2/MSE rescue. The
  next round, if any, must be a new preregistration that explains why a
  fixed-coordinate prototype dictionary cannot reproduce the trained reader and
  must carry the replayed same-checkpoint Full as the matched baseline.
kind: claim
limitations:
- One backbone checkpoint (Full m=3 seed-0 soup) and a single reused official
  valid split that historically selected that soup; exploratory screen only, no
  independent or multi-seed confirmation.
- Negative for exactly one fixed family (train-selected K=256 Gaussian
  prototypes, Nystrom whitening, direct MAE + L2 head, lambda in {1e-5,1e-4,1e-3});
  it does not prove the 814-D representation is theoretically sufficient or
  insufficient, nor does it refute other readout families.
- The old weak ridge proxy (0.3626 -> 0.3313) and unmatched historical
  endpoints are not used as evidence here.
scope: >-
  Local CPU only (8 threads); seed 0; official ZINC train 10000 / valid 1000;
  official test never instantiated; one frozen backbone (Full m=3 seed-0
  parameter soup, 408,651 parameters); the exact 814-D tensor reaching
  model.reader captured by a forward pre-hook; vendored frozen prototype
  dictionary and certified convex MAE head; no backbone training, no second
  backbone, no old-prediction addition, no message passing, no attention.
statement: >-
  In a single frozen-backbone, single-valid-screen local-CPU ZINC test
  (runs 20261002-103457-ebc7b526 fit and 20261002-104542-cc3d455f evaluate;
  code revision 339dbea6; parent checkpoint sha
  17f5fcc3cdf32462657006ec89ebf2ecc72ab6fbc954b926af248aca374574eb; backbone
  state-reader sha ad7e1baacce1d7e075301a622d17df55d5508e6d4b6dd5abbfcf8a135417f2e7;
  published soup valid MAE 0.1191540920053958), replacing the trained Full
  reader with a FIXED graph-level prototype dictionary readout (K=256, seed
  20261002, Gaussian kernel with median-pair bandwidth, Nystrom whitening,
  direct MAE + L2 head, lambda selected 1e-5) on the captured 814-D reader
  input gives official-valid MAE 0.2482236020672727 versus the exactly replayed
  same-checkpoint Full H0 readout 0.1191540920053958: absolute gain
  -0.1290695100618769 (pre-registered gate >= +0.006), new MAE 0.248224 (gate
  <= 0.113), and 0/5 fixed-ID diagnostic bins improve (gate >= 4/5); per-molecule
  improvement fraction 0.259, median gain -0.081157. The result is certified,
  not an artefact: the captured R replays through the original reader with max
  per-molecule delta 0.0 and reproduces the published valid MAE to 0.0, all
  three lambdas and the final fit returned CONVERGED with primal-dual gap
  <= 1e-6, C6 zero slots stayed off, and the frozen backbone hash is unchanged.
  The head fits the train representation to MAE 0.222 while the frozen Full
  trains to 0.0454, so a 257-coefficient fixed-kernel readout underfits the
  representation the trained MLP reader fits. Verdict:
  GRAPH_DICTIONARY_READOUT_STOP for this fixed configuration; no new full
  neural training run is purchased.
status: tentative
