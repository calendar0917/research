claim_id: claim-graph-head-refit-late-adaptation-20260916
kind: claim
status: supported
study_id: zinc-context-gap
created: '2026-09-16T01:10:00'
statement: >-
  On the frozen compact-v4 graph representation R (302D) of the official ZINC
  train universe, the previously observed advantage of a small post-hoc MLP head
  (302->13->13->1, H2) over the original jointly-trained head
  (302->64->32->1, H0) is NOT a head-capacity effect. Under an identical
  frozen-R refit protocol the small 13->13 MLP and the original-size 64->32 MLP
  are statistically indistinguishable: Delta_cap = MAE(L-scratch) - MAE(S) =
  +0.000255 (paired molecule-level stratified bootstrap over 2 backbone seeds x
  5 folds, 95% CI [-0.00097,+0.00150], P(>0)=0.658, fold-averaged positive only
  2/5), and on raw inputs the sign reverses (Delta_cap_raw = -0.003264, large
  head better, only 1/5 folds positive). The dominant mechanism is frozen readout
  refit / late adaptation: Delta_S = MAE(H0)-MAE(S) = +0.004751 (CI
  [+0.00150,+0.00952], P=0.9997, 5/5), Delta_L = MAE(H0)-MAE(L-scratch) =
  +0.004496 (CI [+0.00108,+0.00946], P=0.9983, 5/5) and Delta_W =
  MAE(H0)-MAE(L-warm) = +0.005369 (CI [+0.00414,+0.00660], P=1.0000, 5/5). The
  original head module, warm-started from the checkpoint through an exact
  first-layer standardisation reparameterisation (float64 identity max 6.2e-15;
  float32 deployment max 4.4e-5 < 1e-4), matches or beats both scratch heads,
  so the original architecture is sufficient and was under-adapted to the final
  frozen R. Fit-only standardisation is not the source of the gain: the same
  small head on raw R beats its standardised counterpart by 0.002234 (CI
  [-0.00356,-0.00090], P(>0)=0.0004). Learning curves support overfitting of the
  large scratch head (fit MAE 0.0371 vs 0.0740 at epoch 800 while selection
  worsens) and under-adaptation of the warm-started original head. Exact
  parameter counts: H0 original head 21633 (21505 linear + 128 LayerNorm),
  small head 4135, large scratch head 21505; replacing the head in the real
  model changes 96141 -> 78643 on fold0/seed0 (mean 78732.6), a saving of 17498
  per model.
scope: >-
  ZINC-12k official TRAIN only, through the existing frozen compact-v4 OOF R
  caches (graph_head_R_cache_v1; official valid/test never loaded); two frozen
  backbone seeds (0 and 1); head_seed 0 only (the pre-registered second-init
  window was not entered); one fixed training protocol (L1/MAE, Adam lr=1e-3,
  wd=0, deterministic mini-batch 512, horizon 800, best-selection checkpoint on
  800) shared by every refit head; no backbone training, no representation
  change, no new head family, no width sweep.
