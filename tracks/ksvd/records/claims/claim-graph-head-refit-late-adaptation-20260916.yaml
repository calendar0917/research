contradicting_evidence:
  - >-
    The large scratch head does show a clear overfitting fingerprint on
    selection (fit MAE 0.0371 vs 0.0740 at epoch 800, selection worsens to
    0.1871 vs 0.1817). This is consistent with a small-capacity regularisation
    story even though it does not survive on the untouched outer-heldout set.
  - >-
    Warm continuation has the weakest selection MAE of all heads (~0.20) yet the
    best outer-heldout MAE; the selection metric is therefore not a perfect
    proxy for outer generalisation and the L-warm advantage is partly about
    which checkpoint the selection rule lands on.
  - >-
    On raw inputs the LARGE head beats the small head by 0.003264, so the
    capacity ordering is scale-dependent. A capacity claim in either direction
    would be fragile.
limitations:
- Only one refit protocol was tested (mini-batch 512, 800 epochs, lr 1e-3); the
  decomposition holds for this protocol, not for all possible refit schedules.
- The original head carries LayerNorm + Dropout while the two scratch heads are
  pure ReLU MLPs, so the S/L vs L-warm contrast also differs in architecture,
  not only in initialisation. The capacity contrast (S vs L-scratch) is
  architecture-family matched, which is where the decisive Delta_cap is measured.
- Frozen OOF checkpoints only; no official valid/test evidence, so the
  late-adaptation signal is not yet shown to transfer to a benchmark-comparable
  protocol.
implication: >-
  Do NOT replace the compact-v4 head with a 302->13->13->1 head and do NOT run
  width / depth / activation sweeps. Treat the small-head signal as a
  frozen-readout adaptation signal. The next experiment is a leakage-safe
  canonical-training -> freeze-backbone -> head-only MAE adaptation protocol on
  the official train/valid split, with selection and final evaluation roles
  strictly separated. If an end-to-end small head is ever run, all upstream
  shared tensors must be copied item by item (not merely seeded identically).
