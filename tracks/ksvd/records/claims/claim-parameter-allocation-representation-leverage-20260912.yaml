claim_id: claim-parameter-allocation-representation-leverage-20260912
created: '2026-09-12T00:00:00'
kind: claim
study_id: zinc-context-gap
status: supported
claim: >-
  A zero-training parameter-allocation audit of the two optimized compact-v4-hinge
  checkpoints (seed0 valid 0.146420, seed1 valid 0.149332; 99,613 params; R 302D)
  separates the budget into identity storage (36,676; 36.82%), shared structural
  operators (37,616; 37.76%), late readout (21,633; 21.72%) and global structural
  prior (3,688; 3.70%). The graph head is a STRONGLY SUPPORTED reallocation donor:
  a single fixed small raw head (302->13->13->1, 4,135 params, direct yhat=f(R),
  raw R, L1/Adam(lr 1e-3,wd 0), 7200 fit/800 selection, horizon 800, head_seed 0)
  gives valid 0.143208 vs 0.146420 (seed0, delta -0.003213) and 0.147754 vs
  0.149332 (seed1, delta -0.001578), i.e. it improves valid while removing 17,498
  params (80.9%). The identity lookup is NOT a simple donor: its effective 16-D
  table has 99% energy rank 15/16 (seed0/seed1), the 768 frequent rows are
  full-rank-16 and the 6,017 rare rows are already rank-4 factorized, so a global
  rank-15/16 factorization has negative hypothetical saving (-65,595 / -72,396)
  and r99/r999 frozen perturbation drift/valid change is negligible. No
  representation-forming region is R-SUPPORTED: pair path and centre update are
  R-DISFAVORED (P1 composer, P2 refresh, endpoint/covariance/triad NO-GOs),
  higher-order structural persistence is R-DISFAVORED (compact-v4-cell NO-GO), and
  patch_encoder is only R-UNCLEAR.
