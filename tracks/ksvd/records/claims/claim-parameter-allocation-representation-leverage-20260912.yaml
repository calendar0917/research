caveats:
  - >-
    The optimized backbones are valid-selected canonical checkpoints, so the
    small-head screen is parameter-donor screening evidence, NOT a clean
    independent end-to-end compression proof.
  - >-
    Frozen post-hoc low-rank compression failing (or not saving) does not prove
    that end-to-end structured sharing is impossible; it only rejects simple
    post-hoc linear low-rank compression at the pre-registered ranks.
  - >-
    Low activation participation ratio is bandwidth evidence only; it is not an
    instruction to reduce or increase any dimension.
  - >-
    Gradient magnitude at a trained checkpoint is a descriptive local
    sensitivity, not a capacity-importance ranking.
