revisit_if: >-
  A compression-matched control (task+MDL discovery constrained to the frequency
  arm's occurrence / dynamic-state budget) removes the Delta>=0.04 gain -> the
  effect was reduced compression, not task relevance; or a paired seed-1 run
  fails to reproduce the direction; or a stronger dictionary regularisation both
  keeps the frequency-level compression and preserves the task gain.
