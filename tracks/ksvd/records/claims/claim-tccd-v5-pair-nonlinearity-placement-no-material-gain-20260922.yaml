claim_id: claim-tccd-v5-pair-nonlinearity-placement-no-material-gain-20260922
created: '2026-09-22T00:00:00Z'
kind: claim
status: supported
study_id: zinc-context-gap
statement: >-
  On the fixed internal ZINC split, with the exact TCCD-v2 PrototypeREL frozen
  representation, exact five-relation set, all unordered occurrence pairs,
  matched 197-to-64-to-16 pair MLPs, and matched lightweight readers, PRE
  placement E[phi(p_ij)] does not materially outperform POST placement
  phi(E[p_ij]). The Top-5 soup placement delta is 0.000815183, below the
  preregistered 0.005 failure threshold. PRE-SHUFFLE changes the PRE soup MAE
  by only 0.000337422, also below threshold. The new nonlinear pair branch does
  improve over BASE by 0.026945770 MAE, so pair-branch capacity has predictive
  value, but this result cannot be attributed to preserving occurrence pairs
  through the nonlinear transform.
scope: >-
  TCCD-v5 preregistration commit 539ee07; formal implementation commit
  1ec96ffd2abf0e9e2690d4fa7faf0ddb734bb1bb; remote A100 GPU1; seed 0; fixed
  internal split seed 20260922 with 8000 train and 2000 dev; exact TCCD-v2
  714-to-64 local encoder, K=64 prototypes, temperature, existing five
  relations, all unordered i<j pairs, pair descriptor width 197, and
  Linear(197,64)-ReLU-Linear(64,16) pair MLP; official test never loaded.
