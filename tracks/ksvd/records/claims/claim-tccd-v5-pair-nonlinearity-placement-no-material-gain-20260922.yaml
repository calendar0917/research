decision: STOP_STAGE_A_FAIL
interpretation: >-
  The shared pair branch improves the frozen BASE, but PRE and POST are
  indistinguishable at the preregistered causal threshold and PRE-SHUFFLE is
  negligible. A one-level global nonlinear placement change is insufficient to
  support early occurrence aggregation as the primary TCCD bottleneck.
next_hypothesis: >-
  Center-preserving occurrence composition is the next justified hypothesis,
  but it requires a new preregistration and is not auto-authorized.
