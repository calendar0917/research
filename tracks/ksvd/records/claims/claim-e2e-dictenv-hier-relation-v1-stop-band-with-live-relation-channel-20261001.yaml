claim_id: claim-e2e-dictenv-hier-relation-v1-stop-band-with-live-relation-channel-20261001
contradicting_evidence:
- >-
  The best single epoch is epoch 316 of 320 and valid MAE was still falling
  (last-20 mean 0.2022, last epoch 0.1950), so a longer horizon would improve
  slightly; this does not move the band, because no epoch in the last 220 was
  below 0.19 and the endpoint is 0.059 above the 0.1233 edge.
- >-
  The endpoint cannot be read as the ceiling of the hierarchical static
  relation-dictionary idea: the model overfits (train 0.0912 vs valid 0.1823),
  and no capacity or regularisation variant was authorised, so the failure is
  compatible with a data/regularisation limit rather than with the dictionary
  mechanism.
