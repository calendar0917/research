implication: >-
  The single-model hierarchical static relation dictionary is CLOSED as a
  standalone absolute-performance candidate (band `stop`).  The mechanism result
  is retained as a positive building block: unlike the Joint709 coordinate, this
  relation channel is demonstrably used by the trained model (interventions
  0.20-0.65 MAE), so a future round does not need to re-establish liveness.  Any
  continuation must attack the generalisation gap (train 0.0912 vs valid 0.1823)
  or the representation capacity of the linear 128-atom node dictionary, and
  must carry its own preregistration, matched arms and paired seeds if it wants
  to make a performance claim.  No larger-K / smaller-s / stacked-layer /
  message-passing rescue of this candidate is authorised by this round.
kind: claim
limitations:
- >-
  Single seed, single trajectory, no control arm (no dense/PCA arm, no
  random/shuffled-dictionary arm, no no-relation arm), so no increment,
  sparse-vs-dense or dictionary-vs-no-dictionary causal statement is made; the
  frozen absolute band is the only endpoint rule applied.
- >-
  The intervention results are sensitivity statements inside this model only:
  they show the channels carry prediction, not that the channels are better than
  a matched dense or random alternative.  No matched-training control exists in
  this round.
- >-
  The historical numbers of other rounds (Joint709 0.132442, the legacy
  A/B/C / Sem108 / RPD values) are background only; the architectures, input
  representations and parameter counts differ, so this run's 0.182343 is NOT a
  matched comparison against them in either direction.
- >-
  CPU regime (runtime.device=cpu, 8 threads) on a single authoring machine; one
  dictionary geometry only (D_N 712x128 all coordinates kept, P 128x32 fixed
  seed 20261001, D_R 228x64 tied-IHT s=8 steps=10); no K / s / IHT-steps /
  width / horizon / lr / lambda variation was authorised, and the frozen
  relation scaler was never refit.
- >-
  The correctness gate's quoted initial R_N (0.004538) was measured on a
  single-molecule batch and is not population-representative; the
  population value on the probe batch is 0.3411.  The discrepancy is recorded
  in the analysis note rather than repaired.
