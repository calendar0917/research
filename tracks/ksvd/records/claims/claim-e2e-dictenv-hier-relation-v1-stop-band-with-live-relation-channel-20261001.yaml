statement: >-
  The single authorised candidate of this round — a from-scratch 145961-parameter
  static model whose input is a linear 712x128 node dictionary, whose relation
  object is built from within-molecule same-atom-type shared environments mu and
  deviations delta of the node codes, and whose edges are coded by a learnable
  228x64 tied-IHT(s=8, steps=10) relation dictionary — reached an official-valid
  soup MAE of 0.182343094 (best single epoch 0.193210 @ 316) under the local CPU
  regime, landing in the pre-registered `stop` band (> 0.1233): the candidate is
  0.0590 MAE above the borderline edge and the frozen rule terminates it without
  seed 1, rescue or sweep.  Unlike the previous round's inert joint coordinate,
  the mechanism is live at the endpoint: zeroing the relation codes costs
  +0.473052 valid MAE, zeroing the node pooling +0.644932, zeroing the relation
  delta channel +0.230278, and two in-group endpoint permutations cost
  +0.206115 / +0.199758 (all with prediction-RMS changes of 0.11-0.62, four
  orders of magnitude above the pre-registered 1e-4 sensitivity floor); the
  relation dictionary rotated away from its spectral initialisation (column
  cosine 0.27) while staying incoherent, the relation code uses exactly l0 = 8
  atoms with effective atoms 16.9 of 64, and both dictionaries receive finite
  non-zero MAE-only gradients in every probe epoch.  The limitation is
  generalisation, not liveness: soup train MAE 0.091181 (gap -0.091162), with the
  initial node dictionary reconstructing the Sem108/RoleCorr columns poorly
  (R_N = 0.3411 on the probe batch, 99.3 % of the residual in those two blocks)
  and the auxiliary reconstruction term then doing real work (R_N 0.341 -> 0.143
  on the probe, 0.079 full train / 0.071 valid).  The negative absolute band
  result and the positive mechanism result are two separate statements and must
  not be merged.
