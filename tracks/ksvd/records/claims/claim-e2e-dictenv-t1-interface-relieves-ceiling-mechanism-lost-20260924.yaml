caveats:
  single_tuning_seed: true
  gpu_not_bit_deterministic: true
  gpu_heterogeneous_stage_a: >-
    A1 ran on a GPU0 contended by a foreign ~37 GB / ~100% job; A2/A3/B/C and
    the seed-1 confirmation ran on GPU1 (foreign ~35 GB / ~0%).  Wall-clock is
    not a cross-candidate comparator; valid MAE is.
  coarse_146_channel_shared_by_all_stage_a_candidates: >-
    the gain cannot be attributed separately to "exposing coarse chemistry" vs
    "slot width/mode" from within Stage A; the v0->T1 mechanism collapse is the
    evidence for the coarse-pathway interpretation.
  shuffle_gate_miss_is_marginal_in_absolute_terms: >-
    0.007628 vs 0.010 (-0.0024), but the collapse relative to v0 (0.017289 ->
    0.007628) is far larger than execution noise and is corroborated by the
    independent 48x G_dict-use collapse.
