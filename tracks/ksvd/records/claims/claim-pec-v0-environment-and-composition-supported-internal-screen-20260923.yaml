claim_id: claim-pec-v0-environment-and-composition-supported-internal-screen-20260923
created: '2026-09-23T16:50:00'
kind: claim
status: tentative
study_id: zinc-context-gap
statement: >-
  PEC-v0 (2026-09-23, local CPU only, commit 883e529b159cae49fd1a9d279db2b40b8ff5e77c
  plus this round's implementation; ZINC canonical official train 10,000 with
  internal fit 8,000 / monitor 2,000 and a 2,000-train / 500-dev Gate-2 screen;
  official valid and official test NEVER loaded, official_test_loaded = false).
  QUESTION: can a molecule be modeled as chemical primitives bound to reusable
  rooted structural roles -> FROZEN local chemical environments -> one read-only
  static composition, with NO message passing, NO recurrence and NO mixed
  chemistry bypass?  OBJECT (frozen before any run; notes/pec_v0_preregistration.md
  + Amendment A1): per root i and radius-2 patch P_i, node role b^V_{iv} in R^11
  and edge role b^E_{ie} in R^15 are the audited FSAR explicit rooted occurrence
  bases and are TOPOLOGY-ONLY; alpha = SparseDict(b) with K=16, s=4, tied-IHT
  (10 steps, deterministic power-iteration start, unit-normalized atoms, exact
  top-s); r^V_{iv} = [one_hot(shell,3); alpha^V_{iv}], r^E_{ie} =
  [one_hot(shellpair,5); alpha^E_{ie}]; B^V_i = sum_v r^V_{iv} (x) a(q_v) in
  R^{19x28}, B^E_i = sum_e r^E_{ie} (x) c(b_e) in R^{21x4}; E_i = H([q_i, vec B^V_i,
  vec B^E_i, S_i]) in R^48 formed ONCE and frozen; c_ij = F([E_i+E_j, |E_i-E_j|,
  E_i*E_j, rho_ij]) computed ONCE over 18-D PURE-TOPOLOGY pair relations (the
  strict-static S0 relation with path_bond_mean and adjacent-bond chemistry
  DELETED); readout G([mean E, max E, mean c, max c, global_topology]).  GATE 0
  PASSES 8/8: chemistry-vs-topology isolation, chemistry-placement sensitivity
  (max |Delta E| 0.0991), environment freeze bit-identical under pair mutation,
  environment module called exactly once, BAG forward finite, relabel prediction
  max |Delta| 0.0, exact l0 = 4 for both roles, finite non-zero gradients on node
  dict / edge dict / environment MLP / pair composer / reader; parameters sparse
  94,049 = dense 94,049, coarse 94,036.  GATE 1 (label-free, fit 8,000 / monitor
  2,000; K-SVD) is a FROZEN NUMERIC FAIL on 3 of 10 criteria (node E_rec random
  ratio 0.1115 > 0.10, edge 0.1024 > 0.10, edge used atoms 11 < 12) while the
  remaining 7 pass and the user-specified STOP condition (does the dictionary
  preserve the coarse rooted role?) passes decisively: alpha^V -> shell probe
  macro-F1 1.000 (majority 0.217, margin +0.783), alpha^E -> shellpair macro-F1
  1.000 (majority 0.180, margin +0.820); K-SVD E_rec node 0.0369 / edge 0.0543
  versus matched random-normalized 0.3305 / 0.5299 (9.0x / 9.8x).  GATE 2
  (2,000 train / 500 dev official-train molecules, dictionaries refit on train
  only, frozen one-seed protocol, Top-5 epoch-checkpoint soup) PASSES all 5
  criteria: chemistry-placement shuffle degrades MAE by +0.8353 for CK (required
  >= 0.02; +0.7585 CD, +1.0310 C0), TRUE composition beats BAG by +0.035171 and
  SHUFFLE by +0.011597 (each required >= 0.003), the sparse arm is NOT worse than
  the exactly parameter-matched dense arm (CK 0.461811 vs CD 0.467108, i.e.
  0.005297 better) and is load-bearing (neutral-dictionary MAE 2.175492).
  CLAIM: within the frozen 2,000-molecule internal screen, the environment
  hypothesis and the static-composition hypothesis are BOTH SUPPORTED, and the
  frozen sparse role dictionary is neither inert nor worse than a parameter-
  matched dense role encoder.  SCOPE / LIMITS: internal screen only (2,000
  training molecules), so NO absolute-performance or official-valid-band claim is
  made and the numbers are NOT comparable to the strict-static S0 band
  (0.140794/0.136423); exactly one seed; the CK-CD gap 0.005297 is small relative
  to the documented seed spread (~0.004-0.007) and must not be over-read; the
  dictionary is FROZEN (detached K-SVD) rather than task-coupled, so
  TASK_COUPLED_DICT_SUPPORTED is not claimed; because the occurrence basis row
  already contains the shell one-hot (Amendment A1) the alpha -> shell probe is
  near-tautological and is weak evidence; Gate 3 (official-valid seed-0 GPU) was
  deliberately NOT run, so the terminal verdict is WITHHELD and
  PURE_SPARSE_DICT_ENV_COMPOSITION_SUPPORTED is NOT claimed.
