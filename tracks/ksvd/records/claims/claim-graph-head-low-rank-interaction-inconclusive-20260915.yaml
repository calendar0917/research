claim_id: claim-graph-head-low-rank-interaction-inconclusive-20260915
kind: claim
status: tentative
study_id: zinc-context-gap
created: '2026-09-15T00:30:00'
statement: >-
  On the frozen compact-v4 graph representation R (302D) of the official ZINC
  train universe, an explicit rank-4 low-rank cross-coordinate interaction head
  (Factorization Machine: bias + linear + sum_{i<j} <v_i,v_j> z_i z_j, 1511
  params) does NOT show a *replicable* parameter-efficiency advantage over a
  same-budget generic ReLU MLP (302 -> 5 -> 2 -> 1, 1530 params). Setup verified
  from real exports: R_dim = 302 with layout unary 97 + pair-bucket moments 165
  + global 32 + topology 8; per fold the frozen backbone exposes the true
  nested structure 7200 head-fit / 800 head-selection / 2000 outer-heldout, and
  all direct heads do yhat = f(R) with no residual yhat_0. Representation
  integrity gates are exact on 5/5 folds for both backbone seeds: stored target
  == official-train label, role membership == 7200/800/2000, re-fed R through
  the frozen reconstructed head == stored yhat_0 (max 0.0), holdout yhat_0 ==
  frozen OOF fold prediction (max 0.0), and holdout R == corrected
  centre-incidence export R (max 0.0, seed 0). All heads share fit-only
  coordinate standardisation (mean/std from the 7200 head-fit molecules only,
  z_j = (R_j-mean_j)/max(std_j,1e-6), z_j = 0 when std_j < 1e-6; 11-84 of 302
  coordinates are fit-degenerate per fold), the same L1/MAE objective, the same
  Adam(lr=1e-3, weight_decay=0) trainer, the same deterministic mini-batch 512
  order, the same best-selection checkpoint rule and the same fixed horizon
  (800, chosen by a fold0/seed0 100/200/400/800 convergence trace). Head
  parameters: H0 frozen original jointly-trained head; Hlinear 302 -> 1 (303);
  H1 302 -> 5 -> 2 -> 1 (1530); H2 302 -> 13 -> 13 -> 1 (4135); FM rank-4
  (1511). H1/FM mismatch +1.257% <= 3%. Stage 1 (backbone seed 0 x 5 folds x
  init 0) evaluation MAE means: H0 0.175809, Hlinear 0.187802, H1 0.175539,
  H2 0.170051, FM 0.172165; mean Delta_small = MAE(H1)-MAE(FM) = +0.003374
  (median +0.005323, 4/5 folds positive; stratified paired bootstrap 95% CI
  [-0.004398,+0.008361], P(>0)=0.835); mean Delta_strong = MAE(H2)-MAE(FM) =
  -0.002114; mean Delta_orig = MAE(H0)-MAE(FM) = +0.003643. This met the
  pre-registered EFFICIENCY ADVANCE gate. Stage 2 (backbone seed 1 x 5 folds x
  init 0) evaluation MAE means: H0 0.174253, Hlinear 0.186197, H1 0.176349,
  H2 0.170508, FM 0.175931; mean Delta_small = +0.000417 (median -0.002274,
  only 2/5 folds positive; CI [-0.004378,+0.004220]); mean Delta_strong =
  -0.005424. Pooled over both backbones: H0 0.175031, Hlinear 0.186999,
  H1 0.175944, H2 0.170280, FM 0.174048; pooled Delta_small = +0.001896
  (< +0.0025), pooled Delta_strong = -0.003769, fold-averaged Delta_small
  positive in 3/5 folds, and the paired bootstrap 95% CI lower bound is
  negative in both stages. The FM interaction is mechanically alive: on
  backbone 0 std(interaction) = 0.905 vs std(linear) = 1.852
  (interaction/prediction scale 0.427, mean |interaction| = 0.223) and forcing
  V=0 at inference (no retraining) raises evaluation MAE by +0.1144 on 5/5
  folds. CatBoost is not installed, so the secondary tree-style MAE reference
  is recorded unavailable. The end-to-end FM replacement was NOT authorized.
scope: >-
  ZINC-12k official TRAIN only, through the existing frozen compact-v4 OOF
  checkpoints (official valid/test never loaded); backbone seeds 0 and 1 (both
  spent); one head init per backbone (head_seed 0; Stage 1b not triggered);
  typed_tokenizer_v1_historical; direct heads yhat = f(R) with no residual
  yhat_0; fit-only standardisation; identical L1 objective, Adam(lr=1e-3,
  weight_decay=0) and deterministic mini-batch 512 for every head; fixed
  horizon 800 with best-selection checkpointing; no backbone training, no
  compact-v4 change, no new structural feature, no target-informed knot, no
  MSE/Huber/weighted objective, no LR/weight-decay/optimizer/batch/rank sweep,
  no official valid/test access.
