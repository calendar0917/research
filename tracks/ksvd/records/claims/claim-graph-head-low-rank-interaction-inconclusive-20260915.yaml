contradicting_evidence:
  - >-
    On backbone seed 0 the FM does beat H1 (mean Delta_small +0.003374 on 4/5
    folds) and even beats the jointly-trained original head H0 on the untouched
    held-out molecules (mean Delta_orig +0.003643), with a live interaction
    term (V=0 costs +0.1144 MAE, 5/5). A single-backbone reading would call this
    a parameter-efficiency win.
  - >-
    The pooled FM MAE (0.174048) is close to H1 (0.175944) and better than H0
    (0.175031), so the FM head is not a broken reader; the negative is about
    replicability and the strong H2 reference, not about inability to fit.
  - >-
    Frozen R was produced by a backbone jointly trained with the original MLP
    head, so its latent geometry may be MLP-friendly; this could penalise the
    low-rank interaction family in a way that would not persist end-to-end.
limitations:
- Only two frozen backbone seeds and one head init each (Stage 1b not triggered
  because Stage 1 was an efficiency advance, not borderline).
- The final held-out set is 2000 molecules per fold on the official train
  universe; no official valid/test was loaded, so this is a screening result.
- The protocol uses a deterministic mini-batch 512 rather than the frozen
  adapters' full-batch, because full-batch under-trained the 7200-sample heads;
  this is a pre-registered protocol choice, not a head-family difference.
- CatBoost was unavailable, so no tree-style secondary reference exists for
  this representation and split.
- Rank was fixed at 4; no larger or learned rank was tested (by design).
implication: >-
  Do not expand the frozen-R explicit low-rank interaction head budget: no rank
  8/16/learned, no DeepFM / field-aware FM / CrossNet / polynomial network /
  bilinear head, no MLP+FM hybrid, and no end-to-end FM replacement. The
  low-rank interaction hypothesis gets one fair frozen chance (rank 4) and it
  did not replicate. The next move must be a paradigm-level, pre-registered
  representation-family / objective-aligned structured-computation question with
  its own witness, not another function transform of frozen R. If a tree-style
  reader is desired, install CatBoost under its own pre-registered MAE preset
  and split in a separate MAE-compatible head-family audit.
