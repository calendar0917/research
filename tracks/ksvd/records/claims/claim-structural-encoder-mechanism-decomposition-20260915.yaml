supporting_evidence:
  - >-
    B-bag 2-seed Top-5 soup valid mean 0.123806 (seed0 0.127382, seed1 0.120229);
    Delta_connectivity = +0.004833 with both seeds positive (>= 0.002 gate).
  - >-
    Integrity gate: identical primitive multisets + different actual
    connectivity -> B-bag e_bag max abs delta exactly 0.0, B-full e_struct max
    abs delta 1.787e-3; B-bag forward runs on a batch with no edge endpoints.
  - >-
    Matched budget/backbone: 84,511 vs 84,495 total (+16, +0.019%); every one of
    the 15 shared blocks identical; h=64, q=16, T=2, R=334; no typed embedding.
  - >-
    Deterministic-A100 repro bit-identical across GPU0/GPU1 (selection-state
    SHA-256 2198026f796883bea1915068f37b0cc3129d47b98cb96606bbab6b555513b491);
    20/20 sanity checks; 888 repo tests pass.
  - >-
    Frozen B-full rank-1 reconstruction: selection +0.000013/-0.000011, soup
    +0.000020/+0.000011; 2-seed soup mean 0.11897219 -> 0.11898768; full
    evaluation reproduces the deterministic-A100 soup values exactly.
  - >-
    Train spectrum: occurrence-weighted PC1 EV 0.9793/0.9567, effective rank
    1.106/1.196; unique-structure-weighted PC1 EV 0.9937/0.9504; PC1-PC4
    cumulative 1.0000.
contradicting_evidence:
  - >-
    Delta_composition sign-flips across seeds (-0.005688/+0.001905) and its mean
    is negative, so the component intended to be "primitive composition" is not
    a robust positive increment; B-bag is on average worse than A2.
  - >-
    A2 and B-bag have different input information (146-D shell descriptor vs raw
    primitives), so the composition axis is confounded and cannot be read as a
    clean capacity-matched composition test.
  - >-
    Only 2 seeds; the B-bag soup per-seed spread (0.0072) is larger than the
    decomposition deltas, so the composition axis cannot be resolved with this
    budget (and no extra seeds were purchased).
  - >-
    "Connectivity" here is entangled with "has two rounds of learned message
    passing" vs "has none"; it is the pre-registered variable but is not a
    same-encoder edge-flag intervention.
  - >-
    The train-fit PC1 score is only partially explained by existing descriptors
    (R2 0.279/0.553) and the fit is seed-dependent, so the scalar's meaning is
    not fully pinned down.
  - >-
    B-bag e_bag effective rank was not measured, so the matrix has one
    unmeasured representation cell.
