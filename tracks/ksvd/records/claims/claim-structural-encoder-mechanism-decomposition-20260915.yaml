claim_id: claim-structural-encoder-mechanism-decomposition-20260915
kind: claim
status: supported
study_id: zinc-context-gap
created: '2026-09-15T14:30:00'
statement: >-
  On the frozen deterministic-A100 ZINC Cell A protocol, the +0.002942 (2-seed
  fixed Top-5 soup valid) gain of the shared connectivity-aware patch encoder
  (B-full, 0.118972) over the capacity-matched generic shared adapter (A2,
  0.121914) decomposes into (a) a reproducible connectivity increment and (b)
  an inconclusive composition increment, and the 16-D structural channel is
  functionally a rank-1 scalar modulation. The missing control B-bag is a
  permutation-invariant DeepSets encoder built from exactly the same input
  primitives as B-full (atom type, root flag, root-distance, bond type), with
  the same output width (16) and a matched budget (84,511 vs 84,495 params,
  +0.019%); it never reads struct_src/struct_dst and performs no message
  passing. Delta_composition = A2 - Bbag = -0.001891 (seed0 -0.005688, seed1
  +0.001905 -> SIGN FLIP, mean negative); Delta_connectivity = Bbag - Bfull =
  +0.004833 (seed0 +0.007564, seed1 +0.002103 -> both positive >= 0.002);
  Delta_total = +0.002942. 2-seed soup means order B-full 0.118972 < A2 0.121914
  < B-bag 0.123806. Decision: connectivity axis Case C1 (connectivity
  supported); composition axis inconclusive (not proven neutral; B-bag is on
  average worse than A2). Separately, a zero-training audit of the frozen
  B-full checkpoints shows the 16-D e_struct is near rank-1 on official train
  (occurrence-weighted PC1 explained variance 0.9793/0.9567, effective rank
  1.106/1.196; unique-structure weighted is at least as collapsed), and
  replacing e_struct by its train-fit rank-1 reconstruction changes official
  valid MAE by only +0.000020/+0.000011 (soup; 2-seed mean 0.11897219 ->
  0.11898768, delta +0.0000155) at a 2.0%/4.3% relative reconstruction error ->
  Case R1: the channel is functionally a scalar modulation, not a rich explicit
  structural code. The train-fit PC1 score is only partially predictable from
  the 224 deterministic patch descriptors (fixed ridge train->valid R2
  0.279/0.553, Spearman max |rho| ~0.48/0.54 with root-atom-type/atom-composition
  directions strongest) -> between R3 and R4, seed-dependent.
scope: >-
  ZINC-12K official train/valid for the mechanism decomposition; deterministic-A100
  regime; seeds 0 and 1; fixed Top-5 soup; valid-selection metric. The official
  test split was read EXACTLY ONCE, in the separately-authorized terminal
  closure (commit 4802ba8, tag sbpe-test, n=1000); no test number was used for
  selection, tuning, or any model decision. Exactly
  one pre-registered B-bag architecture (no width/depth/pooling sweep); no extra
  seeds. The A2-vs-B-bag comparison is CONFOUNDED by input information (A2 reads
  the 146-D handcrafted shell descriptor; B-bag reads only raw primitives), so
  the composition statement is limited to "a shared bag over raw primitives is
  not better than the generic shared adapter", never "compositional structure is
  worthless". The B-bag e_bag effective rank was NOT measured. Frozen rank-1
  reconstruction is a mechanism diagnostic only, never a model-selection device.
  Excludes attention/Transformer, identity lookup/hash/KNN/SBCI, h/q/T changes,
  optimizer/seed sweeps, MolHIV training, and any scalar-model design.
