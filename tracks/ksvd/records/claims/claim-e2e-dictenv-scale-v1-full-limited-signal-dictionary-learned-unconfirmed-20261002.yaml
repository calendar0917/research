claim_id: claim-e2e-dictenv-scale-v1-full-limited-signal-dictionary-learned-unconfirmed-20261002
contradicting_evidence:
- >-
  The valid endpoint moved by only -0.001904 against the unmatched
  latent-bridge background and -0.004551 against the unmatched Sem108
  background, both single-seed context with different parameter counts, so no
  increment is demonstrated in either direction.
- >-
  The extra capacity mostly bought fitting: same-protocol soup train MAE fell
  from 0.055133 (Small) to 0.045397 (Full) while the valid endpoint fell only
  from 0.121058 to 0.119154, and the train-to-valid gap widened from +0.065926
  to +0.073757.
- >-
  The code is again near-dense at the frozen lambda regime (mean non-zero
  250.89/288, fraction 0.871, p50 255, p95 275), so the round cannot claim
  sparse dictionary coding; the diagnostic low-dimensional reconstruction also
  degraded from mean relative 0.0048 (Small) to 0.0588 (Full).
- >-
  The zero-code (+1.436962), permutation (+0.394184) and reset-to-init
  (+1.329684 MAE) probes are sensitivity statements inside one model: zeroing
  the code removes the whole local encoding from the readout by construction,
  and no parameter-matched dense/random control was run, so nothing is shown
  about dictionary learning versus a matched trained alternative.
- >-
  The round is one seed, one trajectory and one authoring CPU machine; no
  seed-variance estimate exists, and the 0.004846 margin below the 0.115
  promising edge is far below anything this design could resolve.
