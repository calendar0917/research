implication: >-
  The capacity route is CLOSED after seed 0: m=3 reached the limited-signal
  band (0.115 < M_S <= 0.120) and the pre-registration forbids further widening
  (m, K, d, lambda, steps, lr) and any seed-1 / matched-control rescue of this
  round.  The unified Small/Full construction itself is validated as a
  building block: m=1 is bit-identical to the frozen LatentBridgeSEM108
  (106,925), m=2 audits exactly (233,203), m=3 is exact (408,651 = 325,707
  body + 82,944 dictionary) with an eval-mode containment witness and all
  Sem108 modules frozen and identical.  A continuation requires a new
  pre-registration and must be either (a) a confirmation design for the shared
  task dictionary (paired seeds plus a parameter-matched dense/random adapter,
  band and code density pre-declared) or (b) a different local object /
  learning objective; a further widening of K or d is not authorised by this
  round.
kind: claim
limitations:
- >-
  Single seed, single trajectory, no matched control arm (no parameter-matched
  dense or random adapter, no no-dictionary rerun), so no increment or
  dictionary-vs-dense causal statement is made; the frozen absolute band and
  the exact mechanism measurements are the only claims.
- >-
  The zero-code / permutation / reset probes show the channel carries
  prediction inside this one model, not that learning D_L / V_L beats a matched
  trained alternative.
- >-
  All historical comparisons (latent-bridge 0.121058, Sem108 0.123705, T1
  0.125765, FINAL-CLEAN-C6 0.128499, CSSD-q1 0.130028, P1-sparse 0.131975) are
  unmatched background: different architectures, parameter counts and
  protocols, single seed each.
- >-
  CPU regime (runtime.device=cpu, 8 threads) on one authoring machine; one
  geometry only (d 144, K 288, 16 unrolled ISTA steps, lambda1 0.05,
  lambda2 0.01, tied V_L); no K / d / lambda / steps / width / horizon / lr
  variation authorised; m=1 and m=2 were never retrained this round.
- >-
  The probes were produced by the completion run at revision 638d6a3 on the
  frozen training state of run 20261002-004025-2196abdb (revision 5335301);
  the only change is a reporting-only dtype fix in the density accumulator,
  and the completion run reproduced the identical training state hashes.
scope: >-
  Pre-registration committed before the formal run (preregistration sha
  c65d6e223aa9 enforced by preflight).  One Full candidate, seed 0, 320 epochs,
  batch 128, Adam lr 1e-3 / weight_decay 1e-5 / clip 5.0, fixed LR, Top-5 soup
  by official valid, local CPU 8 threads; unified Small 106,925 / Full 408,651
