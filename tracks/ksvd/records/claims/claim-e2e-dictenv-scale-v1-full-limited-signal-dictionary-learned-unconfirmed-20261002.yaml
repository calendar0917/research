statement: >-
  The single authorised Full candidate of this round — the unified Small/Full
  model at scale m=3 (exactly 408,651 parameters: 325,707-parameter widened
  Sem108 body plus an 82,944-parameter shared task dictionary D_L[144,288] /
  V_L[288,144], h -> rho-normalised 16-step unrolled ISTA -> alpha[288] ->
  E = rho * alpha @ V_L, no bypass) — reached an official-valid soup MAE of
  0.11915409201 (best single epoch 0.12330684 @ 299, Top-5 soup members
  268/276/289/299/317) under the local CPU seed-0 regime, landing in the
  pre-registered limited-signal band (0.115 < M_S <= 0.120, case C): so the
  promotion condition M_S <= 0.115 was NOT met and the capacity route closes
  without further widening, seed 1 or matched controls.  The mechanism
  statement is separate and positive: D_L / V_L moved 16.4566 / 12.8033 from
  the frozen frame with non-zero MAE-only task gradients (0.0963 / 0.2431 at
  the endpoint), zeroing the task-dictionary code costs +1.436962 valid MAE
  (prediction RMS +1.940718), a 5-seed within-molecule code permutation costs
  +0.394184 (+0.607477) and resetting D_L / V_L to init costs +1.329684
  (+1.746171).  The measured limitation is that the code is again near-dense
  at the endpoint (mean non-zero 250.89/288, fraction 0.871, p50 255, p95 275),
  so this round cannot call it a sparse code, and the valid endpoint differences
  against the unmatched backgrounds (latent-bridge 0.121058, difference
  -0.001904; Sem108 0.123705, difference -0.004551) are not causal increments
  because the parameter counts differ and no matched control was run.  The
  band result, the mechanism liveness result and the construction-exactness
  result are three separate statements and must not be merged.
