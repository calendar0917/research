protocol_id: luyin16-clean-local-distribution-terminal-audit-v1

data:
  dataset: ogbg-molhiv
  root: data/ogb
  scaffold_folds: tracks/ksvd/results/molhiv/molhiv_n41127_scaffold_folds3_seed20260726.npz
  dev_distribution_cache: tracks/ksvd/results/luyin16/clean_patch_distribution_readout/clean_distribution_features.npz
  dev_global_s: tracks/ksvd/results/luyin16/mentor_r2_atom_chem_k64_s8_all_official_valid/feature_views_train_valid.npz
  full_feature_file: tracks/ksvd/results/luyin16/mentor_r2_atom_chem_k64_s8_all_official_valid/features_and_predictions.npz

representation:
  radius: 2
  degree_bins: 8
  wl_rounds: 2
  node_role_bins: 64
  edge_role_bins: 32
  typed_edge_bins: 256
  max_centers_per_graph: null

# All three S+local views are pre-registered.  The test stage reports every
# view and a fixed 50/50 primary/challenger ensemble; test cannot select among
# them.
candidate_views:
  - s_ta_mean
  - s_ta_mean_std
  - s_ta_all12

tuning:
  n_trials: 8
  seed: 20260921
  n_jobs: 8
  ranges:
    n_estimators: [100, 500]
    max_depth: [2, 7]
    learning_rate: [0.015, 0.18]
    min_child_weight: [2.0, 50.0]
    subsample: [0.65, 1.0]
    colsample_bytree: [0.25, 1.0]
    reg_lambda: [0.3, 150.0]
    reg_alpha: [0.00001, 15.0]
    gamma: [0.0, 5.0]
  view_static:
    s_ta_mean:
      max_bin: 256
      n_jobs: 8
    s_ta_mean_std:
      max_bin: 256
      n_jobs: 8
    s_ta_all12:
      max_bin: 64
      n_jobs: 8

fixed_classifier:
  n_estimators: 140
  max_depth: 4
  learning_rate: 0.05
  min_child_weight: 8
  subsample: 0.85
  colsample_bytree: 0.80
  reg_lambda: 10.0
  reg_alpha: 0.01
  gamma: 0.0
  n_jobs: 8

model_seeds: [0, 1, 2, 3, 4]

output:
  default_dir: tracks/ksvd/results/luyin16/clean_distribution_terminal_audit
  frozen_manifest: frozen_manifest.json
  terminal_test: terminal_test.json
