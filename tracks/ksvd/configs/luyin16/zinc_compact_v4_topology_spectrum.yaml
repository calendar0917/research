# Compact-v4 stage C: main v4 — full invariant topology spectrum (15D raw).
#
# Single-variable experiment against Compact-Hybrid-v2: only the graph-level
# topology channel is added (GlobalTopologyEncoder: Linear(15,16) -> ReLU ->
# Linear(16,8)); the unified graph representation becomes
# [z_local ; z_topology] and the single regression head consumes it.
# Every other variable is identical to compact-v2.
#
# Feature definition (15D, permutation-invariant, all precomputed + cached):
#   [longest simple cycle L, n_cycle_len_3..n_cycle_len_10,
#    n_cycle_len_gt10, mcb_count, mcb_max, mcb_mean, mcb_total, cycle_rank]
# NO target-definition cycle formula, NO atom/edge counts, NO RDKit input.
protocol_id: luyin16-zinc-hierarchical-patch-relation-context-compact-v4-topology-spectrum

data:
  root: data/ZINC

seed: 0

representation:
  max_typed_tokens: 8192
  minimum_typed_frequency: 1
  max_parent_tokens: 2048
  minimum_parent_frequency: 1

model:
  patch_hidden: 48
  pair_hidden: 16
  token_width: 16
  embedding_mode: hybrid
  embedding_rank: 4
  hybrid_full_typed_tokens: 768
  hybrid_full_parent_tokens: 32
  center_context: true
  center_context_hidden: 60
  graph_head_hidden_0: 64
  graph_head_hidden_1: 32
  dropout: 0.05
  epochs: 60
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.00001
  patience: 12
  evaluate_every: 1
  device: cpu
  parameter_audit: true
  # v4: global topology channel (main variant).
  topology_mode: spectrum
  topology_hidden_dim: 16
  topology_out_dim: 8
  topology_shuffle_test: true
  save_state_dict: true
  # Budget: v2 98,549 + head input +8 (512) + encoder Linear(15,16)+Linear(16,8)
  # (392) = 99,453 selection / 100,517 train+valid refit (<= 105k).
  expected_max_trainable_params: 105000

runtime:
  torch_threads: 4

output:
  json: tracks/ksvd/results/luyin16/ZINC_COMPACT_V4_TOPOLOGY_SPECTRUM_20260908.json
  markdown: tracks/ksvd/results/luyin16/ZINC_COMPACT_V4_TOPOLOGY_SPECTRUM_20260908.md
