protocol_id: luyin16-molhiv-unified-exact-rooted-relational-patch-encoder-v2

dataset: molhiv
data:
  root: data/ogb

seed: 0

representation:
  # Exact radius-2 rooted certificates and radius-1 parent certificates are
  # built from the complete OGB atom/bond feature tuples.  The vocabulary is
  # fit on the training side of each phase and keeps index 0 for OOV.
  max_typed_tokens: 32768
  minimum_typed_frequency: 1
  max_backoff_tokens: 4096
  minimum_backoff_frequency: 1

model:
  structure_code_width: 24
  attribute_code_width: 24
  binding_width: 12
  token_width: 16
  token_rank: 8
  backoff_width: 8
  backoff_rank: 4
  patch_hidden: 48
  pair_hidden: 20
  context_code_width: 16
  head_hidden: 64
  head_bottleneck: 32
  dropout: 0.05
  epochs: 20
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.00001
  patience: 5
  device: cpu

runtime:
  torch_threads: 4
  zinc_record_cache: tracks/ksvd/results/luyin16/unified_relational_patch_zinc/record_cache
  molhiv_record_mode: exact_rooted
  molhiv_record_cache: tracks/ksvd/results/luyin16/unified_relational_patch_molhiv_exact_rooted/record_cache

output:
  json: tracks/ksvd/results/luyin16/UNIFIED_EXACT_ROOTED_RELATIONAL_PATCH_ENCODER_MOLHIV_20260905.json
  markdown: tracks/ksvd/results/luyin16/UNIFIED_EXACT_ROOTED_RELATIONAL_PATCH_ENCODER_MOLHIV_20260905.md
