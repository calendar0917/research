# ZINC CSSD pair joint residual v1 — keeping C's shared endpoint projection and
# the existing pair path, does a SHARED, endpoint-swap-symmetric joint residual
# reading BOTH full endpoints and the existing relation improve the complete
# y and g?  TWO arms x body seed 0, one training each (single-seed
# exploratory round; design basis 5d33c9a).
#
# `model.stage`:
#   source-checks  : verify every reused object + the historical DICT s0 run +
#                    the previous round's SHARED_MLP s0 anchor + the
#                    dimension/bucket contracts + the per-arm init contracts
#                    (CTRL_C reproduces the previous round's C s0 init
#                    bit-for-bit; JOINT attaches its module under a fork_rng
#                    private seed 202610081, W2 exactly zero); CPU
#   pretrain-checks: the meaningful fit-only pre-training checks (CTRL_C
#                    parity bit-exact vs the previous C factory, joint module
#                    contracts, endpoint-swap symmetry, the 2-D collision
#                    demo, step-0 agreement, invariances, mask/fill wiring,
#                    gradient smoke, save/reload replay, the joint_enabled
#                    switch equivalence); CPU
#   smoke          : one 1-epoch end-to-end trajectory per arm; GPU
#   train          : one from-scratch 240-epoch training per arm x seed 0
#                    (model.arm in {CTRL_C, JOINT_RESIDUAL}); 15,120 steps
#                    asserted; members 236..240 captured; estimator = their
#                    equal-weight FP32 mean
#   terminal-eval  : the ONE-SHOT frozen comparison (roster verification,
#                    full fit+dev scoring + per-row exports, the single
#                    paired contrast JOINT-CTRL_C, group-paired bootstrap,
#                    noise bound, the alpha-mean intervention on both soups,
#                    the joint_enabled=False toggle, the frozen single-seed
#                    exploratory reading)
#
# Official ZINC valid and test are never instantiated.
protocol_id: zinc-cssd-pair-joint-residual-v1

data:
  root: data/ZINC

seed: 0

model:
  stage: source-checks
  arm: CTRL_C
  seed: 0

runtime:
  # `cpu` for source-checks/pretrain-checks; `cuda:0` is the res-2 A100 regime
  # for smoke/train/terminal-eval. No silent CPU fallback.
  device: cpu
  torch_threads: 8
