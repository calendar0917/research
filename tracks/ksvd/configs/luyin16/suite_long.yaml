      - "24"
      - --sparsity
      - "3"
      - --ksvd-iterations
      - "6"
      - --max-train-patches
      - "24000"
      - --seeds
      - "0"
      - "1"
      - "2"
      - --optuna-trials
      - "6"
      - --tune-top-k
      - "3"
      - --result
      - tracks/ksvd/results/luyin16/suite_zinc_long_range_factorial_20260830/zinc_radius2.json
    depends_on: [zinc_preflight, zinc_smoke_radius2]
    description: Full official ZINC radius-2 factorial and matched K-SVD attribution.

  - id: zinc_radius3_full
    module: tracks.ksvd.experiments.luyin16.zinc_long_range_proxy
