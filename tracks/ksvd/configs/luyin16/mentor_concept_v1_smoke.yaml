protocol_id: mentor-concept-replication-v1-smoke

data:
  dataset: ogbg-molhiv
  root: data/ogb
  max_graphs: 300
  subsample_seed: 0

sampler:
  mode: coverage
  p: 0.5
  q: 2.0
  walk_length: 6
  max_nodes: 8
  max_walks: 4
  edge_decay: 0.7
  seed_policy: degree_stratified
  cover_target: 0.8
  no_backtrack: true
  patch_feat: chem
  normalize_patches: true
  max_patches_per_graph: 4

dictionary:
  n_atoms: 8
  sparsity: 2
  minimum_sparsity: 1
  iterations: 1
  seed: 0
  max_train_patches: 500

classifier:
  seeds: [0]
  evaluate_test: false
  n_estimators: 20
  max_depth: 3
  learning_rate: 0.1
  min_child_weight: 1
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
  reg_alpha: 0.0
  n_jobs: 1

views:
  - s
  - t_init
  - t_final
  - s_t_final
