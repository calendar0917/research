protocol_id: luyin16-zinc-hierarchical-patch-relation-context-compact-hybrid-v1

data:
  root: data/ZINC

seed: 0

representation:
  max_typed_tokens: 8192
  minimum_typed_frequency: 1
  max_parent_tokens: 2048
  minimum_parent_frequency: 1

model:
  patch_hidden: 48
  pair_hidden: 16
  token_width: 16
  embedding_mode: hybrid
  embedding_rank: 2
  # IDs are frequency ordered; ID zero is a learned OOV token.  The full
  # table therefore covers OOV + the top-(768-1)=767 train-frequent typed
  # tokens; every remaining exact token keeps its own rank-2 factorized row
  # (no merging, hashing, or UNK collapse).  The parent vocabulary (31 known
  # + OOV = 32) is entirely covered by the full table.
  hybrid_full_typed_tokens: 768
  hybrid_full_parent_tokens: 32
  center_context: true
  # 64 keeps the exact first-version spec but makes the train+valid refit
  # model exceed the 100k budget by 167 params; 60 stays strictly <=100000
  # in BOTH the validation-selection phase (98579) and the refit phase
  # (99111) while retaining the full center-context feature pipeline.
  center_context_hidden: 60
  dropout: 0.05
  epochs: 60
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.00001
  patience: 12
  evaluate_every: 1
  device: cpu
  parameter_audit: true
  expected_max_trainable_params: 100000

runtime:
  torch_threads: 4

output:
  json: tracks/ksvd/results/luyin16/ZINC_HIERARCHICAL_PATCH_RELATION_CONTEXT_COMPACT_HYBRID_V1_20260907.json
  markdown: tracks/ksvd/results/luyin16/ZINC_HIERARCHICAL_PATCH_RELATION_CONTEXT_COMPACT_HYBRID_V1_20260907.md
