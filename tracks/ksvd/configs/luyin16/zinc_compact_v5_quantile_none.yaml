# Compact-v5 multi-quantile regression — variant A: v4-none baseline guard.
#
# Objective-only v5 stage.  The compact-v4-hinge representation is FROZEN:
# every model/representation key below is byte-identical to
# `zinc_compact_v4_topology_hinge.yaml`.  The only added key is
# `model.quantile_mode: none`, which must fully degenerate to the
# compact-v4-hinge code path (scalar output + L1), verified by a
# bit-identical seed-0 validation trace against the canonical run
# 20260909-194445-182c7021.
#
# Loss: L1 (unchanged).  Params: 99,613 (unchanged).
protocol_id: luyin16-zinc-hierarchical-patch-relation-context-compact-v5-mq-none

data:
  root: data/ZINC

seed: 0

representation:
  max_typed_tokens: 8192
  minimum_typed_frequency: 1
  max_parent_tokens: 2048
  minimum_parent_frequency: 1

model:
  patch_hidden: 48
  pair_hidden: 16
  token_width: 16
  embedding_mode: hybrid
  embedding_rank: 4
  hybrid_full_typed_tokens: 768
  hybrid_full_parent_tokens: 32
  center_context: true
  center_context_hidden: 60
  graph_head_hidden_0: 64
  graph_head_hidden_1: 32
  dropout: 0.05
  epochs: 60
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.00001
  patience: 12
  evaluate_every: 1
  device: cpu
  parameter_audit: true
  # v4: global topology channel with generic hinge basis (nonlinear input).
  topology_mode: hinge
  topology_hidden_dim: 16
  topology_out_dim: 8
  topology_shuffle_test: true
  save_state_dict: true
  # v5 (objective-only): none = exact compact-v4 scalar regression head.
  quantile_mode: none
  # Budget: v4 99,613 selection (<= 105k).  none/median_only add 0 params.
  expected_max_trainable_params: 105000

runtime:
  torch_threads: 4
