protocol_id: luyin16-zinc-decomposable-conditional-statistics-v1

data:
  root: data/ZINC

representation:
  radius: 3
  wl_levels: 3
  node_role_bins: 64
  edge_role_bins: 32

xgboost:
  objective: reg:absoluteerror
  eval_metric: mae
  max_bin: 256
  n_jobs: 4
  model_seed: 0
  params:
    n_estimators: 800
    max_depth: 4
    learning_rate: 0.05
    min_child_weight: 4
    subsample: 0.8
    colsample_bytree: 0.3
    reg_lambda: 2.0
    reg_alpha: 0.02
    gamma: 4.0

tuning:
  n_folds: 3
  split_seed: 20260906
  n_trials: 20
  seed: 20260906
  ranges:
    n_estimators: [200, 1100]
    max_depth: [2, 9]
    learning_rate: [0.01, 0.20]
    min_child_weight: [1.0, 40.0]
    subsample: [0.60, 1.0]
    colsample_bytree: [0.05, 1.0]
    reg_lambda: [0.01, 200.0]
    reg_alpha: [0.00001, 30.0]
    gamma: [0.0, 8.0]

output:
  feature_cache_dir: tracks/ksvd/results/luyin16/zinc_conditional_statistics
  json: tracks/ksvd/results/luyin16/ZINC_CONDITIONAL_STATISTICS_20260906.json
  markdown: tracks/ksvd/results/luyin16/ZINC_CONDITIONAL_STATISTICS_20260906.md
