# ZINC CSSD relation projection v1 — frozen basis + access; does the relation
# side read the endpoint projection BEFORE the local representation is
# compressed?  Three arms x body seed 0, one training each (single-seed
# exploratory round).
#
# `model.stage`:
#   source-checks  : verify every reused object + the historical DICT s0 run +
#                    the dimension/bucket contracts + the per-arm init
#                    contracts (BASE reproduces the historical init
#                    bit-for-bit; C/R swap only the endpoint projection under
#                    a fork_rng private seed 20261008); CPU
#   pretrain-checks: the meaningful fit-only pre-training checks (BASE forward
#                    parity bit-exact, C(E)=P0E identity init, R=P0 bitwise
#                    copies, step-0 agreement, invariances, gradient smoke,
#                    save/reload replay, route-override wiring); CPU
#   smoke          : one 1-epoch end-to-end trajectory per arm; GPU
#   train          : one from-scratch 240-epoch training per arm x seed 0
#                    (model.arm in {BASE, SHARED_MLP, BUCKET_LINEAR});
#                    15,120 steps asserted; members 236..240 captured;
#                    estimator = their equal-weight FP32 mean
#   terminal-eval  : the ONE-SHOT frozen comparison (roster verification,
#                    full fit+dev scoring + per-row exports, the three paired
#                    contrasts R-BASE/C-BASE/R-C, group-paired bootstrap,
#                    noise bound, the alpha-mean intervention on all three
#                    soups, the route-shuffle intervention, the frozen
#                    single-seed exploratory reading)
#
# Official ZINC valid and test are never instantiated.
protocol_id: zinc-cssd-relation-projection-v1

data:
  root: data/ZINC

seed: 0

model:
  stage: source-checks
  arm: BASE
  seed: 0

runtime:
  # `cpu` for source-checks/pretrain-checks; `cuda:0` is the res-2 A100 regime
  # for smoke/train/terminal-eval. No silent CPU fallback.
  device: cpu
  torch_threads: 8
