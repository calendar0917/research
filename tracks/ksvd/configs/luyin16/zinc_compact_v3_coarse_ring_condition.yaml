# Compact-v3 stage A: coarse ring context (continuous, conditioning fusion).
#
# Single-variable experiment against Compact-Hybrid-v2 (#49613 in compact-v2
# terminology: selection 98,549 / refit 99,613): only the patch
# representation formation changes.  Every other variable (split, seed,
# optimizer, LR, scheduler=none, epochs, batch, early stopping, loss, head,
# pooling, path encoder, center-context update) is identical to compact-v2.
#
# Structural context = coarse ring signal of the centre node:
#   [in_cycle, cycle_count, min_cycle_len, max_cycle_len]
# bounded by structural_context_max_cycle_len; no ring message passing.
protocol_id: luyin16-zinc-hierarchical-patch-relation-context-compact-v3-coarse-ring-condition

data:
  root: data/ZINC

seed: 0

representation:
  max_typed_tokens: 8192
  minimum_typed_frequency: 1
  max_parent_tokens: 2048
  minimum_parent_frequency: 1
  patch_radius: 2
  context_radius: 0
  structural_context_max_cycle_len: 10

model:
  patch_hidden: 48
  pair_hidden: 16
  token_width: 16
  embedding_mode: hybrid
  embedding_rank: 4
  hybrid_full_typed_tokens: 768
  hybrid_full_parent_tokens: 32
  center_context: true
  center_context_hidden: 60
  graph_head_hidden_0: 64
  graph_head_hidden_1: 32
  dropout: 0.05
  epochs: 60
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.00001
  patience: 12
  evaluate_every: 1
  device: cpu
  parameter_audit: true
  # The compact-v2 budget is 100k; Compact-v3 accepts a documented,
  # vocabulary-driven overhead up to 110k (see notes/compact_v3).  The audit
  # fails loudly if this is exceeded.
  expected_max_trainable_params: 110000
  structural_context_mode: coarse_ring
  structural_context_fusion: condition
  structural_context_dim: 4
  structural_context_embedding_rank: 1
  structural_context_condition_rank: 8

runtime:
  torch_threads: 4

output:
  json: tracks/ksvd/results/luyin16/ZINC_COMPACT_V3_COARSE_RING_CONDITION_20260907.json
  markdown: tracks/ksvd/results/luyin16/ZINC_COMPACT_V3_COARSE_RING_CONDITION_20260907.md
