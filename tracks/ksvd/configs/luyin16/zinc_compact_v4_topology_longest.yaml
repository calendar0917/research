# Compact-v4 stage B: minimal mechanism test — longest simple cycle + cycle
# rank only (2D raw topology vector).
#
# Single-variable experiment against Compact-Hybrid-v2: only the graph-level
# topology channel is added (GlobalTopologyEncoder: Linear(2,16) -> ReLU ->
# Linear(16,8)); the unified graph representation becomes
# [z_local ; z_topology] and the single regression head consumes it.
# Every other variable (split, seed, optimizer, LR, epochs, batch, patience,
# loss, patch encoder, pooling, center-context update) is identical to
# compact-v2.
#
# Feature definition: t = [exact longest simple cycle, cycle rank].
# Permutation-invariant; computed once per molecule in preprocessing and
# cached (results/zinc_topology_cache/); standardized train-only.
protocol_id: luyin16-zinc-hierarchical-patch-relation-context-compact-v4-topology-longest

data:
  root: data/ZINC

seed: 0

representation:
  max_typed_tokens: 8192
  minimum_typed_frequency: 1
  max_parent_tokens: 2048
  minimum_parent_frequency: 1

model:
  patch_hidden: 48
  pair_hidden: 16
  token_width: 16
  embedding_mode: hybrid
  embedding_rank: 4
  hybrid_full_typed_tokens: 768
  hybrid_full_parent_tokens: 32
  center_context: true
  center_context_hidden: 60
  graph_head_hidden_0: 64
  graph_head_hidden_1: 32
  dropout: 0.05
  epochs: 60
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.00001
  patience: 12
  evaluate_every: 1
  device: cpu
  parameter_audit: true
  # v4: global topology channel (mechanism test, smallest feature set).
  topology_mode: longest
  topology_hidden_dim: 16
  topology_out_dim: 8
  topology_shuffle_test: true
  save_state_dict: true
  # Budget: v2 98,549 + head input +8 (512) + encoder Linear(2,16)+Linear(16,8)
  # (184) = 99,245 selection / 100,309 train+valid refit.
  expected_max_trainable_params: 105000

runtime:
  torch_threads: 4

output:
  json: tracks/ksvd/results/luyin16/ZINC_COMPACT_V4_TOPOLOGY_LONGEST_20260908.json
  markdown: tracks/ksvd/results/luyin16/ZINC_COMPACT_V4_TOPOLOGY_LONGEST_20260908.md
