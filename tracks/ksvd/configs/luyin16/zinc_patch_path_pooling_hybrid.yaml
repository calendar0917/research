protocol_id: luyin16-zinc-exact-patch-path-conditioned-pooling-hybrid-v1

data:
  root: data/ZINC

seed: 0

representation:
  max_typed_tokens: 8192
  minimum_typed_frequency: 1
  max_parent_tokens: 2048
  minimum_parent_frequency: 1

model:
  patch_hidden: 64
  pair_hidden: 24
  token_width: 32
  embedding_mode: hybrid
  embedding_rank: 20
  # IDs are frequency ordered; ID zero is OOV.  The top 479 exact patch
  # identities therefore use a full 32D row, while all remaining identities
  # retain their own rank-20 factorized row.  The smaller boundary keeps both
  # the validation model and the train+valid test-refit model below the
  # 239,745-parameter CIN budget.
  hybrid_full_typed_tokens: 480
  hybrid_full_parent_tokens: 32
  dropout: 0.05
  epochs: 50
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.00001
  patience: 10
  evaluate_every: 1
  device: cpu

runtime:
  torch_threads: 4

output:
  json: tracks/ksvd/results/luyin16/ZINC_PATCH_PATH_POOLING_HYBRID_20260905.json
  markdown: tracks/ksvd/results/luyin16/ZINC_PATCH_PATH_POOLING_HYBRID_20260905.md
