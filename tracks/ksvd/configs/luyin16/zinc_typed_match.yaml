protocol_id: luyin16-zinc-typed-match-xgb-v1

data:
  root: data/ZINC

representation:
  # This cache contains exact rooted typed-WL colours for every atom centre
  # at levels 0, 1, 2 and 3.  It contains no labels or fitted vocabulary.
  token_cache: tracks/ksvd/results/luyin16/zinc_motif_count/token_cache.npz
  n_prototypes: 1024
  # A match at a deeper WL level receives more weight, while lower levels
  # provide a soft backoff for unseen high-order environments.
  level_weights: [0.10, 0.20, 0.30, 0.40]

xgboost:
  objective: reg:absoluteerror
  eval_metric: mae
  max_bin: 256
  n_jobs: 4
  model_seed: 0

tuning:
  # Optuna sees only shuffled folds inside the official training split.
  n_splits: 3
  split_seed: 20260904
  n_trials: 20
  seed: 20260904
  ranges:
    n_estimators: [200, 1100]
    max_depth: [2, 9]
    learning_rate: [0.01, 0.20]
    min_child_weight: [1.0, 40.0]
    subsample: [0.60, 1.0]
    colsample_bytree: [0.10, 1.0]
    reg_lambda: [0.01, 200.0]
    reg_alpha: [0.00001, 30.0]
    gamma: [0.0, 8.0]

output:
  json: tracks/ksvd/results/luyin16/ZINC_TYPED_MATCH_20260904.json
  markdown: tracks/ksvd/results/luyin16/ZINC_TYPED_MATCH_20260904.md
