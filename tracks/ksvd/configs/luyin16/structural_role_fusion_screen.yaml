protocol_id: luyin16-molhiv-clean-structural-role-fusion-v1

data:
  dataset: ogbg-molhiv
  root: data/ogb
  frozen_features: tracks/ksvd/results/luyin16/mentor_r2_atom_chem_k64_s8_all_official_valid/feature_views_train_valid.npz
  scaffold_folds: tracks/ksvd/results/molhiv/molhiv_n41127_scaffold_folds3_seed20260726.npz

representation:
  radius: 2
  schemas: [coarse, rooted_wl]
  degree_bins: 8
  wl_rounds: 2
  node_role_bins: 64
  edge_role_bins: 32
  typed_edge_bins: 256
  max_centers_per_graph: null

# Exact rooted topology is used only for this label-free capacity/coverage
# audit.  It does not enter the supervised feature matrix.
exact_audit:
  max_train_graphs: 64
  max_valid_graphs: 64
  seed: 20260903

audit:
  n_graphs: 32
  permutations_per_graph: 2
  seed: 20260904
  tolerance: 1.0e-6

screen:
  max_train_graphs_per_fold: 3000
  max_valid_graphs_per_fold: 1500
  seed: 20260902
  shuffle_repeats: 2
  minimum_delta: 0.003
  minimum_fold_wins: 2

classifier:
  n_estimators: 140
  max_depth: 4
  learning_rate: 0.05
  min_child_weight: 8
  subsample: 0.85
  colsample_bytree: 0.80
  reg_lambda: 10.0
  reg_alpha: 0.01
  n_jobs: -1
  model_seeds: [0]

output_json: tracks/ksvd/results/luyin16/structural_role_fusion_screen/summary.json
output_markdown: tracks/ksvd/results/luyin16/structural_role_fusion_screen/summary.md
