# Compact-v4 stage A: sanity/reproduction — topology channel disabled.
# This config is bit-parameter-identical to Compact-Hybrid-v2
# (zinc_hierarchical_patch_relation_context_compact_hybrid_v2_budget_reallocation.yaml)
# plus an explicit `topology_mode: none`.  It exists so the v4 code path can
# be audited against the v2 baseline without touching the historical v2
# config, and to serve as the in-v4-family "no topology" control.
#
# Single-variable principle: only the explicit topology_mode=none key is
# added; every other variable (split, seed, optimizer, LR, epochs, batch,
# patience, loss, head, pooling, patch encoder, center-context update) is
# identical to compact-v2.
protocol_id: luyin16-zinc-hierarchical-patch-relation-context-compact-v4-topology-none

data:
  root: data/ZINC

seed: 0

representation:
  max_typed_tokens: 8192
  minimum_typed_frequency: 1
  max_parent_tokens: 2048
  minimum_parent_frequency: 1

model:
  patch_hidden: 48
  pair_hidden: 16
  token_width: 16
  embedding_mode: hybrid
  embedding_rank: 4
  hybrid_full_typed_tokens: 768
  hybrid_full_parent_tokens: 32
  center_context: true
  center_context_hidden: 60
  graph_head_hidden_0: 64
  graph_head_hidden_1: 32
  dropout: 0.05
  epochs: 60
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.00001
  patience: 12
  evaluate_every: 1
  device: cpu
  parameter_audit: true
  # v4: global topology channel disabled -> exact compact-v2 architecture.
  topology_mode: none
  expected_max_trainable_params: 100000

runtime:
  torch_threads: 4

output:
  json: tracks/ksvd/results/luyin16/ZINC_COMPACT_V4_TOPOLOGY_NONE_20260908.json
  markdown: tracks/ksvd/results/luyin16/ZINC_COMPACT_V4_TOPOLOGY_NONE_20260908.md
