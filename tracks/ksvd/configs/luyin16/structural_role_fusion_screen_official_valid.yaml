protocol_id: luyin16-molhiv-clean-structural-role-fusion-v1-official-valid

data:
  dataset: ogbg-molhiv
  root: data/ogb
  frozen_features: tracks/ksvd/results/luyin16/mentor_r2_atom_chem_k64_s8_all_official_valid/feature_views_train_valid.npz
  scaffold_folds: tracks/ksvd/results/molhiv/molhiv_n41127_scaffold_folds3_seed20260726.npz

# Frozen after the official-train scaffold screen.  Coarse roles and the
# high-order typed-edge candidate are not used for model selection here;
# f_raw remains in the table only to preserve its registered no-go ablation.
representation:
  radius: 2
  schemas: [rooted_wl]
  degree_bins: 8
  wl_rounds: 2
  node_role_bins: 64
  edge_role_bins: 32
  typed_edge_bins: 256
  max_centers_per_graph: null

exact_audit:
  max_train_graphs: 64
  max_valid_graphs: 64
  seed: 20260903

audit:
  n_graphs: 32
  permutations_per_graph: 2
  seed: 20260904
  tolerance: 1.0e-6

screen:
  split: official_valid
  max_train_graphs_per_fold: null
  max_valid_graphs_per_fold: null
  seed: 20260902
  shuffle_repeats: 2
  minimum_delta: 0.003
  minimum_fold_wins: 1
  score_views:
    - a_strict
    - t
    - t_a
    - f_raw_factorized
    - f_raw
    - f_centered
    - mixed_s
    - mixed_s_f_raw_factorized
    - mixed_s_f_raw
    - mixed_s_f_centered
    - f_raw_factorized_shuffled_0
    - f_raw_factorized_shuffled_1
    - f_raw_shuffled_0
    - f_raw_shuffled_1
    - f_centered_shuffled_0
    - f_centered_shuffled_1

classifier:
  n_estimators: 140
  max_depth: 4
  learning_rate: 0.05
  min_child_weight: 8
  subsample: 0.85
  colsample_bytree: 0.80
  reg_lambda: 10.0
  reg_alpha: 0.01
  n_jobs: -1
  model_seeds: [0, 1, 2]

output_json: tracks/ksvd/results/luyin16/structural_role_fusion_screen_official_valid/summary.json
output_markdown: tracks/ksvd/results/luyin16/structural_role_fusion_screen_official_valid/summary.md
