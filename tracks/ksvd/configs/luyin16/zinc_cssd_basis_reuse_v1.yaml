# ZINC CSSD basis reuse v1 — frozen source-domain basis on a molecule-size gap.
#
# `model.stage`:
#   build-objects : domain fold (n_nodes threshold + canonical-SMILES group-hash
#                   rules) + T_fit-refit targets/payload/kappa_M/prep (CPU)
#   cssd-refit    : one CSSD basis refit (model.arm = SOURCE on S_fit |
#                   TARGET on T_fit; CPU, last-5 average, equal counts)
#   train-q       : one shared Q(topology25) head on T_fit only (CPU)
#   checks        : focused pre-training correctness checks (CPU)
#   smoke         : short GPU plumbing smoke on real T_fit batches (both arms)
#   train         : one 240-epoch body run (model.arm, model.seed in {0,1})
#   terminal-eval : the one-shot terminal stage (roster -> coverage -> the
#                   unique alpha-mean dictionary intervention -> T_eval ->
#                   group-paired bootstrap -> frozen A-F decision rules)
#
# The canonical-SMILES table (results/zinc_cssd_basis_reuse_v1/
# train_canonical_smiles.npz) is committed once locally via the module CLI
# (--write-smiles-table, reads the untracked sidecar cache); every stage
# here reads only the committed file.
#
# Official ZINC valid and test are never instantiated.
protocol_id: zinc-cssd-basis-reuse-v1

data:
  root: data/ZINC

seed: 0

model:
  arm: SOURCE
  stage: checks
  seed: 0
  epochs: 240
  # max_steps: null (full budget)
  check_graphs: 24
  smoke_batches: 4

runtime:
  # `cpu` for stage-0 builds/cssd refits/checks (CPU-faithful to the design
  # basis); `cuda:0` is the res-2 A100 regime for smoke/train/terminal-eval.
  # No silent CPU fallback: a cuda request on a CPU-only host raises.
  device: cpu
  torch_threads: 8
