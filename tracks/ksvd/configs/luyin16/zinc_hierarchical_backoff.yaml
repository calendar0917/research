protocol_id: luyin16-zinc-hierarchical-exact-token-backoff-v1

data:
  root: data/ZINC

representation:
  radius: 3
  wl_rounds: 3
  top_k: 2048
  # Generated by zinc_motif_count.py; it contains exact collision-audited
  # rooted-WL token rows and no labels or fitted vocabulary.
  token_cache: tracks/ksvd/results/luyin16/zinc_motif_count/token_cache.npz

xgboost:
  objective: reg:absoluteerror
  eval_metric: mae
  max_bin: 256
  n_jobs: 4
  model_seed: 0
  # The selected S+WL-count parameters from the preceding one-protocol
  # Optuna search are held fixed to isolate the representation change.
  params:
    n_estimators: 702
    max_depth: 7
    learning_rate: 0.08977383711827747
    min_child_weight: 10.122255408719656
    subsample: 0.7030255021618793
    colsample_bytree: 0.31029222493719305
    reg_lambda: 16.104336408719343
    reg_alpha: 0.00011965234786526724
    gamma: 4.352377380966574

tuning:
  # Only official-train rows are used here.  The wider column-sampling range
  # is intentional because hierarchical backoff has 41k columns rather than
  # the 16k columns of the preceding baseline.
  n_splits: 3
  split_seed: 20260904
  n_trials: 20
  seed: 20260904
  ranges:
    n_estimators: [200, 1000]
    max_depth: [2, 9]
    learning_rate: [0.01, 0.20]
    min_child_weight: [1.0, 40.0]
    subsample: [0.60, 1.0]
    colsample_bytree: [0.10, 1.0]
    reg_lambda: [0.01, 200.0]
    reg_alpha: [0.00001, 30.0]
    gamma: [0.0, 8.0]

output:
  json: tracks/ksvd/results/luyin16/ZINC_HIERARCHICAL_BACKOFF_20260904.json
  markdown: tracks/ksvd/results/luyin16/ZINC_HIERARCHICAL_BACKOFF_20260904.md
