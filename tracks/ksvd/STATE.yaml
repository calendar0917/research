  - decision-fec-d0-stop-no-subrole-signal-20260923: >-
      FEC-D0 (2026-09-23, local CPU, protocol fec_d0, commit ca2e947,
      LABEL-FREE, official valid/test never loaded, targets never read, no
      FEC-S1 retrain, no task coupling) is the first round to RESIDUALIZE the
      coarse rooted role before asking whether the remainder is a reusable
      sparse vocabulary.  Basis = audited FSAR explicit rooted node basis b^V
      in R^11 (fsar_v2._explicit_basis_for_patch, pure topology); exact shell
      coordinates {0,1,2,3} deleted; FIT-only per-shell standardization ->
      phi^perp in R^7; one shared K=16 / s=4 dictionary (SDB/TCCD K-SVD + OMP),
      matched random dictionary and FIT-only PCA-4 reference; 8000/2000
      train-internal split (SPLIT_SEED 20260922).  Gate 0 passed 7/7; the
      learned dictionary reconstructs almost exactly (R_rec 0.0038 <= 0.80)
      and is maximally reused (16/16 active both splits, Jaccard 1.000,
      Spearman 1.000, 16 atoms on >=20 held-out molecules), but BOTH are
      structural artefacts: after residualization the FIT residual rank is 2
      (shell 0) to 4 (shells 1-2), two kept coordinates (neigh_by_shell[0],
      walk1) being exactly shell-deterministic, so K=16 is massively
      overcomplete and the s=4 code is a linear reparametrisation of the dense
      residual (F1_D == F1_O exactly).  The decisive Gate-2b failure is that
      the DENSE root-relative basis carries no held-out untyped marked-node
      rooted topology signal beyond a within-shell degree baseline: aggregate
      G_O 0.0244 < 0.03 (shell0 0.0177, shell1 0.0537, shell2 0.0055) and the
      learned dictionary is not better than a matched random dictionary
      (F1_D - F1_R -0.0008).  Gate 3 (report-only) shows MI(atom->degree)
      0.357 with every atom spanning only 3-4 degree buckets, so the object is
      primarily a discretized degree representation.  Frozen verdict
      FEC_D0_BASIS_HAS_NO_HELDOUT_SUBROLE_SIGNAL; deficiency localized to the
      BASIS (root-relative, degree-dominated), not the dictionary.  Decision:
      STOP, no FEC-D1, no sweep/rescue, no property run, no official test.  See
      notes/fec_d0_prior_artifact_audit.md, notes/fec_d0_preregistration.md,
      notes/fec_d0_analysis.md, results/fec_d0/,
      claim-fec-d0-basis-no-heldout-subrole-signal-20260923,
      decision-fec-d0-stop-no-subrole-signal-20260923.
  - decision-fec-s0-local-factorization-blocked-20260923: >-
