  - "decision-sbci-fit-generalization-triage-inconclusive-20261007: Decision Case C - FIT_GENERALIZATION_TRIAGE_INCONCLUSIVE. Zero-training triage of the final compact-v4-SBCI NO-GO using only the frozen N3600/I0/T0 baseline and SBCI checkpoints; no gradient updates; official valid/test never loaded. Protocol index-identical and init-exact (16/16 checks, 20 shared tensors max_abs_diff 0.0). Fit deficits are small but sign-conflicting: dF_raw -0.001938 (SBCI better), dF_soup +0.004554 (SBCI worse, CI excludes 0), dF_min +0.003042, dF_late -0.000952. Neither Case A (>= +0.008 fit loss) nor Case B (|dF| <= 0.003 and selected deficits <= +0.003) holds, so no next architecture family is authorized: no Shared Structural Operator Dictionary, no Direct Shared Structural Potentials, no SBCI rescue, no seed1/N7200/N1800, no official valid/test. The literal OLS convergence slope is noise (bootstrap CI includes 0) and SBCI best-so-far had plateaued; the strict literal reading (OPTIMIZATION_AMBIGUOUS) also authorizes no architecture and is recorded explicitly. Outputs: results/sbci_fit_generalization_triage/ + notes/sbci_fit_generalization_triage.md + tests/test_sbci_fit_generalization_triage.py (18 pass). Revisit_if: a larger fit measurement (>1 seed/N pair) or a pre-registered noise-robust convergence statistic resolving the RAW-vs-SOUP sign conflict."
  - "decision-compact-v4-sbci-nogo-20261007: Decision Case A - SBCI MINIMAL SHARED-BASIS FACTORIZATION NO-GO. Run exactly one pre-registered SBCI_N3600_I0T0 ticket (strict function-class restriction replacing the free compact-v4 relation/centre family with a shared K=16 basis + factorised relation-only product; 62,045 <= 82,115 params; 25/25 Stage-0 gates; exact shared init; exact pair factorisation, endpoint symmetry, empty-bucket zeros, permutation invariance). Result: SOUP probe 0.182924 vs reused baseline 0.176633, delta_SE -0.006291 (RAW -0.006215, DDR -0.128), paired SOUP 95% CI [-0.012760,-0.000176] -> clean negative NO-GO. Do NOT buy seed1, do NOT run N7200, do NOT run N1800/seed2/seed3, do NOT rescue with K/width/aggregation/relation-form/head changes; official valid and official test never loaded. Rejected: buying seed1 on a negative delta, running N7200 without a replicated low-data GO, K sweep, attention/softmax/LayerNorm/dropout in SBCI modules, residual q/centre bypass, task-specific global features, HPO/architecture sweep. Outputs: results/compact_v4_sbci/ + notes/compact_v4_sbci_sample_efficiency.md + tests/test_compact_v4_sbci.py (12 pass). Revisit_if: a genuinely different pre-registered function-class hypothesis with its own frozen witness and matched controls."
  - "decision-sample-efficiency-gain-localization-caseH-20261006: Decision Case H - SAMPLE-EFFICIENCY GAIN LOCALIZATION INCONCLUSIVE. Zero-new-training audit; exactly six frozen SOUP states + RAW anchors; official valid/test never loaded. No target-independent support family (token / relation-context / whole-molecule NN density) passes the full pre-registered strong gate in both doublings: token shows the strongest partial signal (quartile contrast +0.0276/+0.0336, CI lower > 0, size-adjusted beta1 > 0 in both) but fails the continuous Spearman gate (rho ~0.061 < +0.15) -> NON-ROBUST ASSOCIATION; neighbour density's size-adjusted beta CI crosses zero -> SIZE-CONFOUNDED; relation passes only 36->72 -> REGIME-SPECIFIC. The primary typed-endpoint WELL_COVERED stress test is underpowered (n=1), so Case E is not claimable; the pre-registered secondary coarser-key diagnostic is powered (n=361, R 0.722/0.603) and is a Case E candidate only. JSON top1_sample_efficiency_mechanism.json: authorized_for_design=false, full_training_authorized=false. Rejected: authorizing any architecture, loosening the primary unseen definition, treating the secondary key as authoritative, reopening old structural NO-GOs, official valid/test access, new training/HPO/EMA/SWA/external comparison. Outputs: results/sample_efficiency_gain_localization/ + notes/sample_efficiency_gain_localization_audit.md (30 sections) + tests/test_sample_efficiency_gain_localization_audit.py (17 pass). Revisit_if: a larger probe or a pre-registered coarser primary relation key makes the primary WELL_COVERED test powered (n>=200)."
  - "decision-top5-checkpoint-aggregation-stabilization-20260912: Decision Case D - CHECKPOINT AGGREGATION STABILIZATION SUPPORTED; primary TOP-5 WEIGHT-SOUP STABILIZATION SIGNAL. Fixed K=5 equal-weight soup of the five lowest-800-MAE checkpoints (I0T0 232/215/223/219/228; I1T1 173/197/183/170/195) improves official valid over raw in both runs (delta +0.004171 / +0.004934, mean +0.004552 >= +0.0015; two-run paired bootstrap 95% CI [+0.002667,+0.006456] lower > 0); ensemble mechanism also passes (+0.004178 / +0.005147, mean +0.004663 >= +0.002). Soup stays a single 82,115-param model (0 buffers, strict load, ~1x forward), retains essentially all ensemble benefit (rho 0.976; ensemble-vs-soup CI includes 0), but does not reduce the two-run point spread (secondary). Authorized: checkpoint_weight_averaging_protocol_design. Rejected: K tuning, diversity/spacing selection, prediction median, greedy/weighted soup, using the development-reuse 2000 probe to change rules, treating official valid as pristine holdout, EMA/SWA, official test access. Outputs: results/top5_checkpoint_aggregation_stabilization/ + notes/top5_checkpoint_aggregation_stabilization.md + tests/test_top5_checkpoint_aggregation_stabilization.py (20 pass)."
  - "decision-compact-v4-smallhead-e2e-replicated-non-inferior-20260912: END-TO-END SMALL-HEAD COMPRESSION - REPLICATED NON-INFERIOR WITH FAVOURABLE POINT ESTIMATES (Decision Case D). Replacing the 21,633-param graph head with the fixed 4,135-param raw small head (82,115 total, -17,498) is validation-non-inferior on both seeds (D0 -0.001086, D1 -0.011273, mean -0.006180 <= +0.0015). Budget honoured: baseline reused, seed1 bought only after seed0 passed, seed2/3 forbidden, released params unused, official test never loaded. The ~82.1K compact-v4-smallhead is a new compact baseline candidate; it is NOT a small-head performance GO (two seeds only). Rejected: buy seed1 early, seed2/3, reallocating the freed params, using frozen-head refit as the result, opening official test, any head width/normalisation/dropout/warm-start rescue. Outputs: results/compact_v4_smallhead_e2e/ + notes/compact_v4_smallhead_e2e_compression.md + tests/test_compact_v4_smallhead_e2e.py (15 pass)."
  - "decision-parameter-allocation-representation-leverage-caseC-20260912: COMPRESSION-ONLY OPPORTUNITY (mandate Case C). Analysis-only / zero-full-backbone-training audit of the optimized compact-v4 checkpoints: graph head H-STRONG donor (small raw head improves valid on both seeds, removes 17,498 params), identity lookup L-NO (already frequency-adaptive; no positive SVD saving), no R-SUPPORTED representation-forming recipient. No budget-reallocation performance architecture and no next full-training run authorized; do NOT reopen P1/P2/cell/covariance/triad as the recipient, do NOT prune rare tokens, do NOT spend freed params on the pair/centre encoder. Rejected: head-shrink+pair-reallocate architecture, higher-order persistence recipient, lookup donor / rare-token pruning, patch_encoder R-SUPPORTED on low activation rank, official test access. Outputs: results/parameter_allocation_representation_leverage/ + notes/parameter_allocation_representation_leverage.md + tests/test_parameter_allocation_representation_leverage.py (15 pass)."
  - "decision-compact-v4-cell-minimal-falsification-nogo-20260921: Decision Case A - CELL REPRESENTATION NO-GO. Single authorised representation-family run (compact-v4-cell: explicit persistent induced-cycle cells d_cell=48, exactly T=2 pre-registered incidence rounds, R 302->399, 113,069 params, topology hinge preserved). TRUE seed0 valid 0.147462 vs optimized-v4 seed0 0.146420 -> delta_arch0 -0.001042 << +0.004 gate. Branch alive (zero-summary max|delta| 1.954); baseline pathway bit-identical (G0.1 0.0); 11/11 integrity gates pass; common-input bulk safe (+0.00176 <= +0.002). BROKEN control NOT purchased, seed1 NOT run, official test NEVER loaded. Do NOT rescue by width/depth/rounds/attention/statistics. Outputs: results/compact_v4_cell/ + notes/compact_v4_cell_minimal_falsification.md + tests/test_compact_v4_cell.py (21 pass)."
  - "decision-optimized-manifold-broad-state-inconclusive-20260919: INCONCLUSIVE - DO NOT BUILD OPTIMIZED OOF (mandate Case C). Broad frozen-state screen on the two existing optimized compact-v4-hinge checkpoints (no training). Init-0 delta_state seed0 +0.000370 / seed1 +0.001150 (mean +0.00076 -> BORDERLINE); second init +0.000179 / -0.000513 (sign flip); combined +0.00030 <= +0.0005. Gate 0 clean and state branch alive, so valid diagnostic. Rejected: optimized OOF backbones, two-fold OOF pilot, optimized endpoint/covariance/triad revalidation, wholesale rejection of historical NO-GOs, model/tokenizer/topology/loss/head changes, official test access. Consequence: bottleneck map historical NO-GO + optimized INCONCLUSIVE (no OOF); next move is paradigm-level (representation family / structural-computation redesign), not another missing-local-statistic probe. Revisit_if: a pre-registered genuinely different broad state reader class or a paradigm-level representation/compute-graph change."
  - "decision-optimized-baseline-critical-revalidation-20260918: exactly 2 new seed0 full-training runs against the optimized compact-v4-hinge baseline. Part A TOPOLOGY STRONGLY SURVIVES (A-STRONG; delta_topo +0.019846 >= +0.006, > historical +0.014093) -> KEEP TOPOLOGY AS CORE ARCHITECTURE, seed1 not purchased. Part B CORRECTED-TOKEN CLEAR NO-GO (corrected 0.150849 vs historical-token optimized 0.146420, worse by +0.004429 >= +0.004) -> PERFORMANCE/CORRECTNESS TRADEOFF REMAINS; keep historical aliased representation for the performance model (accurate terminology: historical aliased rooted-topology token, never 'exact typed patch token'), retain corrected tokenizer as the correct method; seed1 not purchased. Official test never loaded. Rejected: optimized-v2 seed1, corrected seed1, seed2/3, rerunning the full historical experiment set, auto-extending the horizon to 400, touching official test / building optimized OOF / rebaselining 277k now. Non-rerun: radius-3, local ring conditioning, v5 quantile, v6 factorization, endpoint association, centre covariance, triadic binding, FM, head-family, 277k. Next: cheap broad optimized-manifold frozen-state diagnostic (existing optimized-v4 seed0 checkpoint) before expensive optimized OOF models / 277k rebaseline / new architecture design."
  - "decision-compact-v4-training-sufficiency-20260917: Case A HISTORICAL UNDERTRAINING CONFIRMED. The 60-epoch canonical protocol under-trained compact-v4-hinge; longer single-stage training (240 ep, patience 40, unchanged Adam lr 1e-3 / batch 128 / wd 1e-5) absorbs and exceeds the continuation anchor. Replication gates pass (seed0 +0.023645, seed1 +0.013834, mean +0.018740); seeds 2/3 +0.022694/+0.028826; frozen test +0.011706 (4/4). Rejected: OPTIMIZATION-REGIME SWITCH GO (batch512/wd0 both hurt), two-stage full-model protocol, SMALL-IMPROVEMENT/NO-GO, scheduler sweep (best epoch not horizon-pinned), and treating prior NO-GO audits as invalidated (representation drift 0.314 L2 / 0.950 cosine is descriptive only). New baseline: optimized compact-v4-hinge valid 0.147201+/-0.003697, test 0.125179+/-0.003374; all future architecture claims compare against this."
  - "decision-graph-head-function-family-inconclusive-20260915: INCONCLUSIVE (Case E) for the explicit low-rank cross-coordinate interaction head on frozen compact-v4. Stage 1 (backbone seed 0) hit the pre-registered EFFICIENCY ADVANCE (mean delta_small=+0.003374, 4/5 folds; FM 0.172165 vs H1 0.175539 vs H2 0.170051 vs H0 0.175809), so the second backbone seed was spent. Stage 2 (seed 1) did NOT replicate (mean delta_small=+0.000417, only 2/5; FM 0.175931 vs H1 0.176349 vs H2 0.170508 vs H0 0.174253). Pooled delta_small=+0.001896 < +0.0025, fold-averaged 3/5 positive, paired bootstrap 95% CI lower bound negative in both stages -> final frozen GO fails on 3/5 criteria. Interaction is alive (V=0 raises MAE +0.1144, 5/5; std(interaction)/std(linear)=0.489). CatBoost unavailable. Rejected: single-backbone efficiency GO, clean NO-GO label, Stage-1b init, rank 8/16/learned, DeepFM/field-aware FM/CrossNet/polynomial/bilinear, MLP+FM hybrid, end-to-end FM replacement, XGBoost re-sweep, environment change for a secondary tree control. compact-v4 unchanged. Revisit_if: a different pre-registered downstream-function-family hypothesis with its own frozen witness and matched controls, or a paradigm-level representation-family / objective-aligned structured-computation stage; if a tree reference is wanted, install CatBoost under its own pre-registered MAE preset and split."
  - "decision-centre-incidence-cooccurrence-witness-nogo-20260912: NO-GO within-centre cross-channel relation co-occurrence (Case B — centre marginal re-access only — plus Case-C evidence). Stage 0 v4 export (Gate 0 all-pass 37/37 on 5/5) + Stage 1 frozen OOF seed 0 x 5 folds x 1 init: covariance witness worse than the matched marginal control (delta_M -0.001361, CI [-0.00569,+0.00279], P(>0)=0.27, 2/5 folds; worse on selection 5/5 and on common-input bulk max +0.0077 > 0.002) and worse than the historical R-only head (delta_R_hist -0.011056, 0/5); delta_R vs the matched-budget R-only head +0.000922, CI straddling zero, below the clear-NO-GO line. Target-free ambiguity real but mild-moderate (normalized conditional Var(c|16-NN m) = 0.285) -> the discarded statistic exists but is not task-relevant. Depth confound measured (+0.01198 for the extra layer) and shown not to affect the depth-matched E-vs-B2 test. Rejected: covariance/joint-relation/centre-incidence architecture, full covariance, larger/learned projection, attention over relations, DeepSets centre encoder, second centre update, relation-set Transformer, second backbone seed, Stage-1b init, channel-shuffle surrogate (trigger unmet), any further 'missing statistic along the compute graph' probe. compact-v4-hinge unchanged. Revisit_if: a new pre-registered witness for a different discarded quantity with its own hard Gate 0 AND matched control, or a paradigm-level re-posing (information accessibility / learnable parameterization / one-shot centre update as a function-class hypothesis)."
  - "decision-pair-endpoint-association-witness-nogo-20260911: NO-GO off-diagonal endpoint cross-coordinate association (Case C). Stage 0 v3 export (Gate 0 all-pass) + Stage 1 frozen OOF seed 0 x 5 folds x 1 init: endpoint witness worse than R-only (delta_R -0.006994, CI [-0.01039,-0.00359], 0/5) and worse than the diagonal control (delta_diag -0.002741, 0/5); bulk unsafe (+0.0050 mean, +0.0112 max). Representation ambiguity only mild-moderate. Rejected: second backbone seed, Stage-1b init, learned projection, rank sweep, full 120D outer product, attention/triplet, low-rank symmetric bilinear pair encoder. compact-v4-hinge unchanged. Revisit_if: a pre-registered task-relevant witness for a different discarded quantity, or an upstream computation-graph object (centre-incidence compression / one-shot centre update / higher-order interaction) with its own witness first."
  - "decision-frozen-readout-sufficiency-nogo-20260910: NO-GO cheap post-state readout extension. After Gate-0 export repair (all pass) Stage 1 is a pre-registered CLEAR NO-GO (mean delta0 +0.00087 < +0.001; mean delta_R -0.00179 <= +0.001; set better than R-only in only 2/5 folds), so the second frozen backbone seed was NOT spent. Rejected: second backbone seed, Stage 1b extra init, B2 joint-structure control, any pooling-family rescue. compact-v4-hinge unchanged. Revisit_if: a different cheap frozen-state parameterization with its own pre-declared gates, or a task-relevant witness diagnostic for endpoint/centre-incidence structure."
  - "decision-compact-v6-attribute-branch-viability-nogo-20260910: CLOSE topology-attribute factorization permanently (Outcome 2: branch repaired, architecture NO-GO). Root cause verified (zero-init fusion blocks the whole attribute branch at step 0; collapse at the encoder MLP), and the minimal repair (ONLY fusion init zero->normal(0.01)) makes the branch demonstrably active over 100 steps (V1-V4 pass), but the canonical seed-0 run re-collapses and shows no gain (valid 0.170209 vs v4 0.170066, delta -0.000143 < +0.003; Q1/Q2 degradation +0.023831 > +0.002; role shuffle ~1.2e-7). Rejected: continue to seed 1 / 4 seeds, tune the repair, count-only composition, Q5-tail-only GO. seed1 not run. Revisit_if: only a fundamentally different architecture stage with its own pre-registered graph-side-observable gate and fresh sweep; the prior fix-the-zero-init revisit is discharged."
  - "decision-compact-v6-topology-attribute-factorization-nogo-20260910: NO-GO topology-attribute factorization (Case D at benchmark gate). Keep compact-v4-hinge; close the v6 attribute branch. Because: paired multi-seed mean -0.000295 (<0.003, 2/3), seed0 +0.013645 does not replicate; seed0 gain is a tail-for-bulk trade (Q1/Q2 -0.017265 bulk gate FAIL) reproducing the corrected-tokenizer fingerprint; frozen seed0 factorized model is EXACTLY shuffle-invariant (clean==shuffled, e_attribute collapsed norm std 2.3e-10); count-only no gain (mean -0.002243); seed0 capacity-control +0.007491. Rejected: factorization GO, count-only composition, extra encoder capacity, wider role descriptor. Revisit_if: (1) branch-collapse (zero-init fusion -> upstream dead gradient at step0 + weight decay) is diagnosed and fixed and re-registered with a graph-side-observable gate and a fresh seed sweep; (2) a fundamentally different (multiplicative structure x attribute, from scratch) attribute channel is a new stage; (3) the coarse-token basis changes; (4) a benchmark where easy-bulk/hard-tail trade is not dominant."
  - "decision-baseline-difficulty-typed-refinement-20260910: Case D — UNEXPLAINED REDISTRIBUTION. NO architecture GO. The corrected-vs-historical harm/benefit is a stable difficulty-locked CENTRE (bias) shift, NOT variance-regularisation (Case A fails: easy ensemble degrades, centre>spread) and NOT typed-refinement informativeness (Cases B/C fail: partial -0.036, 7/7 metrics null-to-anti-predictive, hard+low-info gains more than hard+high-info). STOP the tokenizer-derived architecture branch (no coarse-to-fine, no coarse prior, no adaptive gate). Reopen only via a pre-registered graph-side-observable gate or a non-exact-identity tokenizer change."
  - "decision-corrected-token-fragmentation-mixed-20260910: Case D — MIXED MECHANISM. The corrected-vs-historical v4 degradation is not directed by token fragmentation (unconditional |Spearman| <= 0.06), is dominated by a baseline-difficulty redistribution (-0.352), and only a weak non-specific newly-rare signal survives conditioning. No architecture GO: do NOT open coarse-shared + exact-residual / coarse-to-fine / shared-low-rank on this evidence. Single next stage = diagnose the baseline-difficulty redistribution (diagnostic only)."
  - "decision-typed-tokenizer-correctness-repair-20260910: Case C — correctness fix reveals accidental sharing benefit. Corrected tokenizer (`typed_tokenizer_v2_corrected`) becomes the default semantically-correct exact-token method; historical certificate tokenizer retained as historical benchmark baseline; do NOT roll back correctness. Next stage = corrected-tokenizer residual/rarity re-audit; shared-base + exact-residual is a hypothesis only (do not implement)."
  - "decision-compositional-patch-sharing-nogo-20260910: NO-GO compositional patch sharing (Case E) — all five frozen-inference sharing variants regress on validation (0/4 seeds), KNN8 not better than frequent-mean/random-donor controls, unaffected bit-identical; do NOT open shared-base+exact-residual / OOV fallback / frequency gate / KSVD / subword routes; single next step is a tokenizer correctness fix (the frozen typed certificate is not injective: 730/6784 tokens mix root atoms), re-registered separately"
  - "decision-compact-v5-multi-quantile-nogo-20260910: NO-GO multi-quantile as a benchmark improvement (Stage-1 seed0 Case A did not reproduce; 4-seed Mild/Mild: point +0.0037 3/4, width 0.211 4/4; one-time test -0.0025 1/4); do NOT open uncertainty-guided weighting (width-GO precondition unmet); re-register/close the quantile route on OOF-train"
  - "decision-oof-difficulty-heteroscedasticity-go-20260910: GO difficulty (cross-fitted OOF Spearman 0.374 >= 0.25, 5/5) + GO epistemic (disagreement 0.393 >= 0.30, 5/5) on official-train OOF residual — remaining error is predictive difficulty/heteroscedastic variance on rarity + disagreement + low-y axes; confirms (train-side, true OOF) the valid-only NO CLEAR SECONDARY SIGNAL; no structural v5 channel; any future change must clear gates on this OOF set"
  - "decision-post-v4-residual-audit-no-secondary-signal-20260909: NO CLEAR SECONDARY SIGNAL — no v5 representation channel; revisit only via OOF-train-tested >=0.003 corrections or an opened objective/calibration study"
  - "decision-d5bf08b3: GO compact-v4-hinge under primary benchmark protocol (selection-checkpoint test, +0.0092 mean paired, 4/4 seeds); next = post-v4 residual audit; seed-0 refit regression is secondary-robustness evidence only"
  - "decision-0a35c7a0: wrap, don't rewrite (strangler runner; revisit if architecture tests demand more)"
  - "decision-compact-v3-context-conditioning-nogo-20260908: first version of ring-context conditioning NO-GO on valid (coarse +0.0021 / typed +0.0125 / concat +0.0171); revisit with capacity-neutral mechanisms"

