      TASK_LINK true for seed1 only, marginally). Interpretation: contextual
      states EXIST and are context-input-dependent, but contextual computation
      is NOT the bottleneck (93-96% of the recurrent shift is locally
      predictable; the context-only increment is 1-4% of the shift and has no
      consistent task link). This deprioritises further local / pair /
      topology-cross dictionary designs as a way to recover the recurrent
      advantage; at most it authorizes ONE bounded preregistered test of a
      strictly-local two-update compiler, with a low ceiling. No seed 2, no
      sweep, no new architecture, no official test. See
      notes/zinc_contextualization_gap_audit_v0_preregistration.md,
