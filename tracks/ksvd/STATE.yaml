  - decision-zinc-static-dict-pair-kernel-v0-stop-after-seed0-20260922: "SDPK-v0 (2026-09-22, prereg+impl commit f0a778d; remote A100-SXM4-40GB GPU0; official test never loaded): promoted the learnable dictionary from a bypassable local residual adapter to the core coordinate of the occurrence-level static pair kernel under the strict-static contract (h_i = h0_i, no residual, no gamma; K=64/rank=32/coord_dim=16/tau_init=0.20; c_i = U(softmax(Wq(h_i) D^T / tau)); dictionary pair coordinates feed m_ij = 1 + tanh(Wm([c_i+c_j, |c_i-c_j|, c_i*c_j, rel_ij])) modulating raw_prod * distance_gate; single 112D pair encoder 112->64->16; 74,996 params; shared tensors bit-identical to S0, only the pair encoder input widened 64->112). One seed-0 full run of 240 epochs (no early stop): best official-valid MAE 0.14219318306347123 @209, Top-5 soup 0.13973486851429334 (members [165,180,186,196,209]); reference strict-static S0 seed0 best 0.145674 / soup 0.140794 -> best improvement +0.003480816936528769, soup improvement +0.0010591314857066603, both below the gates (soup <=0.1328 and delta >=0.008; best delta >=0.006) -> SDPK_V0_NO_STRONG_PERFORMANCE_SIGNAL; seed 1 NOT purchased. The dictionary is live and used (tau 0.20 -> 0.1498, 43 argmax-used atoms, effective atoms 9.49, top-8 mass 0.824, neutral-dictionary intervention mean/max |delta pred| 0.0591/1.7789 and graph-mean-coordinate 0.0517/1.2775), unlike the previous residual dictionary's 1e-5-scale ablation, so the failure is 'used dictionary-conditioned pair kernel still does not add absolute signal', not inertness. Strict-static hard gates all pass; baseline guard replayed the S0 checkpoint to 3.3e-7; 1 full run; GPU wall 888.1 s; elapsed 902 s; peak GPU 174.3 MB; official test never loaded. Decision: STOP with no sweep, no residual, no dense control, no seed 1. See notes/zinc_static_dictionary_pair_kernel_v0_preregistration.md, notes/zinc_static_dictionary_pair_kernel_v0_analysis.md, results/zinc_static_dictionary_pair_kernel_v0/RESULTS_SUMMARY.md, claim-zinc-static-dict-pair-kernel-v0-dictionary-used-no-absolute-gain-20260922, decision-zinc-static-dict-pair-kernel-v0-stop-after-seed0-20260922."
  - decision-zinc-static-dict-pair-v1-stop-confirmatory-pair-kernel-20260922: "ZINC strict-static dictionary-pair v1 confirmation (2026-09-22, prereg+impl commit 1cb4fc7; remote A100 GPU0/GPU1; official test never loaded): Phase A zero-training common-horizon audit of the seed-0 curves gave H_common 204 from durable artifacts, M0c 0.145674 / MDc 0.145958 / MKc 0.139009, base_gain_common +0.006666 (>=0.004) and dict_gain_common +0.006949 (>=0.002) -> A1 COMMON_HORIZON_SIGNAL_SURVIVES; the restricted Top-5 weight soup is unavailable from saved states (v0 persisted only the best checkpoint) and was not faked; ~30.7% of the seed-0 S0-Dict margin came from epochs 205-240. Phase B bought exactly three seed-1 full runs, each forced to 240 epochs with a shadow patience-40 early-stopping tracker: equal-horizon best S0 0.139389 @233 (soup 0.136423), S-Dense 0.145830 @164 (soup 0.141608), S-Dict 0.138020 @240 (soup 0.134697); Gbase_1 = S0-Dict +0.001369 (<0.004 gate), Gdict_1 = Dense-Dict +0.007811 (>=0.002), soup +0.001726 / +0.006912 -> B2 SEED1_DIRECTIONAL_REPLICATION. The shadow tracker never stopped S0 or S-Dict, so equal-horizon and original-protocol views coincide. DECISIVE CAVEAT: the seed-1 dictionary residual is inert at the best checkpoint (gamma 0.100 -> 3.75e-04 with 0.0021 by epoch 100 and ~0 from ~epoch 140; residual-disable ablation mean/max shift 1.02e-05 / 1.02e-04 versus 0.3044 / 0.9832 in seed 0; entropy 4.068 of 4.159, 58.45 effective atoms, tau 0.20 -> 0.547) and the matched S-Dense branch collapsed too (gamma 9.5e-05), so the seed-1 S-Dict endpoint is effectively the strict-static base network. Seed-1 S0 also improved 0.006285 over seed-0 S0 (~4.6x the S0-Dict margin). Two-seed original-protocol paired means: S0-Dict +0.005497 best / +0.004346 soup, Dense-Dict +0.008859 best / +0.007871 soup, sign-consistent. Strict-static gates PASS for all seed-1 arms; shared tensors bit-identical; 3 full runs; GPU wall 3109.4 s; official test never loaded. Decision: do NOT authorize the confirmatory occurrence-level dictionary-conditioned pair kernel; first run a new preregistered residual-dictionary stability/liveness round. See notes/zinc_static_dictionary_pair_v1_preregistration.md, notes/zinc_static_dictionary_pair_v1_analysis.md, results/zinc_static_dictionary_pair_v1_confirmation/RESULTS_SUMMARY.md, claim-zinc-static-dict-pair-v1-seed1-directional-not-mechanism-20260922, decision-zinc-static-dict-pair-v1-stop-confirmatory-pair-kernel-20260922."
  - decision-zinc-static-dict-pair-v0-buy-seed1-and-pair-kernel-20260922: "ZINC strict-static dictionary-pair v0 (2026-09-22, preregistration+implementation commit 033c1b6; remote A100 GPU0/GPU1; official test never loaded): a strict-static patch-pair compact-v4-smallhead S0 (center_context False, center_update None, 302D runtime representation, small raw head 302->13->13->1, 66,228 params) with three seed-0 full runs. Best-checkpoint official-valid MAE S0 0.145674 @164 (soup 0.140794), S-Dense 0.145958 @170 (soup 0.142660), S-Dict 0.136050 @225 (soup 0.133829). Gains primary: M0-MK +0.009624 (>=0.004), M0-MD -0.000284, MD-MK +0.009908 (>=0.002); soup: M0-MK +0.006965, MD-MK +0.008831. Both metrics fire Case A DICT_SPECIFIC_SIGNAL while the parameter-matched generic dense adapter (H=53, 5,189 vs 5,201 params, 0.23% mismatch, shared tensors bit-identical) gives no gain over S0. Strict-static gates PASS (forward with _pool_pairs_to_centres raising, pair/relation encoder called once, h_i bit-identical under pair mutation, pair-order invariant <=1.9e-6); dictionary active (64/64 atoms, effective count 8.13, gamma 0.1->0.184, inference ablation mean shift 0.304 vs dense 0.034). Caveat: single seed, noisy valid curve, S-Dict used more optimizer steps (240 epochs, no early stop) than S0/S-Dense. Decision: buy one paired seed-1 confirmation and implement the occurrence-level dictionary-conditioned pair kernel under a NEW preregistration; no HPO/rescue. See notes/zinc_static_dictionary_pair_preregistration.md, notes/zinc_static_dictionary_pair_analysis.md, results/zinc_static_dictionary_pair/RESULTS_SUMMARY.md, claim-zinc-static-dict-pair-v0-dictionary-specific-signal-20260922, decision-zinc-static-dict-pair-v0-buy-seed1-and-pair-kernel-20260922."
  - decision-tccd-v7-stop-standalone-normalized-moment-20260922: "TCCD-v7 (2026-09-22, preregistration commit a3f531d, implementation commit 34d931f; remote A100 GPU1 only; official test never loaded): Gate 0 passed all checks (permutation, batching/padding, algebra, full-symmetric normalized composition mass, zero-mass relation, no target leakage, official-test blocking, independent float64 reference, Stage-A-cache vs Stage-B-tensor equivalence, and relation-mass source agreement). Stage A on the fixed internal 8000/2000 split with the exact frozen TCCD-v2 PrototypeREL checkpoint and the identical linear-reader protocol: same-session RAW re-screen reproduced the frozen TCCD-v5 BASE bit-for-bit (best 0.28791576623916626 @ epoch 54, soup 0.2783639132976532, members [54,94,50,43,79], drift 0.0), NORM (10,470 dims) best/soup 0.4144890606403351/0.4146538972854614, NORM+MOM (10,534 dims) best/soup 0.4119139015674591/0.4121180474758148; delta_norm -0.13375413417816162 (required >= +0.015), absolute gate 0.255 failed, delta_mom 0.0025358498096466064 NEGLIGIBLE. Verdict Stage A FAIL -> STOP the TCCD standalone performance route immediately: no Stage B end-to-end run, no official-valid run, no official-test access, no seed 1, no tuning. TCCD standalone performance route CLOSED; No TCCD-v8 rescue is authorized. See notes/tccd_v7_final_normalized_moment_preregistration.md, notes/tccd_v7_final_normalized_moment_analysis.md, claim-tccd-v7-normalized-moment-standalone-insufficient-20260922, decision-tccd-v7-stop-standalone-normalized-moment-20260922."
  - decision-tccd-v5-stop-stage-a-pair-placement-20260922: "TCCD-v5 (2026-09-22, preregistration commit 539ee07, implementation commit 1ec96ff; remote A100 GPU1 only; official test never loaded): Gate 0 passed pair-swap, graph-relabel, pair-order, batching, linear-PRE/POST equivalence, nonlinear separation, gradient, no-leakage, and official-test-blocking checks. Stage A on the fixed internal 8000/2000 split used exact TCCD-v2 PrototypeREL assignments and matched 197-to-64-to-16 pair MLPs. BASE best/soup 0.287916/0.278364, POST 0.260827/0.252233, PRE 0.261728/0.251418, PRE-SHUFFLE 0.262062/0.251756; delta_place 0.000815183, delta_add 0.026945770, delta_shuffle 0.000337422. Decision: STOP at Stage A; no paired seed, Stage-B E2E, official-valid full run, or official-test access. Pair branch value versus BASE is supported, but PRE versus POST causal placement is not; next justified hypothesis is center-preserving occurrence composition under a new preregistration. See notes/tccd_v5_occurrence_pair_nonlinearity_analysis.md, claim-tccd-v5-pair-nonlinearity-placement-no-material-gain-20260922, decision-tccd-v5-stop-stage-a-pair-placement-20260922."
  - decision-tccd-v4-stop-stage-a-twohop-20260922: "TCCD-v4 (2026-09-22, preregistration commit bd7ad91, implementation commit 2e0218a; remote A100 GPU1 only; official test never loaded): Gate 0 passed exact S^2 algebra, permutation and batching invariance, two-hop sensitivity, effective fixed-permutation mismatch, target independence, and official-test blocking. Stage A frozen screen on the internal 8000/2000 split used the exact TCCD-v2 PrototypeREL checkpoint and matched readers. BASE best/soup 0.287916/0.279731, REAL-2 0.287929/0.278038, MIS-2 0.287936/0.279558; delta_topo 0.0000068843 and delta_add -0.0000134408, both below the 0.005 failure threshold. Decision: STOP at Stage A; no paired seed, end-to-end +2hop, S^3, official-valid full run, or official-test access. Leading hypothesis: early occurrence aggregation / lossy C^T R C contraction. See notes/tccd_v4_higher_order_assembly_analysis.md, claim-tccd-v4-twohop-assembly-no-material-increment-20260922, decision-tccd-v4-stop-stage-a-twohop-20260922."
  - decision-tccd-v3b-stop-correct-pre-pair-bridge-20260922: "TCCD-v3b (2026-09-22, preregistration commit f46cd63, formal implementation commit f942a00; remote A100 GPU1 only; official test never loaded): corrected the historical TCCD-v3 bridge by extracting the complete fused pure-local B-full patch_encoder output before pair projection, with raw width 64 and matched Linear(64,64) adapters in DenseREL and PrototypeREL. Gate 0 passed, including train/valid cache freshness max delta 2.3842e-7, exterior/relabel/batch invariance, deterministic reload, pair/global independence, frozen-source and gradient checks, and no raw bypass. CorrectStrongLocal-DenseREL best/soup valid MAE 0.327528/0.312805; CorrectStrongLocal-PrototypeREL 0.315263/0.312643; shuffle 0.592378. Delta_local = -0.027926 versus TCCD-v2 best 0.287337, Delta_proto,strong = -0.012265, Delta_comp,strong = 0.277115; all 64 prototypes active, effective count 63.8328. Decision: L3 CORRECT STRONG LOCAL BRIDGE FAIL. Historical TCCD-v3 is narrowed to the isolated e_struct claim; no rescue sweeps or official-test read. See notes/tccd_v3b_correct_strong_local_bridge_analysis.md, claim-tccd-v3b-correct-pre-pair-bridge-20260922, claim-tccd-v3-clarification-20260922, decision-tccd-v3b-stop-correct-pre-pair-bridge-20260922."
