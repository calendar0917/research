      role is strongly ring-relevant (ring_any delta shell1_shell2_edge_density
      -0.271, shell2_edge_density +0.096, same-shell incidence +0.054) and the
      dictionary learns ring-correlated atoms without ring input (Arm A atom
      13 +0.168; Arm M atom 38 +0.169 / ring6 +0.252). Dictionary health is
      mixed/concentrated in both arms (effective atoms 2.47 M / 2.88 A of 64,
