      soup 0.144330 vs S0 seed0 0.140794 (+0.003536), S0 seed1 0.136423
      (+0.007907), SDPK-v0 0.139735 (+0.004595), SRDA-v0 0.149873 (-0.005543).
      13 targeted CPU tests pass; encode audit confirms dictionary_input_width
      145 and bit-identical patch_cont recompute; 2 full runs (the whole
      budget); GPU wall 1353.4 s (M) / 1673.0 s (A); peak 191.0 / 192.5 MB;
      official test never loaded. Decision: STOP with no seed 1, no sweep, no
      rescue, no explicit ring input; the graph-level aligned cross line is
      CLOSED. See
      notes/zinc_no_ring_dictionary_topology_cross_v0_preregistration.md,
      notes/zinc_no_ring_dictionary_topology_cross_v0_analysis.md,
      results/zinc_no_ring_dictionary_topology_cross_v0/RESULTS_SUMMARY.md,
      claim-zinc-dtx-v0-aligned-cross-load-bearing-but-no-signal-20260923,
