# ---------------------------------------------------------------------------
# next round: direction under discussion, NOT an authorized experiment
# ---------------------------------------------------------------------------
# Source: docs/luyin/luyin18.txt (mentor discussion, 2026-09-18). These are
# design intentions, not a registered protocol. Nothing here is authorized.
research_direction:
  status: discussion-only
  summary: >-
    Shift from hand-crafted statistical descriptors toward a naturally learned,
    end-to-end structural representation: unify structure and attribute
    information, and couple the representation learning to the downstream task
    (no detached statistics-then-MLP). Because ZINC graphs are small
    (~20-30 atoms), a whole-graph / graph-level representation-and-compression
    question is on the table, and the KSVD/dictionary-learning idea should enter
    the end-to-end pipeline rather than staying a separate pre-processing step.
    Stop expanding local feature ablations.
  non_goals:
    - do not turn the discussion into a started experiment without a preregistration
    - do not open either official test again
    - do not re-litigate the closed statistical/ablation families

authorized_next_action:
  status: none
  note: >-
    No experiment is authorized. TCCD-v0 (2026-09-21, seed 0, commit 008b5e3,
    remote A100 GPU1; canonical PyG ZINC subset=True official train 10000;
    official valid AND official test never loaded; Gate 1 uses no y) tested
    whether a molecule can be represented as data-learned reusable local
    environments plus explicit observed composition relations, without learned
    message passing. Frozen candidate notes/tccd_v0_preregistration.md: exact
    rooted colored-incidence canonical coordinate x_v in R^714 per radius-2
    attributed rooted patch (M=14, A=21, B=3), shared K=64 / s=8 dictionary,
    one-shot relations C^T R C (R_int/R_b/R_geo tau=1), linear reader. Gate -1
    PASS (canonical strong GPU reference B-Full 0.119818, A100, official test
    unread). Gate 0 PASS on GPU1 (all 8 correctness checks: x_v/code/C^T R C/
    prediction permutation invariance, batching invariance, relation
    correctness, decoupling sensitivity, exact sparsity=8, task+reconstruction
    gradients reach D, no collapse). Gate 1 FAILS on the full official train
    10000 on exactly one pre-registered check: LOCAL-COORDINATE CONTINUITY
    (code-space AUC 0.4675, x-space AUC 0.5019; PASS threshold >= 0.70). All
    other Gate 1 checks pass comfortably: permutation stability max Delta x_v
    = 0.0 and OMP support Jaccard 1.0 over 48200 relabeling checks; held-out
    reconstruction ratio E_learned/E_random = 0.0491 (0.0470 vs 0.9568); reuse
    0 dead / 64 of 64 atoms used, top-1 mass 0.0515, top-8 0.2879. 800 near
    pairs (typed-WL cosine ~1.0, non-isomorphic) are coded at essentially
    random distance (near 5.799 vs random 5.710): canonical slot rearrangement
    scatters structurally near patches. Atom semantics (report only) show
    atoms latch onto repeated EXACT motifs (key concentration 0.610 vs 0.075
    random), orthogonal to metric smoothness. The 400-graph smoke shows the
    same failure (AUC 0.54). Two implementation findings fixed before any
    formal run (pynauty.canon_label is not an invariant vertex ORDER unless
    root/shell colours are included -> typed-patch root+distance colouring;
    tied-IHT step size needs a deterministic power-iteration start). FROZEN
    VERDICT: 'A fixed-coordinate canonical raw local patch is not a suitable
    K-SVD / dictionary-learning domain for ZINC: structurally near patches are
    as far apart in the frozen coordinate/code space as size/root-matched
    random patches.' DECISION: STOP TCCD-v0 at Gate 1; Gates 2/3/4 NOT RUN; no
    K/radius/ordering/reader/encoder rescue; the negative result is recorded
    with full evidence. Any future round needs a NEW pre-registration for a
    DIFFERENT object class (permutation-invariant learned local encoder ->
    dictionary, or permutation-invariant bag/multiset reconstruction
    objective), not the frozen TCCD-v0 construction. Neither official test was
    opened. See notes/tccd_v0_preregistration.md, notes/tccd_v0_analysis.md,
    results/tccd_v0/, claim-tccd-v0-fixed-coordinate-patch-not-ksvd-domain-20260921,
    decision-tccd-v0-stop-fixed-coordinate-patch-20260921. The PSD-v0
    authorized-next-action note is retained below for provenance:
    A100; ZINC canonical train 10000 / valid 1000, official test never loaded;
    train-only screen) tested whether a raw-input RELATION-PRESERVING PAIR-STATE
    structural encoder (M_ij = sum_k phi(H_ik).psi(H_kj), L=3, d=64; readout
    u_G in R^64) can match a raw node-MPNN at comparable parameter budget as the
    prerequisite (Q1) for a function-preserving sparse dictionary (Q2). Stage 0
    (data-free) all passed and the synthetic C6-vs-2C3 mechanism test is active;
    Stage 1 (128 graphs) passes after one targeted optimization-budget revision
    (batch 128->16, 300 epochs; pair train 0.0626). Stage 2 (2048 train-dev / 512
    train-monitor, seed 20260922, official valid/test never used) is decisive:
    best monitor MAE pair 0.5038 (200 ep, early stop) / 0.5177 (80 ep) vs
    raw_wide 0.4115 and raw 0.4152; soup pair 0.4955 vs raw_wide 0.4094 / raw
    0.4105. Delta pair - raw_wide = +0.106 / +0.088, far above the pre-registered
    0.005 scale; pair overfits (train 0.195 vs monitor 0.513; raw 0.255/0.415)
    and is ~1.8-2.1x slower. Mechanism: no pair-specific numerical pathology (the
    pair field is rank 8.5-11.7 at L1-2 and the raw baselines' sum-pooled graph
    vectors are ALSO low rank: raw 2.46, raw_wide 2.18, pair u_G 1.46) -> the
    difference is inductive bias / effective capacity. FROZEN VERDICT:
    'Pair-state structural representation is not viable (dominated by the raw
    node baseline).' DECISION: STOP the pair encoder and DO NOT start the
    dictionary (Q2); no width/depth/capacity/readout/regularisation rescue; no
    full-10k pair run (round brief forbids it once the 2048 gap is clear). Any
    next step needs a NEW preregistration; neither official test was opened. See
    notes/zinc_pair_dict_v0_preregistration.md,
    notes/zinc_pair_dict_v0_analysis.md,
    results/zinc_pair_dict_v0/RESULTS_SUMMARY.md,
    claim-psd-v0-pair-structural-encoder-not-viable-20260920,
    decision-psd-v0-stop-pair-encoder-20260920. The GSCN-v0 authorized-next-action
    note is retained below for provenance: No experiment is authorized. GSCN-v0 (2026-09-20, seed 0, commit e7f5e02,
    A100; ZINC canonical train 10000 / valid 1000, official test never loaded)
    tested whether task-driven sparse dictionary coding can be the graph
    hidden-state transition from raw topology. Reading the repo first showed the
    canonical B-Null/B-Full are ROOTED-PATCH models that already use handcrafted
    statistics and differ only by a learned 16-D local token (gap 0.0032), so the
    input discipline was frozen to raw atom/bond/adjacency and the primary
    baseline became a raw graph model B-Null-Raw (d=64, L=4). Under the canonical
    protocol (soup valid MAE): B-Null-Raw 0.1950 (55,681 params), param-matched
    generic control 0.1982 (89,985), No-Threshold-GSCN 0.2605 (89,473),
    Sparse-GSCN 0.2123 (89,473) vs B-Full reference 0.119818. No GSCN variant
    beats the raw baseline; the generic control is at least as good as
    Sparse-GSCN, so the pre-registered capacity-only failure gate fires. The
    sparse mechanism is genuinely active (sparse, non-collapsed codes; task
    gradients reach D; destruction/shuffle/mean-code ablations degrade MAE
    strongly) and the explicit lambda threshold helps inside the family (+0.048
    over lambda=0), but the dictionary-core is not competitive. FROZEN VERDICT:
    'The gain is explained by generic model capacity rather than sparse
    dictionary learning.' DECISION: REJECT the dictionary-core architecture and
    reassess the research premise (do NOT add a residual/side channel, bigger
    dictionary, learned encoder, or revisit PSCD/motifs/ports). Any next step
    needs a NEW preregistration; the official test was never opened. See
    notes/gscn_v0_preregistration.md, notes/gscn_v0_analysis.md, results/gscn_v0/,
    claim-gscn-v0-sparse-dictionary-core-not-viable-20260920,
    decision-gscn-v0-reject-dictionary-core-20260920. The previous PSCD-RM-v0
    authorized-next-action note is retained below for provenance: PSCD-RM-v0
    (2026-09-20, commits faf8c49/a4d1eb2, seed 0, A100; reused PSCD-TMDL-v0
    FREQ/TM dictionaries and the unchanged 9000 discovery + 1000 internal-monitor
    split; only discovery drives merges) resolved the PSCD-TMDL-v0 compression
    confound. At a STRONG rate match to the task+MDL dictionary, the pure
    frequency FREQ-LOOSE dictionary (k*=5, R_state 1.4046, R_occ 0.5556) scores
    best valid 0.21293 (Top-5 soup 0.20325) vs TM 0.20374 (soup 0.19517), so
    Delta_task^high-rate = 0.00919 / 0.00808 (< 0.02 negligible) and ~86% of the
    original Delta_dictionary = 0.067 is decompression. The rate-matched task
    dictionary (TM-RATE; FREQ-64 discovery budget R_state 0.8887 / R_occ 0.3156)
    is INFEASIBLE under the frozen 64-rule budget: the first-order two-part MDL
    eligibility (deltaL<0) rejects the high-merge rules the frequency dictionary
    needs (max compressive 526 merges vs a 2103-merge rate floor at step 2).
    VERDICT (frozen first line): 'Rate-matched task dictionary construction is
    infeasible under the current 64-rule merge-only parameterisation.' DECISION:
    analyze the merge-only parameterisation (and its MDL eligibility) before
    further dictionary learning; the next round may study merge + split +
    replacement + retirement, or a dictionary objective that does not penalise
    high-merge boundary rules, but must NOT increase K, must NOT formalise
    alternating task-driven dictionary learning yet, must NOT sweep
    beta/K/reader/ports, and must NOT open either official test. See
    notes/pscd_rm_analysis.md, notes/pscd_rm_preregistration.md, results/pscd_rm/,
    claim-pscd-rm-v0-rate-matched-dictionary-20260920,
    decision-pscd-rm-v0-analyze-merge-only-20260920.

