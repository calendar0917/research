# path, does the fusion become load-bearing and move the ~0.13 band?  Exactly
# one architectural change over frozen CSSD-Sem108: a 48-D per-bond residual
# j_uv = F([h_u+h_v ; |h_u-h_v| ; h_u*h_v]) * (b_uv @ B) with
# h_v = (alpha_v @ A) * (q_v @ C), A 32->16, C 28->16, B 4->48 bias-free,
# F = 48->32->48 SiLU bias-free (F2 ~ Normal(0,0.01)), summed into the edge
# response BEFORE the shellpair index_add_ (parent hook _edge_response_delta,
# default None => bit-identical parent forward; 45/45 shared tensors
# bit-identical, parent-equivalence forward 0.0, frozen parent soup reproduced
# exactly 0.123704927947314).  All 14 correctness gates J0-J13 and 12 focused
# tests pass.  One seed-0 320-epoch CPU trajectory (8 threads, 2334.2 s): best
