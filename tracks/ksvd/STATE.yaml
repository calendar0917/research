      graph-mean alpha costs 0.4882.  Dictionary is healthy (64/64 active,
      51 argmax-used, effective atoms 14.47, top-8 mass 0.750, coherence mean
      0.172, tau 0.200 -> 0.1718).  Strict-static hard gates all pass
      (standalone module, forward with _pool_pairs_to_centres raising,
      dictionary/relation/pair encoder 1 call each, z/q/alpha/eps bit-identical
