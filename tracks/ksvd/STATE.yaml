recent_decisions:
  - "decision-compact-v4-training-sufficiency-20260917: Case A HISTORICAL UNDERTRAINING CONFIRMED. The 60-epoch canonical protocol under-trained compact-v4-hinge; longer single-stage training (240 ep, patience 40, unchanged Adam lr 1e-3 / batch 128 / wd 1e-5) absorbs and exceeds the continuation anchor. Replication gates pass (seed0 +0.023645, seed1 +0.013834, mean +0.018740); seeds 2/3 +0.022694/+0.028826; frozen test +0.011706 (4/4). Rejected: OPTIMIZATION-REGIME SWITCH GO (batch512/wd0 both hurt), two-stage full-model protocol, SMALL-IMPROVEMENT/NO-GO, scheduler sweep (best epoch not horizon-pinned), and treating prior NO-GO audits as invalidated (representation drift 0.314 L2 / 0.950 cosine is descriptive only). New baseline: optimized compact-v4-hinge valid 0.147201+/-0.003697, test 0.125179+/-0.003374; all future architecture claims compare against this."
  - "decision-graph-head-function-family-inconclusive-20260915: INCONCLUSIVE (Case E) for the explicit low-rank cross-coordinate interaction head on frozen compact-v4. Stage 1 (backbone seed 0) hit the pre-registered EFFICIENCY ADVANCE (mean delta_small=+0.003374, 4/5 folds; FM 0.172165 vs H1 0.175539 vs H2 0.170051 vs H0 0.175809), so the second backbone seed was spent. Stage 2 (seed 1) did NOT replicate (mean delta_small=+0.000417, only 2/5; FM 0.175931 vs H1 0.176349 vs H2 0.170508 vs H0 0.174253). Pooled delta_small=+0.001896 < +0.0025, fold-averaged 3/5 positive, paired bootstrap 95% CI lower bound negative in both stages -> final frozen GO fails on 3/5 criteria. Interaction is alive (V=0 raises MAE +0.1144, 5/5; std(interaction)/std(linear)=0.489). CatBoost unavailable. Rejected: single-backbone efficiency GO, clean NO-GO label, Stage-1b init, rank 8/16/learned, DeepFM/field-aware FM/CrossNet/polynomial/bilinear, MLP+FM hybrid, end-to-end FM replacement, XGBoost re-sweep, environment change for a secondary tree control. compact-v4 unchanged. Revisit_if: a different pre-registered downstream-function-family hypothesis with its own frozen witness and matched controls, or a paradigm-level representation-family / objective-aligned structured-computation stage; if a tree reference is wanted, install CatBoost under its own pre-registered MAE preset and split."
  - "decision-centre-incidence-cooccurrence-witness-nogo-20260912: NO-GO within-centre cross-channel relation co-occurrence (Case B — centre marginal re-access only — plus Case-C evidence). Stage 0 v4 export (Gate 0 all-pass 37/37 on 5/5) + Stage 1 frozen OOF seed 0 x 5 folds x 1 init: covariance witness worse than the matched marginal control (delta_M -0.001361, CI [-0.00569,+0.00279], P(>0)=0.27, 2/5 folds; worse on selection 5/5 and on common-input bulk max +0.0077 > 0.002) and worse than the historical R-only head (delta_R_hist -0.011056, 0/5); delta_R vs the matched-budget R-only head +0.000922, CI straddling zero, below the clear-NO-GO line. Target-free ambiguity real but mild-moderate (normalized conditional Var(c|16-NN m) = 0.285) -> the discarded statistic exists but is not task-relevant. Depth confound measured (+0.01198 for the extra layer) and shown not to affect the depth-matched E-vs-B2 test. Rejected: covariance/joint-relation/centre-incidence architecture, full covariance, larger/learned projection, attention over relations, DeepSets centre encoder, second centre update, relation-set Transformer, second backbone seed, Stage-1b init, channel-shuffle surrogate (trigger unmet), any further 'missing statistic along the compute graph' probe. compact-v4-hinge unchanged. Revisit_if: a new pre-registered witness for a different discarded quantity with its own hard Gate 0 AND matched control, or a paradigm-level re-posing (information accessibility / learnable parameterization / one-shot centre update as a function-class hypothesis)."
  - "decision-pair-endpoint-association-witness-nogo-20260911: NO-GO off-diagonal endpoint cross-coordinate association (Case C). Stage 0 v3 export (Gate 0 all-pass) + Stage 1 frozen OOF seed 0 x 5 folds x 1 init: endpoint witness worse than R-only (delta_R -0.006994, CI [-0.01039,-0.00359], 0/5) and worse than the diagonal control (delta_diag -0.002741, 0/5); bulk unsafe (+0.0050 mean, +0.0112 max). Representation ambiguity only mild-moderate. Rejected: second backbone seed, Stage-1b init, learned projection, rank sweep, full 120D outer product, attention/triplet, low-rank symmetric bilinear pair encoder. compact-v4-hinge unchanged. Revisit_if: a pre-registered task-relevant witness for a different discarded quantity, or an upstream computation-graph object (centre-incidence compression / one-shot centre update / higher-order interaction) with its own witness first."
  - "decision-frozen-readout-sufficiency-nogo-20260910: NO-GO cheap post-state readout extension. After Gate-0 export repair (all pass) Stage 1 is a pre-registered CLEAR NO-GO (mean delta0 +0.00087 < +0.001; mean delta_R -0.00179 <= +0.001; set better than R-only in only 2/5 folds), so the second frozen backbone seed was NOT spent. Rejected: second backbone seed, Stage 1b extra init, B2 joint-structure control, any pooling-family rescue. compact-v4-hinge unchanged. Revisit_if: a different cheap frozen-state parameterization with its own pre-declared gates, or a task-relevant witness diagnostic for endpoint/centre-incidence structure."
  - "decision-compact-v6-attribute-branch-viability-nogo-20260910: CLOSE topology-attribute factorization permanently (Outcome 2: branch repaired, architecture NO-GO). Root cause verified (zero-init fusion blocks the whole attribute branch at step 0; collapse at the encoder MLP), and the minimal repair (ONLY fusion init zero->normal(0.01)) makes the branch demonstrably active over 100 steps (V1-V4 pass), but the canonical seed-0 run re-collapses and shows no gain (valid 0.170209 vs v4 0.170066, delta -0.000143 < +0.003; Q1/Q2 degradation +0.023831 > +0.002; role shuffle ~1.2e-7). Rejected: continue to seed 1 / 4 seeds, tune the repair, count-only composition, Q5-tail-only GO. seed1 not run. Revisit_if: only a fundamentally different architecture stage with its own pre-registered graph-side-observable gate and fresh sweep; the prior fix-the-zero-init revisit is discharged."
  - "decision-compact-v6-topology-attribute-factorization-nogo-20260910: NO-GO topology-attribute factorization (Case D at benchmark gate). Keep compact-v4-hinge; close the v6 attribute branch. Because: paired multi-seed mean -0.000295 (<0.003, 2/3), seed0 +0.013645 does not replicate; seed0 gain is a tail-for-bulk trade (Q1/Q2 -0.017265 bulk gate FAIL) reproducing the corrected-tokenizer fingerprint; frozen seed0 factorized model is EXACTLY shuffle-invariant (clean==shuffled, e_attribute collapsed norm std 2.3e-10); count-only no gain (mean -0.002243); seed0 capacity-control +0.007491. Rejected: factorization GO, count-only composition, extra encoder capacity, wider role descriptor. Revisit_if: (1) branch-collapse (zero-init fusion -> upstream dead gradient at step0 + weight decay) is diagnosed and fixed and re-registered with a graph-side-observable gate and a fresh seed sweep; (2) a fundamentally different (multiplicative structure x attribute, from scratch) attribute channel is a new stage; (3) the coarse-token basis changes; (4) a benchmark where easy-bulk/hard-tail trade is not dominant."
  - "decision-baseline-difficulty-typed-refinement-20260910: Case D — UNEXPLAINED REDISTRIBUTION. NO architecture GO. The corrected-vs-historical harm/benefit is a stable difficulty-locked CENTRE (bias) shift, NOT variance-regularisation (Case A fails: easy ensemble degrades, centre>spread) and NOT typed-refinement informativeness (Cases B/C fail: partial -0.036, 7/7 metrics null-to-anti-predictive, hard+low-info gains more than hard+high-info). STOP the tokenizer-derived architecture branch (no coarse-to-fine, no coarse prior, no adaptive gate). Reopen only via a pre-registered graph-side-observable gate or a non-exact-identity tokenizer change."
  - "decision-corrected-token-fragmentation-mixed-20260910: Case D — MIXED MECHANISM. The corrected-vs-historical v4 degradation is not directed by token fragmentation (unconditional |Spearman| <= 0.06), is dominated by a baseline-difficulty redistribution (-0.352), and only a weak non-specific newly-rare signal survives conditioning. No architecture GO: do NOT open coarse-shared + exact-residual / coarse-to-fine / shared-low-rank on this evidence. Single next stage = diagnose the baseline-difficulty redistribution (diagnostic only)."
  - "decision-typed-tokenizer-correctness-repair-20260910: Case C — correctness fix reveals accidental sharing benefit. Corrected tokenizer (`typed_tokenizer_v2_corrected`) becomes the default semantically-correct exact-token method; historical certificate tokenizer retained as historical benchmark baseline; do NOT roll back correctness. Next stage = corrected-tokenizer residual/rarity re-audit; shared-base + exact-residual is a hypothesis only (do not implement)."
  - "decision-compositional-patch-sharing-nogo-20260910: NO-GO compositional patch sharing (Case E) — all five frozen-inference sharing variants regress on validation (0/4 seeds), KNN8 not better than frequent-mean/random-donor controls, unaffected bit-identical; do NOT open shared-base+exact-residual / OOV fallback / frequency gate / KSVD / subword routes; single next step is a tokenizer correctness fix (the frozen typed certificate is not injective: 730/6784 tokens mix root atoms), re-registered separately"
  - "decision-compact-v5-multi-quantile-nogo-20260910: NO-GO multi-quantile as a benchmark improvement (Stage-1 seed0 Case A did not reproduce; 4-seed Mild/Mild: point +0.0037 3/4, width 0.211 4/4; one-time test -0.0025 1/4); do NOT open uncertainty-guided weighting (width-GO precondition unmet); re-register/close the quantile route on OOF-train"
  - "decision-oof-difficulty-heteroscedasticity-go-20260910: GO difficulty (cross-fitted OOF Spearman 0.374 >= 0.25, 5/5) + GO epistemic (disagreement 0.393 >= 0.30, 5/5) on official-train OOF residual — remaining error is predictive difficulty/heteroscedastic variance on rarity + disagreement + low-y axes; confirms (train-side, true OOF) the valid-only NO CLEAR SECONDARY SIGNAL; no structural v5 channel; any future change must clear gates on this OOF set"
  - "decision-post-v4-residual-audit-no-secondary-signal-20260909: NO CLEAR SECONDARY SIGNAL — no v5 representation channel; revisit only via OOF-train-tested >=0.003 corrections or an opened objective/calibration study"
  - "decision-d5bf08b3: GO compact-v4-hinge under primary benchmark protocol (selection-checkpoint test, +0.0092 mean paired, 4/4 seeds); next = post-v4 residual audit; seed-0 refit regression is secondary-robustness evidence only"
  - "decision-0a35c7a0: wrap, don't rewrite (strangler runner; revisit if architecture tests demand more)"
