    architecture: >-
      standalone strict-static module (no PatchPathModel inheritance): typed
      (16D) and parent (8D) identity channels deleted outright; local state
      z_i = SiLU MLP(146 -> 96 -> 64) from patch_cont+patch_context only;
      end-to-end dictionary K=64 / rank=32 / tau_init=0.20; a_i = alpha_i @ A,
      b_i = alpha_i @ B (A,B in R^{64x32}, init std 2.0);
