  - decision-zinc-cga-v0-deprioritise-local-dictionaries-20260923: >-
      CGA-v0 (2026-09-23, preregistration + Amendment A1 commit c174ab3,
      formal-run commit c174ab36; remote A100 host res, deterministic CPU
      inference; official ZINC train 10000 / official valid 1000; official test
      never loaded; 0 new full training runs) reused the DURABLE recurrent
      pair-centre checkpoints (recurrent_seed{0,1}, 82,115 params, training
      commit a3515e76), the matched one-shot baseline (baseline_seed{0,1}, same
      commit/budget/seed/local machinery) and the auxiliary B-Null seed0
      (49,343 params) to ask whether the recurrent model's advantage comes from
      a contextual computation a strict-static representation cannot replicate.
      Exports reproduce the recorded behaviour exactly (valid MAE |Δ| = 5.2e-9
      / 2.4e-8; q0/A0 reconstruction, single-vs-batched h0, repeat-export all
      bit-identical), gates A/B/C/D pass. Discovered structure: the h0 space is
      massively duplicated (72.3% of valid patches have an exact h0 match in
      train, median 77 duplicates), so Jaccard(NN_h0,NN_h2) is tie-confounded
      and Amp = d2/(d0+eps) is degenerate; Amendment A1 (frozen before the
      formal run) therefore bases the decision on a matched-random retention
      ratio and an absolute context criterion. Result: delta_h = h2 - h0 is
      largely a LOCALLY determined transformation. P_local = 0.926 / 0.961;
      adding centre context [h0;A0] gives P_context = 0.963 / 0.976, i.e.
      context_abs_gain = 0.037 / 0.014 of the delta variance (0.85% / 0.57% of
      the h2 variance); context_gain on the residual is 0.501 / 0.375 but the
      residual is tiny. h0-neighbour deltas disagree only 0.304 / 0.262 as much
      as matched random patches; identical-h0 patches disagree by 0.176 / 0.082
      of sqrt(2) sigma_delta; K=64 target-free local prototypes carry only
      13-18% of the delta variance within-atom (weighted mean S_k 0.184 /
      0.128). The task link is marginal and SEED-UNSTABLE: Spearman(C_h,gain) =
      0.026 (95% CI [-0.036,0.092]) / 0.065 (95% CI [0.0005,0.130]), Q4-Q1 gain
      +0.0088 (CI crosses 0) / +0.0044, size-residualised Spearman 0.018 / 0.042
      (CIs include 0). Auxiliary B-Null seed0 shows the same structure
      (P_local 0.864, context_abs_gain 0.069, reproduction |Δ| = 5.6e-8).
      Preregistered decision -> CASE C: CONTEXTUAL_STATE_LOCALLY_COMPILABLE
      (DIVERGENCE false for both seeds; LOCAL_COMPILABLE_ABSOLUTE true for both;
      TASK_LINK true for seed1 only, marginally). Interpretation: contextual
      states EXIST and are context-input-dependent, but contextual computation
      is NOT the bottleneck (93-96% of the recurrent shift is locally
      predictable; the context-only increment is 1-4% of the shift and has no
      consistent task link). This deprioritises further local / pair /
      topology-cross dictionary designs as a way to recover the recurrent
      advantage; at most it authorizes ONE bounded preregistered test of a
      strictly-local two-update compiler, with a low ceiling. No seed 2, no
      sweep, no new architecture, no official test. See
      notes/zinc_contextualization_gap_audit_v0_preregistration.md,
      notes/zinc_contextualization_gap_audit_v0_analysis.md,
      results/zinc_contextualization_gap_audit_v0/RESULTS_SUMMARY.md,
      claim-zinc-cga-v0-contextual-state-locally-compilable-20260923,
      decision-zinc-cga-v0-deprioritise-local-dictionaries-20260923.
  - decision-zinc-dtx-v0-stop-no-aligned-cross-signal-20260923: >-
      DTX-v0 (2026-09-23, preregistration commit 7c28be1, formal-run commit
      3810d73; remote A100-SXM4-40GB GPU0 = MARGINAL / GPU1 = ALIGNED, in
      parallel; official test never loaded) tested whether a RING-BLIND
      dictionary crossed with a RING-BLIND, generic, untyped topology role via
      an ALIGNED graph-level joint statistic beats a matched marginal-only
      control, with all identity channels deleted and the raw S0 pair backbone
      preserved. Architecture: x_i = [patch_cont | patch_context] 146D;
      h_i = SiLU MLP(146 -> 64 -> 48); dictionary query = patch_cont with the
      explicit cycle-rank coordinate 143 deleted (145D) -> 64 -> 32, K=64,
      rank 32, tau init 0.20, alpha_i = softmax(q_i D^T / tau); ring-blind
      generic topology role s_i in R^8 (root degree fraction, shell-1/2
      occupancy, shell-1 / shell-1-shell-2 / shell-2 edge densities, shell-2
      multi-parent fraction, same-shell incidence fraction) from the untyped
      radius-2 induced distances + edges only; mu_alpha 64, mu_s 8;
      J_align = mean_i alpha_i outer s_i vs J_indep = mu_alpha outer mu_s
      (512 -> 32); inherited raw pair backbone (u 48 -> 16, pair input 64,
      5 buckets) evaluated once; R_final = [unary 97 | pair 165 | global 32 |
      topology hinge 8 | mu_alpha 64 | mu_s 8 | e_cross 32] = 406D; head
      406 -> 16 -> 16 -> 1; 60,442 params; shared init bit-identical; the only
      difference between arms is J_align vs J_indep. Two seed-0 full runs of
      240 epochs (no early stop, no HPO, no sweep), deterministic algorithms
      on with a bit-identical GPU0/GPU1 smoke (same init sha256, same
      2-epoch trace, peak 181.3 MB): ARM M best official-valid MAE
      0.14867128915613284 @238 / Top-5 soup 0.1443295570872142 (members
      [232,233,235,236,238]); ARM A best 0.1540012241489603 @232 / soup
      0.15035672007867834 (members [216,224,227,231,232]); Delta_align =
      M - A = -0.005330 (best) / -0.006027 (soup) -> preregistered Case D
      NO_ALIGNED_CROSS_SIGNAL, no base-regression confound (M_soup 0.144330 <=
      0.1450), seed 1 NOT purchased. The aligned cross is NOT inert: on the
      Arm A soup, replacing J_align by J_indep moves predictions by mean
      0.06494 / max 0.32649 and raises valid MAE 0.15036 -> 0.16877, and
      within-graph shuffling s_i moves them by mean 0.08716 / max 0.48008 and
      raises valid MAE to 0.18416 (noise floor 0.0; both clear the 0.010 / 20x
      gates) -> the aligned-trained weights genuinely depend on the
      alpha_i <-> s_i pairing, yet Arm A is worse than the matched marginal
      control, so within-graph alignment of the two marginals is not the
      missing ingredient. Ring-blindness proven: exactly one dictionary
      coordinate deleted (cycle_rank_coordinate_audit passed on synthetic
      tree/triangle/square/fused-triangles/hexagon; other cycle-derived
      coordinates none), AST audit finds no ring/cycle/basis/aromatic/fused/
