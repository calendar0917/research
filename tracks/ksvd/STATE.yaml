      explicit role x primitive bindings.  patch_cont (146), pair_relation
      (23), global_context (62), topology_features (25) and the train-fit
      standardizers/vocabularies reproduce the historical inputs
      bit-identically on the full official-valid split (1,000 molecules) and a
      512-molecule train sample (max_abs 0.0, bit_equal_fraction 1.0); h, q,
      relation/global encoder outputs, R and the prediction are all
      bit-identical, and the fixed checkpoint's valid MAE recomputes to
      0.1456743378872634 versus recorded 0.14567435123870381 (|delta| 1.34e-8).
      Static purity holds (no MP / recurrence / pair->centre / context
      writeback; environment formed before pair; relabel-invariant; 7/7
      targeted tests).  The blocking path is typed_token/parent_token: an
      aliased non-injective pynauty certificate (typed_tokenizer_v1_historical
      omits color labels) answered by a 6,785-row / 36,420-param per-key table;
      299/2,379 unique tokens (12.57%) and 15,309/23,083 patch occurrences
      (66.32%) mix distinct root atoms.  It is reconstructible from primitives
      (certificate bytes exact for 23,083/23,083 patches; token ids exact) but
      is not a shared role x primitive factorization, so the local environment
      is not fully factorized.  FROZEN VERDICT: FEC_S0_LOCAL_FACTORIZATION_BLOCKED
      (Case C).  The Top-5 soup (0.140794) was not reproduced (member states
      never persisted; no retraining).  Conservative alternative reading
      recorded: under the permissive 'reconstructible via explicit binding'
      clause the verdict would be FEC_S0_FUNCTIONALLY_EQUIVALENT.  FEC-D1
      (baseline-preserving sparse role refinement, r_new = r_coarse + g*r_dict,
      g=0 => FEC-S0) is a proposal only, not implemented or trained.  See
      notes/fec_s0_*.md, results/fec_s0/, claim-fec-s0-*-20260923,
      decision-fec-s0-local-factorization-blocked-20260923.
