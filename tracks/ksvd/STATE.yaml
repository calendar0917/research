# ---------------------------------------------------------------------------
# open questions, split by what they actually gate
# ---------------------------------------------------------------------------
# (a) live design questions for the next representation round.
open_design_questions:
  - Can a single end-to-end module learn the structural representation jointly
    with the task objective (replacing the statistics-then-readout pipeline)
    while keeping the KSVD/dictionary-learning interpretation?
  - For ZINC-sized graphs, is a whole-graph compressed representation preferable
    to a rooted-patch system (and can attributes be folded in without a separate
    descriptor branch)?

# (b) genuinely open scientific questions that are NOT on the next-round
# critical path. Do not let these pull an agent back into the closed ablation
# lines; they stay deferred until a future round re-opens them explicitly.
deferred_scientific_questions:
  - >-
    zinc: is the documented z_SA-axis / rarity-axis heteroscedastic difficulty
    reducible by any objective/calibration change at all? Shape is confirmed
    (OOF difficulty + epistemic GO 2026-09-10); reducibility is untested and
    unqueued. See decision-oof-difficulty-heteroscedasticity-go-20260910.
  - >-
    molhiv (legacy study question): do the strong internal 3-fold scaffold
    effects persist on official valid outside-scaffold, and is the distribution
    readout advantage robust for interaction variants? Not re-asked by the
    current MolHIV line (which trains directly on the official split). See
    studies/molhiv-cross-scaffold-interaction.yaml.

# (c) reporting / paper-level open items (comparability and write-up), not
# experiments to run.
reporting_open_items:
  - >-
    zinc: at matched parameter budget (CIN-comparable), is there an
    apples-to-apples comparability claim? Legacy framing: compact-v4-hinge
    ~0.137 mean test vs CIN-small 0.094. Open only as a *comparability claim*;
    the SBCI/statistical family is closed for architecture inference. See
    decision-sbci-fit-matched-generalization-frontier-caseC-20260912.

# ---------------------------------------------------------------------------
# next round: direction under discussion, NOT an authorized experiment
# ---------------------------------------------------------------------------
# Source: docs/luyin/luyin18.txt (mentor discussion, 2026-09-18). These are
# design intentions, not a registered protocol. Nothing here is authorized.
research_direction:
  status: discussion-only
  summary: >-
    Shift from hand-crafted statistical descriptors toward a naturally learned,
    end-to-end structural representation: unify structure and attribute
    information, and couple the representation learning to the downstream task
    (no detached statistics-then-MLP). Because ZINC graphs are small
    (~20-30 atoms), a whole-graph / graph-level representation-and-compression
    question is on the table, and the KSVD/dictionary-learning idea should enter
    the end-to-end pipeline rather than staying a separate pre-processing step.
    Stop expanding local feature ablations.
  non_goals:
    - do not turn the discussion into a started experiment without a preregistration
    - do not open either official test again
    - do not re-litigate the closed statistical/ablation families

authorized_next_action:
  status: none
  note: >-
    No experiment is authorized. The only admissible next step is writing a new
    preregistration under the relevant protocol (freeze before any terminal
    read; test_policy=terminal), then explicit human authorization.

