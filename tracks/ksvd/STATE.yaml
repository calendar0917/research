  - decision-zinc-srda-v0-stop-after-seed0-negative-20260922: >-
      SRDA-v0 (2026-09-22, preregistration commit d4ef523, formal-run commit
      82adff7; remote A100-SXM4-40GB GPU0; official test never loaded) deleted
      the typed (16D) and parent (8D) identity channels outright and made the
      end-to-end dictionary assignment define the occurrence-level relation
      algebra directly under the strict-static contract: standalone module,
      z_i = SiLU MLP(146 -> 96 -> 64) from the static descriptor only,
      K=64/rank=32/tau_init=0.20, a_i = alpha_i @ A, b_i = alpha_i @ B
      (A,B in R^{64x32}), proto_pair_ij = 0.5*(a_i*b_j + a_j*b_i),
      p_dict = proto_pair * rel_gate, narrow 8D within-prototype residual
      eps_i = q_i - alpha_i @ D_norm -> W_eps, pair input 72 -> pair encoder
      72 -> 64 -> 32 evaluated once, 129D unary + 325D pair + 32D global + 8D
      topology = 494D graph vector, 16/16 reader, 49,970 params, identity
      params 0. One seed-0 full run of 240 epochs (no early stop): best
