      -0.010138 (worse on both), and valid MAE never reached 0.15 in any of the
      240 epochs -> SRDA_V0_NO_STRONG_PERFORMANCE_SIGNAL; seed 1 NOT purchased.
      The failure is NOT bypass/inertness: the prototype algebra is the
      dominant pair block (mean ||p_dict|| 0.611 -> 2.256 = 3.69x, 81.8% of
      pair-input energy, pair-encoder first-layer block weight norm 3.08 ->
      7.04) while the 8D residual stayed flat (0.621 -> 0.659, 7.0% energy);
