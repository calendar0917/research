# ---------------------------------------------------------------------------
# next round: direction under discussion, NOT an authorized experiment
# ---------------------------------------------------------------------------
# Source: docs/luyin/luyin18.txt (mentor discussion, 2026-09-18). These are
# design intentions, not a registered protocol. Nothing here is authorized.
research_direction:
  status: discussion-only
  summary: >-
    Shift from hand-crafted statistical descriptors toward a naturally learned,
    end-to-end structural representation: unify structure and attribute
    information, and couple the representation learning to the downstream task
    (no detached statistics-then-MLP). Because ZINC graphs are small
    (~20-30 atoms), a whole-graph / graph-level representation-and-compression
    question is on the table, and the KSVD/dictionary-learning idea should enter
    the end-to-end pipeline rather than staying a separate pre-processing step.
    Stop expanding local feature ablations.
  non_goals:
    - do not turn the discussion into a started experiment without a preregistration
    - do not open either official test again
    - do not re-litigate the closed statistical/ablation families

authorized_next_action:
  status: none
  note: >-
    No experiment is authorized. The only admissible next step is writing a new
    preregistration under the relevant protocol (freeze before any terminal
    read; test_policy=terminal), then explicit human authorization. PSCD-TMDL-v0
    (2026-09-20, commits 3b77b4b/aed5796/0839151, seed 0, A100; ZINC canonical
    train 10000 / valid 1000, official test never loaded; deterministic 9000
    discovery + 1000 internal-monitor split, only discovery drives merges)
    changed ONLY the motif-selection rule while freezing reader / ports /
    vocabulary budget / max motif size. Stage B (identical PSCD-SC-v0
    StrongPortOperator, 192257 params, seed 0) gave B-FREQ best valid 0.27078
    (Top-5 soup 0.25331, early stop 153) vs B-TM best valid 0.20374 (soup
    0.19517, 240 epochs): Delta_dictionary = 0.0670 (best) / 0.0581 (soup) /
    +0.0523 at the matched 153-epoch budget; both dictionaries exact
    (Decode==G 100%). VERDICT: task supervision materially improves the
    dictionary, WITH the mandatory caveat that D_TM is materially less
    compressive (dynamic-state ratio 1.392x vs 0.888x raw) and less reused
    (median support 140 vs 506; 6 low-support + 2 unused motifs vs 1 + 0), so
    'reusable/compressive' is only partially supported and the gain is
    entangled with reduced compression. DECISION: strengthen dictionary
    regularization before further task coupling -- the next step is a
    COMPRESSION-MATCHED CONTROL (constrain task+MDL discovery to the frequency
    arm's occurrence / dynamic-state budget, or add an explicit reuse / state
    penalty to the MDL objective), then re-run the identical strong reader;
    formalise alternating / reader-gradient task-driven dictionary learning ONLY
    if the task-selection gain survives at matched compression. Do NOT open
    either official test; do NOT sweep beta / K / reader / ports. See
    decision-pscd-tmdl-v0-strengthen-regularization-20260920,
    claim-pscd-tmdl-v0-task-mdm-dictionary-selection-20260920,
    notes/pscd_tmdl_analysis.md, notes/pscd_tmdl_preregistration.md,
    results/pscd_tmdl/.

