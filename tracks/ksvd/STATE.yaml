  - decision-tccd-v2-stop-absolute-gap-20260922: "TCCD-v2 (2026-09-22, preregistration commit 6773866, implementation commit 69a985a, corrected full-data commit 030b3c5; remote A100 GPU1 only; official test never loaded): shared task-learned K=64 prototype vocabulary over the matched TCCD-v1 714-to-64 local encoder. Gate 0 passed. Gate A passed: Dense-REL 0.410789, Prototype-BAG 0.354108, Prototype-REL 0.286244, REL-SHUFFLE 0.838816; composition gain 0.552572 and prototype gap -0.124546. Vocabulary passed: 64/64 active, effective count 62.5755, top-8 mass 0.152634, learned temperature 0.094572. The first full-data attempt at 8ad255c was invalidated because it wired official-valid indices against the training-record list. The corrected train-to-official-valid run at 030b3c5 reached best valid 0.287337 / Top-5 soup 0.261988 versus canonical GPU1 baseline 0.119818; delta_abs 0.167519 -> NOT_VIABLE. K-SVD refit, OMP/IHT, and raw reconstruction loss were not used. Decision: stop the current prototype bottleneck; any stronger local encoder requires a new preregistration. See notes/tccd_v2_analysis.md, claim-tccd-v2-task-learned-prototype-vocabulary-20260922, decision-tccd-v2-stop-absolute-gap-20260922."
  - decision-tccd-v1-stop-dense-control-20260921: "TCCD-v1 (2026-09-21, pre-registration commit 3739c3a, vectorized local-training fix 0b6ebc4, diagnostics commit 5e3a4cf; ZINC canonical train 10000 / internal 8000-2000; official test never loaded): reused TCCD-v0 D0 with K=64/s=8 and NO K-SVD refit. Gate A passed on remote A100 GPU1: REL 0.750809 vs REL-SHUFFLE 0.941584, delta_comp 0.190775, BAG 1.078464. The original remote Gate B graphwise path was stopped for excessive runtime before producing a result; after exact slow-vs-fast contraction/reconstruction tests, Gate B ran locally on CPU with the same split/seed/loss/initialization/sparsity/relations and passed: FROZEN-D 1.087302 vs TASK-D 0.938099, delta_task 0.149203. Post-Gate-B diagnostics were report-only: code continuity AUC frozen 0.477500 -> TASK-D 0.506250, dead atoms 0 -> 32, reused atoms 64/64 -> 31/64. Gate C then failed decisively on local CPU: TASK-D 0.938099 vs matched DENSE 0.403933, gap 0.534167 vs allowed 0.005. Gate D NOT RUN by preregistered stop rule. Durable note: notes/tccd_v1_analysis.md; claim/decision: claim-tccd-v1-composition-task-coupling-dense-control-20260921, decision-tccd-v1-stop-dense-control-20260921."
  - decision-tccd-v0-stop-fixed-coordinate-patch-20260921: "TCCD-v0 (2026-09-21, seed 0, commit 008b5e3, remote A100 GPU1; canonical PyG ZINC subset=True official train 10000; official valid and official test never loaded; Gate 1 uses no y) tested whether a molecule can be represented as data-learned reusable local environments plus explicit observed composition relations, without learned message passing. Frozen pre-registration notes/tccd_v0_preregistration.md: for every radius-2 attributed rooted patch an exact rooted colored-incidence canonical coordinate x_v in R^714 (M=14 train max patch size, A=21 atom cats, B=3 bond cats; blocks topology/bond/atom/shell/mask; slot order = root, then shells by increasing pynauty canonical rank with colours (is_root, distance_from_root, atom_type)); shared K=64 / s=8 dictionary; one-shot relations C^T R C (R_int = B B^T diag-removed, R_b per bond type, R_geo = exp(-d/tau) with tau=1); single linear reader. Gate -1 PASS: canonical strong GPU reference B-Full / shared-structural Top-5 soup valid MAE 0.119818 (84495 params, deterministic A100, official test unread) already exists in claim-local-token-null-20260919. Gate 0 PASS on GPU1: 8/8 correctness checks (x_v max Delta 0.0; code support Jaccard 1.0; C^T R C max Delta 5.7e-14 float64; prediction max Delta 0.0; batching max Delta 0.0; relation correctness 1e-6; decoupling sensitivity rel 0.313; exact sparsity 8; task+rec grads reach D, D changes, no column collapse). Gate 1 on full official train 10000 (internal split seed 20260922: 8000 fit = 185538 patches / 2000 dev = 46126 patches; 12 chunk epochs OMP+K-SVD; wall 3145 s) FAILS on exactly one pre-registered check: LOCAL-COORDINATE CONTINUITY (code-space AUC 0.4675, x-space AUC 0.5019, graded tail code AUC 0.5494; PASS threshold >= 0.70). All other checks pass comfortably: permutation stability max Delta x_v 0.0, OMP support Jaccard mean=frac=1.0 over 48200 checks; held-out reconstruction ratio E_learned/E_random = 0.0491 (learned 0.0470 vs matched random normalized D 0.9568); reuse 0 dead atoms, 64/64 reused, top-1 atom mass 0.0515, top-8 0.2879, entropy 1.542; atom semantics (report only) mean top-50 canonical-key concentration 0.610 vs random baseline 0.075 (8.1x). 800 near pairs (typed-WL cosine ~1.0 non-isomorphic) are coded at essentially random distance (near 5.799 vs random 5.710): canonical slot rearrangement scatters structurally near patches. The 400-graph smoke gives the same failure (code AUC 0.54). Two implementation findings fixed before any formal run: pynauty.canon_label is NOT an invariant vertex ORDER unless the colouring includes root/shell (verified on path-3 and ring-6), fixed by using typed_patch_tokenizer root+distance colours; and the tied-IHT step size needs a deterministic power-iteration start vector (random init broke invariance). FROZEN VERDICT: 'A fixed-coordinate canonical raw local patch is not a suitable K-SVD / dictionary-learning domain for ZINC: structurally near patches are as far apart in the frozen coordinate/code space as size/root-matched random patches.' DECISION: STOP TCCD-v0 at Gate 1, Gates 2/3/4 NOT RUN, no K/radius/ordering/reader/encoder rescue, future work needs a NEW pre-registration for a different object class. Neither official test opened. See notes/tccd_v0_analysis.md, notes/tccd_v0_preregistration.md, results/tccd_v0/gate0.json, results/tccd_v0/gate1.json, claim-tccd-v0-fixed-coordinate-patch-not-ksvd-domain-20260921, decision-tccd-v0-stop-fixed-coordinate-patch-20260921."
  - decision-psd-v0-stop-pair-encoder-20260920: "PSD-v0 (2026-09-20, seed 0, commit e1bef7c, A100; ZINC canonical train 10000 / valid 1000, official test never loaded; train-only screen; protocol zinc-pair-struct-dict-v0): a raw-input RELATION-PRESERVING PAIR-STATE structural encoder (pair state H_ij in R^64 from raw atom/bond/relation embeddings; M_ij = sum_k phi(H_ik).psi(H_kj); residual eta -> LayerNorm; L=3; readout u_G in R^64 = W_read[mean pairs H ; mean diag H]; linear head) does NOT match a raw node-MPNN at matched parameters. Raw categories 21 atom / 3 bond; params raw 55,681 / pair 76,609 / raw_wide 77,977 (1.75% mismatch). Stage 0 all passed (perm-equivariance 9.5e-7, batch/padding/order invariance <=3.7e-9, gradients on every structural tensor, no position parameter, test blocked); synthetic C6-vs-2C3: raw node multiset gap 0.0 vs pair projection gap 0.051 / u_G gap 0.043 (mechanism active). Stage 1 (128 graphs) passes after one targeted optimization-budget revision (batch 128->16, 300 epochs; pair train 0.0626 / raw 0.0694). Stage 2 (2048 train-dev / 512 train-monitor, seed 20260922, batch 64, official valid/test unused): best monitor MAE pair 0.5038 (200 ep, early stop 143, no gain after 103) / 0.5177 (80 ep) vs raw_wide 0.4115 and raw 0.4152; soup pair 0.4955/0.5043 vs raw_wide 0.4094 / raw 0.4105. Delta pair - raw_wide = +0.106 / +0.088, Delta pair - raw = +0.103 / +0.089 (>> 0.005 scale); pair overfits (train 0.195 vs monitor 0.513; raw 0.255/0.415) and is ~1.8-2.1x slower. Diagnosis: no pair-specific numerical pathology (pair field rank 8.5-11.7 at L1-2; graph readout low rank for BOTH: pair u_G 1.46, raw 2.46, raw_wide 2.18) -> inductive bias / effective capacity, not collapse. VERDICT (frozen first line): 'Pair-state structural representation is not viable (dominated by the raw node baseline).' DECISION: STOP the pair encoder and DO NOT start the dictionary (Q2); no width/depth/capacity/readout/regularisation rescue; no full-10k pair run (round brief forbids it once the 2048 gap is clear). See notes/zinc_pair_dict_v0_analysis.md, notes/zinc_pair_dict_v0_preregistration.md, results/zinc_pair_dict_v0/RESULTS_SUMMARY.md, claim-psd-v0-pair-structural-encoder-not-viable-20260920, decision-psd-v0-stop-pair-encoder-20260920."
  - decision-gscn-v0-reject-dictionary-core-20260920: "GSCN-v0 (2026-09-20, seed 0, commit e7f5e02, A100; ZINC canonical train 10000 / valid 1000, official test never loaded; d=64 L=4 K=128 T=3; lambda label-free 80th-percentile calibrated once and frozen; B-Null/B-Full restated as rooted-patch models, input frozen to raw atom/bond/adjacency, baseline = raw graph model B-Null-Raw): soup valid MAE B-Null-Raw 0.1950 (55681), generic param-matched control 0.1982 (89985), No-Threshold-GSCN 0.2605 (89473), Sparse-GSCN 0.2123 (89473), B-Full reference 0.119818. Delta_Null -0.0173 (sparse worse), Delta_Capacity -0.0141 (sparse worse than generic), Delta_Sparsity +0.0482 (explicit lambda helps inside the family). Strong-positive FALSE; CAPACITY-ONLY failure gate FIRES (M_Generic <= M_Sparse); sparsity-not-needed FALSE; handcrafted gap 0.0752 with rho -0.230 (no recovery). Mechanism genuinely active and sparse (active 0.060-0.078/layer, atoms used 75-84%, eff rank 19.5-25.2, task grads reach D; ablations random-dict +40.7 / shuffle +2.6 / mean-code +4.5) and Stage0+smoke gates passed; failure is neither collapse nor optimization. VERDICT (frozen first line): 'The gain is explained by generic model capacity rather than sparse dictionary learning.' DECISION: reject the dictionary-core architecture and reassess the research premise; no seed-1, no optimization revision, no dictionary-factorization-only, no PSCD/motif repair; next step needs a NEW preregistration and the official test stays unopened. See notes/gscn_v0_analysis.md, notes/gscn_v0_preregistration.md, results/gscn_v0/, claim-gscn-v0-sparse-dictionary-core-not-viable-20260920, decision-gscn-v0-reject-dictionary-core-20260920."
  - decision-pscd-rm-v0-analyze-merge-only-20260920: "PSCD-RM-v0 (2026-09-20, seed 0, A100; commits faf8c49/a4d1eb2; ZINC canonical train 10000 / valid 1000, official test never loaded; reused PSCD-TMDL-v0 FREQ/TM dictionaries md5 bbb26189/8c151be6 and split md5 c4a21aa1; only discovery drives merges): two pre-registered rate-matched controls. FREQ-LOOSE (frozen frequency trajectory stopped at k*=5) is a STRONG rate match to the task+MDL dictionary (R_state 1.4046 vs 1.3923, |d| 0.0124 <= 0.03; R_occ 0.5556 vs 0.5551, |d| 0.0004 <= 0.05) and, under the IDENTICAL PSCD-SC-v0 StrongPortOperator (192257 params, seed 0), gives best valid 0.21293@220 (Top-5 soup 0.20325, 240 epochs) vs TM 0.20374 (soup 0.19517): Delta_task^high-rate = 0.00919 (best) / 0.00808 (soup) < 0.02, so 86.3%/86.1% of the raw Delta_dictionary 0.06704/0.05814 is decompression and 13.7%/13.9% is task. TM-RATE (task+MDL under the hard representation-rate constraint to the FREQ-64 discovery budget R_state 0.8887 / R_occ 0.3156) is INFEASIBLE under the frozen 64-rule budget: step 1 forced (1 admissible of 36 support_ok), step 2 support_ok 41 / mdl_ok 7 / rate_ok 9 / admissible 0 (rate floor need_occ 0.01009 ~ 2103 merges vs best compressive g_occ 0.00252 ~ 526 merges). Binding constraint = the frozen first-order two-part MDL eligibility rejecting the high-merge rules frequency uses (e.g. 51753 merges -> deltaL +129998), verified bit-for-bit against PSCD-TMDL-v0 mdl_delta_candidate. Both new dictionaries exact (Decode==G 100% discovery+monitor); FREQ-LOOSE invariance 0/1000 relabel mismatches; FREQ-LOOSE reuse maximally healthy (5 motifs, median support 7277, 0 low-support, 0 unused) while TM uses 64 mostly-fine motifs (median support 140, 6 low-support, 2 unused) at the SAME dynamic-state budget. VERDICT (frozen first line): rate-matched task dictionary construction is infeasible under the current 64-rule merge-only parameterisation; co-primary finding: at a strong rate match the pure-frequency dictionary is only 0.009 worse than TM, i.e. ~86% of the PSCD-TMDL-v0 gain is weaker abstraction / higher representation rate, not task-selected boundaries. DECISION: analyze the merge-only parameterisation (and its MDL eligibility) before further dictionary learning; do NOT increase K; do NOT formalise alternating task-driven dictionary learning yet; do NOT open either official test. Delta_task^low-rate is UNDEFINED (no TM-RATE dictionary). See notes/pscd_rm_analysis.md, notes/pscd_rm_preregistration.md, results/pscd_rm/, claim-pscd-rm-v0-rate-matched-dictionary-20260920, decision-pscd-rm-v0-analyze-merge-only-20260920."
  - decision-pscd-tmdl-v0-strengthen-regularization-20260920: "PSCD-TMDL-v0 (2026-09-20, seed 0, commits 3b77b4b/aed5796/0839151, A100; ZINC canonical train 10000 / valid 1000, official test never loaded; deterministic 9000 discovery + 1000 internal-monitor split, only discovery drives every merge; both dictionaries exact Decode==G 100%; 64 merges / max size 8): changing ONLY the motif-selection rule (frequency vs task+MDL), with the IDENTICAL PSCD-SC-v0 StrongPortOperator (192257 params) frozen on each dictionary, gives B-FREQ best valid 0.27078@113 (Top-5 soup 0.25331, early stop epoch 153) vs B-TM best valid 0.20374@230 (soup 0.19517, 240 epochs). Delta_dictionary = 0.0670 (best) / 0.0581 (soup) / +0.0523 at the matched 153-epoch budget (epoch 100 +0.0559; epoch 150 +0.0411); B-TM fits TRAIN better (0.0852 vs 0.1318) AND generalises better with a SMALLER train-valid gap (0.1186 vs 0.1389). Dictionaries almost disjoint (Jaccard 0.058; 7/64 shared types; 0 identical positional rules). The pre-registered PREDICTIVE gate fires decisively (Delta>=0.04; MAE_TM<=0.22), but the required reuse/compression half is only partially met: D_TM is materially less compressive (dynamic-state ratio 1.392x vs 0.888x raw; occurrence/atom 0.555 vs 0.315) and less reused (median support 140 vs 506; 6 low-support + 2 unused motifs vs 1 + 0), so the gain is entangled with reduced compression. Cheap Ridge probe did NOT predict this (task-only 0.5400 < D_TM 0.5911 ~ D_freq 0.5909). VERDICT (frozen first line): task supervision materially improves the reusable compositional dictionary, with the compression/reuse caveat. DECISION: strengthen dictionary regularization before further task coupling -- next step is a COMPRESSION-MATCHED CONTROL, then re-run the identical strong reader; formalise alternating task-driven dictionary learning only if the gain survives. See notes/pscd_tmdl_analysis.md, notes/pscd_tmdl_preregistration.md, results/pscd_tmdl/, claim-pscd-tmdl-v0-task-mdm-dictionary-selection-20260920, decision-pscd-tmdl-v0-strengthen-regularization-20260920."
  - decision-pscd-sc-v0-task-mdm-motif-discovery-20260920: "PSCD-SC-v0 (2026-09-20, seed 0, commits 34bd87a/f167269, A100; frozen PSCD-v0 dictionary md5 b180e969..., ZINC train 10000 / valid 1000, official test never loaded; Decode(D,C_G)==G 100% train+valid; all data-free gates pass): under the CANONICAL B-Full protocol a STRONG port-operator reader (d=64, L_outer=4, alternating inter/intra-motif transfer; 192257 params = 2.28x P_raw) does NOT follow the raw graph. Best valid: canonical strong raw (zinc-b-full, fresh Arm A seed 0, truncated epoch 119/240) 0.1364 vs frozen PSCD port operator (Arm C seed 0, truncated epoch 170/240) 0.262959 -> gap +0.127. Tiny->strong: raw improves 0.336->0.136 (0.20) while frozen PSCD improves only 0.325->0.263 (0.06); the gap GROWS from -0.012 (tiny) to +0.127 (strong). The failure is a representation-induced GENERALISATION / abstraction bottleneck, not capacity: Arm C train MAE 0.096 is BELOW raw train 0.110 while valid is 0.127 worse, and the valid curve had plateaued while train kept falling. Decode oracle (same canonical B-Full weights on G vs Decode(C_G), 512+512, CPU deterministic) max|Delta y_hat| 3.58e-6 (< 1e-5): the object is computationally lossless. Compression NOT demonstrated: dynamic state N_PSCD = |O_G| + active ports = 0.888x N_raw and message count 0.899x raw (occurrence/atom 0.315 excludes ports). Gate C (abstraction ceiling) AND Gate E (compression failure) fire; raw baseline reproduced (<0.16). VERDICT (frozen first line): the fixed frequency dictionary imposes a real predictive abstraction ceiling; motif discovery must become task-coupled. DECISION: replace frequency motif discovery with task+MDL discovery (and STOP claiming 3.2x computational compression). Both training runs intentionally truncated at the user's request; no Top-5 soup. See notes/pscd_sc_analysis.md, results/pscd_strong_reader/, claim-pscd-sc-v0-strong-port-operator-abstraction-ceiling-20260920, decision-pscd-sc-v0-task-mdm-motif-discovery-20260920."
  - decision-pscd-r-v0-develop-structured-reader-20260920: "PSCD-R-v0 (2026-09-20, frozen PSCD-v0 dictionary md5 b180e969..., commits 782f49e4/16e6d6f5, A100; ZINC train 10000 / valid 1000, official test never loaded; Decode(D,C_G)==G re-asserted 100% train+valid): the dominant PSCD-v0 failure was the opaque motif READER. Found pre-run that the as-shipped Stage-B composition collate is NOT batch-invariant (node layout vs h[:M]/h[M:] assumption; batch-vs-single diff up to 1.36 MAE), so the historical composition valid MAE 0.5429 is a reader artifact. Matched step-2000 best-valid: R0ship 0.578 | R0 corrected-opaque 0.456 | R1 structured-static 0.417 | R2 port-resolved 0.379 | R3 raw 0.414; recovery R_recover^valid R1 0.93 / R2 1.82; at the 6000-step ceiling R2 best-valid 0.3246 vs raw 0.3363. Gap decomposition at 2000: batching defect 0.122 (74%), H1 0.039, H2 0.038. Evaluation-only port-mean ablation degrades R2 valid 0.340->0.560, so port-resolved state is used. VERDICT (frozen first line): the dominant PSCD-v0 failure was the opaque motif reader; frequency-derived motifs remain viable. DECISION: develop the structured dictionary reader next; not task-aware motif discovery, not object repair, not stopping the line. See notes/pscd_reader_diagnostic_analysis.md, results/pscd_reader_diagnostic/SUMMARY.json, claim-pscd-r-v0-frozen-dictionary-readable-20260920, claim-pscd-v0-composition-reader-batching-defect-20260920."
  - decision-pscd-v0-abstraction-weak-20260920: "PSCD-v0 (2026-09-20, seed 0, commit cdae8b0, A100; ZINC train 10000 / valid 1000, official test never loaded): a port-structured compositional graph code G <-> (D, C_G) with a 64-rule / max-size-8 data-driven graph-BPE dictionary is VIABLE on all Stage-A hard gates — 100% exact decode (train+valid), 0/10000 relabel mismatches, mean(M_G/n_G)=0.320, 64/64 learned types used (support 8..3135, top-16/32 coverage 0.597/0.823), size>=4 port fraction 0.471, full-PSCD collisions 0, MDL L_PSCD/L_atom=0.215; collision ladder A:1 pair, B=C=D:0. BUT under a matched tiny reader (d=32, L=2, seed 0) the frozen frequency code is not task-friendly: composition valid MAE 0.5429 vs raw atom-graph 0.3113 (+0.232; strong band fails), motif bag 0.5609 so composition adds only +0.018. VERDICT (frozen sentence): the compositional dictionary is lossless and compressive but its abstraction is not task-friendly enough. DECISION: refine the motif discovery objective (task-aware primitives), NOT proceed to task-driven selection yet and NOT repair ports/composition. See notes/pscd_representation_analysis.md, claim-pscd-v0-lossless-compositional-code-20260920. NOTE (2026-09-20, PSCD-R-v0): the Stage-B composition number here was produced by a non-batch-invariant reader and is superseded; the object claims are unaffected."
  - decision-tigd-v0-pilot-failure-20260920: "TIGD-v0 (2026-09-20, seed 0, commit 28bab97, A100; ZINC train 2048 / valid 1000, official test never loaded): a shared dictionary of WHOLE attributed incidence-graph atoms (K=16, q_V=q_E=24, softmax categorical prototypes, R_k[:,b]=2*softmax_a(Xi) endpoint mass) fit by a mixture code alpha_G in Delta_16 and FREE graph-specific soft transport P_V/P_E FAILS its pre-registered feasibility gate (5/10). L_V -25% / L_E -42% but L_B only -1.4% (0.0835 -> 0.0823); code collapses (effective support 1.01, 97.8% one-hot, argmax atom 7 = 83%, 13/16 atoms dead); degree-preserving rewiring is invisible (Delta_rewire 5.8e-08 ~= Delta_perm 1.9e-08; random 0.545); structure-off (lambda_B=0) changes codes by 1.0e-04; unrelated random graphs reconstruct as well as originals (0.5891 vs 0.5858, L_B even lower for random); entropic transport silently mal-converges (marginal error 1.0e-04 -> 1.24e-02). Frozen-code probe valid MAE 1.32 >> DOI 0.3865 / scattering 0.3657 / I-CRATE 0.399. Verdict: soft transport absorbs too much graph identity; this graph-space dictionary formulation is not viable. Decision: skip the full stage; revise the graph-space reconstruction / transport objective under a new preregistration. See notes/tigd_representation_analysis.md."
  - decision-3f9c1a7e: "NPA audit (2026-09-21, seed 20260921, commit 6585bf6): neither a FIXED nonlinear scattering lift (P=(I+S)/2, dyadic wavelets Psi_j with interleaved pointwise modulus, 192-D per-object response, DOI distributional readout, 0 structural params) nor a TINY task-coupled incidence lift (h=16, L=2 atom-bond alternating tanh, 2496 structural params, fixed-seed RFF, MAE-only end-to-end) materially fixes the DOI readout on ZINC train 10000 / valid 1000 (official test never loaded). Fixed scattering valid 0.3865 -> 0.3657 (+0.021) and needs D_RFF 2048 (dim 6146 vs 3074); learned incidence valid 0.3865 -> 0.3310 (-0.0555, train 0.3138) with the best geometry (R_topo 9.71 -> 3.85, best WL top-1 0.9356) but still >0.25. Learned post-training RFF audit p95 0.022 (not confounded); no-message control not triggered (<0.10 improvement). Verdict: Hypothesis C — even a minimal task-coupled lift lacks enough capacity. Decision: a minimally parameterised pre-dictionary structural lift is insufficient for ZINC; reconsider whether the whole-graph dictionary can remain the primary representation. See notes/nonlinearity_placement_analysis.md."
  - decision-4b8e2d1f: "DOI audit (2026-09-19, seed 20260920): the distributional operator-incidence lift (per-object multiscale responses + atom/bond/incidence-pair empirical distributions + log masses, same S_G/X_G as AIOM) is exactly permutation-invariant (max err 3.5e-17 / 10000 checks), RFF-accurate (median<0.02, p95<0.05, Spearman>=0.995) and collision-free (min non-iso std distance 0.020 -> 0.223), and improves the frozen AIOM T=4 dense probe 0.4321 -> 0.3865 valid (train 0.3956 -> 0.3273) with a real multiscale gain (T=0 0.520 -> T=2 0.403 -> T=4 0.387). But it stays in the pre-registered WEAK band (valid>0.30, train>0.25) and degree-preserving rewiring is still ~1% relative (random pairs ~11x larger standardised). Decision: the fixed-lift premise is the bottleneck -> move to a task-coupled minimal structural lift; no dictionary/ISTA/K-SVD, no T>4, no higher-order tuples. See notes/doi_representation_analysis.md."
  - decision-70d6532a: "I-CRATE-v0 seed-0 (2026-09-19): incidence-structured white-box dictionary transformer FAILS the pre-registered gate (best-checkpoint valid 0.3989 vs the >0.20 Case-A threshold) but BOTH mechanisms are active — within-graph incidence rewiring moves alpha_G by ~42% (WG-ICSC 1.5%), token ODL is sparse (0 dead atoms), dictionaries are full-rank (~42/96) and non-collapsed. Failure is a capacity limit of the fixed sparse forward pipeline (train~valid~0.40, ~3.4x the A100 reference), not a dead mechanism. Decision: STOP the current form; no sweeps, gated controls not run. See notes/icrate_v0_failure_analysis.md. NOTE: the formal-run audit crashed (variable-token concatenation bug, now fixed) so Top-5 soup + full-data intervention were not materialised; mechanism numbers are from a 64-graph overfit run + per-epoch probes."
  - decision-1379b7f2: "WG-ICSC-v0 seed-0 (2026-09-19): whole-graph incidence-coupled sparse coding FAILS the pre-registered feasibility gate (valid soup 0.5058 vs the 0.15 gate) but the sparse-incidence mechanism is active; failure is representational (assignment-invariant row-norm readout). Decision: REVISE THE MATHEMATICAL OBJECTIVE; gated No-incidence/Dense controls not run. See notes/wg_icsc_v0_failure_analysis.md."
