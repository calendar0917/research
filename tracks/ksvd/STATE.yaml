      and rel_feat (16); p_dict = proto_pair * rel_gate; narrow within-prototype
      residual eps_i = q_i - alpha_i @ D_norm -> W_eps (32 -> 8) giving
      p_eps = [e_i+e_j | |e_i-e_j| | e_i*e_j] (24); pair input 72 -> pair
