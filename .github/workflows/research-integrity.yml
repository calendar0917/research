name: research-integrity

# Lightweight, CPU-only gate. It must never download datasets, train models,
# require a GPU/CUDA wheel, or read the official test splits. It checks that the
# durable research surface (STATE.yaml + records/) is internally consistent and
# that an explicit, verified fresh-clone-safe subset of unit tests still passes.
#
# The test list below is an explicit ALLOWLIST, NOT `-m "not slow"`. The `slow`
# marker only classifies expensive local tests; it is not a fresh-clone-safety
# guarantee (many unmarked tests still need data/, results/ or checkpoints).
# Every file listed here was verified to pass on a fresh `git clone` with the
# minimal, torch-free environment produced by
# `uv sync --frozen --no-default-groups --group dev`.
# Re-verify a file the same way before adding it here.
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: research-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync minimal CPU-only environment (no torch / CUDA wheels)
        run: uv sync --frozen --no-default-groups --group dev

      - name: Research-integrity validator (STATE + durable records)
        run: uv run --no-sync research verify

      - name: Ruff (maintained control-plane code)
        run: |
          uv run --no-sync ruff check \
            tracks/ksvd/src \
            tracks/ksvd/tests/test_ksvd_integrity.py \
            tracks/ksvd/tests/test_molhiv_shared_bag_patch_encoder.py \
            tracks/ksvd/tests/test_shared_bag_patch_encoder.py \
            tracks/ksvd/experiments/luyin16/molhiv_shared_bag_patch_encoder.py \
            tracks/ksvd/experiments/luyin16/zinc_shared_bag_patch_encoder.py

      - name: Fresh-clone-safe test allowlist (no data, no checkpoints, no torch)
        run: |
          uv run --no-sync pytest -q -p no:cacheprovider \
            tracks/ksvd/tests/test_ksvd_integrity.py \
            tracks/ksvd/tests/test_ksvd_cli.py \
            tracks/ksvd/tests/test_ksvd_compare.py \
            tracks/ksvd/tests/test_ksvd_policy.py \
            tracks/ksvd/tests/test_ksvd_protocol_hash.py \
            tracks/ksvd/tests/test_ksvd_runtime.py \
            tracks/ksvd/tests/test_ksvd_runtime_guard.py \
            tracks/ksvd/tests/test_ksvd_run_sources.py \
            tracks/ksvd/tests/test_ksvd_runner_dependencies.py \
            tracks/ksvd/tests/test_ksvd_git_provenance.py \
            tracks/ksvd/tests/test_core_api.py \
            tracks/ksvd/tests/test_metrics.py \
            tracks/ksvd/tests/test_canonical_slots.py \
            tracks/ksvd/tests/test_canonical_vectorize.py \
            tracks/ksvd/tests/test_identity_incremental_information_audit.py \
            tracks/ksvd/tests/test_corrected_token_fragmentation_audit.py \
            tracks/ksvd/tests/test_baseline_difficulty_typed_refinement_audit.py
